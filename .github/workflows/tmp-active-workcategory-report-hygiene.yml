name: TEMP Active WorkCategory Report Hygiene
on:
  push:
    paths:
      - scripts/apply-active-workcategory-report-hygiene.py
      - .github/workflows/tmp-active-workcategory-report-hygiene.yml
permissions:
  contents: write
jobs:
  patch_and_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/active-workcategory-report-hygiene
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: python3 scripts/apply-active-workcategory-report-hygiene.py
      - run: npm ci
      - name: Stability
        run: npm run test:stability
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rules
        run: npm run test:rules
      - name: Security
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Materialize verified source and clean temp files
        shell: bash
        run: |
          rm -f scripts/apply-active-workcategory-report-hygiene.py
          rm -f .github/workflows/tmp-active-workcategory-report-hygiene.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Fix stale deleted work categories in reports"
          git push origin HEAD:fix/active-workcategory-report-hygiene
