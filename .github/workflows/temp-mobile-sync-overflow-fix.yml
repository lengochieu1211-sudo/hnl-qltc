name: HNL QLTC TEMP Mobile Sync Overflow Fix

on:
  push:
    branches:
      - tmp-mobile-sync-overflow-80
    paths:
      - '.github/workflows/temp-mobile-sync-overflow-fix.yml'
      - '.github/patches/HNL-QLTC-MOBILE-SYNC-OVERFLOW-80.patch'

permissions:
  contents: write

jobs:
  apply_patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify and apply responsive fix
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/tmp-mobile-sync-overflow-80' || { echo '::error::REFUSING: wrong branch'; exit 1; }
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = '755200dad806a8a42c1a4b68d73a0620e5a75d0a' || {
            echo "::error::REFUSING: expected DEV parent 755200dad806a8a42c1a4b68d73a0620e5a75d0a, got $PARENT"
            exit 1
          }
          PATCH='.github/patches/HNL-QLTC-MOBILE-SYNC-OVERFLOW-80.patch'
          printf '%s  %s\n' '1d63ba9ca380297629f0b716fefdd906fe39b02ed785dcb49dfb74883d43cffe' "$PATCH" | sha256sum -c -
          git apply --check "$PATCH"
          git apply "$PATCH"
          rm -f "$PATCH" .github/workflows/temp-mobile-sync-overflow-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(dev): prevent mobile Sync Center horizontal overflow'
          git push origin HEAD:tmp-mobile-sync-overflow-80
