name: Temporary Diagnostic Go To Record Patcher

on:
  push:
    branches:
      - feat/diagnostic-go-to-record

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/diagnostic-go-to-record
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/patch-diagnostic-go-to-record.py
      - name: Commit patched source
        run: |
          if git diff --quiet; then
            echo "No patch changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/GoogleConfigTab.tsx src/components/CrewTab.tsx
          git commit -m "feat: navigate from photo diagnostics to crew record"
          git push origin HEAD:feat/diagnostic-go-to-record
