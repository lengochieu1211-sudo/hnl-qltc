name: Temporary contact runtime v2 patch

on:
  push:
    branches:
      - fix/contact-cross-project-diagnostics-runtime
    paths:
      - '.github/workflows/contact-runtime-v2-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/contact-cross-project-diagnostics-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-contact-runtime-v2.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SecurityModal.tsx src/components/GoogleConfigTab.tsx
          git diff --cached --quiet && exit 0
          git commit -m "fix: stabilize contacts across projects and diagnostics"
          git push
