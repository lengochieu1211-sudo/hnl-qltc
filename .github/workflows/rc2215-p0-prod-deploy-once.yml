name: RC2.2.15 P0 PROD Deploy Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc2215-p0-prod-deploy-once.yml'

permissions:
  contents: read

jobs:
  certify_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact PROD identities and P0 fixes
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_FIREBASE_PROJECT_ID" = "com-example-qlct-61329"
          test "$VITE_BINARY_STORAGE_PROVIDER" = "r2"
          test "$VITE_R2_GATEWAY_URL" = "https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev"
          grep -F '"site": "hnlqltc"' firebase.prod.json
          grep -F 'PUT bị từ chối; refresh Firebase token và thử lại' src/lib/r2Storage.ts
          grep -F 'qlct-defect-navigation-request' src/App.tsx
          grep -F 'Xuất file chẩn đoán lỗi' src/components/GoogleConfigTab.tsx
          grep -F 'Ảnh đang chờ Cloud/R2' src/features/chat/ChatTab.tsx

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stability Gate
        run: npm run test:stability

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Security audit production critical
        run: npm run security:audit

      - name: Build PROD bundle
        run: npm run build

      - name: Deploy Hosting site hnlqltc
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo '::error::Missing existing Firebase service-account secret'; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only hosting --config firebase.prod.json --project com-example-qlct-61329 --non-interactive

      - name: PROD web smoke test
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -L -sS -o /tmp/hnlqltc.html -w '%{http_code}' --max-time 20 "https://hnlqltc.web.app/?release=rc2.2.15-p0-photo-diagnostics&probe=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$code" = "200" ] && grep -qi '<div id="root"' /tmp/hnlqltc.html; then
              echo "HNL QLTC PROD P0 smoke PASS on attempt $i"
              exit 0
            fi
            sleep 5
          done
          exit 1
