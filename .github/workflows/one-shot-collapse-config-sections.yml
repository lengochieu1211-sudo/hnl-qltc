name: One-shot collapse config sections

on:
  push:
    branches:
      - feature/ai-data-optin-live-models
    paths:
      - .github/workflows/one-shot-collapse-config-sections.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-data-optin-live-models
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Apply collapsible settings patch
        run: python3 scripts/patch-collapse-config-sections.py

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Remove one-shot helpers and commit verified source
        run: |
          rm -f scripts/patch-collapse-config-sections.py .github/workflows/one-shot-collapse-config-sections.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "ui(config): collapse advanced settings sections by default"
          git push origin HEAD:feature/ai-data-optin-live-models
