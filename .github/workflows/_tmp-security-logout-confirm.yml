name: TEMP Security Logout Confirm

on:
  push:
    branches:
      - fix/security-logout-confirm-20260911

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/security-logout-confirm-20260911
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Patch logout confirmation and regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          security_path = Path('src/components/SecurityModal.tsx')
          source = security_path.read_text(encoding='utf-8')
          old = """  const handleAccountSignOut = async () => {
              if (isAccountBusy) return;
              setIsAccountBusy(true);
              setAccountMsg(null);
              try {
                await signOutFirebaseAccount();
          """
          new = """  const handleAccountSignOut = async () => {
              if (isAccountBusy) return;

              const accountLabel = String(cloudUser?.email || 'tài khoản Google/Firebase');
              const confirmed = await confirmAsync(
                `Bạn có chắc muốn đăng xuất tài khoản Google/Firebase?\\n\\nTài khoản: ${accountLabel}\\n\\nSau khi đăng xuất, phiên hiện tại sẽ chuyển về VIEWER cho đến khi đăng nhập lại.`
              );
              if (!confirmed) return;

              setIsAccountBusy(true);
              setAccountMsg(null);
              try {
                await signOutFirebaseAccount();
          """
          if old not in source:
              raise SystemExit('SecurityModal sign-out handler anchor not found')
          security_path.write_text(source.replace(old, new, 1), encoding='utf-8')

          test_path = Path('scripts/ui-entry-ux-golden.ts')
          test = test_path.read_text(encoding='utf-8')
          anchor = """assert(security.includes('handleAccountSignOut'), 'Security Center sign-out handler missing');
          """
          if anchor not in test:
              raise SystemExit('Security regression anchor not found')
          addition = anchor + """const signOutHandlerStart = security.indexOf('const handleAccountSignOut');
          const signOutConfirm = security.indexOf('await confirmAsync(', signOutHandlerStart);
          const signOutCall = security.indexOf('await signOutFirebaseAccount()', signOutHandlerStart);
          assert(signOutHandlerStart >= 0 && signOutConfirm > signOutHandlerStart && signOutCall > signOutConfirm, 'Security logout must confirm before Firebase sign-out');
          assert(security.includes('Bạn có chắc muốn đăng xuất tài khoản Google/Firebase?'), 'Security logout confirmation copy missing');
          assert(security.includes('if (!confirmed) return;'), 'Cancelling logout confirmation must keep the current session');
          """
          test_path.write_text(test.replace(anchor, addition, 1), encoding='utf-8')
          PY

      - name: Focused verification
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:ui-entry-ux
          npm run typecheck
          npm run lint

      - name: Commit source patch and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/_tmp-security-logout-confirm.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/SecurityModal.tsx scripts/ui-entry-ux-golden.ts .github/workflows/_tmp-security-logout-confirm.yml
          git commit -m 'fix(security): confirm before Google Firebase logout'
          git push origin HEAD:fix/security-logout-confirm-20260911
