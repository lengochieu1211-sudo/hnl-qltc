name: RC2.2.15 Apply Once

on:
  push:
    branches:
      - rc2-2-15-crew-delete-mobile-alert
    paths:
      - '.github/workflows/rc2215-apply-once.yml'

permissions:
  contents: write

jobs:
  apply_patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC2.2.15 branch
        uses: actions/checkout@v4
        with:
          ref: rc2-2-15-crew-delete-mobile-alert
          fetch-depth: 0

      - name: Reconstruct and apply exact RC2.2.15 source patch
        shell: bash
        run: |
          set -euo pipefail
          cat scripts/rc2215.patch.part.* | base64 --decode | gzip --decompress > /tmp/rc2215.patch
          git apply --check /tmp/rc2215.patch
          git apply /tmp/rc2215.patch
          rm -f /tmp/rc2215.patch

      - name: Commit source patch and remove patch fragments
        shell: bash
        run: |
          set -euo pipefail
          git rm scripts/rc2215.patch.part.*
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'RC2.2.15: project-wide photo read, crew delete, mobile alert'
          git push origin HEAD:rc2-2-15-crew-delete-mobile-alert
