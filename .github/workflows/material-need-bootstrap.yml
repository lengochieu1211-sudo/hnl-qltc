name: HNL QLTC Apply Material Need Candidate

on:
  push:
    branches: [audit-hardening-20260913]
    paths:
      - '.github/workflows/material-need-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
          ref: audit-hardening-20260913

      - name: Verify exact audited source and materialize patch
        shell: bash
        run: |
          set -euo pipefail
          BASE='663fb5eadd151ba4e9ec9ec8dcc7960cb636a6dd'
          git merge-base --is-ancestor "$BASE" HEAD

          test "$(git hash-object src/components/WarehouseTab.tsx)" = 'faed8d8f96c0f35b25cd8a0a41fadfff303650fd'
          test "$(git hash-object src/utils/materialNeedEngine.ts)" = '5adf565b8a162e4a07783e0adcb750e7176f611d'
          test "$(git hash-object scripts/material-need-golden.ts)" = 'a1122b38b457c081328691ec42e66c4274037ee2'
          test "$(git hash-object scripts/ui-entry-ux-golden.ts)" = 'f8722c1b694e9da37f85a34ccade6c01211fa69f'
          test "$(git hash-object scripts/dev-hosted-browser-golden.mjs)" = 'a26ea2ff393462274f11d2a6c65c845ae95fc2f6'
          test "$(git hash-object src/components/ExpandCollapseButton.tsx)" = '27a67361f46bc1c2ba1d0463e8eb1f14a43f16c1'

          cat .material-need-bootstrap/patch.part.* > /tmp/hnl-material-feature.patch.gz.b64
          echo '87b0fb37b7305256754771f7f11186ab05fb01763c9277a2914ac893b8a6353a  /tmp/hnl-material-feature.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/hnl-material-feature.patch.gz.b64 | gzip -d > /tmp/hnl-material-feature.patch
          echo '1bd31fef620e9b6ef4b383b940da8ee39a37fdb4902ed8c948c0d8d54dc175c2  /tmp/hnl-material-feature.patch' | sha256sum -c -
          git apply -p0 --check /tmp/hnl-material-feature.patch
          git apply -p0 /tmp/hnl-material-feature.patch
          git diff --check

      - name: Candidate source guards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/source-lint.mjs
          node --experimental-strip-types scripts/ui-entry-ux-golden.ts

      - name: Commit material-need source only
        shell: bash
        run: |
          set -euo pipefail
          git rm -r .material-need-bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(candidate): filter material needs by rooms and declared work categories'
          git push origin HEAD:audit-hardening-20260913
