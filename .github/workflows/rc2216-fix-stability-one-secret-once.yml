name: RC2.2.16 Fix One-Secret Stability Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc2216-fix-stability-one-secret-once.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Update one-secret R2 deploy expectation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/stability-gate.mjs')
          s = p.read_text()
          old = "requireAll(r2DeployWorkflow, ['workflow_dispatch:', 'DEPLOY-R2', 'CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID', 'wrangler@4.33.0 deploy', '/health', '\"version\":\"6.3.0-rc2.2.16\"', '\"accessPolicy\":\"canonical-email-first\"', 'Smoke browser PUT CORS preflight', 'Access-Control-Request-Method: PUT'], 'manual-gated R2 Worker deploy workflow + exact runtime/CORS verification');"
          new = "requireAll(r2DeployWorkflow, ['workflow_dispatch:', 'CLOUDFLARE_API_TOKEN', 'Resolve Cloudflare Account ID automatically', 'api.cloudflare.com/client/v4/accounts?per_page=50', 'CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID', 'wrangler@4.33.0 deploy', '/health', '\"version\":\"6.3.0-rc2.2.16\"', '\"accessPolicy\":\"canonical-email-first\"', 'Smoke browser PUT CORS preflight', 'Access-Control-Request-Method: PUT'], 'manual one-button R2 Worker deploy workflow + auto account resolve + exact runtime/CORS verification');"
          if old not in s:
              raise SystemExit('expected legacy stability marker not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Install dependencies
        run: npm ci
      - name: Stability Gate
        run: npm run test:stability
      - name: Commit verified stability repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/stability-gate.mjs
          git diff --cached --quiet && { echo 'No source change needed'; exit 0; }
          git commit -m 'test: align R2 gate with one-secret deploy'
          git push origin HEAD:main
