name: RC2.2.12 Apply Definitive Photo Sync Once

on:
  push:
    branches:
      - rc2-2-12-android-gallery-picker-hotfix

permissions:
  contents: write

jobs:
  apply_hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and decode chunked patch
        shell: bash
        run: |
          set -euo pipefail
          echo "34b6ef736863a2933f4d98b6f2ccc0a348186b4209efb9f713146e37f887c115  rc2212_sync_parts/part_00.b64" | sha256sum -c -
          echo "7e4af83c15560944235cc077e2712a75e54a9950e03b56642059e0ee37251171  rc2212_sync_parts/part_01.b64" | sha256sum -c -
          echo "8d6684c5e87f0115cebadfbda9cfe574a724ce9b8e871a75b7fe795f43f6237b  rc2212_sync_parts/part_02.b64" | sha256sum -c -
          echo "c31bd604b3890d8bf5def57efcd13ed25d995d90f676d731161a540b2a95ca46  rc2212_sync_parts/part_03.b64" | sha256sum -c -
          echo "7a69cd92cdb1bb96eb8e48a6cfc386d29f543c1dd67ddba4bfc8430c4fea3e42  rc2212_sync_parts/part_04.b64" | sha256sum -c -
          echo "f231f17e1dfd9c6ba6b84fd5118704e33e9498d32a3fac846648a90faca4c3a4  rc2212_sync_parts/part_05.b64" | sha256sum -c -
          echo "70a8b6d7409492800f84abbdccdd10bffd7ddbf32497b4a0dbb85ae6789f69db  rc2212_sync_parts/part_06.b64" | sha256sum -c -
          cat rc2212_sync_parts/part_*.b64 | base64 -d > /tmp/rc2212-sync.patch
          echo "e37151c131bcc71c0547c9d46373eb440ef13114f61b4709f69f1c39bf5056d7  /tmp/rc2212-sync.patch" | sha256sum -c -
          test "$(wc -c < /tmp/rc2212-sync.patch)" -eq 15501
          grep -q "Ready-only publish" /tmp/rc2212-sync.patch
          grep -q "isSharedCloudPhotoVisible" /tmp/rc2212-sync.patch
          grep -q "R2 upload failed; falling back to Firebase Storage" /tmp/rc2212-sync.patch
          grep -q "photoOutboxRetryTimerRef" /tmp/rc2212-sync.patch
          grep -q "retryDelays = \[0, 400, 1200, 2500\]" /tmp/rc2212-sync.patch
          git apply --check /tmp/rc2212-sync.patch
          git apply /tmp/rc2212-sync.patch
          git diff --check

      - name: Source regression gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stability-gate.mjs
          node scripts/offline-golden.mjs
          node scripts/category-golden.mjs
          node scripts/firebase-only-golden.mjs
          node scripts/firebase-only-legacy-audit.mjs --self-test
          node scripts/emulator-golden.mjs
          node scripts/rbac-matrix.mjs
          node scripts/r2-gateway-golden.mjs
          node scripts/desktop-launcher-golden.mjs
          node scripts/auth-popup-golden.mjs
          node scripts/source-lint.mjs

      - name: Commit verified sync architecture fix
        shell: bash
        run: |
          set -euo pipefail
          git rm rc2212_sync_parts/*.b64
          git add src/utils/photoStorage.ts src/lib/photoCloudSync.ts src/lib/binaryStorage.ts src/App.tsx src/components/PhotoAttachmentPicker.tsx scripts/stability-gate.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: publish photos only after durable cloud binary"
          git push origin HEAD:rc2-2-12-android-gallery-picker-hotfix
