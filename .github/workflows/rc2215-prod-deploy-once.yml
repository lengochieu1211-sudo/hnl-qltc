name: RC2.2.15 PROD Deploy Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc2215-prod-deploy-once.yml'

permissions:
  contents: read

jobs:
  certify_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify exact PROD identities and RC2.2.15 source
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_FIREBASE_PROJECT_ID" = "com-example-qlct-61329"
          test "$VITE_BINARY_STORAGE_PROVIDER" = "r2"
          test "$VITE_R2_GATEWAY_URL" = "https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev"
          test -f firebase.prod.json
          grep -F '"site": "hnlqltc"' firebase.prod.json
          test "$(tr -d '\r\n' < desktop-wrapper/release-tag.txt)" = "6.3.0-rc2.2.15"
          grep -F "const GATEWAY_VERSION = '6.3.0-rc2.2.15'" cloudflare/r2-gateway/worker.js

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stability / Architecture / Golden Gate
        run: npm run test:stability

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Firebase Rules compile + emulator behavior
        run: npm run test:rules

      - name: Security audit production critical
        run: npm run security:audit

      - name: Build PROD bundle
        run: npm run build

      - name: R2 gateway compatibility health smoke
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$VITE_R2_GATEWAY_URL/health?release=rc2.2.15" | tee /tmp/r2-health.json
          grep -q '"ok":true' /tmp/r2-health.json
          if grep -q '"version":"6.3.0-rc2.2.15"' /tmp/r2-health.json && grep -q '"accessPolicy":"canonical-email-first"' /tmp/r2-health.json; then
            echo 'R2 runtime is RC2.2.15 certified.'
          else
            echo '::warning::R2 runtime is reachable but not yet RC2.2.15 certified; Cloudflare deploy secrets are required for the final cross-account photo gate.'
          fi

      - name: Deploy Firestore rules to existing project
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo '::error::Missing existing Firebase service-account secret'; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project com-example-qlct-61329 --non-interactive

      - name: Deploy Hosting site hnlqltc
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo '::error::Missing existing Firebase service-account secret'; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only hosting --config firebase.prod.json --project com-example-qlct-61329 --non-interactive

      - name: PROD web smoke test
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -L -sS -o /tmp/hnlqltc.html -w '%{http_code}' --max-time 20 "https://hnlqltc.web.app/?release=rc2.2.15&probe=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$code" = "200" ] && grep -qi '<div id="root"' /tmp/hnlqltc.html; then
              echo "HNL QLTC PROD smoke PASS on attempt $i"
              exit 0
            fi
            echo "Waiting for Hosting propagation: HTTP=$code attempt=$i"
            sleep 5
          done
          echo 'PROD Hosting smoke failed'
          exit 1
