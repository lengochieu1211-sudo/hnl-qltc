name: Deploy HNL QLTC DEV Environment

on:
  push:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

env:
  DEV_FIRESTORE_LOCATION: asia-southeast1
  DEV_R2_BUCKET: hnl-qltc-media-dev
  DEV_R2_WORKER: hnl-qltc-r2-gateway-dev
  DEV_R2_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
  PROD_FIREBASE_PROJECT_ID: com-example-qlct-61329
  PROD_R2_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev

jobs:
  deploy_dev:
    runs-on: ubuntu-latest
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: DEV credential preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${FIREBASE_SERVICE_ACCOUNT:-}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEV_WAITING_FOR_SECRET=FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV"
            exit 0
          fi
          DEV_PROJECT_ID="$(printf '%s' "$FIREBASE_SERVICE_ACCOUNT" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);process.stdout.write(String(j.project_id||''))})")"
          test -n "$DEV_PROJECT_ID" || { echo '::error::DEV service account JSON has no project_id'; exit 1; }
          test "$DEV_PROJECT_ID" != "$PROD_FIREBASE_PROJECT_ID" || { echo '::error::REFUSING: DEV service account points to PROD project'; exit 1; }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::Missing CLOUDFLARE_API_TOKEN for isolated DEV R2'; exit 1; }
          test "$DEV_R2_URL" != "$PROD_R2_URL" || { echo '::error::REFUSING: DEV R2 URL equals PROD R2 URL'; exit 1; }
          echo "configured=true" >> "$GITHUB_OUTPUT"
          echo "DEV_PROJECT_ID=$DEV_PROJECT_ID" >> "$GITHUB_ENV"
          echo "DEV_HOSTING_URL=https://${DEV_PROJECT_ID}.web.app" >> "$GITHUB_ENV"
          echo "DEV_AUTH_DOMAIN=${DEV_PROJECT_ID}.web.app" >> "$GITHUB_ENV"
          echo "DEV_FIREBASEAPP_ORIGIN=https://${DEV_PROJECT_ID}.firebaseapp.com" >> "$GITHUB_ENV"
          echo "DEV isolation gate: PASS ($DEV_PROJECT_ID)"

      - name: Stop cleanly until DEV Firebase secret exists
        if: steps.preflight.outputs.configured != 'true'
        shell: bash
        run: |
          echo 'DEV environment scaffold is ready.'
          echo 'Add repository secret FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV, then push/touch branch dev to continue.'

      - uses: actions/setup-node@v4
        if: steps.preflight.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Write DEV Firebase credential
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          CRED="$RUNNER_TEMP/firebase-dev-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$CRED"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$CRED" >> "$GITHUB_ENV"

      - name: Verify DEV Firebase access
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(npx --yes firebase-tools@13.35.1 projects:list --json)"
          printf '%s' "$RAW" | DEV_PROJECT_ID="$DEV_PROJECT_ID" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=Array.isArray(j.result)?j.result:[];const id=process.env.DEV_PROJECT_ID;if(!r.some(x=>x.projectId===id)){console.error('DEV Firebase project not accessible: '+id);process.exit(2)};console.log('DEV Firebase project access: PASS')})"

      - name: Ensure DEV Firestore default database
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(npx --yes firebase-tools@13.35.1 firestore:databases:list --project "$DEV_PROJECT_ID" --json)"
          if printf '%s' "$RAW" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=Array.isArray(j.result)?j.result:[];process.exit(r.some(x=>String(x.name||'').endsWith('/databases/(default)'))?0:1)})"; then
            echo 'DEV Firestore default database already exists.'
          else
            echo "Creating DEV Firestore (default) in $DEV_FIRESTORE_LOCATION"
            npx --yes firebase-tools@13.35.1 firestore:databases:create '(default)' --location="$DEV_FIRESTORE_LOCATION" --project "$DEV_PROJECT_ID" --non-interactive
          fi

      - name: Ensure DEV Firebase Web App and resolve SDK config
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APPS="$(npx --yes firebase-tools@13.35.1 apps:list WEB --project "$DEV_PROJECT_ID" --json)"
          APP_ID="$(printf '%s' "$APPS" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=Array.isArray(j.result)?j.result:[];const a=r.find(x=>x.platform==='WEB'||String(x.appId||'').includes(':web:'))||r[0];process.stdout.write(String(a?.appId||''))})")"
          if [ -z "$APP_ID" ]; then
            CREATED="$(npx --yes firebase-tools@13.35.1 apps:create WEB 'HNL QLTC DEV Web' --project "$DEV_PROJECT_ID" --json)"
            APP_ID="$(printf '%s' "$CREATED" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=j.result||j;process.stdout.write(String(r.appId||r.app?.appId||''))})")"
          fi
          test -n "$APP_ID" || { echo '::error::Unable to resolve/create DEV Firebase Web App'; exit 1; }
          SDK="$(npx --yes firebase-tools@13.35.1 apps:sdkconfig WEB "$APP_ID" --project "$DEV_PROJECT_ID" --json)"
          printf '%s' "$SDK" > "$RUNNER_TEMP/firebase-dev-sdk.json"
          node - <<'NODE'
          const fs = require('fs');
          const raw = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/firebase-dev-sdk.json','utf8'));
          const c = raw.result || raw;
          const need = ['apiKey','appId','messagingSenderId','projectId','storageBucket'];
          for (const k of need) if (!c[k]) { console.error('Missing DEV SDK field: '+k); process.exit(2); }
          const out = process.env.GITHUB_ENV;
          fs.appendFileSync(out, `VITE_FIREBASE_API_KEY=${c.apiKey}\n`);
          fs.appendFileSync(out, `VITE_FIREBASE_APP_ID=${c.appId}\n`);
          fs.appendFileSync(out, `VITE_FIREBASE_MESSAGING_SENDER_ID=${c.messagingSenderId}\n`);
          fs.appendFileSync(out, `VITE_FIREBASE_PROJECT_ID=${c.projectId}\n`);
          fs.appendFileSync(out, `VITE_FIREBASE_STORAGE_BUCKET=${c.storageBucket}\n`);
          fs.appendFileSync(out, `VITE_FIREBASE_AUTH_DOMAIN=${process.env.DEV_AUTH_DOMAIN}\n`);
          NODE
          echo "DEV Firebase Web App: $APP_ID"

      - name: Resolve Cloudflare account
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          ACCOUNT_ID="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=Array.isArray(j.result)?j.result:[];if(!j.success||r.length!==1){console.error('Expected exactly one accessible Cloudflare account, got '+r.length);process.exit(2)};process.stdout.write(String(r[0].id||''))})")"
          test -n "$ACCOUNT_ID" || { echo '::error::Cloudflare Account ID resolve failed'; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Ensure isolated DEV R2 bucket
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LIST="$(npx --yes wrangler@4.33.0 r2 bucket list --json)"
          if printf '%s' "$LIST" | DEV_R2_BUCKET="$DEV_R2_BUCKET" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=Array.isArray(j)?j:(Array.isArray(j.result)?j.result:[]);process.exit(r.some(x=>(x.name||x.bucket_name)===process.env.DEV_R2_BUCKET)?0:1)})"; then
            echo "DEV R2 bucket exists: $DEV_R2_BUCKET"
          else
            npx --yes wrangler@4.33.0 r2 bucket create "$DEV_R2_BUCKET"
          fi

      - name: Deploy isolated DEV R2 Worker
        if: steps.preflight.outputs.configured == 'true'
        working-directory: cloudflare/r2-gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.dev.ci.toml <<WRANGLER_EOF
          name = "$DEV_R2_WORKER"
          main = "worker.js"
          compatibility_date = "2026-08-30"

          [[r2_buckets]]
          binding = "HNL_QLTC_MEDIA"
          bucket_name = "$DEV_R2_BUCKET"

          [vars]
          FIREBASE_PROJECT_ID = "$DEV_PROJECT_ID"
          SUPER_ADMIN_EMAIL = "lengochieu1211@gmail.com"
          ALLOWED_ORIGINS = "$DEV_HOSTING_URL,$DEV_FIREBASEAPP_ORIGIN"
          MAX_UPLOAD_BYTES = "26214400"
          WRANGLER_EOF
          trap 'rm -f wrangler.dev.ci.toml' EXIT
          npx --yes wrangler@4.33.0 deploy --config wrangler.dev.ci.toml

      - name: Smoke DEV R2 Worker
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            BODY="$(curl --fail --silent --show-error "${DEV_R2_URL}/health?probe=${GITHUB_RUN_ID}-${i}" || true)"
            if printf '%s' "$BODY" | grep -q '"ok":true'; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1 || { echo '::error::DEV R2 Worker health failed'; exit 1; }

      - name: Install app dependencies
        if: steps.preflight.outputs.configured == 'true'
        run: npm ci

      - name: DEV source gates
        if: steps.preflight.outputs.configured == 'true'
        env:
          VITE_APP_ENV: DEV
          VITE_RUNTIME_BACKEND: firebase-only
          VITE_BINARY_STORAGE_PROVIDER: r2
          VITE_R2_GATEWAY_URL: ${{ env.DEV_R2_URL }}
          VITE_ENABLE_LEGACY_DRIVE_READ: 'true'
          VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
          VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
          VITE_FIRESTORE_DATABASE_ID: '(default)'
          VITE_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
          VITE_FIREBASE_APP_CHECK_SITE_KEY: ''
          VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          VITE_GIT_COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:stability
          npm run typecheck
          npm run lint
          npm run test:rules
          npm run security:audit
          npm run build

      - name: Deploy DEV Firestore rules
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project "$DEV_PROJECT_ID" --non-interactive

      - name: Deploy DEV Hosting
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes firebase-tools@13.35.1 deploy --only hosting --project "$DEV_PROJECT_ID" --non-interactive
          echo "DEV Hosting: $DEV_HOSTING_URL"

      - name: Smoke DEV Hosting
        if: steps.preflight.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 30); do
            CODE="$(curl --silent --output /tmp/dev-index.html --write-out '%{http_code}' "${DEV_HOSTING_URL}/?build=${GITHUB_RUN_ID}-${i}" || true)"
            if [ "$CODE" = '200' ]; then ok=1; break; fi
            sleep 2
          done
          test "$ok" = 1 || { echo '::error::DEV Hosting smoke failed'; exit 1; }
          echo "DEV_READY_URL=$DEV_HOSTING_URL"
