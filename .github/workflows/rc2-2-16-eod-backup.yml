name: RC2.2.16 EOD Backup Package

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc2-2-16-eod-backup.yml'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Package clean source, patch and handoff
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD^)"
          BASE_SHA="906faea35ebfce7eaa05319245d3734e2c5101ef"
          OUT="$RUNNER_TEMP/hnl-eod"
          PATCH_DIR="$RUNNER_TEMP/hnl-patch"
          mkdir -p "$OUT" "$PATCH_DIR"

          FULL="$OUT/HNL-QLTC-V6.3.0-RC2.2.16-EOD-2026-08-31-FULL-SOURCE.zip"
          PATCH="$OUT/HNL-QLTC-V6.3.0-RC2.2.16-EOD-2026-08-31-PATCH.zip"
          REPORT="$OUT/HNL-QLTC-V6.3.0-RC2.2.16-EOD-REPORT.md"
          CHECKPOINT="$OUT/HNL-QLTC-RC2.2.16-PROD-CONTINUATION-CHECKPOINT.md"
          SUMS="$OUT/HNL-QLTC-V6.3.0-RC2.2.16-EOD-SHA256SUMS.txt"

          git archive --format=zip --output="$FULL" "$SOURCE_SHA"

          : > "$PATCH_DIR/DELETED_FILES.txt"
          while IFS=$'\t' read -r status path; do
            [ -n "${status:-}" ] || continue
            case "$status" in
              A|M|T)
                mkdir -p "$PATCH_DIR/$(dirname "$path")"
                git show "$SOURCE_SHA:$path" > "$PATCH_DIR/$path"
                ;;
              D)
                printf '%s\n' "$path" >> "$PATCH_DIR/DELETED_FILES.txt"
                ;;
              *)
                echo "Unsupported diff status: $status $path" >&2
                exit 2
                ;;
            esac
          done < <(git diff --name-status --no-renames "$BASE_SHA" "$SOURCE_SHA")
          if [ ! -s "$PATCH_DIR/DELETED_FILES.txt" ]; then rm "$PATCH_DIR/DELETED_FILES.txt"; fi
          (cd "$PATCH_DIR" && zip -qr "$PATCH" .)

          cat > "$REPORT" <<EOF
          # HNL QLTC V6.3.0 — RC2.2.16 EOD RELEASE REPORT

          Date: 2026-08-31

          ## Source identity
          - Repository: lengochieu1211-sudo/hnl-qltc
          - Clean source SHA: $SOURCE_SHA
          - Certified comparison baseline RC2.2.14: $BASE_SHA
          - Firebase project: com-example-qlct-61329
          - Hosting site: hnlqltc
          - PROD URL: https://hnlqltc.web.app
          - R2 Worker: hnl-qltc-r2-gateway.lengochieu1211.workers.dev
          - R2 bucket: hnl-qltc-media
          - Release: 6.3.0-rc2.2.16

          ## Final fixes preserved
          - R2 browser PUT CORS root fix and propagation-safe smoke gate.
          - One-secret manual R2 deploy using CLOUDFLARE_API_TOKEN; Account ID auto-resolved.
          - Android diagnostics export avoids zero-byte output.
          - Cross-account photo reconciliation: Cloud-newer state is merged Cloud to local instead of remaining a sticky PHOTO_CONFLICT.
          - Existing pending/legacy photo metadata advances lifecycle revision and updatedAt before verified R2 metadata is written.
          - EDITOR no longer retries ADMIN-only floor-plan upload/migration.
          - Existing RBAC / Firebase Rules are preserved; no permission weakening.
          - RC2.2.15 photo visibility, Crew delete policy, Defect/Chat cloud status, Defect deep link and gallery behavior remain included.

          ## Release evidence
          - Photo finalization workflow run 33383944017: PASS.
          - Final Android APK run 33384153414 (#115): PASS.
          - Final Windows EXE run 33384172266 (#109): PASS.
          - Final Hosting deploy run 33384196510: PASS; Full release gate, Hosting deploy and PROD smoke all PASS.
          - Latest R2 production deploy run 33390515840: PASS.
          - R2 health/CORS runtime evidence: RC2.2.16, canonical-email-first, browser PUT preflight allowed.
          - Build run 33384196512 (#274) on final PROD deploy source: PASS.

          ## Runtime note
          Earlier post-R2 diagnostics proved ADMIN had zero photo queue and cross-account R2 objects were visible. The final reconcile fix was then deployed to PROD. A fresh physical multi-device diagnostic after this final reconcile should still be run in the next chat before applying the strongest label 'PHOTO CROSS-ACCOUNT PROD CERTIFIED'. No physical-device PASS is fabricated in this backup.

          ## Packaging
          - FULL SOURCE is an exact git archive of $SOURCE_SHA; no .git, node_modules or dist.
          - PATCH contains only added/modified files relative to RC2.2.14 plus DELETED_FILES.txt if applicable.
          - No Cloudflare token, Firebase service-account secret, Android signing secret, auth token, PIN or password is intentionally included.
          EOF

          cat > "$CHECKPOINT" <<EOF
          # HNL QLTC — CONTINUATION CHECKPOINT — RC2.2.16 — 2026-08-31

          Start the next chat from this checkpoint and the EOD FULL SOURCE in the same Drive folder.

          ## Baseline
          - Release: HNL QLTC V6.3.0 RC2.2.16
          - Clean source SHA: $SOURCE_SHA
          - Repo: lengochieu1211-sudo/hnl-qltc
          - Firebase: com-example-qlct-61329
          - Hosting: https://hnlqltc.web.app
          - R2 Worker: hnl-qltc-r2-gateway.lengochieu1211.workers.dev
          - R2 bucket: hnl-qltc-media

          ## Completed
          - Root R2 CORS failure fixed and deployed.
          - Cloudflare token is stored only as GitHub Repository Secret; do not paste it into chat/source.
          - R2 workflow restored to manual-only one-button workflow_dispatch.
          - Final Hosting deployment PASS.
          - Android #115 PASS and Windows #109 PASS from source containing final photo reconcile.
          - Final source fixes photo revision/update monotonicity, Cloud-to-local reconcile, and EDITOR floor-plan retry loop.

          ## Next-chat first task
          1. Read this checkpoint first.
          2. Use the EOD FULL SOURCE ZIP as the source baseline; do not rollback.
          3. Verify current GitHub main tree still matches the clean backup tree before changing code.
          4. On Android EDITOR account, close/reopen app, stay online 1–2 minutes, open Crew + Defect.
          5. Export a fresh diagnostics JSON from Thêm → Hệ thống & Chẩn đoán.
          6. Verify photoPending/pendingDriveUploads = 0, no repeated r2-upload NETWORK/permission retry for the repaired Crew photos, and no EDITOR floor-plan WRITE_DENIED retry loop.
          7. On ADMIN second device/account, verify same Crew/Defect/Chat images open after cold restart.
          8. Only after that physical Runtime Golden passes, mark PHOTO CROSS-ACCOUNT PROD CERTIFIED.

          ## Do not change
          - Firebase project/projectId/Hosting.
          - GitHub repository.
          - R2 bucket/Worker identity.
          - Existing data or features.
          EOF

          (cd "$OUT" && sha256sum "$(basename "$FULL")" "$(basename "$PATCH")" "$(basename "$REPORT")" "$(basename "$CHECKPOINT")" > "$(basename "$SUMS")")

          unzip -t "$FULL" >/dev/null
          unzip -t "$PATCH" >/dev/null
          echo "SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          ls -lah "$OUT"

      - name: Upload backup bundle
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-RC2.2.16-EOD-BACKUP-2026-08-31
          path: ${{ env.OUT }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Remove one-shot backup workflow
        shell: bash
        run: |
          rm -f .github/workflows/rc2-2-16-eod-backup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/rc2-2-16-eod-backup.yml
          git commit -m "chore: remove RC2.2.16 EOD backup workflow"
          git push origin HEAD:main
