name: HNL DEV main vs PROD safe merge preview, GitHub runner only (NO PUSH/DEPLOY)
on:
  push:
    branches: [qa/dev-main-prod-parity-dryrun-20261101]
permissions:
  contents: read
jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact DEV, PROD source and QA-only change guard
        shell: bash
        run: |
          set -euo pipefail
          DEV=6073580c0d5ebcce1b6669f531d7140c384a78d3
          PROD=1c2b7d663d51d51aa45010e533d8e035e22adf59
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/qa/dev-main-prod-parity-dryrun-20261101
          test "$(git rev-parse HEAD^)" = "$DEV"
          test "$(git diff --name-only "$DEV" HEAD)" = '.github/workflows/hnl-dev-prod-parity-dryrun.yml'
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$DEV"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PROD"
          git merge-base "$DEV" "$PROD"
      - name: Dry run true merge of PROD history into DEV, no remote changes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          git config user.name 'HNL-QA-Dryrun'
          git config user.email 'qa-dryrun@users.noreply.github.com'
          git fetch --no-tags origin main
          set +e
          git merge --no-commit --no-ff origin/main > "$RUNNER_TEMP/merge.log" 2>&1
          EXIT_CODE=$?
          set -e
          git diff --name-only --diff-filter=U | sort > evidence/UNMERGED-FILES.txt
          echo "$EXIT_CODE" > evidence/merge-exit-code.txt
          cat "$RUNNER_TEMP/merge.log" | tail -70
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo 'NO FILE CONFLICT. Auto-merge still requires business regression; not approved to merge.'
            printf '%s\n' SAFE_AUTOMERGE_STRUCTURE_ONLY > evidence/MERGE-STATUS.txt
          else
            echo 'CONFLICTS FOUND. No cherry-picking or force merging permitted.'
            printf '%s\n' MANUAL_CONFLICT_RESOLUTION_REQUIRED > evidence/MERGE-STATUS.txt
          fi
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const files=fs.readFileSync('evidence/UNMERGED-FILES.txt','utf8').trim().split('\n').filter(Boolean);
          const status=fs.readFileSync('evidence/MERGE-STATUS.txt','utf8').trim();
          const report={devHead:'6073580c0d5ebcce1b6669f531d7140c384a78d3',prodHead:'1c2b7d663d51d51aa45010e533d8e035e22adf59',devCommitsAheadOfProd:87,prodCommitsAheadOfDev:8,status,unmergedFiles:files,unmergedCount:files.length,devBranchChanged:false,prodBranchChanged:false,firebaseTouched:false,noPushNoDeploy:true,checkedAt:new Date().toISOString()};
          fs.writeFileSync('evidence/DEV-PROD-MERGE-DRYRUN.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify(report));
          NODE
          if [ "$EXIT_CODE" -eq 0 ]; then
            echo 'HNL_AUTOMERGE_NO_CONFLICT=1' >> "$GITHUB_ENV"
          else
            echo 'HNL_AUTOMERGE_NO_CONFLICT=0' >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        if: env.HNL_AUTOMERGE_NO_CONFLICT == '1'
        with:
          node-version: 22
          cache: npm
      - name: If zero conflicts, static gates of merged local tree only (NO COMMIT)
        if: env.HNL_AUTOMERGE_NO_CONFLICT == '1'
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm run lint
          npm run test:rules
          npm run build
          echo 'Local auto-merged source static/build PASS; runtime/data parity still required.'
      - name: Upload audit evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNL-DEV-PROD-PARITY-DRYRUN-${{ github.sha }}
          path: evidence/**
          retention-days: 30
          if-no-files-found: error
