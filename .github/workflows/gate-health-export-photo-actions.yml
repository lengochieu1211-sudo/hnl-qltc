name: Gate Health Export + Photo Actions

on:
  push:
    branches:
      - gate/health-export-photo-actions-20260909

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BUILD_ID: gate-${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout isolated gate branch
        uses: actions/checkout@v4
        with:
          ref: gate/health-export-photo-actions-20260909
          fetch-depth: 0

      - name: Verify and apply exact compressed patch
        shell: bash
        run: |
          set -euo pipefail
          BASE=9436806e4fed43812f64d6126a22bc732c54c967
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          cat .gate-patch/00 .gate-patch/01 .gate-patch/02 .gate-patch/03 > /tmp/patch.b64
          echo '7f3d8c86b74c4978402b19d6567a82ce27003268ce6a9d74334e525664aa001e  /tmp/patch.b64' | sha256sum -c -
          base64 -d /tmp/patch.b64 > /tmp/patch.gz
          echo '3da276b86ef287e89401867a6db09ffbdb51685370c9879e309fcd6128a95ced  /tmp/patch.gz' | sha256sum -c -
          gzip -dc /tmp/patch.gz > /tmp/candidate.patch
          echo 'b38ef032293ae2e017cc7e5a39b99b3d0dc2f9932cd709824dfcb391eb5dc351  /tmp/candidate.patch' | sha256sum -c -
          git apply --check /tmp/candidate.patch
          git apply /tmp/candidate.patch

          python <<'PY'
          import subprocess
          expected = {
            'scripts/health-center-export-golden.ts',
            'scripts/health-center-navigation-golden.ts',
            'scripts/stability-gate.mjs',
            'src/components/GoogleConfigTab.tsx',
            'src/components/ImageViewerModal.tsx',
            'src/healthCenter/HealthCenterPanelBase.tsx',
            'src/healthCenter/healthCenterExport.ts',
            'src/utils/fileExport.ts',
            'src/utils/shareUtils.ts',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          if changed != expected:
            raise SystemExit(f'Unexpected patch scope: {sorted(changed)}')
          print('Patch scope PASS:', len(changed), 'files')
          PY
          git diff --check
          git diff --exit-code "$BASE" -- package.json package-lock.json .firebaserc firebase.json firestore.rules storage.rules database.rules.json
          git diff --exit-code "$BASE" -- .github/workflows/build.yml .github/workflows/firebase-hosting-merge.yml .github/workflows/firebase-hosting-pull-request.yml .github/workflows/firebase-dev-environment.yml .github/workflows/windows-exe-dev.yml .github/workflows/android-apk-dev.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Focused regressions
        run: |
          npm run test:health-center
          npm run test:share-center
          node scripts/stability-gate.mjs
          node scripts/source-lint.mjs

      - name: Full verification
        run: npm run verify

      - name: Commit verified candidate and remove gate transport
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gate-patch .github/workflows/gate-health-export-photo-actions.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix: compact Health Center exports and add photo viewer actions'
          git push origin HEAD:gate/health-export-photo-actions-20260909
