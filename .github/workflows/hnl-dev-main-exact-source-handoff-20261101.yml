name: HNL exact CURRENT DEV main full source + patch + SHA archive (NO DEPLOY)
on:
  push:
    branches: [qa/dev-main-exact-799425-handoff-20261101]
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pin exact current DEV and untouched PROD
        shell: bash
        run: |
          set -euo pipefail
          DEV=7994251ca9fa9e09437ee0440ef09905463d7a39
          PREV=6073580c0d5ebcce1b6669f531d7140c384a78d3
          PROD=1c2b7d663d51d51aa45010e533d8e035e22adf59
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/qa/dev-main-exact-799425-handoff-20261101
          git merge-base --is-ancestor "$DEV" "$GITHUB_SHA"
          test "$(git diff --name-only "$DEV" HEAD)" = '.github/workflows/hnl-dev-main-exact-source-handoff-20261101.yml'
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$DEV"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PROD"
          git merge-base --is-ancestor "$PREV" "$DEV"
          git merge-base --is-ancestor "$PROD" "$DEV"
      - name: Archive exact DEV HEAD, patch relative to 6073580c, source identity and SHA
        shell: bash
        run: |
          set -euo pipefail
          DEV=7994251ca9fa9e09437ee0440ef09905463d7a39
          PREV=6073580c0d5ebcce1b6669f531d7140c384a78d3
          mkdir -p output
          git diff --name-only "$PREV" "$DEV" > output/CHANGED-FILES.txt
          test "$(wc -l < output/CHANGED-FILES.txt | tr -d ' ')" = 20
          git archive --format=zip --output=output/HNL-QLTC-DEV-7994251c-FULL-SOURCE.zip "$DEV"
          git archive --format=zip --output=output/HNL-QLTC-DEV-7994251c-PATCH-FROM-6073580C.zip "$DEV" $(cat output/CHANGED-FILES.txt)
          unzip -t output/HNL-QLTC-DEV-7994251c-FULL-SOURCE.zip > /tmp/full-test.txt
          unzip -t output/HNL-QLTC-DEV-7994251c-PATCH-FROM-6073580C.zip > /tmp/patch-test.txt
          # Sensitive private keys are never part of source archives.
          if unzip -Z1 output/HNL-QLTC-DEV-7994251c-FULL-SOURCE.zip | grep -Eiv '\.example$' | grep -Ei '(^|/)(\.env($|\.)|service-account.*\.json$|.*private[_-]?key.*\.pem$)'; then echo '::error::sensitive file path in source'; exit 1; fi
          sha256sum output/HNL-QLTC-DEV-*.zip > output/SHA256SUMS.txt
          cat > output/REPORT.md <<'EOF'
          HNL QLTC – EXACT DEV MAIN SOURCE HANDOFF 2026-11-01
          Repo: lengochieu1211-sudo/hnl-qltc
          Branch dev exact HEAD: 7994251ca9fa9e09437ee0440ef09905463d7a39
          Base DEV: 6073580c0d5ebcce1b6669f531d7140c384a78d3
          PROD main unchanged: 1c2b7d663d51d51aa45010e533d8e035e22adf59
          DEV reconciled source root: c83188d5f68b9230bf999671d8289923607ce512
          PR #378 merges one DEV-only Hosting workflow on top of reconciled source.
          DEV main Hosting-only deployment GitHub Actions #41288025842 SUCCESS.
          LIVE https://hnl-qltc-dev.web.app/hnl-dev-release.json reports exact gitCommit 7994251ca9fa9e09437ee0440ef09905463d7a39.
          Firebase DEV: hnl-qltc-dev, NOT DEV Backup and NOT PROD.
          DEV app code: 19 files merged plus existing PROD stable history; workflow only 1 file added on 799425.
          PROD unchanged, Firestore Rules and Cloudflare Workers not deployed.
          CI: Web, APK, EXE PASS on c83188d; full static, Rules, stability, RBAC, offline and build PASS in Hosting-only run 41288025842.
          Not certified until real device Golden: signed in Windows/Android/phone Browser and offline reconnect, multi-user and regression checks.
          Source archives exact SHA and integrity checked in GitHub Actions.
          EOF
          cat output/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-DEV-MAIN-799425-FULL-PATCH-REPORT-SHA
          path: output/**
          retention-days: 30
          if-no-files-found: error
