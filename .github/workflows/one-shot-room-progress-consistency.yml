name: One-shot Room Progress Consistency

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-room-progress-consistency.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Patch room progress and Excel consistency
        run: python3 scripts/patch-room-progress-consistency.py

      - name: Install dependencies
        run: npm ci

      - name: Stability Gate
        run: npm run test:stability

      - name: Room Progress Consistency Golden
        run: npx tsx scripts/room-progress-consistency-golden.ts

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated source hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/RoomHighlightModal.tsx src/components/FloorPlanDefectTab.tsx scripts/room-progress-consistency-golden.ts
          git diff --cached --check
          git commit -m 'fix(dev): harden room progress inspection and Excel preflight'
          git push origin HEAD:dev
