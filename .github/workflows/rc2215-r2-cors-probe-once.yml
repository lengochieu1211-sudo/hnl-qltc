name: RC2.2.15 R2 CORS Probe Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc2215-r2-cors-probe-once.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe Worker health and browser PUT preflight
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev'
          echo '=== HEALTH ==='
          curl -sS -D /tmp/health.headers -o /tmp/health.body "$BASE/health"
          cat /tmp/health.headers
          cat /tmp/health.body
          echo
          echo '=== OPTIONS PUT PREFLIGHT ==='
          curl -sS -X OPTIONS -D /tmp/options.headers -o /tmp/options.body \
            -H 'Origin: https://hnlqltc.web.app' \
            -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-hnl-metadata' \
            "$BASE/v1/object?key=projects/proj_1786411472502/media/diagnostics/probe/original.jpg"
          cat /tmp/options.headers
          cat /tmp/options.body || true
          echo
          grep -qi '^access-control-allow-origin: https://hnlqltc.web.app' /tmp/options.headers
          grep -qi '^access-control-allow-methods:.*PUT' /tmp/options.headers
          grep -qi '^access-control-allow-headers:.*Authorization' /tmp/options.headers
          grep -qi '^access-control-allow-headers:.*X-HNL-Metadata' /tmp/options.headers
