name: One-shot DEFECT room-team suggestion repair

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-defect-room-team-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Patch room-specific Defect team suggestions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/components/FloorPlanDefectTab.tsx')
          text = path.read_text(encoding='utf-8')

          old = """  // The durable teamId is authoritative. Legacy room/sub-item rows may have teamId but an
          // empty or stale assignedTeam string; the Defect UI must still display the real linked team.
          const roomAtPosTeam = roomAtPos
            ? resolveAssignedTeamName(roomAtPos.teamId, roomAtPos.assignedTeam)
            : '';
          """
          new = """  // Surface every team that is actually linked to this room. In real projects the room
          // root can be intentionally blank while teams are assigned per category/sub-item. The old
          // picker only read room.teamId/assignedTeam, so a pin inside such a room incorrectly showed
          // \"Căn chưa gán đội mặc định\" even though the room's work items had valid teamId links.
          const roomAtPosDefaultTeam = roomAtPos
            ? resolveAssignedTeamName(roomAtPos.teamId, roomAtPos.assignedTeam)
            : '';
          const roomAtPosTeamNames = roomAtPos
            ? Array.from(new Set([
                roomAtPosDefaultTeam,
                ...(roomAtPos.subItems || []).map((s) => resolveAssignedTeamName(s.teamId, s.assignedTeam)),
              ].filter(Boolean)))
            : [];
          // A single room-specific team is safe to treat as the room suggestion. If several teams
          // work in the room, keep all of them visible and require the user to choose the responsible one.
          const roomAtPosTeam = roomAtPosDefaultTeam || (roomAtPosTeamNames.length === 1 ? roomAtPosTeamNames[0] : '');
          """
          if old not in text:
              raise SystemExit('Expected roomAtPosTeam block not found')
          text = text.replace(old, new, 1)

          old = """      ...(roomAtPosTeam ? [roomAtPosTeam] : []),
          """
          new = """      ...roomAtPosTeamNames,
          """
          if old not in text:
              raise SystemExit('Expected allSuggestedTeams room entry not found')
          text = text.replace(old, new, 1)

          old = """    roomAtPos,
            roomAtPosTeam,
          """
          new = """    roomAtPos,
            roomAtPosTeamNames,
            roomAtPosTeam,
          """
          if old not in text:
              raise SystemExit('Expected return roomAtPos block not found')
          text = text.replace(old, new, 1)

          old = """    roomAtPos,
            roomAtPosTeam,
            currentFloorTeams,
          """
          new = """    roomAtPos,
            roomAtPosTeamNames,
            roomAtPosTeam,
            currentFloorTeams,
          """
          if old not in text:
              raise SystemExit('Expected destructuring roomAtPos block not found')
          text = text.replace(old, new, 1)

          old = """          {roomAtPosTeam && (
            <optgroup label=\"📍 Đội thuộc Căn / Phòng hiện tại\">
              <option value={roomAtPosTeam}>📍 {roomAtPosTeam} ({roomAtPos?.roomName || 'Căn hiện tại'})</option>
            </optgroup>
          )}
          """
          new = """          {roomAtPosTeamNames.length > 0 && (
            <optgroup label=\"📍 Đội đang làm Căn / Phòng hiện tại\">
              {roomAtPosTeamNames.map((tName) => (
                <option key={tName} value={tName}>📍 {tName} ({roomAtPos?.roomName || 'Căn hiện tại'})</option>
              ))}
            </optgroup>
          )}
          """
          if old not in text:
              raise SystemExit('Expected room team optgroup not found')
          text = text.replace(old, new, 1)

          old = """            {roomAtPosTeam ? (
              <button
                type=\"button\"
                onClick={() => onChange(roomAtPosTeam)}
                className={`px-2 py-1 rounded-lg text-[10px] font-bold shrink-0 transition-all ${
                  value === roomAtPosTeam
                    ? 'bg-amber-600 text-white shadow-xs'
                    : 'bg-white border border-amber-300 text-amber-900 hover:bg-amber-100'
                }`}
              >
                Gán ({roomAtPosTeam})
              </button>
            ) : (
              <span className=\"text-[10px] text-amber-700 italic shrink-0\">Căn chưa gán đội mặc định</span>
            )}
          """
          new = """            {roomAtPosTeamNames.length > 0 ? (
              <div className=\"flex flex-wrap justify-end gap-1\">
                {roomAtPosTeamNames.map((tName) => (
                  <button
                    type=\"button\"
                    key={tName}
                    onClick={() => onChange(tName)}
                    className={`px-2 py-1 rounded-lg text-[10px] font-bold shrink-0 transition-all ${
                      value === tName
                        ? 'bg-amber-600 text-white shadow-xs'
                        : 'bg-white border border-amber-300 text-amber-900 hover:bg-amber-100'
                    }`}
                  >
                    {tName}
                  </button>
                ))}
              </div>
            ) : (
              <span className=\"text-[10px] text-amber-700 italic shrink-0\">Căn chưa gán đội ở cấp căn / hạng mục</span>
            )}
          """
          if old not in text:
              raise SystemExit('Expected room quick-click block not found')
          text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')

          test_path = Path('scripts/defect-linkage-golden.ts')
          test = test_path.read_text(encoding='utf-8')
          anchor = """assert.match(floorPlanSource, /teamNameById = new Map/, 'Defect team picker must resolve durable room/sub-item teamId to the current team name');
          """
          addition = anchor + """assert.match(floorPlanSource, /roomAtPosTeamNames/, 'Defect team picker must collect room-specific teams');
          assert.match(floorPlanSource, /roomAtPos\\.subItems/, 'Defect team picker must include teams assigned on current-room sub-items');
          assert.match(floorPlanSource, /Đội đang làm Căn \\/ Phòng hiện tại/, 'Defect picker must prioritize current-room teams before floor-wide teams');
          """
          if anchor not in test:
              raise SystemExit('Expected golden assertion anchor not found')
          test = test.replace(anchor, addition, 1)
          test_path.write_text(test, encoding='utf-8')

          workflow = Path('.github/workflows/dev-runtime-golden.yml')
          wf = workflow.read_text(encoding='utf-8')
          anchor = """      - 'scripts/dev-hosted-browser-golden.mjs'
                - '.github/workflows/dev-runtime-golden.yml'
          """
          replacement = """      - 'scripts/dev-hosted-browser-golden.mjs'
                - 'src/components/FloorPlanDefectTab.tsx'
                - 'src/utils/defectLinkageUtils.ts'
                - 'scripts/defect-linkage-golden.ts'
                - '.github/workflows/dev-runtime-golden.yml'
          """
          if anchor not in wf:
              raise SystemExit('Expected runtime-golden path anchor not found')
          wf = wf.replace(anchor, replacement, 1)
          workflow.write_text(wf, encoding='utf-8')
          PY

      - name: Validate targeted linkage repair
        run: |
          npm ci
          npx tsx scripts/defect-linkage-golden.ts
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit source repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-defect-room-team-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FloorPlanDefectTab.tsx scripts/defect-linkage-golden.ts .github/workflows/dev-runtime-golden.yml .github/workflows/one-shot-defect-room-team-fix.yml
          git diff --cached --check
          git commit -m 'fix(dev): suggest teams working in selected room for Defect'
          git push origin HEAD:dev
