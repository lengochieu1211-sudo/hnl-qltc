name: One-shot DEFECT room-team suggestion repair

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-defect-room-team-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Patch room-specific Defect team suggestions
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/components/FloorPlanDefectTab.tsx')
          text = path.read_text(encoding='utf-8')

          # 1) Replace only the declaration itself; keep surrounding comments/formatting intact.
          marker = 'const roomAtPosTeam = roomAtPos'
          start = text.find(marker)
          if start < 0:
              raise SystemExit('roomAtPosTeam declaration not found')
          end_marker = ": '';"
          end = text.find(end_marker, start)
          if end < 0:
              raise SystemExit('roomAtPosTeam declaration end not found')
          end += len(end_marker)
          declaration = """const roomAtPosDefaultTeam = roomAtPos
            ? resolveAssignedTeamName(roomAtPos.teamId, roomAtPos.assignedTeam)
            : '';
          const roomAtPosTeamNames = roomAtPos
            ? Array.from(new Set([
                roomAtPosDefaultTeam,
                ...(roomAtPos.subItems || []).map((s) => resolveAssignedTeamName(s.teamId, s.assignedTeam)),
              ].filter(Boolean)))
            : [];
          // If there is exactly one team working in the room, it is a safe primary suggestion.
          // With several room teams, show all of them and let the user choose the responsible team.
          const roomAtPosTeam = roomAtPosDefaultTeam || (roomAtPosTeamNames.length === 1 ? roomAtPosTeamNames[0] : '');"""
          text = text[:start] + declaration + text[end:]

          # 2) Current-room teams must precede floor-wide and declared-team fallbacks.
          old = '...(roomAtPosTeam ? [roomAtPosTeam] : []),'
          if text.count(old) != 1:
              raise SystemExit(f'Expected exactly one allSuggestedTeams room entry, got {text.count(old)}')
          text = text.replace(old, '...roomAtPosTeamNames,', 1)

          # 3) Return/destructure the room team collection. There should be exactly two bare properties.
          prop_pattern = re.compile(r'(?m)^(?P<indent>\s*)roomAtPosTeam,\s*$')
          matches = list(prop_pattern.finditer(text))
          if len(matches) != 2:
              raise SystemExit(f'Expected two roomAtPosTeam object properties, got {len(matches)}')
          text = prop_pattern.sub(lambda m: f"{m.group('indent')}roomAtPosTeamNames,\n{m.group('indent')}roomAtPosTeam,", text)

          # 4) Replace the current-room optgroup with all teams linked at room or sub-item level.
          opt_pattern = re.compile(
              r'\{roomAtPosTeam\s*&&\s*\(\s*'
              r'<optgroup label="📍 Đội thuộc Căn / Phòng hiện tại">.*?'
              r'</optgroup>\s*\)\}',
              re.S,
          )
          opt_replacement = """{roomAtPosTeamNames.length > 0 && (
            <optgroup label="📍 Đội đang làm Căn / Phòng hiện tại">
              {roomAtPosTeamNames.map((tName) => (
                <option key={tName} value={tName}>📍 {tName} ({roomAtPos?.roomName || 'Căn hiện tại'})</option>
              ))}
            </optgroup>
          )}"""
          text, count = opt_pattern.subn(opt_replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'Expected one current-room optgroup, got {count}')

          # 5) Replace the quick-click room action. Use the visible legacy message as a bounded anchor.
          message = 'Căn chưa gán đội mặc định'
          message_pos = text.find(message)
          if message_pos < 0:
              raise SystemExit('Legacy room quick-click message not found')
          quick_start = text.rfind('{roomAtPosTeam ? (', 0, message_pos)
          if quick_start < 0:
              raise SystemExit('room quick-click conditional start not found')
          quick_end = text.find(')}', message_pos)
          if quick_end < 0:
              raise SystemExit('room quick-click conditional end not found')
          quick_end += 2
          quick_replacement = """{roomAtPosTeamNames.length > 0 ? (
              <div className="flex flex-wrap justify-end gap-1">
                {roomAtPosTeamNames.map((tName) => (
                  <button
                    type="button"
                    key={tName}
                    onClick={() => onChange(tName)}
                    className={`px-2 py-1 rounded-lg text-[10px] font-bold shrink-0 transition-all ${
                      value === tName
                        ? 'bg-amber-600 text-white shadow-xs'
                        : 'bg-white border border-amber-300 text-amber-900 hover:bg-amber-100'
                    }`}
                  >
                    {tName}
                  </button>
                ))}
              </div>
            ) : (
              <span className="text-[10px] text-amber-700 italic shrink-0">Căn chưa gán đội ở cấp căn / hạng mục</span>
            )}"""
          text = text[:quick_start] + quick_replacement + text[quick_end:]

          path.write_text(text, encoding='utf-8')

          # Targeted regression evidence for the exact user-visible failure.
          test_path = Path('scripts/defect-linkage-golden.ts')
          test = test_path.read_text(encoding='utf-8')
          anchor = "assert.match(floorPlanSource, /teamNameById = new Map/, 'Defect team picker must resolve durable room/sub-item teamId to the current team name');"
          if anchor not in test:
              raise SystemExit('Golden assertion anchor not found')
          if 'Defect team picker must collect room-specific teams' not in test:
              addition = anchor + "\n" + (
                  "assert.match(floorPlanSource, /roomAtPosTeamNames/, 'Defect team picker must collect room-specific teams');\n"
                  "assert.match(floorPlanSource, /roomAtPos\\.subItems/, 'Defect team picker must include teams assigned on current-room sub-items');\n"
                  "assert.match(floorPlanSource, /Đội đang làm Căn \\/ Phòng hiện tại/, 'Defect picker must prioritize current-room teams before floor-wide teams');"
              )
              test = test.replace(anchor, addition, 1)
          test_path.write_text(test, encoding='utf-8')

          # Ensure this source change triggers Runtime Golden in future dev pushes.
          workflow = Path('.github/workflows/dev-runtime-golden.yml')
          wf = workflow.read_text(encoding='utf-8')
          if "      - 'src/components/FloorPlanDefectTab.tsx'" not in wf:
              anchor_line = "      - '.github/workflows/dev-runtime-golden.yml'"
              if anchor_line not in wf:
                  raise SystemExit('Runtime Golden path anchor not found')
              extra = (
                  "      - 'src/components/FloorPlanDefectTab.tsx'\n"
                  "      - 'src/utils/defectLinkageUtils.ts'\n"
                  "      - 'scripts/defect-linkage-golden.ts'\n"
                  + anchor_line
              )
              wf = wf.replace(anchor_line, extra, 1)
          workflow.write_text(wf, encoding='utf-8')
          PY

      - name: Validate targeted linkage repair
        run: |
          npm ci
          npx tsx scripts/defect-linkage-golden.ts
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit source repair and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-shot-defect-room-team-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FloorPlanDefectTab.tsx scripts/defect-linkage-golden.ts .github/workflows/dev-runtime-golden.yml .github/workflows/one-shot-defect-room-team-fix.yml
          git diff --cached --check
          git commit -m 'fix(dev): suggest teams working in selected room for Defect'
          git push origin HEAD:dev
