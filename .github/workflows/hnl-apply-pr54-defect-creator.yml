name: HNL Apply PR54 Defect Creator

on:
  push:
    branches:
      - fix/post-pr53-phone-defect-hardening
    paths:
      - '.github/workflows/hnl-apply-pr54-defect-creator.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply audited Defect creator patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .hnl-bootstrap/pr54-defect-creator.patch
          git apply .hnl-bootstrap/pr54-defect-creator.patch

      - name: Commit real Firebase Defect creator fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanDefectTab.tsx src/App.tsx
          git diff --cached --check
          git commit -m "Fix Defect creator to use verified Firebase identity"
          git push origin HEAD:${GITHUB_REF_NAME}
