name: RC2.2.16 Feature Binary Certification

on:
  push:
    branches:
      - rc2.2.16-feature-ci
    paths:
      - '.github/workflows/rc2-2-16-feature-binaries.yml'
  workflow_dispatch:

jobs:
  android:
    runs-on: windows-latest
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
      QLCT_WEB_URL: https://hnlqltc.web.app/?app=android
      QLCT_RELEASE_TAG: 6.3.0-rc2.2.16-feature
      QLCT_ANDROID_KEYSTORE_BASE64: ${{ secrets.QLCT_ANDROID_KEYSTORE_BASE64 }}
      QLCT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QLCT_ANDROID_KEYSTORE_PASSWORD }}
      QLCT_ANDROID_KEY_PASSWORD: ${{ secrets.QLCT_ANDROID_KEYSTORE_PASSWORD }}
      QLCT_ANDROID_KEY_PASSWORD_CONFIGURED: ${{ secrets.QLCT_ANDROID_KEY_PASSWORD }}
      QLCT_ANDROID_KEY_ALIAS: ${{ secrets.QLCT_ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run test:stability
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Build APK
        shell: pwsh
        run: ./android-wrapper/build-apk.ps1
      - name: Verify APK
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath './HNL-QLTC-Android.apk')) { throw 'APK was not created' }
          $item = Get-Item './HNL-QLTC-Android.apk'
          if ($item.Length -lt 4096) { throw "APK unexpectedly small: $($item.Length)" }
          Get-FileHash -Algorithm SHA256 -LiteralPath './HNL-QLTC-Android.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-RC2.2.16-Feature-Android
          path: HNL-QLTC-Android.apk
          if-no-files-found: error
          retention-days: 30

  windows:
    runs-on: windows-latest
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
      QLCT_RELEASE_TAG: 6.3.0-rc2.2.16-feature
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:stability
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - run: node scripts/desktop-launcher-golden.mjs
      - name: Build EXE
        shell: pwsh
        run: ./desktop-wrapper/build-launcher.ps1
      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath './HNL-QLTC-Windows.exe')) { throw 'EXE was not created' }
          $item = Get-Item './HNL-QLTC-Windows.exe'
          if ($item.Length -lt 4096) { throw "EXE unexpectedly small: $($item.Length)" }
          Get-FileHash -Algorithm SHA256 -LiteralPath './HNL-QLTC-Windows.exe'
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-RC2.2.16-Feature-Windows
          path: HNL-QLTC-Windows.exe
          if-no-files-found: error
          retention-days: 30
