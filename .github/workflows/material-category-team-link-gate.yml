name: Material Category Team Link Gate

on:
  push:
    branches: [gate/material-category-team-link-20260909]
    paths:
      - 'src/utils/materialNeedEngine.ts'
      - 'scripts/material-need-golden.ts'
      - '.gate/material-category-team-link.patch'
      - '.github/workflows/material-category-team-link-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout gate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact DEV parent and candidate scope
        shell: bash
        run: |
          set -euo pipefail
          BASE='bf3fdb6b87032787db2b56facf1aa5e9cd544806'
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --name-only "$BASE"..HEAD | sort > /tmp/actual.txt
          printf '%s\n' \
            '.gate/material-category-team-link.patch' \
            '.github/workflows/material-category-team-link-gate.yml' \
            'scripts/material-need-golden.ts' \
            'src/utils/materialNeedEngine.ts' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --exit-code "$BASE"..HEAD -- package.json package-lock.json .firebaserc firebase.json firebase.prod.json firestore.rules storage.rules

      - name: Install exact dependencies
        run: npm ci

      - name: Material linkage golden
        run: npm run test:material-need

      - name: Full release gate
        run: npm run verify

      - name: Working tree clean
        run: git diff --exit-code && git diff --cached --exit-code
