name: RC2.2.8 PROD Deploy Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc2-2-8-prod-deploy-once.yml'

permissions:
  contents: read

concurrency:
  group: hnl-qltc-prod-release
  cancel-in-progress: false

jobs:
  deploy_prod:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify one-shot source integrity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE="cd2bf0b31f13bea7540a09818d2b4bb305cb2785"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE" || { echo "BLOCKED: unexpected parent commit"; exit 1; }
          changed="$(git diff --name-only "$EXPECTED_SOURCE"..HEAD)"
          test "$changed" = ".github/workflows/rc2-2-8-prod-deploy-once.yml" || { echo "BLOCKED: unexpected files changed:"; echo "$changed"; exit 1; }
          test "$(node -p "require('./package.json').version")" = "6.3.0" || { echo "BLOCKED: unexpected package version"; exit 1; }
          test "$(node -p "require('./package-lock.json').version")" = "6.3.0" || { echo "BLOCKED: package-lock mismatch"; exit 1; }

      - name: R2 and PROD identity gate
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_BINARY_STORAGE_PROVIDER" = "r2"
          test "$VITE_FIREBASE_PROJECT_ID" = "com-example-qlct-61329"
          echo "$VITE_R2_GATEWAY_URL" | grep -Eq '^https://[^ ]+$'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stability / Architecture / Golden Gate
        run: npm run test:stability

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Firebase Rules compile check
        run: npm run test:rules

      - name: Security audit (production, critical)
        run: npm run security:audit

      - name: Build
        run: npm run build

      - name: Deploy Firestore rules
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project com-example-qlct-61329 --non-interactive

      - name: Deploy Hosting site hnlqltc
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only hosting --config firebase.prod.json --project com-example-qlct-61329 --non-interactive
          echo "PROD Hosting: https://hnlqltc.web.app"

      - name: PROD HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            if curl -fsS -H 'Cache-Control: no-cache' "https://hnlqltc.web.app/?release=rc2.2.8&ts=$(date +%s)" -o /tmp/prod-index.html; then
              grep -q '<div id="root"></div>' /tmp/prod-index.html && break
            fi
            sleep 5
          done
          grep -q '<div id="root"></div>' /tmp/prod-index.html
          curl -fsSI -H 'Cache-Control: no-cache' https://hnlqltc.web.app/ | head -n 20
          echo "PROD_HTTP_SMOKE_PASS"
