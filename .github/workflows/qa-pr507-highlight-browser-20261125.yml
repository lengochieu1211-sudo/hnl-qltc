name: PR507 isolated Highlight browser gate (NO DEPLOY)
on:
  push:
    branches: [qa/pr507-highlight-browser-20261125]
    paths: ['.github/workflows/qa-pr507-highlight-browser-20261125.yml']
permissions:
  contents: read
jobs:
  highlight-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Pin exact approved source and no source changes
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = '1be2366d3c2d215e943c45a4c128eb1d28ea600f'
          git diff --exit-code HEAD^ HEAD -- src package.json package-lock.json firebase.json firestore.rules storage.rules cloudflare
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - run: node scripts/highlight-pr507-browser-golden.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HNL-PR507-Highlight-browser-evidence
          path: runtime-evidence/pr507-highlight/
          retention-days: 14
