name: TEMP Post PR73 Audit

on:
  push:
    branches:
      - audit/post-pr73-hardening

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/post-pr73-hardening
      - name: Apply audit patch
        run: python scripts/_tmp_apply_post_pr73_audit.py
      - name: Validate focused and full source gates
        run: |
          npm ci
          npm run test:team-directory-integrity
          npm run test:material-need
          npm run typecheck
          npm run lint
          npm run test:rules
          npm run security:audit
          npm run build
      - name: Commit audited source and remove temporary files
        run: |
          rm -f .github/workflows/_tmp-post-pr73-audit.yml scripts/_tmp_apply_post_pr73_audit.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(audit): harden team directory without UI remount"
          git push origin HEAD:audit/post-pr73-hardening
