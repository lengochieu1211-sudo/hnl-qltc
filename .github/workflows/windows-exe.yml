name: Build HNL QLTC Windows EXE

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop-wrapper/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/desktop-launcher-golden.mjs'
      - '.github/workflows/windows-exe.yml'
  push:
    branches:
      - main
    paths:
      - 'desktop-wrapper/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/desktop-launcher-golden.mjs'
      - '.github/workflows/windows-exe.yml'

jobs:
  build_exe:
    runs-on: windows-latest
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
      QLCT_RELEASE_TAG: 6.3.0-rc2.2.11

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stability Gate
        run: npm run test:stability

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web bundle
        run: npm run build

      - name: Desktop launcher golden
        run: node scripts/desktop-launcher-golden.mjs

      - name: Build portable Windows EXE
        shell: pwsh
        run: ./desktop-wrapper/build-launcher.ps1

      - name: Verify EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path './HNL-QLTC-Windows.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'EXE was not created' }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 4096) { throw "EXE is unexpectedly small: $($item.Length) bytes" }
          $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($exe)
          Write-Host "EXE: $($item.FullName)"
          Write-Host "Size: $($item.Length)"
          Write-Host "Assembly version: $($assembly.Version)"
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe

      - name: Upload Windows EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-Windows-EXE-${{ github.run_number }}
          path: HNL-QLTC-Windows.exe
          if-no-files-found: error
          retention-days: 30
