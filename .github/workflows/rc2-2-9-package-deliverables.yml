name: RC2.2.9 Package Final Deliverables
on:
  push:
    branches: [rc2-2-9-same-phone-photo-sync-ui]
    paths:
      - '.github/workflows/rc2-2-9-package-deliverables.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Exact final-tree guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "789a7cb76ff3ec426a112f99da8d6f1527bc5888" || { echo 'REFUSING: unexpected package parent'; exit 1; }
          test "$(git show -s --format=%T HEAD^)" = "ceabeff150f4fccb272af68a9b7f21b55d25dc3f" || { echo 'REFUSING: source tree does not match final clean main tree'; exit 1; }
          test "$(tr -d '\r\n' < desktop-wrapper/release-tag.txt)" = "6.3.0-rc2.2.9" || { echo 'REFUSING: release tag mismatch'; exit 1; }
      - name: Dependency-free release guards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stability-gate.mjs
          node scripts/desktop-launcher-golden.mjs
          node scripts/source-lint.mjs
      - name: Build PATCH + FULL SOURCE + REPORT
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p deliverables
          FULL='deliverables/HNL-QLTC-V6.3.0-RC2.2.9-FULL-SOURCE.zip'
          PATCH='deliverables/HNL-QLTC-V6.3.0-RC2.2.9-PATCH.zip'
          REPORT='deliverables/HNL-QLTC-V6.3.0-RC2.2.9-REPORT.md'
          SUMS='deliverables/HNL-QLTC-V6.3.0-RC2.2.9-SHA256SUMS.txt'

          git archive --format=zip --output="$FULL" HEAD^
          git archive --format=zip --output="$PATCH" HEAD^ -- \
            .github/workflows/android-apk.yml \
            .github/workflows/windows-exe.yml \
            desktop-wrapper/release-tag.txt \
            scripts/desktop-launcher-golden.mjs \
            scripts/stability-gate.mjs \
            src/components/MaterialNormModal.tsx \
            src/components/PhotoAttachmentPicker.tsx \
            src/lib/photoCloudSync.ts \
            src/utils/photoStorage.ts

          cat > "$REPORT" <<'EOF'
          # HNL QLTC V6.3.0 RC2.2.9 - FINAL REPORT

          ## Release identity
          - Release: `6.3.0-rc2.2.9`
          - Repository: `lengochieu1211-sudo/hnl-qltc`
          - PR: `#8 - RC2.2.9 Same-phone photo sync + PC quota alignment`
          - PR head certified: `789a7cb76ff3ec426a112f99da8d6f1527bc5888`
          - Main merge commit: `01b751d741f8356abebe4853c8417ebd95e28c1f`
          - Final clean main commit: `cebd623317cc446fa2e07d7edd7321e2150379ac`
          - Final application/source tree: `ceabeff150f4fccb272af68a9b7f21b55d25dc3f`
          - PROD URL: `https://hnlqltc.web.app`

          ## P0 fixes completed
          1. Same-phone account switch photo reliability
             - Isolated runtime photo list cache by authenticated account.
             - Pending/offline photo metadata is not reused across another account session.
             - Added server refresh for stale `pending` photo documents.
             - Added explicit cloud binary-ready verification after upload.
             - Reset runtime photo cache on auth-user change.
             - Prevent opaque R2/Storage pointers from being used directly as image URLs.
             - Applies to shared photo rendering paths used by Crew/Defect workflows.
          2. PC Material Norm layout
             - Aligned `Hao phí định mức` and `Hao phí / đơn vị khối lượng` fields on desktop.
             - Mobile layout remains stacked/responsive.
          3. Release identity
             - Android and Windows release identity moved to `6.3.0-rc2.2.9`.

          ## Files changed in RC2.2.9 PATCH
          - `.github/workflows/android-apk.yml`
          - `.github/workflows/windows-exe.yml`
          - `desktop-wrapper/release-tag.txt`
          - `scripts/desktop-launcher-golden.mjs`
          - `scripts/stability-gate.mjs`
          - `src/components/MaterialNormModal.tsx`
          - `src/components/PhotoAttachmentPicker.tsx`
          - `src/lib/photoCloudSync.ts`
          - `src/utils/photoStorage.ts`

          ## Verification / CI evidence
          - Dependency-free source gates: PASS (Stability, Offline/Firebase/RBAC/R2/Desktop/Auth/Source Lint during hotfix flow).
          - PR #8: Build #152 PASS; Android #49 PASS; Windows #43 PASS.
          - Main merge commit `01b751d...`: Build #153 PASS; Android #50 PASS including fixed release signing; Windows #44 PASS.
          - PROD one-shot release: PASS for npm ci, Stability, TypeScript, Lint, Firebase Rules behavior, critical security audit, Build, Firestore Rules deploy, Firebase Hosting deploy and live HTTP smoke.
          - PROD live smoke: PASS on `https://hnlqltc.web.app`.
          - Temporary PROD deploy workflow removed from `main` after successful deployment.
          - Final clean-main Build #155: PASS for npm ci, Stability, TypeScript, Lint, Firebase Rules behavior, critical security audit and Build.

          ## Configuration integrity
          - `package.json` / `package-lock.json`: unchanged by this hotfix; CI `npm ci` PASS.
          - Firebase project/Hosting identity: unchanged (`com-example-qlct-61329`, Hosting site `hnlqltc`).
          - Firestore/Storage rules were not replaced by another project configuration.
          - Existing GitHub repository retained; no new production repository created.
          - Secret-sensitive source lint/gates passed; no release secrets are included in the deliverable ZIPs.

          ## Remaining physical Runtime Golden
          The source/CI/deployment gates are green, but the exact real-device account-switch case still needs a physical test:
          1. On the same phone, sign in Account A and capture a new Crew/Defect photo while online.
          2. Wait until the UI confirms the photo is synchronized to cloud.
          3. Sign out Account A, sign in Account B, open the same project/card.
          4. Confirm thumbnail and full photo both render; open Edit and confirm the photo also renders there.
          5. Force-close the app/browser, reopen under Account B and verify again.
          6. Repeat once with a Defect photo.

          Physical Runtime Golden should only be marked VERIFIED after the above passes on the actual phone.
          EOF

          sha256sum "$PATCH" "$FULL" "$REPORT" > "$SUMS"
          unzip -t "$PATCH" >/dev/null
          unzip -t "$FULL" >/dev/null
          test "$(unzip -Z1 "$PATCH" | grep -v '/$' | wc -l | tr -d ' ')" = "9"
          echo 'PATCH entries:'
          unzip -Z1 "$PATCH"
          echo 'FULL source entries:'
          unzip -Z1 "$FULL" | wc -l
          cat "$SUMS"
      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-RC2.2.9-FINAL-DELIVERABLES
          path: deliverables/*
          if-no-files-found: error
          retention-days: 30
