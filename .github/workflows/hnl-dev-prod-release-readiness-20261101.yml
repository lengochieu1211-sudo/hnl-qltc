name: HNL exact DEV main source, PROD candidate parity and safe handoff (NO DEPLOY)
on:
  push:
    branches: [qa/dev-main-prod-release-readiness-20261101]
permissions:
  contents: read
jobs:
  readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Refuse HEAD drift, confirm PROD is ancestor of DEV
        shell: bash
        run: |
          set -euo pipefail
          DEV=7994251ca9fa9e09437ee0440ef09905463d7a39
          PROD=1c2b7d663d51d51aa45010e533d8e035e22adf59
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/qa/dev-main-prod-release-readiness-20261101
          test "$(git rev-parse HEAD^)" = "$DEV"
          test "$(git diff --name-only "$DEV" HEAD)" = '.github/workflows/hnl-dev-prod-release-readiness-20261101.yml'
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$DEV"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PROD"
          git merge-base --is-ancestor "$PROD" "$DEV"
          echo 'PROD is a Git ancestor of exact DEV source, no histories missing.'
      - name: Scan tracked file names and release candidate file-level parity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {execFileSync} from 'node:child_process';
          const sh=(...args)=>execFileSync('git',args,{encoding:'utf8'}).trim();
          const dev='7994251ca9fa9e09437ee0440ef09905463d7a39',prod='1c2b7d663d51d51aa45010e533d8e035e22adf59';
          const prs=[{pr:375,sha:'33a24cc3e97bdce61058fd2c2219c37da4f40642'},{pr:366,sha:'5cb282b76c0e74898ff8c86ed22fc26e4c0c58ae'}];
          const report={repo:'lengochieu1211-sudo/hnl-qltc',devHead:dev,prodHead:prod,mainAncestorOfDev:true,productionChanges:sh('diff','--name-only',prod,dev).split('\n').filter(Boolean).length,noDeployment:true,candidates:[]};
          const tracked=sh('ls-files').split('\n');
          const sensitive=tracked.filter(x=>/^(\.env(\..+)?|.+\.(pem|p12|pfx|key)|service-account.*\.json|firebase-adminsdk.*\.json)$/i.test(x) && !/\.example$|\.sample$|public\.pem$/i.test(x));
          report.trackedSensitiveFiles=sensitive;
          for(const p of prs){
            const files=sh('diff','--name-only',prod,p.sha).split('\n').filter(Boolean);
            const comparison=files.map(file=>{
              let status='different-from-dev';
              try {if(sh('rev-parse',dev+':'+file)===sh('rev-parse',p.sha+':'+file))status='byte-identical-to-dev';} catch {status='one-side-missing';}
              return {file,status};
            });
            report.candidates.push({...p,files:comparison,matchCount:comparison.filter(x=>x.status==='byte-identical-to-dev').length,divergenceCount:comparison.filter(x=>x.status!=='byte-identical-to-dev').length});
          }
          fs.writeFileSync('evidence/PROD-CANDIDATE-VS-EXACT-DEV.json',JSON.stringify(report,null,2));
          console.log(JSON.stringify({dev,prod,trackedSensitiveFiles:sensitive,candidates:report.candidates.map(x=>({pr:x.pr,matchCount:x.matchCount,divergenceCount:x.divergenceCount,divergent:x.files.filter(f=>f.status!=='byte-identical-to-dev').map(f=>f.file)}))}));
          if(sensitive.length)process.exitCode=1;
          NODE
      - name: TypeScript, lint, rules and build current DEV source (no backend credentials)
        shell: bash
        env:
          VITE_APP_ENV: DEV
          VITE_USE_FIREBASE_EMULATORS: 'true'
          VITE_FIREBASE_EMULATOR_PROJECT_ID: demo-hnl-readiness
        run: |
          set -euo pipefail
          node -e "const a=require('./package.json'),b=require('./package-lock.json');if(a.version!==b.version||a.name!==b.name)process.exit(1)"
          npm ci
          npm run typecheck
          npm run lint
          npm run test:rules
          node scripts/auth-popup-golden.mjs
          node scripts/position-lock-cloud-golden.mjs
          npm run build
          test -s dist/index.html
      - name: Archive exact DEV FULL and DEV delta PATCH, CRC and SHA256
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/archives
          DEV=7994251ca9fa9e09437ee0440ef09905463d7a39
          PREV=6073580c0d5ebcce1b6669f531d7140c384a78d3
          git archive --format=zip --output=evidence/archives/HNL-QLTC-DEV-MAIN-FULL-7994251.zip "$DEV"
          git diff --diff-filter=ACMR --name-only -z "$PREV" "$DEV" > /tmp/patch-paths.null
          if [ -s /tmp/patch-paths.null ];then
            xargs -0 git archive --format=zip --output=evidence/archives/HNL-QLTC-DEV-MAIN-PATCH-FROM-6073580.zip "$DEV" < /tmp/patch-paths.null
          fi
          unzip -t evidence/archives/HNL-QLTC-DEV-MAIN-FULL-7994251.zip | tail -1
          unzip -t evidence/archives/HNL-QLTC-DEV-MAIN-PATCH-FROM-6073580.zip | tail -1
          sha256sum evidence/archives/*.zip > evidence/SHA256SUMS.txt
          printf 'DEV=7994251ca9fa9e09437ee0440ef09905463d7a39\nPROD=1c2b7d663d51d51aa45010e533d8e035e22adf59\nNO_DEPLOY=TRUE\n' > evidence/SOURCE-IDENTITY.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HNL-DEV-7994251-EXACT-FULL-PATCH-PROD-AUDIT-${{ github.sha }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 30
