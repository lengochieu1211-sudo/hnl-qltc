name: P21 DEV Sidecar Pure Parity Golden (NO DEPLOY)
on:
  pull_request:
    paths:
      - 'src/utils/roomSidecarProgressSafety.ts'
      - 'src/lib/roomSidecarProgressCloud.ts'
      - 'src/utils/warehouseTrustedCutoverSafety.ts'
      - 'scripts/p21-room-sidecar-pure-golden.mjs'
      - '.github/workflows/p21-sidecar-parity-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sidecar-pure:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pure legacy/sidecar overlay + structural immutability
        run: node --experimental-strip-types scripts/p21-room-sidecar-pure-golden.mjs
