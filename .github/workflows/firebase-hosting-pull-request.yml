# DEV-only preview. Never point this workflow at the production Firebase project.
name: Deploy to HNL QLTC DEV on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: ${{ vars.HNL_QLTC_DEV_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.HNL_QLTC_DEV_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ vars.HNL_QLTC_DEV_PROJECT_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.HNL_QLTC_DEV_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.HNL_QLTC_DEV_MESSAGING_SENDER_ID }}
      VITE_FIREBASE_APP_ID: ${{ vars.HNL_QLTC_DEV_APP_ID }}
      VITE_FIREBASE_APP_CHECK_SITE_KEY: ${{ vars.HNL_QLTC_DEV_APP_CHECK_SITE_KEY }}
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify source root
        shell: bash
        run: |
          test -f package.json || { echo "Missing package.json at repository root"; exit 1; }
          test -f package-lock.json || { echo "Missing package-lock.json at repository root"; exit 1; }
      - name: DEV Firebase isolation gate
        shell: bash
        run: |
          test -n "$VITE_FIREBASE_PROJECT_ID" || { echo "BLOCKED: configure HNL_QLTC_DEV_PROJECT_ID in GitHub Variables"; exit 1; }
          test "$VITE_FIREBASE_PROJECT_ID" != "com-example-qlct-61329" || { echo "REFUSING: DEV workflow points to PROD project"; exit 1; }
          test -n "$VITE_FIREBASE_STORAGE_BUCKET" || { echo "BLOCKED: configure HNL_QLTC_DEV_STORAGE_BUCKET"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Stability / Architecture / Golden Gate
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Firebase Rules compile check
        run: npm run test:rules
      - name: Security audit (production, critical)
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Deploy DEV Firestore + Storage rules
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-dev-service-account.json
        run: |
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo "BLOCKED: configure FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only firestore:rules,storage --project "$VITE_FIREBASE_PROJECT_ID" --non-interactive
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV }}
          projectId: ${{ vars.HNL_QLTC_DEV_PROJECT_ID }}
