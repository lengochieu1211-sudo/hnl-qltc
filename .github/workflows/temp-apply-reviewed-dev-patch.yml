name: HNL QLTC TEMP Apply Reviewed DEV Patch

on:
  push:
    branches:
      - tmp-apply-ui-health-4
    paths:
      - '.github/workflows/temp-apply-reviewed-dev-patch.yml'
      - '.github/patches/HNL-QLTC-DEV-UI-HEALTH-2026-09-11.part-*.b64'

permissions:
  contents: write

jobs:
  apply_patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temp branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 3

      - name: Verify and apply exact reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/tmp-apply-ui-health-4' || { echo '::error::REFUSING: wrong branch'; exit 1; }
          PARENT="$(git rev-parse HEAD^)"
          test "$PARENT" = '72b33484162bcc5d335829259082b68891c51c63' || {
            echo "::error::REFUSING: expected parent 72b33484162bcc5d335829259082b68891c51c63, got $PARENT"
            exit 1
          }
          cat .github/patches/HNL-QLTC-DEV-UI-HEALTH-2026-09-11.part-*.b64 > "$RUNNER_TEMP/patch.gz.b64"
          base64 -d "$RUNNER_TEMP/patch.gz.b64" | gzip -d > "$RUNNER_TEMP/hnl-dev-ui-health.patch"
          printf '%s  %s\n' 'bc9aadaa1ea17268f21db694c7315d43dd92f45f30c464f35ae732ab88470ed8' "$RUNNER_TEMP/hnl-dev-ui-health.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/hnl-dev-ui-health.patch"
          git apply "$RUNNER_TEMP/hnl-dev-ui-health.patch"
          rm -f .github/patches/HNL-QLTC-DEV-UI-HEALTH-2026-09-11.patch.gz.b64
          rm -f .github/patches/HNL-QLTC-DEV-UI-HEALTH-2026-09-11.part-*.b64
          rm -f .github/workflows/dev-one-time-patch-apply.yml
          rm -f .github/workflows/temp-apply-reviewed-dev-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'feat(dev): unify settings sync UI and health diagnostics'
          git push origin HEAD:tmp-apply-ui-health-4
