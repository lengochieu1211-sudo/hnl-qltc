name: TEMP Admin Sync Health Fix

on:
  push:
    branches:
      - fix/admin-sync-health-center

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-sync-health-center
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: node scripts/temp-admin-sync-health-fix.mjs
      - name: Install dependencies
        run: npm ci
      - name: Focused regression
        run: npm run test:superadmin-navigation
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Commit verified source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/SuperAdminCenter.tsx src/components/ProjectManagerModal.tsx scripts/superadmin-navigation-golden.ts
          git commit -m "fix: merge admin sync diagnostics and raise sync modal"
          git push origin HEAD:fix/admin-sync-health-center
