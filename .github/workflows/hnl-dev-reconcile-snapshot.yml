name: HNL DEV/PROD exact source snapshot and merge conflict context (READ ONLY)
on:
  push:
    branches: [qa/dev-main-reconcile-source-snapshot-20261101]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pin immutable DEV/PROD and inspect three-way merge
        shell: bash
        run: |
          set -euo pipefail
          DEV=6073580c0d5ebcce1b6669f531d7140c384a78d3
          PROD=1c2b7d663d51d51aa45010e533d8e035e22adf59
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/qa/dev-main-reconcile-source-snapshot-20261101
          git merge-base --is-ancestor "$DEV" "$GITHUB_SHA"
          test "$(git diff --name-only "$DEV" HEAD)" = '.github/workflows/hnl-dev-reconcile-snapshot.yml'
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$DEV"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PROD"
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$PROD"
          mkdir -p evidence/conflicts evidence/archives
          git archive --format=zip --output=evidence/archives/DEV-FULL-6073580c.zip "$DEV"
          git archive --format=zip --output=evidence/archives/PROD-FULL-1c2b7d66.zip "$PROD"
          git merge-base "$DEV" "$PROD" > evidence/merge-base-sha.txt
          git archive --format=zip --output=evidence/archives/BASE-FULL-MERGE-BASE.zip "$(cat evidence/merge-base-sha.txt)"
          git config user.name HNL-QA-SourceAudit
          git config user.email qa-audit@users.noreply.github.com
          set +e
          git merge --no-commit --no-ff origin/main > evidence/git-merge-output.txt 2>&1
          status=$?
          set -e
          echo "$status" > evidence/git-merge-exit.txt
          git diff --name-only --diff-filter=U > evidence/unmerged-paths.txt
          while IFS= read -r p; do
            test -n "$p" || continue
            mkdir -p "evidence/conflicts/$(dirname "$p")"
            for stage in 1 2 3; do
              git show ":$stage:$p" > "evidence/conflicts/$p.stage$stage" || true
            done
            cp "$p" "evidence/conflicts/$p.conflict" || true
          done < evidence/unmerged-paths.txt
          # Include merge result (auto-merged files and unresolved markers) without VCS/
          # node_modules; this is read-only evidence from isolated GitHub runner.
          git ls-files -z | tar --null -T - -czf evidence/archives/MERGE-WORKTREE-INCOMPLETE.tgz --ignore-failed-read
          sha256sum evidence/archives/* > evidence/SHA256SUMS.txt
          printf 'DEV_HEAD=%s\nPROD_HEAD=%s\nMERGE_EXIT=%s\nNOT_MERGED=TRUE\nNO_PUSH=TRUE\nNO_DEPLOY=TRUE\n' "$DEV" "$PROD" "$status" > evidence/SOURCE-IDENTITY.txt
          echo 'Merge context sources prepared.'
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-DEV-PROD-EXACT-SOURCE-MERGE-CONTEXT-${{ github.sha }}
          path: evidence/**
          retention-days: 15
          if-no-files-found: error
