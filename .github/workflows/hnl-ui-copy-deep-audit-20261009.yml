name: HNL QLTC Dark HNL Brand and Copy Deep Audit (no deploy)
on:
  push:
    branches: [audit/hnl-ui-copy-deep-a832f89a-20261009]
permissions:
  contents: read
jobs:
  isolated_color_gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_PROJECT_ID: hnl-qltc-dev
    steps:
      - uses: actions/checkout@v4
      - name: Verify safe branch
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "audit/hnl-ui-copy-deep-a832f89a-20261009"
          test "$VITE_FIREBASE_PROJECT_ID" = "hnl-qltc-dev"
          test "$VITE_FIREBASE_PROJECT_ID" != "com-example-qlct-61329"
          test -f package-lock.json
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Palette regression
        run: node --experimental-strip-types scripts/hnl-primary-color-golden.ts
      - name: Stability and RBAC
        run: npm run test:stability
      - name: TypeScript
        run: npm run typecheck
      - name: Lint and secret scan
        run: npm run lint
      - name: Firebase rules regression
        run: npm run test:rules
      - name: Dependency security
        run: npm run security:audit
      - name: Build only; NO DEPLOY
        run: npm run build
      - name: Package audited candidate ZIPs (never deploy)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p handoff
          git archive --format=zip --output=handoff/HNL-QLTC-DEV-a832f89a-DEEP-AUDIT-FULL-SOURCE.zip HEAD
          zip -q -d handoff/HNL-QLTC-DEV-a832f89a-DEEP-AUDIT-FULL-SOURCE.zip .github/workflows/hnl-ui-copy-deep-audit-20261009.yml
          zip -q handoff/HNL-QLTC-DEV-a832f89a-DEEP-AUDIT-PATCH.zip src/index.css src/components/CrewReportShareModal.tsx src/components/SecurityModal.tsx src/components/ExportPdfModal.tsx scripts/hnl-primary-color-golden.ts
          unzip -t handoff/HNL-QLTC-DEV-a832f89a-DEEP-AUDIT-FULL-SOURCE.zip > /dev/null
          unzip -t handoff/HNL-QLTC-DEV-a832f89a-DEEP-AUDIT-PATCH.zip > /dev/null
          printf "BASE DEV HEAD a832f89ae1f9ae3e083097160e9ea3c1054d1fb7\nSOURCE FILES 459\nPATCH 5 FILES\nCI SHA %s\nNO DEV OR PROD DEPLOY\n" "$GITHUB_SHA" > handoff/CHECKPOINT.txt
          sha256sum handoff/HNL-QLTC-DEV-a832f89a-DEEP-AUDIT-*.zip > handoff/SHA256SUMS.txt
      - name: Upload audited candidate deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-DEV-a832f89a-DEEP-AUDIT-CANDIDATE
          path: handoff/
          if-no-files-found: error
          retention-days: 30
