name: HNL QLTC DEV Rules Timeout Budget Audit

on:
  push:
    branches: [audit/dev-rules-timeout-budget-20260915]

permissions:
  contents: write

concurrency:
  group: audit-dev-rules-timeout-budget-20260915
  cancel-in-progress: true

env:
  DEV_SHA: e4839af06a786d87dcd815cb7de1fe44f261c657
  READY_BRANCH: audit/dev-rules-timeout-budget-ready-20260915

jobs:
  certify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Guard exact DEV and apply timeout-budget fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/dev)" = "$DEV_SHA"
          git checkout --detach "$DEV_SHA"
          cat > "$RUNNER_TEMP/rules-timeout.patch.gz.b64" <<'PATCH_B64'
          
          PATCH_B64
          tr -d '[:space:]' < "$RUNNER_TEMP/rules-timeout.patch.gz.b64" | base64 -d | gzip -d > "$RUNNER_TEMP/rules-timeout.patch"
          git apply --check "$RUNNER_TEMP/rules-timeout.patch"
          git apply "$RUNNER_TEMP/rules-timeout.patch"
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = ".github/workflows/firebase-dev-environment.yml scripts/audit-hardening-golden.mjs "
          git diff --exit-code -- package.json package-lock.json
          node scripts/audit-hardening-golden.mjs

      - name: Install exact dependencies
        run: npm ci

      - name: Full certification gates
        shell: bash
        run: |
          set -euo pipefail
          npm run verify
          git diff --check
          git diff --exit-code -- package.json package-lock.json

      - name: Create clean ready commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/firebase-dev-environment.yml scripts/audit-hardening-golden.mjs
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/firebase-dev-environment.yml scripts/audit-hardening-golden.mjs "
          git commit -m 'fix(dev): align Firebase Rules retry timeout budget'
          git rev-parse HEAD | tee fix-sha.txt
          git push --force origin "HEAD:refs/heads/$READY_BRANCH"

      - uses: actions/upload-artifact@v4
        with:
          name: dev-rules-timeout-ready-sha-${{ github.run_number }}
          path: fix-sha.txt
          if-no-files-found: error
          retention-days: 14
