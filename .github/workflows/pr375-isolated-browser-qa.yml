name: HNL PR375 isolated browser preflight (EMULATOR ONLY - NO DEPLOY)
on:
  push:
    branches:
      - qa/pr375-isolated-browser-golden-20261101
permissions:
  contents: read
concurrency:
  group: hnl-pr375-qa-isolated
  cancel-in-progress: false
jobs:
  browser-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_USE_FIREBASE_EMULATORS: 'true'
      VITE_FIREBASE_EMULATOR_PROJECT_ID: demo-hnl-pr375
      VITE_FIREBASE_EMULATOR_HOST: '127.0.0.1'
      VITE_FIREBASE_AUTH_EMULATOR_PORT: '9099'
      VITE_FIRESTORE_EMULATOR_PORT: '8080'
      VITE_FIREBASE_STORAGE_EMULATOR_PORT: '9199'
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
      VITE_HNL_AI_ENABLED: 'false'
      VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact candidate ancestry, current main, and source whitelist
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=33a24cc3e97bdce61058fd2c2219c37da4f40642
          BASE=1c2b7d663d51d51aa45010e533d8e035e22adf59
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/qa/pr375-isolated-browser-golden-20261101
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$BASE"
          git merge-base --is-ancestor "$CANDIDATE" "$GITHUB_SHA"
          test "$(git merge-base "$BASE" "$CANDIDATE")" = "$BASE"
          git diff --name-only "$CANDIDATE" HEAD | tee /tmp/qa-files.txt
          test "$(wc -l </tmp/qa-files.txt | tr -d ' ')" = 4
          while IFS= read -r f; do
            case "$f" in
              scripts/pr375-isolated-browser-smoke.mjs|scripts/pr375-emulator-auth-runtime-smoke.mjs|scripts/pr375-webkit-emulator-auth-smoke.mjs|.github/workflows/pr375-isolated-browser-qa.yml) ;;
              *) echo "REFUSING out-of-scope QA file: $f";exit 1;;
            esac
          done < /tmp/qa-files.txt
          test "$VITE_APP_ENV" = DEV
          test "$VITE_USE_FIREBASE_EMULATORS" = true
          test "$VITE_FIREBASE_EMULATOR_PROJECT_ID" = demo-hnl-pr375
          test "$VITE_ENABLE_LEGACY_DRIVE_WRITE" = false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install locked dependencies and browser
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium webkit
      - name: Build DEV Emulator-only candidate (not a PROD bundle)
        run: |
          npm run build
          test -s dist/index.html
          grep -R -q 'demo-hnl-pr375' dist/assets
      - name: Start isolated Firestore/Auth emulators
        shell: bash
        run: |
          set -euo pipefail
          nohup npx --yes firebase-tools@13.35.1 emulators:start --only firestore,auth --project demo-hnl-pr375 --config firebase.json > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/emulator.pid"
          ok=0
          for i in $(seq 1 150); do
            if curl -sS -m 2 -o /dev/null http://127.0.0.1:8080/ && curl -sS -m 2 -o /dev/null http://127.0.0.1:9099/; then ok=1;break;fi
            sleep 2
          done
          test "$ok" = 1 || { tail -120 "$RUNNER_TEMP/emulator.log";exit 1; }
      - name: Start local-only browser preview
        shell: bash
        run: |
          set -euo pipefail
          nohup npx vite preview --host 127.0.0.1 --port 4173 --strictPort > "$RUNNER_TEMP/preview.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/preview.pid"
          ok=0
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:4173/; then ok=1;break;fi
            sleep 2
          done
          test "$ok" = 1 || { tail -100 "$RUNNER_TEMP/preview.log";exit 1; }
      - name: Chromium desktop/mobile emulator preflight with PROD-network deny
        run: node scripts/pr375-isolated-browser-smoke.mjs
      - name: Start local-only Vite development server for direct emulator auth module test
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_APP_ENV" = DEV
          test "$VITE_USE_FIREBASE_EMULATORS" = true
          test "$VITE_FIREBASE_EMULATOR_PROJECT_ID" = demo-hnl-pr375
          nohup npx vite --host 127.0.0.1 --port 4174 --strictPort > "$RUNNER_TEMP/vite-dev.log" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/vite-dev.pid"
          ok=0
          for i in $(seq 1 40); do
            if curl -fsS -o /dev/null http://127.0.0.1:4174/src/lib/firebase.ts; then ok=1;break;fi
            sleep 2
          done
          test "$ok" = 1 || { tail -100 "$RUNNER_TEMP/vite-dev.log"; exit 1; }
      - name: Signed-in emulator browser smoke for ADMIN, EDITOR, VIEWER on PC/phone (NO PROD)
        run: node scripts/pr375-emulator-auth-runtime-smoke.mjs
      - name: WebKit mobile Safari-like authenticated ADMIN/EDITOR/VIEWER smoke (NO PROD)
        run: node scripts/pr375-webkit-emulator-auth-smoke.mjs
      - name: Upload browser screenshot, audit and logs (evidence only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR375-ISOLATED-BROWSER-PREFLIGHT-${{ github.sha }}
          path: |
            runtime-evidence/pr375-isolated-qa/**
            runtime-evidence/pr375-emulator-auth/**
            runtime-evidence/pr375-webkit-emulator-auth/**
          if-no-files-found: warn
          retention-days: 30
      - name: Package exact QA FULL SOURCE and PATCH with SHA256 (NO DEPLOY)
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE=33a24cc3e97bdce61058fd2c2219c37da4f40642
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git diff --name-only "$CANDIDATE" HEAD | wc -l | tr -d ' ')" = 4
          test "$(git hash-object scripts/p2115-firestore-backup-public.pem)" = b27d18fda5d05bbfc257725cc463772389af236d
          SENSITIVE="$(git ls-files | grep -E '(^|/)([.]env$|[.]env[.]production$|[^/]*service.account[^/]*[.]json$|[^/]*[.]pem$|[^/]*[.]p12$|[^/]*[.]key$)' | grep -v -x 'scripts/p2115-firestore-backup-public.pem' || true)"
          test -z "$SENSITIVE" || { echo "Refuse to package sensitive tracked files";exit 1; }
          mkdir -p qa-handoff
          git archive --format=zip --output="qa-handoff/HNL-QLTC-PR375-QA-FULL-SOURCE-${GITHUB_SHA}.zip" HEAD
          git archive --format=zip --output="qa-handoff/HNL-QLTC-PR375-QA-PATCH-${GITHUB_SHA}.zip" HEAD .github/workflows/pr375-isolated-browser-qa.yml scripts/pr375-isolated-browser-smoke.mjs scripts/pr375-emulator-auth-runtime-smoke.mjs scripts/pr375-webkit-emulator-auth-smoke.mjs
          unzip -t "qa-handoff/HNL-QLTC-PR375-QA-FULL-SOURCE-${GITHUB_SHA}.zip" >/dev/null
          unzip -t "qa-handoff/HNL-QLTC-PR375-QA-PATCH-${GITHUB_SHA}.zip" >/dev/null
          sha256sum qa-handoff/*.zip > qa-handoff/SHA256SUMS.txt
          printf 'QA_HEAD=%s\\nQA_TREE=%s\\nCANDIDATE_BASE=%s\\n' "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" "$CANDIDATE" > qa-handoff/SOURCE-IDENTITY.txt
      - name: Upload complete QA source handoff (NO DEPLOY)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PR375-QA-SOURCE-HANDOFF-${{ github.sha }}
          path: qa-handoff/**
          if-no-files-found: warn
          retention-days: 30
      - name: Explicit status boundary
        if: always()
        run: echo 'This job NEVER deploys and does NOT certify signed-in/physical Runtime Golden or PROD data parity.'
