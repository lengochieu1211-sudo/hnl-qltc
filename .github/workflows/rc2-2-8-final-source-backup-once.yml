name: RC2.2.8 Final Source Backup Once
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc2-2-8-final-source-backup-once.yml'
permissions:
  contents: read
jobs:
  archive_final_source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact source parent
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE="c39ed6f90d136015ca2c35d41b9782a28ea9e06a"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE" || { echo "BLOCKED: unexpected source parent"; exit 1; }
          test "$(git diff --name-only "$EXPECTED_SOURCE"..HEAD)" = ".github/workflows/rc2-2-8-final-source-backup-once.yml" || { echo "BLOCKED: unexpected source change"; exit 1; }
      - name: Archive exact current main source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE="c39ed6f90d136015ca2c35d41b9782a28ea9e06a"
          BASELINE="fab7d071520df72885de73295a3f8d5cee2f29d5"
          git archive --format=zip --output=HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL-FULL-SOURCE.zip "$SOURCE"
          git diff --binary "$BASELINE".."$SOURCE" > HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL.patch
          git diff --name-only "$BASELINE".."$SOURCE" > HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL-CHANGED-FILES.txt
          printf 'source_commit=%s\nsource_tree=%s\nbaseline_commit=%s\n' "$SOURCE" "$(git rev-parse "$SOURCE^{tree}")" "$BASELINE" > HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL-SOURCE-MANIFEST.txt
          sha256sum HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL-FULL-SOURCE.zip HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL.patch HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL-CHANGED-FILES.txt HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL-SOURCE-MANIFEST.txt > SHA256SUMS-SOURCE.txt
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-RC2.2.8-PROD-FINAL-SOURCE-BACKUP
          path: |
            HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL-FULL-SOURCE.zip
            HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL.patch
            HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL-CHANGED-FILES.txt
            HNL-QLTC-V6.3.0-RC2.2.8-PROD-FINAL-SOURCE-MANIFEST.txt
            SHA256SUMS-SOURCE.txt
          retention-days: 7
