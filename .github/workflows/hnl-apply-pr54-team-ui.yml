name: HNL Apply PR54 Team UI

on:
  push:
    branches:
      - fix/post-pr53-phone-defect-hardening
    paths:
      - '.github/workflows/hnl-apply-pr54-team-ui.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply audited team UI patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check .hnl-bootstrap/pr54-team-ui.patch
          git apply .hnl-bootstrap/pr54-team-ui.patch

      - name: Commit hardened team UI
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/FloorPlanDefectTab.tsx
          git diff --cached --check
          git commit -m "Fix Defect teamId display resolution"
          git push origin HEAD:${GITHUB_REF_NAME}
