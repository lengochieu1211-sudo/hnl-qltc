name: PR492 isolated native QA build and shell smoke
on:
  push:
    branches: [qa/pr492-stage3-isolated-20261124]
    paths:
      - '.github/workflows/qa-pr492-native-isolated.yml'
      - 'scripts/qa-pr492-native-isolated.ps1'
      - 'scripts/qa-pr492-android-runtime.mjs'
      - 'src/main.tsx'
      - 'src/lib/firebaseBase.ts'
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-2022
    timeout-minutes: 35
    env:
      QA_PR492_NATIVE_ONLY: 'true'
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_USE_FIREBASE_EMULATORS: 'true'
      VITE_FIREBASE_EMULATOR_PROJECT_ID: demo-hnl-qltc-pr492
      VITE_FIREBASE_EMULATOR_HOST: 127.0.0.1
      VITE_BINARY_STORAGE_PROVIDER: firebase-storage
      VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
      VITE_ENABLE_LEGACY_DRIVE_READ: 'false'
      VITE_HNL_AI_ENABLED: 'false'
      VITE_R2_GATEWAY_URL: ''
      VITE_FIREBASE_DATABASE_URL: ''
      QLCT_RELEASE_TAG: 6.3.0-qa-pr492
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build isolated wrappers and run Windows local fixture probe
        shell: pwsh
        run: ./scripts/qa-pr492-native-isolated.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr492-native-qa-${{ github.sha }}
          path: qa-native-evidence/
          if-no-files-found: warn
          retention-days: 14

  android-runtime:
    needs: native
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QA_PR492_RUNTIME_EMULATOR_ONLY: 'true'
      QA_PR492_ANDROID_RUNTIME: 'true'
      GCLOUD_PROJECT: demo-hnl-qltc-pr492
      VITE_APP_ENV: DEV
      VITE_USE_FIREBASE_EMULATORS: 'true'
      VITE_FIREBASE_EMULATOR_PROJECT_ID: demo-hnl-qltc-pr492
      VITE_FIREBASE_EMULATOR_HOST: 127.0.0.1
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: firebase-storage
      VITE_HNL_AI_ENABLED: 'false'
      VITE_ENABLE_LEGACY_DRIVE_READ: 'false'
      VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
      VITE_R2_GATEWAY_URL: ''
      VITE_FIREBASE_DATABASE_URL: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@v4
        with:
          name: pr492-native-qa-${{ github.sha }}
          path: qa-native-evidence
      - name: Verify exact QA artifact and prepare isolated Android emulator
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/qa/pr492-stage3-isolated-20261124
          test "$(tr -d '\r\n' < qa-native-evidence/HEAD.txt)" = "$GITHUB_SHA"
          test -z "${GOOGLE_APPLICATION_CREDENTIALS:-}${FIREBASE_TOKEN:-}${CLOUDFLARE_API_TOKEN:-}"
          test -s qa-native-evidence/HNL-QLTC-QA-PR492-Android.apk
          mkdir -p runtime-evidence/pr492-android
          sha256sum qa-native-evidence/HNL-QLTC-QA-PR492-Android.apk > runtime-evidence/pr492-android/APK-SHA256.txt
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
          sdkmanager --install 'system-images;android-34;google_apis;x86_64'
          echo no | avdmanager create avd --force --name hnl-pr492-qa --package 'system-images;android-34;google_apis;x86_64' --device pixel_6
          nohup "$ANDROID_HOME/emulator/emulator" -avd hnl-pr492-qa -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect > "$RUNNER_TEMP/pr492-emulator.log" 2>&1 &
          adb start-server
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == 1 ]]; do sleep 5; done'
          adb shell input keyevent 82
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop ro.build.version.sdk
          adb shell dumpsys webviewupdate > runtime-evidence/pr492-android/webview-version.txt
          for port in 4178 8080 9099 9199; do adb reverse "tcp:$port" "tcp:$port"; done
          adb install qa-native-evidence/HNL-QLTC-QA-PR492-Android.apk
          adb shell pm path com.qlct.app.qa.pr492
      - run: npm ci --no-audit --no-fund
      - run: npm install --no-save --package-lock=false playwright@1.55.0
      - name: Actual Android WebView app Auth, offline save, force-stop and recovery
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=10s 600s npx --yes firebase-tools@13.35.1 --non-interactive emulators:exec --config firebase.rules-ci.json --project demo-hnl-qltc-pr492 --only auth,firestore,storage "node scripts/qa-pr492-android-runtime.mjs"
      - name: Capture Android diagnostics
        if: always()
        shell: bash
        run: |
          mkdir -p runtime-evidence/pr492-android
          adb logcat -d -t 3000 > runtime-evidence/pr492-android/logcat.txt || true
          adb exec-out screencap -p > runtime-evidence/pr492-android/device-last.png || true
          cp "$RUNNER_TEMP/pr492-emulator.log" runtime-evidence/pr492-android/emulator.log || true
          adb emu kill || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr492-android-runtime-${{ github.sha }}
          path: runtime-evidence/pr492-android/
          if-no-files-found: error
          retention-days: 14
