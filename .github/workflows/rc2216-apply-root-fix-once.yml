name: RC2.2.16 Apply Root Fix Once

on:
  push:
    branches:
      - rc2-2-16-r2-cors-root-fix
    paths:
      - 'rc2216-root-fix.patch'
      - '.github/workflows/rc2216-apply-root-fix-once.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc2-2-16-r2-cors-root-fix
          fetch-depth: 0
      - name: Apply exact RC2.2.16 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check rc2216-root-fix.patch
          git apply rc2216-root-fix.patch
          node scripts/stability-gate.mjs
          node scripts/r2-gateway-golden.mjs
          git diff --check
      - name: Commit applied source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/utils/fileExport.ts src/components/GoogleConfigTab.tsx cloudflare/r2-gateway/worker.js scripts/r2-gateway-golden.mjs .github/workflows/r2-worker-deploy.yml .github/workflows/android-apk.yml .github/workflows/windows-exe.yml desktop-wrapper/release-tag.txt scripts/desktop-launcher-golden.mjs scripts/stability-gate.mjs
          git commit -m 'fix: RC2.2.16 R2 CORS root cause and Android diagnostics export'
          git push origin HEAD:rc2-2-16-r2-cors-root-fix
