name: TEMP Apply Settings Sync Relocation

on:
  push:
    branches:
      - ux/unified-open-close-20260910

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/unified-open-close-20260910
          fetch-depth: 0
      - name: Apply UI relocation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          header = Path('src/components/GoogleAuthHeader.tsx')
          text = header.read_text(encoding='utf-8')
          text = text.replace('  RefreshCw, \n', '', 1)
          pattern = re.compile(r'\n\s*\{/\* Nút Đồng Bộ mở Trung tâm lưu & đồng bộ dự án \*/\}\n\s*<button\n\s*onClick=\{\(\) => onOpenProjectManager \? onOpenProjectManager\(\'sync\'\) : handleTriggerSync\(\)\}.*?</button>\n', re.S)
          text, count = pattern.subn('\n', text, count=1)
          if count != 1:
              raise SystemExit(f'Expected to remove 1 header sync button, removed {count}')
          header.write_text(text, encoding='utf-8')

          config = Path('src/components/GoogleConfigTab.tsx')
          text = config.read_text(encoding='utf-8')
          marker = '      {syncDiagnostics && (\n        <details id="system-sync-card"'
          if marker not in text:
              raise SystemExit('Settings insertion marker not found')
          card = '''      {onOpenProjectManager && (\n        <button\n          type="button"\n          onClick={() => onOpenProjectManager()}\n          className="w-full rounded-2xl border border-emerald-200 bg-emerald-50/70 p-4 text-left shadow-sm transition-all hover:bg-emerald-50 active:scale-[0.995]"\n          aria-label="Trung tâm đồng bộ và sao lưu dự án"\n          title="Trung tâm đồng bộ & sao lưu dự án"\n        >\n          <div className="flex items-center justify-between gap-3">\n            <div className="flex min-w-0 items-center gap-3">\n              <div className="flex h-9 w-9 shrink-0 items-center justify-center rounded-xl border border-emerald-200 bg-white text-emerald-700">\n                <RefreshCw className="h-4 w-4" />\n              </div>\n              <div className="min-w-0">\n                <div className="text-xs font-extrabold text-slate-900">Trung tâm đồng bộ & sao lưu dự án</div>\n                <div className="mt-0.5 text-[10px] font-semibold text-slate-500">Đồng bộ dữ liệu, R2/ảnh, sao lưu, khôi phục và đối chiếu dự án.</div>\n              </div>\n            </div>\n            <span className="shrink-0 text-lg font-bold text-emerald-700" aria-hidden="true">›</span>\n          </div>\n        </button>\n      )}\n\n'''
          text = text.replace(marker, card + marker, 1)
          config.write_text(text, encoding='utf-8')

          lang = Path('src/utils/language.ts')
          text = lang.read_text(encoding='utf-8')
          replacements = {
              "config: 'Cấu hình'": "config: 'Cài đặt'",
              "config_title: 'Cấu hình'": "config_title: 'Cài đặt'",
              "save_success: 'Đã cập nhật cấu hình hệ thống thành công!'": "save_success: 'Đã cập nhật cài đặt hệ thống thành công!'",
              "formatting_settings: 'Cấu hình định dạng số & ngày tháng'": "formatting_settings: 'Cài đặt định dạng số & ngày tháng'",
              "config_title: 'Configuration'": "config_title: 'Settings'",
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Language marker missing: {old}')
              text = text.replace(old, new, 1)
          lang.write_text(text, encoding='utf-8')

          # Verify the requested UX invariants before committing.
          header_text = header.read_text(encoding='utf-8')
          config_text = config.read_text(encoding='utf-8')
          lang_text = lang.read_text(encoding='utf-8')
          if 'title="Trung tâm lưu & đồng bộ dự án"' in header_text:
              raise SystemExit('Header sync shortcut still present')
          if config_text.count('Trung tâm đồng bộ & sao lưu dự án') < 2:
              raise SystemExit('Settings sync-center card missing')
          if "config: 'Cài đặt'" not in lang_text or "config_title: 'Cài đặt'" not in lang_text:
              raise SystemExit('Settings rename missing')
          PY
      - name: Commit source patch and remove temp workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-ux-open-close-audit.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GoogleAuthHeader.tsx src/components/GoogleConfigTab.tsx src/utils/language.ts .github/workflows/_tmp-ux-open-close-audit.yml
          git diff --cached --check
          git commit -m "fix(ui): move sync backup center into settings"
          git push origin HEAD:ux/unified-open-close-20260910
