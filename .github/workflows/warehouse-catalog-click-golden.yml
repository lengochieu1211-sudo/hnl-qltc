name: HNL Warehouse Catalog P0 Click Golden
on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/components/WarehouseTab.tsx'
      - 'scripts/warehouse-catalog-browser-golden.mjs'
      - 'scripts/fixtures/warehouse-catalog/**'
      - '.github/workflows/warehouse-catalog-click-golden.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real_click_desktop_mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Real WarehouseTab click on desktop and phone
        run: node scripts/warehouse-catalog-browser-golden.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNL-WAREHOUSE-CATALOG-P0-CLICK-${{ github.run_number }}
          path: runtime-evidence/catalog-click-*
          if-no-files-found: warn
          retention-days: 30
