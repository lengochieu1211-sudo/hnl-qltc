name: HNL DEV BACKUP Member Discovery Aggregate Audit (READ ONLY)
on:
  push:
    branches: [safety/dev-backup-room-highlight-uniform-stroke-20261029]
    paths: ['.github/workflows/hnl-dev-backup-member-discovery-readonly-audit-20261029.yml']
permissions:
  contents: read
jobs:
  member-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      EXPECTED_BASE: 0b584c6be41eb7712254c3cd373950d4da347151
      BACKUP_PROJECT: hnl-qltc-dev-backup
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact QA source, no application changes and no PROD access
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/safety/dev-backup-room-highlight-uniform-stroke-20261029'
          test "$(git diff --name-only "$EXPECTED_BASE" HEAD)" = '.github/workflows/hnl-dev-backup-member-discovery-readonly-audit-20261029.yml'
          test "$BACKUP_PROJECT" = 'hnl-qltc-dev-backup'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install locked Google auth dependencies
        run: npm ci --ignore-scripts
      - name: Read ONLY aggregate Firestore membership/index integrity (no PII)
        shell: bash
        env:
          FIREBASE_BACKUP_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV_BACKUP }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { google } from 'googleapis';
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const sa = JSON.parse(process.env.FIREBASE_BACKUP_SERVICE_ACCOUNT || '{}');
          if (sa.type !== 'service_account' || sa.project_id !== process.env.BACKUP_PROJECT || !sa.private_key) throw Error('WRONG_OR_MISSING_BACKUP_SA');
          const auth = new google.auth.GoogleAuth({credentials:sa, scopes:['https://www.googleapis.com/auth/datastore']});
          const token = (await (await auth.getClient()).getAccessToken()).token;
          if (!token) throw Error('NO_FIRESTORE_READ_TOKEN');
          const root = 'https://firestore.googleapis.com/v1/projects/' + process.env.BACKUP_PROJECT + '/databases/(default)/documents/';
          const field=(x,k)=>x?.fields?.[k];
          const str=(x,k)=>String(field(x,k)?.stringValue || '').trim();
          const bool=(x,k)=>field(x,k)?.booleanValue === true;
          const norm=x=>String(x||'').trim().toLowerCase();
          // SHA-256 fingerprint of the account supplied for this audit; no email or UID in source/logs.
          const targetSha='9da0521819812438b967d60f897b23970ff30ecd7863d3d180c575fab7ffe1cc';
          const isTarget=x=>createHash('sha256').update(norm(x)).digest('hex')===targetSha;
          async function read(path){
            let out=[], next='';
            do {
              if(out.length>=1000)throw Error('AUDIT_LIMIT_REACHED');
              const url=new URL(root+path);
              url.searchParams.set('pageSize','100');
              if(next)url.searchParams.set('pageToken',next);
              const response=await fetch(url,{method:'GET',headers:{Authorization:'Bearer '+token,Accept:'application/json'}});
              if(response.status===404) return out;
              if(!response.ok)throw Error('FIRESTORE_READ_ONLY_UNAVAILABLE_'+response.status+'_'+path.split('/')[0]);
              const body=await response.json();out.push(...(body.documents||[]));next=body.nextPageToken||'';
            }while(next);
            return out;
          }
          const [projects, invitations, accesses, userDocs]=await Promise.all([
            read('projects'),read('projectInvitations'),read('projectAccess'),read('users')
          ]);
          if (projects.length>100)throw Error('MAX_PROJECTS_AUDIT_STOP');
          const inviteSet=new Set(invitations.map(x=>str(x,'projectId')+'|'+norm(str(x,'invitedEmail')||str(x,'email'))));
          const accessSet=new Set(accesses.filter(x=>!field(x,'active')||bool(x,'active')).map(x=>str(x,'projectId')+'|'+norm(str(x,'email'))));
          const summary={environment:process.env.BACKUP_PROJECT,readOnly:true,projectRoots:projects.length,activeProjectRoots:0,activeMemberships:0,activeMembershipMissingInvitation:0,activeMembershipMissingAccessIndex:0,recentMembershipsMissingInvitation:0,missingCanonicalEmailIdentity:0,archivedProjects:0,invitationRows:invitations.length,accessRows:accesses.length,complete:true,changedFirestoreData:false,changedRules:false,prodTouched:false};
          const target={activeMemberCount:0,invitationCount:invitations.filter(i=>isTarget(str(i,'invitedEmail')||str(i,'email'))).length,accessCount:accesses.filter(a=>isTarget(str(a,'email'))).length,ownerRootCount:0,activeMemberWithInvitation:0,activeMemberWithAccessIndex:0,memberRoles:[],identityVerifiedByUserSession:false,userProfileDocuments:0,userProfilesWithProjectIndex:0};
          const targetProjectIds=new Set();
          const now=Date.now();
          for(const p of projects){
            if(bool(p,'deleted'))continue;
            if(isTarget(str(p,'ownerEmail')))target.ownerRootCount++;
            summary.activeProjectRoots++;
            const pid=p.name.split('/').pop();
            if(field(p,'archivedAt')?.integerValue && Number(field(p,'archivedAt').integerValue)>0)summary.archivedProjects++;
            const members=await read('projects/'+encodeURIComponent(pid)+'/members');
            for(const member of members){
              if(field(member,'active') && !bool(member,'active'))continue;
              const id=member.name.split('/').pop();
              const email=norm(str(member,'email') || (id.includes('@')?id:''));
              if(!email){summary.missingCanonicalEmailIdentity++;continue;}
              if(id.toLowerCase()!==email)continue; // exclude legacy UID aliases, canonical email identity only
              if(isTarget(email)){
                target.activeMemberCount++;
                targetProjectIds.add(pid);
                target.memberRoles.push(str(member,'role')||'UNKNOWN');
                if(inviteSet.has(pid+'|'+email))target.activeMemberWithInvitation++;
                if(accessSet.has(pid+'|'+email))target.activeMemberWithAccessIndex++;
              }
              summary.activeMemberships++;
              const key=pid+'|'+email;
              if(!inviteSet.has(key)){
                summary.activeMembershipMissingInvitation++;
                const updated=Number(field(member,'updatedAt')?.integerValue||0);
                if(updated>now-86400000)summary.recentMembershipsMissingInvitation++;
              }
              if(!accessSet.has(key))summary.activeMembershipMissingAccessIndex++;
            }
          }
          for(const userDoc of userDocs){
            if(!isTarget(str(userDoc,'email')))continue;
            target.userProfileDocuments++;
            const projectsMap=field(userDoc,'projects')?.mapValue?.fields||{};
            if(Array.from(targetProjectIds).some(id=>Object.prototype.hasOwnProperty.call(projectsMap,id)))target.userProfilesWithProjectIndex++;
          }
          // Read deployed Rules release/ruleset metadata only; never print rules or credentials.
          const rulesResult={readOnly:true,available:false,sourceHashMatchesDeployed:null,status:'unavailable'};
          try {
            const readAuth=new google.auth.GoogleAuth({credentials:sa,scopes:['https://www.googleapis.com/auth/cloud-platform']});
            const readToken=(await(await readAuth.getClient()).getAccessToken()).token;
            const headers={Authorization:'Bearer '+readToken,Accept:'application/json'};
            const rel=await fetch('https://firebaserules.googleapis.com/v1/projects/'+process.env.BACKUP_PROJECT+'/releases/cloud.firestore',{method:'GET',headers});
            rulesResult.status=String(rel.status);
            if(rel.ok){
              const release=await rel.json();
              const rulesetUrl='https://firebaserules.googleapis.com/v1/'+release.rulesetName;
              const rulesetRes=await fetch(rulesetUrl,{method:'GET',headers});
              rulesResult.status=String(rulesetRes.status);
              if(rulesetRes.ok){
                const ruleset=await rulesetRes.json();
                const deployedFiles=ruleset.source?.files||[];
                const candidates=deployedFiles.filter(file=>file.content && (/firestore/i.test(file.name||'')||deployedFiles.length===1));
                const localSource=fs.readFileSync('firestore.rules','utf8').replace(/\r\n/g,'\n').trim();
                rulesResult.available=Boolean(candidates.length);
                rulesResult.sourceHashMatchesDeployed=candidates.some(file=>file.content.replace(/\r\n/g,'\n').trim()===localSource);
                const deployedRules=candidates.map(x=>String(x.content||'')).join('\n');
                rulesResult.capabilities={
                  hasProjectAccessRules:deployedRules.includes('match /projectAccess/{accessId}'),
                  hasProjectInvitationsRules:deployedRules.includes('match /projectInvitations/{invitationId}'),
                  hasUsersSelfIndexRules:deployedRules.includes('match /users/{userId}'),
                  hasCanonicalEmailMemberRules:deployedRules.includes('hasEmailMember(projectId)'),
                  hasOwnerReadRecoveryRules:deployedRules.includes('isOwner(projectId)'),
                  invitationQueryMayRequireMember:deployedRules.includes('isMember(resource.data.projectId)'),
                };
                // Only reveal rules for invitation/user-index/projectAccess paths, with email strings masked.
                const excerpts=[];
                const lines=deployedRules.split('\n');
                for(const marker of ['match /projectInvitations/{','match /projectAccess/{','match /users/{']){
                  const idx=lines.findIndex(x=>x.includes(marker));
                  excerpts.push({marker,found:idx>=0,excerpt:idx>=0?lines.slice(idx,idx+14).join('\n').replace(/[\w.+-]+@[\w.-]+/g,'[redacted]'):''});
                }
                rulesResult.relevantExcerpts=excerpts;
                const guardStart=deployedRules.indexOf('function backupAccountAllowed()');
                if(guardStart>=0){
                  const braceStart=deployedRules.indexOf('{',guardStart);
                  let depth=0,end=braceStart;
                  for(;end<deployedRules.length;end++){
                    if(deployedRules[end]==='{')depth++;
                    if(deployedRules[end]==='}'){depth--;if(depth===0){end++;break;}}
                  }
                  const guard=deployedRules.slice(guardStart,end);
                  const emails=[...guard.matchAll(/[\\w.+-]+@[\\w.-]+/g)].map(x=>x[0]);
                  rulesResult.backupAccountGuard={
                    present:true,explicitEmailCount:emails.length,explicitlyAllowsTarget:emails.some(isTarget),
                    mentionsCurrentEmail:guard.includes('signedInEmail()'),
                    mentionsMember:guard.includes('isMember('),
                    mentionsProject:guard.includes('projectId'),
                    sanitizedExpression:guard.replace(/[\\w.+-]+@[\\w.-]+/g,'[email-redacted]').slice(0,1100)
                  };
                }else rulesResult.backupAccountGuard={present:false};
              }
            }
          } catch(err) {
            rulesResult.status='rules-api-unavailable';
          }
          summary.deployedRules=rulesResult;
          summary.target=target;
          fs.mkdirSync('evidence',{recursive:true});
          fs.writeFileSync('evidence/member-discovery-aggregate-readonly.json',JSON.stringify(summary,null,2)+'\n');
          console.log('READ_ONLY_AUDIT_PASS '+JSON.stringify(summary));
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HNL-DEV-BACKUP-MEMBER-DISCOVERY-READ-ONLY-EVIDENCE
          path: evidence/
          retention-days: 30
          if-no-files-found: warn
