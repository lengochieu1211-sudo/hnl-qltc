name: HNL PROD-to-DEV 11-file 3-way conflict forensic (NO PUSH/DEPLOY)
on:
  push:
    branches: [qa/dev-prod-conflict-triples-20261101]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact source identity and scope
        shell: bash
        run: |
          set -euo pipefail
          DEV=6073580c0d5ebcce1b6669f531d7140c384a78d3
          PROD=1c2b7d663d51d51aa45010e533d8e035e22adf59
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/qa/dev-prod-conflict-triples-20261101
          test "$(git rev-parse HEAD^)" = "$DEV"
          test "$(git diff --name-only "$DEV" HEAD)" = '.github/workflows/hnl-dev-prod-conflict-triples.yml'
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$DEV"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$PROD"
      - name: Read only perform merge and package 3-way inputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HNL QA Forensic'
          git config user.email 'hnl-qa@users.noreply.github.com'
          git fetch --no-tags origin main
          mkdir -p evidence
          git merge --no-commit --no-ff origin/main > evidence/merge.log 2>&1 || :
          python3 - <<'PY'
          import subprocess, zipfile, json, datetime, hashlib
          out='evidence/DEV-PROD-11-FILE-3WAY-INPUTS.zip'
          paths=subprocess.check_output(['git','diff','--name-only','--diff-filter=U'],text=True).splitlines()
          required=['scripts/dev-backup-four-issues-golden.mjs','scripts/dev-backup-voucher-a3-a4-matrix-golden.ts','scripts/floorplan-p0-golden.ts','scripts/prod-readiness-golden.mjs','scripts/stability-gate.mjs','scripts/ui-entry-ux-golden.ts','scripts/warehouse-voucher-xlsx-style-golden.ts','src/App.tsx','src/components/FloorPlanDefectTab.tsx','src/lib/chatService.ts','src/utils/warehouseVoucherExcel.ts']
          if sorted(paths)!=sorted(required): raise RuntimeError('Unexpected merge conflicts '+repr(paths))
          report={'dev':'6073580c0d5ebcce1b6669f531d7140c384a78d3','prod':'1c2b7d663d51d51aa45010e533d8e035e22adf59','conflicts':paths,'count':len(paths),'noPushNoDeploy':True}
          with zipfile.ZipFile(out,'w',zipfile.ZIP_DEFLATED) as z:
            for p in paths:
              for name,stage in [('base',1),('dev',2),('prod',3)]:
                r=subprocess.run(['git','show',f':{stage}:{p}'],capture_output=True)
                if r.returncode==0:
                  z.writestr(f'{name}/{p}',r.stdout)
              with open(p,'rb') as f:z.writestr(f'with-conflict-markers/{p}',f.read())
            z.writestr('identity.json',json.dumps(report,indent=2))
            z.writestr('merge.log',open('evidence/merge.log','rb').read())
          print(json.dumps(report))
          print('3way zip bytes',__import__('os').path.getsize(out))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-DEV-PROD-3WAY-INPUTS-${{ github.sha }}
          path: evidence/DEV-PROD-11-FILE-3WAY-INPUTS.zip
          retention-days: 10
          if-no-files-found: error
