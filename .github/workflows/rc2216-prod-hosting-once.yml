name: RC2.2.16 PROD Hosting Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc2216-prod-hosting-once.yml'

permissions:
  contents: read

jobs:
  certify_and_deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify exact PROD identity and RC2.2.16 diagnostics fix
        shell: bash
        run: |
          set -euo pipefail
          test "$VITE_FIREBASE_PROJECT_ID" = "com-example-qlct-61329"
          test "$VITE_R2_GATEWAY_URL" = "https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev"
          grep -F '"site": "hnlqltc"' firebase.prod.json
          grep -F 'saveTextFileToDownloads' src/components/GoogleConfigTab.tsx
          grep -F "'downloads'" src/utils/fileExport.ts
          grep -F "GATEWAY_VERSION = '6.3.0-rc2.2.16'" cloudflare/r2-gateway/worker.js
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run test:stability
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run security:audit
      - run: npm run build
      - name: Deploy Hosting site hnlqltc
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FIREBASE_SERVICE_ACCOUNT" || { echo '::error::Missing Firebase service-account secret'; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only hosting --config firebase.prod.json --project com-example-qlct-61329 --non-interactive
      - name: Live smoke
        shell: bash
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            code=$(curl -L -sS -o /tmp/live.html -w '%{http_code}' --max-time 20 "https://hnlqltc.web.app/?release=rc2.2.16&probe=${GITHUB_RUN_ID}-${i}" || true)
            if [ "$code" = "200" ] && grep -qi '<div id="root"' /tmp/live.html; then
              echo 'RC2.2.16 PROD Hosting smoke PASS'
              exit 0
            fi
            sleep 5
          done
          exit 1
