name: HNL DEV BACKUP Uniform Room Stroke – FULL PATCH REPORT SHA256 (NO DEPLOY)
on:
  push:
    branches: [safety/dev-backup-room-highlight-uniform-stroke-20261029]
    paths: ['.github/workflows/hnl-dev-backup-room-stroke-package-20261029.yml']
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BASE_SHA: 4ca8d52dbcf3cc13bba46e6a34861012a72e24db
      SOURCE_SHA: 8b3ca43d66eaa1023f560699d10f49898a96eed6
      CI_RUN: '40882949722'
      CI_SHA: 162da7879653dbc63e9eed698fc2361521f23a21
      PREVIEW_RUN: '40888469373'
      PREVIEW_SHA: 527895d0109bd16fb96ebcff0b0ea9ce96811448
      LIVE_RUN: '40888850831'
      LIVE_SHA: 8b3ca43d66eaa1023f560699d10f49898a96eed6
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact SHA, previous CI and live, and forbidden PROD changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/safety/dev-backup-room-highlight-uniform-stroke-20261029'
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = '.github/workflows/hnl-dev-backup-room-stroke-package-20261029.yml'
          for record in "$CI_RUN:$CI_SHA" "$PREVIEW_RUN:$PREVIEW_SHA" "$LIVE_RUN:$LIVE_SHA"; do
            id="${record%%:*}"; sha="${record#*:}"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$id" -o "$RUNNER_TEMP/$id.json"
            ID="$id" WANT_SHA="$sha" node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+process.env.ID+'.json'));
          if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!==process.env.WANT_SHA)throw Error('NOT_PASS '+process.env.ID);
          console.log('PASS',r.name,r.id);
          NODE
          done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 'b2557860fbb3b128b5f2c9863e99d0f8b1f78686'
          # DEV main may advance independently while a QA-only archive is built.
          # Read its exact current SHA, never rewrite/reset it.
          DEV_CURRENT_SHA="$(git ls-remote origin refs/heads/dev | cut -f1)"
          test -n "$DEV_CURRENT_SHA"
          echo "Observed DEV main HEAD (read-only): $DEV_CURRENT_SHA"
          node scripts/source-lint.mjs
          test "$(git rev-parse "$BASE_SHA^{tree}")" = "$(git rev-parse "$CI_SHA^{tree}")" || { echo 'P2180_CI_TREE_MISMATCH'; exit 1; }
      - name: Package complete current QA source and minimal patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/patch
          git archive --format=zip HEAD -o output/HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-FULL-SOURCE.zip
          git diff --name-only "$BASE_SHA" HEAD > output/CHANGED-FILES.txt
          while IFS= read -r path; do
            test -n "$path"
            test -f "$path"
            mkdir -p "output/patch/$(dirname "$path")"
            cp "$path" "output/patch/$path"
          done < output/CHANGED-FILES.txt
          (cd output/patch && zip -qr ../HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-PATCH.zip .)
          rm -rf output/patch
          cat > output/HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-REPORT.md <<EOF
          # HNL QLTC P21.80 – DEV Backup Live Hosting Release and Source Checkpoint – 29/10/2026
          Repo: lengochieu1211-sudo/hnl-qltc
          Branch: safety/dev-backup-room-highlight-uniform-stroke-20261029
          Packaging exact HEAD: $GITHUB_SHA
          P21.80 app source merge HEAD: $BASE_SHA
          CI-approved source tree: $CI_SHA, identical Git tree to $BASE_SHA
          DEV main: $(git ls-remote origin refs/heads/dev | cut -f1) (read-only; not touched)
          PROD main: b2557860fbb3b128b5f2c9863e99d0f8b1f78686 (not touched)
          Firebase Hosting project/site: hnl-qltc-dev-backup, R2 dev-backup unchanged.
          Before LIVE version: sites/hnl-qltc-dev-backup/versions/ef82f84f9c6f901b
          After LIVE version: sites/hnl-qltc-dev-backup/versions/f5cd1dc6972e508a
          Rollback channel: hnl-p2180-rollback-20261029 (original LIVE verified before promotion).
          Preview channel: hnl-p2180-qa-20261029
          CI $CI_RUN SUCCESS (TypeScript, lint, Firebase Rules/security audit, Web build, Windows EXE, Android APK and room sidecar on candidate).
          Preview $PREVIEW_RUN SUCCESS (P21.80 targeted 13/13, TypeScript, lint, Rules, security audit, Web build; 55 JS/CSS byte parity).
          LIVE $LIVE_RUN SUCCESS (read-only preflight, rollback snapshot, controlled promote, 55 JS/CSS byte parity).
          Public readback /sw-assets.json buildId=40888469373, upgraded from 40807623352.
          P21.80 application fix: Full PC room edit controls in flex flow without overlapping top toolbar; drawing overlay blocks accidental room/Defect selection and drag while freehand/polygon/rect tools active; highlight slider 50–250% per project/device, vectorEffect non-scaling-stroke retained.
          Changed application paths since PR #349: none. Subsequent QA-only changes are preview, live and packaging GitHub Actions workflow files.
          No changes to application business data, room geometry/IDs, Firestore Rules/Firestore data, Firebase settings, R2, permissions or PROD/main/dev.
          Remaining: signed-in physical PC/Android/Windows runtime golden and multi-account/offline/chat unread8 tests pending; NOT CERTIFIED.
          EOF
          mv output/CHANGED-FILES.txt output/HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-CHANGED-FILES.txt
          (cd output && sha256sum *.zip *.md *.txt > HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-SHA256SUMS.txt)
          unzip -tq output/HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-FULL-SOURCE.zip
          unzip -tq output/HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-PATCH.zip
          test -s output/HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-REPORT.md
          test -s output/HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-SHA256SUMS.txt
          echo 'PASS source full patch report hashes and CRC'
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-DEV-BACKUP-P2180-HOSTING-CHECKPOINT-FULL-PATCH-REPORT-SHA256
          path: output/
          if-no-files-found: error
          retention-days: 30
