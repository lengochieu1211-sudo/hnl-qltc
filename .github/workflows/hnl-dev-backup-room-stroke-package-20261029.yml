name: HNL DEV BACKUP Uniform Room Stroke – FULL PATCH REPORT SHA256 (NO DEPLOY)
on:
  push:
    branches: [safety/dev-backup-room-highlight-uniform-stroke-20261029]
    paths: ['.github/workflows/hnl-dev-backup-room-stroke-package-20261029.yml']
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      BASE_SHA: b349ff3f4feff1c8a52e5322d4c0e29e538fa37e
      SOURCE_SHA: 9968dee6a71d67a1214e4aef1408927e6d842c6f
      CI_RUN: '40807389437'
      CI_SHA: 950fb4091171281df435773b132483f292769dc9
      PREVIEW_RUN: '40807623352'
      PREVIEW_SHA: d4b1b6ca45f1a65491947ac4292e09d249f2925f
      LIVE_RUN: '40807769324'
      LIVE_SHA: 9968dee6a71d67a1214e4aef1408927e6d842c6f
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact SHA, previous CI and live, and forbidden PROD changes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/safety/dev-backup-room-highlight-uniform-stroke-20261029'
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = '.github/workflows/hnl-dev-backup-room-stroke-package-20261029.yml'
          for record in "$CI_RUN:$CI_SHA" "$PREVIEW_RUN:$PREVIEW_SHA" "$LIVE_RUN:$LIVE_SHA"; do
            id="${record%%:*}"; sha="${record#*:}"
            curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H 'Accept: application/vnd.github+json' "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$id" -o "$RUNNER_TEMP/$id.json"
            ID="$id" WANT_SHA="$sha" node - <<'NODE'
          const fs=require('fs'),r=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/'+process.env.ID+'.json'));
          if(r.status!=='completed'||r.conclusion!=='success'||r.head_sha!==process.env.WANT_SHA)throw Error('NOT_PASS '+process.env.ID);
          console.log('PASS',r.name,r.id);
          NODE
          done
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 'b2557860fbb3b128b5f2c9863e99d0f8b1f78686'
          # DEV main may advance independently while a QA-only archive is built.
          # Read its exact current SHA, never rewrite/reset it.
          DEV_CURRENT_SHA="$(git ls-remote origin refs/heads/dev | cut -f1)"
          test -n "$DEV_CURRENT_SHA"
          echo "Observed DEV main HEAD (read-only): $DEV_CURRENT_SHA"
          node scripts/source-lint.mjs
      - name: Package complete current QA source and minimal patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output/patch
          git archive --format=zip HEAD -o output/HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-FULL-SOURCE.zip
          git diff --name-only "$BASE_SHA" HEAD > output/CHANGED-FILES.txt
          while IFS= read -r path; do
            test -n "$path"
            test -f "$path"
            mkdir -p "output/patch/$(dirname "$path")"
            cp "$path" "output/patch/$path"
          done < output/CHANGED-FILES.txt
          (cd output/patch && zip -qr ../HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-PATCH.zip .)
          rm -rf output/patch
          cat > output/HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-REPORT.md <<EOF
          # HNL QLTC DEV Backup – Fix account menu tab routing – 2026-10-29
          Repo: lengochieu1211-sudo/hnl-qltc
          Branch: safety/dev-backup-room-highlight-uniform-stroke-20261029
          Exact packaging HEAD: $GITHUB_SHA
          App tested source at CI: $CI_SHA (only subsequent workflows; no business code changes)
          QA baseline: $BASE_SHA
          DEV main observed at packaging: $(git ls-remote origin refs/heads/dev | cut -f1) (read-only; changed independently during QA; NOT touched by this branch)
          PROD main: b2557860fbb3b128b5f2c9863e99d0f8b1f78686 (unchanged)
          Backend: Firebase hnl-qltc-dev-backup, R2 dev-backup (unchanged)
          Before Hosting: sites/hnl-qltc-dev-backup/versions/dcb606ceb3b3104b
          After Hosting: sites/hnl-qltc-dev-backup/versions/ef82f84f9c6f901b
          Rollback channel: hnl-room-stroke-rollback-20261029
          CI: $CI_RUN SUCCESS (TypeScript, lint, Firebase Rules, RBAC, offline, Chromium PC/mobile, build).
          PREVIEW: $PREVIEW_RUN SUCCESS (55 web assets exact byte parity).
          LIVE: $LIVE_RUN SUCCESS (rollback snapshot, gated promotion, 55 web assets parity).
          Root cause: saved room outlines used SVG coordinate stroke widths inside a viewBox 0 0 100 100 with preserveAspectRatio none. Stretching the SVG anisotropically caused vertical/horizontal strokes to differ visually on wide/tall plans.
          Changed app: src/components/FloorPlanDefectTab.tsx ONLY, within the saved-room highlight subtree.
          Fix: add vectorEffect=non-scaling-stroke to each of 4 saved-room SVG edges; use foreground 2px (selected 2.6px) and polyline glow 4px independent of SVG aspect ratio and zoom.
          No change: viewBox, coordinate mapping, image transforms, zoom/pan, saved room points, ID/schema, drag/resize/click/touch handlers, polygon fill, Defect markers, snap/draft preview, Firebase/R2, auth, permissions, Excel or account menu.
          Golden: scripts/dev-backup-room-highlight-stroke-golden.mjs verifies production JSX wiring (4 stroke shapes), all handlers unchanged, and Chromium SVG raster across 880x360, 360x880, 640x640, 1280x440, 440x1280; horizontal/vertical thickness within 1 pixel.
          Regression: CI $CI_RUN PASS npm ci, TypeScript, lint, Firebase Rules, RBAC, offline, room geometry/floor identity/sideguard, room transform and orthogonal snap, Chromium visual, build.
          Preview: $PREVIEW_RUN SUCCESS, isolated DEV Backup, 55 Web assets byte-identical with build; previous LIVE untouched.
          LIVE: $LIVE_RUN SUCCESS, rollback channel hnl-room-stroke-rollback-20261029; 55 assets byte-identical with Preview, no data changes.
          Remaining: signed-in real PC/mobile zoom/resize/pick/drag Runtime Golden requires owner confirmation; not CERTIFIED. Affected app module is presentation-only, no Firestore/R2 writes.
          EOF
          mv output/CHANGED-FILES.txt output/HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-CHANGED-FILES.txt
          (cd output && sha256sum *.zip *.md *.txt > HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-SHA256SUMS.txt)
          unzip -tq output/HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-FULL-SOURCE.zip
          unzip -tq output/HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-PATCH.zip
          test -s output/HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-REPORT.md
          test -s output/HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-SHA256SUMS.txt
          echo 'PASS source full patch report hashes and CRC'
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-DEV-BACKUP-ROOM-HIGHLIGHT-STROKE-FULL-PATCH-REPORT-SHA256
          path: output/
          if-no-files-found: error
          retention-days: 30
