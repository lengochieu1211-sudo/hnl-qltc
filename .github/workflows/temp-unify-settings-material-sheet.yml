name: TEMP Unify Settings Material Sheet

on:
  push:
    branches: [work/settings-feature-sheet-unify-stage]
    paths:
      - 'src/components/SettingsFeatureSheet.tsx'
      - 'src/components/SettingsAccordionCard.tsx'
      - '.github/workflows/temp-unify-settings-material-sheet.yml'

permissions:
  contents: write

jobs:
  validate_and_publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout staging branch
        uses: actions/checkout@v4
        with:
          ref: work/settings-feature-sheet-unify-stage
          fetch-depth: 0

      - name: Apply remaining unified-sheet edits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          # Warehouse: keep Material Norm untouched, route only Material Need through SettingsFeatureSheet.
          p = Path('src/components/WarehouseTab.tsx')
          s = p.read_text()
          old = "  ChevronDown\n} from 'lucide-react';"
          assert old in s
          s = s.replace(old, "  ChevronDown,\n  PackageSearch\n} from 'lucide-react';", 1)
          old = "import { ExpandCollapseButton } from './ExpandCollapseButton';"
          assert old in s
          s = s.replace(old, "import { SettingsFeatureSheet } from './SettingsFeatureSheet';", 1)
          old = '''            <ExpandCollapseButton\n              expanded={isMaterialNeedExpanded}\n              onToggle={() => setIsMaterialNeedExpanded((value) => !value)}\n              controls="material-need-details"\n              className={isMaterialNeedExpanded ? 'rotate-180' : ''}\n            />'''
          assert old in s
          s = s.replace(old, '''            <span aria-hidden="true" className="shrink-0 inline-flex h-9 w-9 items-center justify-center rounded-xl text-indigo-600 transition-all group-hover:bg-indigo-50">\n              <ChevronDown className={`h-4 w-4 transition-transform duration-200 ${isMaterialNeedExpanded ? 'rotate-180' : ''}`} />\n            </span>''', 1)
          start_needle = '          {isMaterialNeedExpanded && (\n            <div id="material-need-details" className="flex flex-col gap-3">'
          assert start_needle in s
          start = s.index(start_needle)
          end_marker = '            </div>\n          )}'
          end = s.index(end_marker, start) + len(end_marker)
          block = s[start:end]
          block = block.replace(start_needle, '''          <SettingsFeatureSheet\n            open={isMaterialNeedExpanded}\n            onClose={() => {\n              setIsMaterialNeedExpanded(false);\n              setShowMaterialFloorPicker(false);\n              setShowMaterialTeamPicker(false);\n            }}\n            sheetKey="material-need-details"\n            icon={PackageSearch}\n            iconClassName="text-indigo-600"\n            title="Gợi ý vật tư tổng hợp"\n            description="Theo tầng · Theo đội · Toàn dự án"\n            bodyClassName="space-y-3"\n          >\n            <div id="material-need-details" className="flex min-w-0 flex-col gap-3">''')
          block = block.replace(end_marker, '            </div>\n          </SettingsFeatureSheet>')
          s = s[:start] + block + s[end:]
          p.write_text(s)

          # Five Settings sheets: remove legacy inner horizontal padding because the shared shell owns 28px mobile padding.
          p = Path('src/components/GoogleConfigTab.tsx')
          s = p.read_text()
          assert s.count('space-y-3.5 px-4 pb-4') == 3
          assert s.count('px-2 pb-2 sm:px-3 sm:pb-3 space-y-3') == 1
          s = s.replace('          <div className="px-2 pb-2 sm:px-3 sm:pb-3 space-y-3">', '          <div className="space-y-3">', 1)
          s = s.replace('<div className="space-y-3.5 px-4 pb-4">', '<div className="space-y-3.5">')
          p.write_text(s)

          # UI source golden: lock one shared sheet implementation for 5 Settings entries + Material Need.
          p = Path('scripts/ui-entry-ux-golden.ts')
          s = p.read_text()
          a = s.index("const settingsAccordion = read('src/components/SettingsAccordionCard.tsx');")
          b = s.index("const config = read('src/components/GoogleConfigTab.tsx');")
          new = '''const settingsAccordion = read('src/components/SettingsAccordionCard.tsx');\nconst featureSheet = read('src/components/SettingsFeatureSheet.tsx');\nassert(settingsAccordion.includes('<details'), 'Shared Settings entry must retain semantic details anchor for existing navigation');\nassert(settingsAccordion.includes('<summary'), 'Shared Settings entry must retain a compact semantic trigger');\nassert(settingsAccordion.includes('rounded-2xl border border-slate-200 bg-white shadow-sm'), 'Settings cards must share the same white/border/radius/shadow design system');\nassert(settingsAccordion.includes('ChevronDown'), 'Settings cards must use the shared chevron icon');\nassert(settingsAccordion.includes("open ? 'rotate-180' : ''"), 'Settings chevron must follow shared sheet open state');\nassert(settingsAccordion.includes('duration-200 ease-out'), 'Settings open/close affordance must use one transition timing');\nassert(settingsAccordion.includes("import { SettingsFeatureSheet } from './SettingsFeatureSheet';"), 'Settings cards must delegate sheet chrome to SettingsFeatureSheet');\nassert(settingsAccordion.includes('<SettingsFeatureSheet'), 'Settings cards must render through SettingsFeatureSheet');\nassert(settingsAccordion.includes("lazy = false"), 'Shared Settings entry must support lazy heavy content');\n\nassert(featureSheet.includes('createPortal'), 'SettingsFeatureSheet must render through a body portal');\nassert(featureSheet.includes('data-hnl-settings-sheet-backdrop'), 'Shared feature sheet backdrop contract missing');\nassert(featureSheet.includes('data-hnl-settings-sheet={sheetKey}'), 'Shared feature sheet dialog contract missing');\nassert(featureSheet.includes('role="dialog"') && featureSheet.includes('aria-modal="true"'), 'Shared feature sheet accessibility dialog contract missing');\nassert(featureSheet.includes('fixed inset-x-0 bottom-0 top-[8dvh]'), 'Shared feature sheet must use the rounded mobile viewport geometry');\nassert(featureSheet.includes("document.body.style.overflow = 'hidden'"), 'Shared feature sheet must lock background scroll while open');\nassert(featureSheet.includes("window.addEventListener('popstate'"), 'Shared feature sheet Android/browser Back behavior missing');\nassert(featureSheet.includes("event.key !== 'Escape'"), 'Shared feature sheet Escape close behavior missing');\nassert(featureSheet.includes('window.history.pushState'), 'Shared feature sheet history marker behavior missing');\nassert(featureSheet.includes('flushSync'), 'Shared feature sheet Back close must synchronously remove stale backdrop interception');\nassert(featureSheet.includes('env(safe-area-inset-bottom'), 'Shared feature sheet Android safe-area padding missing');\nassert(featureSheet.includes('h-12 w-12') && featureSheet.includes('h-6 w-6'), 'Shared feature sheet header icon must stay at the 48px contract');\nassert(featureSheet.includes('px-7'), 'Shared feature sheet mobile padding must stay at 28px');\nassert(featureSheet.includes('text-[17px] font-semibold'), 'Shared feature sheet title must use compact medium-weight typography');\nassert(featureSheet.includes('<X className="h-6 w-6"'), 'Shared feature sheet close affordance must be the icon-only X');\nassert(!featureSheet.includes('rounded-full border border-slate-200 bg-white'), 'Shared feature sheet X must not regress to a large circular button');\n\nconst warehouse = read('src/components/WarehouseTab.tsx');\nassert(warehouse.includes('aria-controls="material-need-details"'), 'Material Need row trigger missing');\nassert(warehouse.includes('role="button"'), 'Material Need heading row must be tappable');\nassert(warehouse.includes('Gợi ý vật tư tổng hợp'), 'Material Need summary card missing');\nassert(warehouse.includes("import { SettingsFeatureSheet } from './SettingsFeatureSheet';"), 'Material Need must use the same SettingsFeatureSheet shell as Settings');\nassert(warehouse.includes('sheetKey="material-need-details"'), 'Material Need shared sheet key missing');\nassert(warehouse.includes('description="Theo tầng · Theo đội · Toàn dự án"'), 'Material Need shared sheet subtitle contract missing');\nassert(warehouse.includes('icon={PackageSearch}'), 'Material Need shared sheet icon contract missing');\nassert(!warehouse.includes('<ExpandCollapseButton'), 'Material Need must not activate the legacy custom floating-sheet implementation');\n\n'''
          s = s[:a] + new + s[b:]
          p.write_text(s)

          # Hosted browser golden: certify 48px header icon, compact icon-only X and new shared history marker.
          p = Path('scripts/dev-hosted-browser-golden.mjs')
          s = p.read_text()
          assert 'metrics.headerIconWidth <= 20.5' in s
          s = s.replace('metrics.headerIconWidth <= 20.5', 'metrics.headerIconWidth <= 24.5', 1)
          assert 'window.history.state?.__hnlSettingsFeatureSheet || null' in s
          s = s.replace('window.history.state?.__hnlSettingsFeatureSheet || null', 'window.history.state?.__hnlFeatureSheet || null', 1)
          s = s.replace('Settings history marker', 'feature-sheet history marker')
          old = '''        closeWidth: dialog?.querySelector('header button')?.getBoundingClientRect().width ?? -1,\n        titleFontSize: dialog ? parseFloat(getComputedStyle(dialog.querySelector('h2')).fontSize) : -1,\n'''
          assert old in s
          s = s.replace(old, '''        closeWidth: dialog?.querySelector('header button')?.getBoundingClientRect().width ?? -1,\n        closeBackground: dialog ? getComputedStyle(dialog.querySelector('header button')).backgroundColor : '',\n        closeBorderWidth: dialog ? getComputedStyle(dialog.querySelector('header button')).borderTopWidth : '',\n        closeBoxShadow: dialog ? getComputedStyle(dialog.querySelector('header button')).boxShadow : '',\n        titleFontSize: dialog ? parseFloat(getComputedStyle(dialog.querySelector('h2')).fontSize) : -1,\n''', 1)
          old = '''    assert(metrics.closeWidth > 0 && metrics.closeWidth <= 45, `${label}: ${item.name} close button is too large (${metrics.closeWidth}px)`);\n    assert(metrics.titleFontSize > 0 && metrics.titleFontSize <= 17.5, `${label}: ${item.name} title is too large (${metrics.titleFontSize}px)`);\n'''
          assert old in s
          s = s.replace(old, '''    assert(metrics.closeWidth > 0 && metrics.closeWidth <= 41, `${label}: ${item.name} close target is too large (${metrics.closeWidth}px)`);\n    assert(metrics.closeBackground === 'rgba(0, 0, 0, 0)', `${label}: ${item.name} close X regained a visible background (${metrics.closeBackground})`);\n    assert(metrics.closeBorderWidth === '0px', `${label}: ${item.name} close X regained a visible border (${metrics.closeBorderWidth})`);\n    assert(metrics.closeBoxShadow === 'none', `${label}: ${item.name} close X regained a shadow (${metrics.closeBoxShadow})`);\n    assert(metrics.titleFontSize > 0 && metrics.titleFontSize <= 17.5, `${label}: ${item.name} title is too large (${metrics.titleFontSize}px)`);\n''', 1)
          p.write_text(s)

          # Runtime path gate must follow the new shared shell forever.
          p = Path('.github/workflows/dev-runtime-golden.yml')
          s = p.read_text()
          needle = "      - 'src/components/SettingsAccordionCard.tsx'\n"
          assert needle in s
          if "src/components/SettingsFeatureSheet.tsx" not in s:
              s = s.replace(needle, needle + "      - 'src/components/SettingsFeatureSheet.tsx'\n", 1)
          p.write_text(s)
          PY

          BASE_SHA='2be824b0b40c9fe06c4e6af04a144f7d426ed1da'
          echo 'Final changed files versus certified DEV:'
          git diff --name-only "$BASE_SHA"
          test "$(git diff --name-only "$BASE_SHA" | wc -l | tr -d ' ')" = '7'
          ! git diff --name-only "$BASE_SHA" | grep -Ei 'MaterialNorm|material-norm|MaterialNormModal'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint and source secret scan
        run: npm run lint

      - name: UI golden
        run: npm run test:ui-entry-ux

      - name: Critical production dependency audit
        run: npm audit --omit=dev --audit-level=critical

      - name: Build
        run: npm run build

      - name: Publish one clean source commit based directly on DEV 2be824b0
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='2be824b0b40c9fe06c4e6af04a144f7d426ed1da'
          rm -f .github/workflows/temp-unify-settings-material-sheet.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          TREE_SHA="$(git write-tree)"
          COMMIT_SHA="$(printf '%s\n' 'feat(dev): unify Settings and Material Need feature sheets' | git commit-tree "$TREE_SHA" -p "$BASE_SHA")"
          echo "CLEAN_COMMIT_SHA=$COMMIT_SHA"
          git push --force origin "$COMMIT_SHA:refs/heads/work/settings-feature-sheet-unify-stage"
