name: SuperAdmin Remote PIN Reset Materialize

on:
  push:
    branches:
      - feature/superadmin-ui-pin-reset-20260901
    paths:
      - '.github/workflows/superadmin-pin-reset-materialize.yml'
      - 'scripts/materialize-superadmin-pin-reset.py'

permissions:
  contents: write

jobs:
  patch_test_materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/superadmin-ui-pin-reset-20260901
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 scripts/materialize-superadmin-pin-reset.py
      - name: Fix confirm API in generated source
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/SecurityModal.tsx')
          s = p.read_text(encoding='utf-8')
          pattern = r"    const ok = await confirmAsync\(\{ title: 'Reset PIN từ xa\?', message: `PIN cũ của \$\{email\} sẽ bị vô hiệu khi thiết bị online\. User sẽ phải đăng nhập Google lại trước khi tiếp tục\.`, confirmText: 'Reset PIN', cancelText: 'Hủy', tone: 'danger' \}\);"
          repl = "    const ok = await confirmAsync(`Reset PIN từ xa cho ${email}?\\n\\nPIN cũ sẽ bị vô hiệu khi thiết bị online. User sẽ phải đăng nhập Google lại trước khi tiếp tục.`);"
          s2, n = re.subn(pattern, repl, s)
          if n != 1:
              raise SystemExit(f'confirm API patch expected 1, found {n}')
          p.write_text(s2, encoding='utf-8')
          PY
      - run: npm ci
      - name: Stability
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rules
        run: npm run test:rules
      - name: Security
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Commit certified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HNL QLTC CI"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/superadmin-pin-reset-materialize.yml scripts/materialize-superadmin-pin-reset.py
          git add src/App.tsx src/lib/firebase.ts src/utils/securityUtils.ts src/components/SecurityModal.tsx .github/workflows/superadmin-pin-reset-materialize.yml scripts/materialize-superadmin-pin-reset.py
          git commit -m "Add Super Admin remote PIN reset"
          git push origin HEAD:feature/superadmin-ui-pin-reset-20260901
