name: RC2.2.8 Verified App ID PROD Final Once
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc2-2-8-prod-appid-final-once.yml'
permissions:
  contents: read
concurrency:
  group: hnl-qltc-prod-release
  cancel-in-progress: false
jobs:
  deploy_prod_final:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify exact source parent and PROD identity
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_SOURCE="c14a279a7edf92e33dcd8558edf90301b308f361"
          test "$(git rev-parse HEAD^)" = "$EXPECTED_SOURCE" || { echo "BLOCKED: unexpected source parent"; exit 1; }
          test "$(git diff --name-only "$EXPECTED_SOURCE"..HEAD)" = ".github/workflows/rc2-2-8-prod-appid-final-once.yml" || { echo "BLOCKED: unexpected source change"; exit 1; }
          test "$VITE_FIREBASE_PROJECT_ID" = "com-example-qlct-61329"
          test "$VITE_FIREBASE_APP_ID" = "1:119152410850:web:c2aee2135428af34ef5ebb"
          grep -Fq "appId: '1:119152410850:web:c2aee2135428af34ef5ebb'" src/lib/firebase.ts
          grep -Fq "VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb" .github/workflows/firebase-hosting-merge.yml
          grep -Fq "VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb" .github/workflows/android-apk.yml
          grep -Fq "VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb" .github/workflows/windows-exe.yml
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Stability Gate
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Firebase Rules compile
        run: npm run test:rules
      - name: Security audit (production, critical)
        run: npm run security:audit
      - name: Build PROD bundle
        run: npm run build
      - name: Verify App ID is embedded in built PROD bundle
        shell: bash
        run: |
          set -euo pipefail
          grep -R -Fq "1:119152410850:web:c2aee2135428af34ef5ebb" dist
          echo "PROD_BUNDLE_APP_ID_PASS"
      - name: Verify registered Firebase Web App
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 apps:list WEB --project com-example-qlct-61329 --json > /tmp/apps.json
          node -e "const r=require('/tmp/apps.json');const a=r.result||r;const xs=Array.isArray(a)?a:(a.apps||[]);const w=xs.filter(x=>x.appId==='1:119152410850:web:c2aee2135428af34ef5ebb'&&x.projectId==='com-example-qlct-61329'&&x.state==='ACTIVE');if(w.length!==1)process.exit(3);console.log('FIREBASE_WEB_APP_ACTIVE_PASS')"
      - name: Deploy Firestore Rules
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project com-example-qlct-61329 --non-interactive
      - name: Deploy Hosting hnlqltc
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only hosting --config firebase.prod.json --project com-example-qlct-61329 --non-interactive
      - name: Final live HTTP smoke
        shell: bash
        run: |
          set -euo pipefail
          URL="https://hnlqltc.web.app/?release=rc2.2.8-appid-final&ts=$(date +%s)"
          for i in 1 2 3 4 5 6; do
            if curl -fsS -H 'Cache-Control: no-cache' "$URL" -o /tmp/index.html; then
              grep -q '<div id="root"></div>' /tmp/index.html && break
            fi
            sleep 5
          done
          grep -q '<div id="root"></div>' /tmp/index.html
          curl -fsSI -H 'Cache-Control: no-cache' https://hnlqltc.web.app/ | head -n 20
          echo "PROD_FINAL_HTTP_200_PASS"
          echo "PROD_FINAL_RELEASE_COMPLETE"
