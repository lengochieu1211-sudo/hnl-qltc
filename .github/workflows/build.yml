name: Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify source root
        shell: bash
        run: |
          test -f package.json || { echo "Missing package.json at repository root"; exit 1; }
          test -f package-lock.json || { echo "Missing package-lock.json at repository root. Copy the CONTENTS of FULL SOURCE into the repo root, not a parent folder."; exit 1; }

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: DEV deploy budget regression
        run: node scripts/dev-deploy-budget-golden.mjs

      - name: Warehouse catalog and order regression
        run: node --experimental-strip-types scripts/warehouse-order-golden.mjs
      - name: Warehouse XLSX formulas and grid Golden
        run: npx tsx scripts/warehouse-export-formulas-golden.ts
      - name: Warehouse order Cloud and formula data golden
        run: npx tsx scripts/warehouse-order-cloud-golden.ts

      - name: Floor-plan room-creation safety regression
        run: node scripts/floorplan-room-creation-guard-golden.mjs

      - name: P21.79 chat account-switch ownership regression (no deploy)
        run: node --experimental-strip-types scripts/p2179-chat-account-switch-golden.mjs

      - name: P21.80 floorplan exclusive drawing and highlight regression (no deploy)
        run: node scripts/p2180-floorplan-exclusive-draw-golden.mjs

      - name: 10-group targeted QA regression (source-only, no deploy)
        run: |
          node scripts/dev-backup-defect-card-date-golden.mjs
          node scripts/dev-backup-four-issues-geometry-golden.mjs
          node scripts/dev-backup-four-issues-golden.mjs
          node scripts/dev-backup-json-export-progress-golden.mjs
          node scripts/dev-backup-ortho-snap-chat-unread-golden.mjs

      - name: Mobile XLSX receipt issue OOXML and A3 A4 matrix (no deploy)
        run: |
          npx tsx scripts/warehouse-voucher-xlsx-style-golden.ts
          npx tsx scripts/dev-backup-voucher-a3-a4-matrix-golden.ts

      - name: Stability Gate
        run: npm run test:stability

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Firebase Rules compile + Auth/Firestore/Storage Emulator behavior
        run: npm run test:rules

      - name: P21.86 + P21.97 Chat bidirectional Rules in disposable Emulator (NO CLOUD)
        env:
          GCLOUD_PROJECT: demo-hnl-qltc-p2186
          FIREBASE_PROJECT_ID: demo-hnl-qltc-p2186
          FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
          FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
        run: npx --yes firebase-tools@13.35.1 emulators:exec --config firebase.rules-ci.json --only auth,firestore --project demo-hnl-qltc-p2186 "node scripts/p2172-chat-atomic-summary-emulator.mjs && node scripts/p2197-chat-message-only-security-emulator.mjs"

      - name: Security audit (production, critical)
        run: npm run security:audit

      - name: Build
        run: npm run build
