name: Deploy HNL QLTC R2 Worker

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-R2 to deploy the existing HNL QLTC Worker'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy_r2_worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Require explicit deploy confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = "DEPLOY-R2" || { echo '::error::CONFIRMATION_MUST_BE_DEPLOY-R2'; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require Cloudflare deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::MISSING_CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::MISSING_CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy existing HNL QLTC R2 Worker
        working-directory: cloudflare/r2-gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.ci.toml <<'WRANGLER_EOF'
          name = "hnl-qltc-r2-gateway"
          main = "worker.js"
          compatibility_date = "2026-08-30"

          [[r2_buckets]]
          binding = "HNL_QLTC_MEDIA"
          bucket_name = "hnl-qltc-media"

          [vars]
          FIREBASE_PROJECT_ID = "com-example-qlct-61329"
          SUPER_ADMIN_EMAIL = "lengochieu1211@gmail.com"
          ALLOWED_ORIGINS = "https://hnlqltc.web.app,https://com-example-qlct-61329.web.app,https://com-example-qlct-61329.firebaseapp.com"
          MAX_UPLOAD_BYTES = "26214400"
          WRANGLER_EOF
          trap 'rm -f wrangler.ci.toml' EXIT
          npx --yes wrangler@4.33.0 deploy --config wrangler.ci.toml

      - name: Smoke Worker health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 5 --retry-delay 2 \
            https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev/health \
            | tee /tmp/r2-health.json
          grep -q '"ok":true' /tmp/r2-health.json
          grep -q '"version":"6.3.0-rc2.2.16"' /tmp/r2-health.json
          grep -q '"accessPolicy":"canonical-email-first"' /tmp/r2-health.json

      - name: Smoke browser PUT CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev'
          curl --fail --silent --show-error -X OPTIONS -D /tmp/r2-cors.headers -o /tmp/r2-cors.body \
            -H 'Origin: https://hnlqltc.web.app' \
            -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-hnl-metadata' \
            "$BASE/v1/object?key=projects/cors-probe/media/diagnostics/probe/original.jpg"
          cat /tmp/r2-cors.headers
          grep -qi '^access-control-allow-origin: https://hnlqltc.web.app' /tmp/r2-cors.headers
          grep -qi '^access-control-allow-methods:.*PUT' /tmp/r2-cors.headers
          grep -qi '^access-control-allow-headers:.*Authorization' /tmp/r2-cors.headers
          grep -qi '^access-control-allow-headers:.*X-HNL-Metadata' /tmp/r2-cors.headers
