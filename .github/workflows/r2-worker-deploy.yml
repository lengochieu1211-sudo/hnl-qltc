name: HNL QLTC PROD Binary Parity Audit

on:
  push:
    branches:
      - audit/prod-binary-parity-2026-09-18
  workflow_dispatch:

permissions:
  contents: read

jobs:
  readonly_prod_binary_parity:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
      FIREBASE_PROJECT_ID: com-example-qlct-61329
      FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      R2_BUCKET: hnl-qltc-media
      PROJECT_ID: proj_1786411472502
      EXPECTED_BACKUP_SHA256: 09b53db4244c1ab02f8e4786ff10eac052801f556022c86d2841da32a43b9ebb
      EXPECTED_LIVE_MANIFEST_SHA256: 96430953b7b4e6d0c46483d71fcafef375ec84bd96e57c7a8b4b4c9efd85c3fd
      EXPECTED_ACTIVE_PHOTOS: "57"
      EXPECTED_ACTIVE_FLOOR_PLANS: "6"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard read-only audit branch and credentials
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/audit/prod-binary-parity-2026-09-18" || {
            echo "::error::READ_ONLY_AUDIT_MUST_RUN_FROM_DEDICATED_AUDIT_BRANCH"
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo "::error::MISSING_CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo "::error::MISSING_PROD_FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          echo "READ-ONLY audit only. No PUT/POST/PATCH/DELETE to PROD providers."

      - name: Install read-only audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/hnl-parity
          cd /tmp/hnl-parity
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --ignore-scripts firebase-admin@13.4.0 google-auth-library@9.15.1

      - name: Inventory Firestore, R2 and Firebase Storage
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/hnl-parity/audit.mjs <<'NODE'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { createRequire } from 'node:module';
          const require = createRequire(import.meta.url);
          const admin = require('firebase-admin');
          const { GoogleAuth } = require('google-auth-library');

          const {
            CLOUDFLARE_API_TOKEN,
            FIREBASE_SERVICE_ACCOUNT,
            FIREBASE_PROJECT_ID,
            FIREBASE_STORAGE_BUCKET,
            R2_BUCKET,
            PROJECT_ID,
            EXPECTED_BACKUP_SHA256,
            EXPECTED_LIVE_MANIFEST_SHA256,
            EXPECTED_ACTIVE_PHOTOS,
            EXPECTED_ACTIVE_FLOOR_PLANS,
          } = process.env;

          const serviceAccount = JSON.parse(FIREBASE_SERVICE_ACCOUNT);
          admin.initializeApp({
            credential: admin.credential.cert(serviceAccount),
            projectId: FIREBASE_PROJECT_ID,
            storageBucket: FIREBASE_STORAGE_BUCKET,
          });

          const db = admin.firestore();
          const active = (d) => !Boolean(d?.deleted || d?.deletedAt);
          const photosSnap = await db.collection('projects').doc(PROJECT_ID).collection('photos').get();
          const floorSnap = await db.collection('projects').doc(PROJECT_ID).collection('floor_plans').get();

          const photos = photosSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(active);
          const floors = floorSnap.docs.map(d => ({ id: d.id, ...d.data() })).filter(active);

          const entries = [];
          for (const p of photos) entries.push({
            type: 'photo',
            id: String(p.id),
            storageProvider: String(p.storageProvider || ''),
            storagePath: String(p.storagePath || ''),
            thumbnailPath: String(p.thumbnailPath || ''),
            size: Number(p.fileSize || 0),
            sha256: String(p.contentHash || p.storageMd5Hash || ''),
            deleted: Boolean(p.deleted),
          });
          for (const p of floors) entries.push({
            type: 'floorplan',
            id: String(p.id),
            storageProvider: String(p.storageProvider || ''),
            storagePath: String(p.storagePath || ''),
            thumbnailPath: String(p.thumbnailPath || ''),
            size: Number(p.imageFileSize || 0),
            sha256: String(p.storageMd5Hash || ''),
            deleted: Boolean(p.deleted),
          });

          const stable = (o) => JSON.stringify(Object.fromEntries(Object.keys(o).sort().map(k => [k, o[k]])));
          const canonical = entries
            .sort((a,b) => a.type.localeCompare(b.type) || a.id.localeCompare(b.id))
            .map(stable)
            .join('\n');
          const liveManifestSha256 = crypto.createHash('sha256').update(canonical).digest('hex');

          const countErrors = [];
          if (photos.length !== Number(EXPECTED_ACTIVE_PHOTOS)) countErrors.push(`active photos expected ${EXPECTED_ACTIVE_PHOTOS}, got ${photos.length}`);
          if (floors.length !== Number(EXPECTED_ACTIVE_FLOOR_PLANS)) countErrors.push(`active floor plans expected ${EXPECTED_ACTIVE_FLOOR_PLANS}, got ${floors.length}`);
          if (liveManifestSha256 !== EXPECTED_LIVE_MANIFEST_SHA256) countErrors.push(`live Firestore manifest differs from verified backup: ${liveManifestSha256}`);

          const nonR2 = entries.filter(x => x.storageProvider !== 'r2' || !x.storagePath);
          const expectedObjects = new Map();
          for (const x of entries) {
            if (x.storagePath) {
              const prev = expectedObjects.get(x.storagePath);
              const next = { key:x.storagePath, role:`${x.type}-original`, size:x.size, sha256:x.sha256 };
              if (!prev) expectedObjects.set(x.storagePath, next);
              else if ((prev.size && next.size && prev.size !== next.size) || (prev.sha256 && next.sha256 && prev.sha256 !== next.sha256)) {
                countErrors.push(`conflicting current metadata for shared R2 key ${x.storagePath}`);
              }
            }
            if (x.thumbnailPath && !expectedObjects.has(x.thumbnailPath)) {
              expectedObjects.set(x.thumbnailPath, { key:x.thumbnailPath, role:`${x.type}-thumb`, size:0, sha256:'' });
            }
          }

          async function cfJson(url) {
            const res = await fetch(url, { headers: { Authorization: `Bearer ${CLOUDFLARE_API_TOKEN}` }});
            const body = await res.text();
            if (!res.ok) throw new Error(`Cloudflare HTTP ${res.status}: ${body.slice(0,500)}`);
            const j = JSON.parse(body);
            if (j.success === false) throw new Error(`Cloudflare API failure: ${body.slice(0,500)}`);
            return j;
          }

          const accounts = await cfJson('https://api.cloudflare.com/client/v4/accounts?per_page=50');
          const accountList = Array.isArray(accounts.result) ? accounts.result : [];
          if (accountList.length !== 1) throw new Error(`Expected exactly one Cloudflare account, got ${accountList.length}`);
          const accountId = String(accountList[0].id);

          const r2Objects = [];
          let cursor = '';
          do {
            const u = new URL(`https://api.cloudflare.com/client/v4/accounts/${accountId}/r2/buckets/${R2_BUCKET}/objects`);
            u.searchParams.set('prefix', `projects/${PROJECT_ID}/`);
            u.searchParams.set('per_page', '1000');
            if (cursor) u.searchParams.set('cursor', cursor);
            const page = await cfJson(u.toString());
            const result = page.result;
            const items = Array.isArray(result) ? result : (Array.isArray(result?.objects) ? result.objects : []);
            r2Objects.push(...items);
            cursor = String(page.result_info?.cursor || result?.cursor || '');
          } while (cursor);

          const r2ByKey = new Map(r2Objects.map(o => [String(o.key), o]));
          const missing = [];
          const mismatched = [];
          for (const exp of expectedObjects.values()) {
            const got = r2ByKey.get(exp.key);
            if (!got) {
              missing.push(exp);
              continue;
            }
            const gotSize = Number(got.size || 0);
            const cm = got.custom_metadata || got.customMetadata || {};
            const gotSha = String(cm.sha256 || cm.contentHash || '').toLowerCase();
            if (exp.size && gotSize !== exp.size) mismatched.push({ key:exp.key, field:'size', expected:exp.size, actual:gotSize });
            if (exp.sha256 && gotSha && gotSha !== exp.sha256.toLowerCase()) mismatched.push({ key:exp.key, field:'sha256', expected:exp.sha256, actual:gotSha });
            if (exp.sha256 && !gotSha) mismatched.push({ key:exp.key, field:'sha256', expected:exp.sha256, actual:'MISSING_CUSTOM_METADATA_SHA256' });
          }
          const extras = r2Objects.filter(o => !expectedObjects.has(String(o.key))).map(o => ({
            key:String(o.key), size:Number(o.size || 0), etag:String(o.etag || ''), uploaded:String(o.uploaded || o.last_modified || o.lastModified || '')
          }));

          const auth = new GoogleAuth({
            credentials: serviceAccount,
            scopes: ['https://www.googleapis.com/auth/devstorage.read_only'],
          });
          const client = await auth.getClient();
          const tokenResult = await client.getAccessToken();
          const accessToken = typeof tokenResult === 'string' ? tokenResult : tokenResult?.token;
          if (!accessToken) throw new Error('Could not obtain Google Storage read-only access token');

          // Discover all physical Cloud Storage buckets that are readable for this PROD
          // project. Newer Firebase configs may use *.firebasestorage.app while legacy
          // buckets may still be *.appspot.com. This audit never mutates either.
          const bucketDiscovery = { method:'project-list', verified:false, errors:[], buckets:[] };
          try {
            const u = new URL('https://storage.googleapis.com/storage/v1/b');
            u.searchParams.set('project', FIREBASE_PROJECT_ID);
            u.searchParams.set('maxResults', '100');
            const res = await fetch(u.toString(), { headers: { Authorization: `Bearer ${accessToken}` }});
            const body = await res.text();
            if (res.ok) {
              const j = JSON.parse(body);
              bucketDiscovery.buckets = (Array.isArray(j.items) ? j.items : []).map(x => String(x.name || '')).filter(Boolean);
              bucketDiscovery.verified = true;
            } else {
              bucketDiscovery.errors.push(`project bucket list HTTP ${res.status}: ${body.slice(0,300)}`);
            }
          } catch (err) {
            bucketDiscovery.errors.push(String(err?.message || err));
          }

          if (!bucketDiscovery.verified) {
            bucketDiscovery.method = 'candidate-probe';
            const candidates = [...new Set([
              FIREBASE_STORAGE_BUCKET,
              `${FIREBASE_PROJECT_ID}.appspot.com`,
              `${FIREBASE_PROJECT_ID}.firebasestorage.app`,
            ].filter(Boolean))];
            const readable = [];
            let probesComplete = true;
            for (const bucket of candidates) {
              const u = `https://storage.googleapis.com/storage/v1/b/${encodeURIComponent(bucket)}`;
              const res = await fetch(u, { headers: { Authorization: `Bearer ${accessToken}` }});
              const body = await res.text();
              if (res.ok) readable.push(bucket);
              else if (res.status !== 404) {
                probesComplete = false;
                bucketDiscovery.errors.push(`${bucket}: HTTP ${res.status}: ${body.slice(0,300)}`);
              }
            }
            bucketDiscovery.buckets = readable;
            bucketDiscovery.verified = probesComplete;
          }

          const firebaseObjects = [];
          if (bucketDiscovery.verified) {
            for (const bucket of bucketDiscovery.buckets) {
              let pageToken = '';
              do {
                const u = new URL(`https://storage.googleapis.com/storage/v1/b/${encodeURIComponent(bucket)}/o`);
                u.searchParams.set('prefix', `projects/${PROJECT_ID}/`);
                u.searchParams.set('maxResults', '1000');
                if (pageToken) u.searchParams.set('pageToken', pageToken);
                const res = await fetch(u.toString(), { headers: { Authorization: `Bearer ${accessToken}` }});
                const body = await res.text();
                if (!res.ok) {
                  bucketDiscovery.verified = false;
                  bucketDiscovery.errors.push(`${bucket} object list HTTP ${res.status}: ${body.slice(0,300)}`);
                  break;
                }
                const j = JSON.parse(body);
                firebaseObjects.push(...(Array.isArray(j.items) ? j.items : []).map(o => ({...o, _bucket:bucket})));
                pageToken = String(j.nextPageToken || '');
              } while (pageToken);
            }
          }

          const report = {
            generatedAt: new Date().toISOString(),
            mode: 'READ_ONLY',
            projectId: PROJECT_ID,
            expectedBackupSha256: EXPECTED_BACKUP_SHA256,
            expectedLiveManifestSha256: EXPECTED_LIVE_MANIFEST_SHA256,
            liveManifestSha256,
            firestore: {
              activePhotos: photos.length,
              activeFloorPlans: floors.length,
              totalActiveEntries: entries.length,
              currentEntries: entries,
              nonR2CurrentReferences: nonR2,
              countErrors,
            },
            r2: {
              bucket: R2_BUCKET,
              listedUnderProjectPrefix: r2Objects.length,
              expectedUniqueObjects: expectedObjects.size,
              missing,
              mismatched,
              extraRetainedCandidates: extras,
            },
            firebaseStorageLegacy: {
              configuredBucket: FIREBASE_STORAGE_BUCKET,
              discovery: bucketDiscovery,
              listedUnderProjectPrefix: firebaseObjects.length,
              objects: firebaseObjects.map(o => ({
                bucket:String(o._bucket || ''), name:String(o.name || ''), size:Number(o.size || 0), md5Hash:String(o.md5Hash || ''), generation:String(o.generation || ''), updated:String(o.updated || '')
              })),
            },
          };

          report.releaseGatePass =
            report.firestore.countErrors.length === 0 &&
            report.firestore.nonR2CurrentReferences.length === 0 &&
            report.r2.missing.length === 0 &&
            report.r2.mismatched.length === 0 &&
            report.firebaseStorageLegacy.discovery.verified;

          fs.writeFileSync('/tmp/hnl-parity/parity-report.json', JSON.stringify(report, null, 2));
          const md = [
            '# HNL QLTC PROD Binary Parity Audit',
            '',
            `- Mode: **READ_ONLY**`,
            `- Project: \`${PROJECT_ID}\``,
            `- Verified backup SHA-256: \`${EXPECTED_BACKUP_SHA256}\``,
            `- Expected manifest SHA-256: \`${EXPECTED_LIVE_MANIFEST_SHA256}\``,
            `- Live Firestore manifest SHA-256: \`${liveManifestSha256}\``,
            `- Active photos: ${photos.length}`,
            `- Active floor plans: ${floors.length}`,
            `- Current non-R2 references: ${nonR2.length}`,
            `- R2 expected unique objects: ${expectedObjects.size}`,
            `- R2 listed objects under project prefix: ${r2Objects.length}`,
            `- R2 missing current objects: ${missing.length}`,
            `- R2 size/hash mismatches: ${mismatched.length}`,
            `- R2 extra retained/orphan candidates: ${extras.length}`,
            `- Firebase Storage discovery: ${bucketDiscovery.verified ? 'verified' : 'FAILED'} via ${bucketDiscovery.method}`,
            `- Firebase Storage buckets discovered: ${bucketDiscovery.buckets.join(', ') || '(none)'}`,
            `- Firebase Storage legacy objects under project prefix: ${firebaseObjects.length}`,
            '',
            `## Gate: ${report.releaseGatePass ? 'PASS' : 'FAIL'}`,
            '',
            'No object was uploaded, changed, or deleted by this workflow.',
            ''
          ].join('\n');
          fs.writeFileSync('/tmp/hnl-parity/parity-report.md', md);
          console.log(md);
          if (!report.releaseGatePass) process.exitCode = 2;
          NODE
          cd /tmp/hnl-parity
          node audit.mjs

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-PROD-BINARY-PARITY-${{ github.run_number }}
          path: |
            /tmp/hnl-parity/parity-report.json
            /tmp/hnl-parity/parity-report.md
          if-no-files-found: warn
          retention-days: 30
