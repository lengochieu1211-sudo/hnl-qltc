name: Deploy HNL QLTC R2 Worker

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DEPLOY-R2-PROD to deploy the production R2 Worker'
        required: true
        type: string
      backup_confirmation:
        description: 'Type BACKUP-VERIFIED after verifying current PROD Firestore and R2 backup'
        required: true
        type: string
      migration_confirmation:
        description: 'Type MIGRATION-PARITY-VERIFIED after checking legacy media count/checksums'
        required: true
        type: string
      dev_certified_sha:
        description: 'Exact 40-character DEV commit SHA that passed full Golden testing'
        required: true
        type: string
      expected_main_sha:
        description: 'Exact 40-character approved main commit SHA for R2 PROD'
        required: true
        type: string

permissions:
  contents: read

jobs:
  deploy_r2_worker:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - name: Require explicit PROD R2 confirmation
        shell: bash
        run: |
          set -euo pipefail
          test "${{ inputs.confirmation }}" = 'DEPLOY-R2-PROD' || { echo '::error::REFUSING_R2_PROD_WITHOUT_CONFIRMATION'; exit 1; }
          test "${GITHUB_REF}" = 'refs/heads/main' || { echo '::error::R2_PROD_MUST_RUN_FROM_MAIN'; exit 1; }
          test "${{ inputs.backup_confirmation }}" = 'BACKUP-VERIFIED' || { echo '::error::R2_PROD_BACKUP_NOT_VERIFIED'; exit 1; }
          test "${{ inputs.migration_confirmation }}" = 'MIGRATION-PARITY-VERIFIED' || { echo '::error::R2_PROD_MEDIA_PARITY_NOT_VERIFIED'; exit 1; }
          printf '%s' "${{ inputs.dev_certified_sha }}" | grep -Eq '^[0-9a-f]{40}$' || { echo '::error::R2_PROD_DEV_SHA_INVALID'; exit 1; }
          printf '%s' "${{ inputs.expected_main_sha }}" | grep -Eq '^[0-9a-f]{40}$' || { echo '::error::R2_PROD_MAIN_SHA_INVALID'; exit 1; }
          test "${GITHUB_SHA}" = "${{ inputs.expected_main_sha }}" || { echo '::error::R2_PROD_MAIN_SHA_MISMATCH'; exit 1; }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # P7: the standalone R2 PROD deploy must not bypass the P6 Firestore
      # integrity gate, the DEV ancestry lock, or PROD backup approval. This
      # preflight runs before Cloudflare API calls or any cloud modification.
      - name: Require certified source and P1 data-integrity preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_main_sha }}" || { echo '::error::R2_PROD_CHECKOUT_SHA_MISMATCH'; exit 1; }
          git merge-base --is-ancestor "${{ inputs.dev_certified_sha }}" HEAD || { echo '::error::R2_PROD_DEV_SHA_NOT_ANCESTOR'; exit 1; }
          test -f package.json && test -f package-lock.json || { echo '::error::R2_PROD_SOURCE_INCOMPLETE'; exit 1; }
          test -f scripts/p1-release-safety-gate.mjs || { echo '::error::R2_PROD_P1_GATE_MISSING'; exit 1; }
          node scripts/p1-release-safety-gate.mjs || { echo '::error::R2_PROD_P1_INTEGRITY_GATE_FAILED'; exit 1; }
          test -f cloudflare/r2-gateway/worker.js || { echo '::error::R2_PROD_WORKER_MISSING'; exit 1; }

      - name: Require Cloudflare deploy token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::MISSING_CLOUDFLARE_API_TOKEN'; exit 1; }

      - name: Resolve Cloudflare Account ID automatically
        shell: bash
        run: |
          set -euo pipefail
          RESPONSE="$(curl --fail --silent --show-error \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H 'Content-Type: application/json' \
            'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          ACCOUNT_ID="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=Array.isArray(j.result)?j.result:[];if(!j.success||r.length!==1){console.error('Expected exactly one accessible Cloudflare account, got '+r.length);process.exit(2)};process.stdout.write(String(r[0].id||''))})")"
          test -n "$ACCOUNT_ID" || { echo '::error::CLOUDFLARE_ACCOUNT_ID_AUTO_RESOLVE_FAILED'; exit 1; }
          echo "CLOUDFLARE_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "Cloudflare account resolved successfully."

      - name: Deploy existing HNL QLTC R2 Worker
        working-directory: cloudflare/r2-gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.ci.toml <<'WRANGLER_EOF'
          name = "hnl-qltc-r2-gateway"
          main = "worker.js"
          compatibility_date = "2026-08-30"

          [[r2_buckets]]
          binding = "HNL_QLTC_MEDIA"
          bucket_name = "hnl-qltc-media"

          [vars]
          FIREBASE_PROJECT_ID = "com-example-qlct-61329"
          SUPER_ADMIN_EMAIL = "lengochieu1211@gmail.com"
          ALLOWED_ORIGINS = "https://hnlqltc.web.app,https://com-example-qlct-61329.web.app,https://com-example-qlct-61329.firebaseapp.com"
          MAX_UPLOAD_BYTES = "26214400"
          WRANGLER_EOF
          trap 'rm -f wrangler.ci.toml' EXIT
          npx --yes wrangler@4.33.0 deploy --config wrangler.ci.toml

      - name: Smoke Worker health after propagation
        shell: bash
        run: |
          set -euo pipefail
          URL='https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev/health'
          ok=0
          for i in $(seq 1 30); do
            BODY="$(curl --fail --silent --show-error "${URL}?probe=${GITHUB_RUN_ID}-${i}" || true)"
            echo "attempt=${i} body=${BODY}"
            if printf '%s' "$BODY" | grep -q '"ok":true' \
              && printf '%s' "$BODY" | grep -q '"version":"6.3.0-rc2.2.16"' \
              && printf '%s' "$BODY" | grep -q '"accessPolicy":"canonical-email-first"' \
              && printf '%s' "$BODY" | grep -q '"policyVersion":"immutable-deleted-project-v2"'; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1 || { echo '::error::R2_HEALTH_MARKER_NOT_PROPAGATED'; exit 1; }

      - name: Smoke browser PUT CORS preflight
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev'
          curl --fail --silent --show-error -X OPTIONS -D /tmp/r2-cors.headers -o /tmp/r2-cors.body \
            -H 'Origin: https://hnlqltc.web.app' \
            -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-hnl-metadata' \
            "$BASE/v1/object?key=projects/cors-probe/media/diagnostics/probe/original.jpg&probe=${GITHUB_RUN_ID}"
          cat /tmp/r2-cors.headers
          grep -qi '^access-control-allow-origin: https://hnlqltc.web.app' /tmp/r2-cors.headers
          grep -qi '^access-control-allow-methods:.*PUT' /tmp/r2-cors.headers
          grep -qi '^access-control-allow-headers:.*Authorization' /tmp/r2-cors.headers
          grep -qi '^access-control-allow-headers:.*X-HNL-Metadata' /tmp/r2-cors.headers
          grep -qi '^x-hnl-r2-gateway-version: 6.3.0-rc2.2.16' /tmp/r2-cors.headers
