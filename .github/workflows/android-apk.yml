name: Build HNL QLTC Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'android-wrapper/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'
  push:
    branches:
      - main
    paths:
      - 'android-wrapper/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - '.github/workflows/android-apk.yml'

jobs:
  build_apk:
    runs-on: windows-latest
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: ${{ vars.VITE_R2_GATEWAY_URL }}
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
      QLCT_WEB_URL: https://hnlqltc.web.app/?app=android
      QLCT_RELEASE_TAG: 6.3.0-rc2.2.7
      QLCT_ANDROID_KEYSTORE_BASE64: ${{ secrets.QLCT_ANDROID_KEYSTORE_BASE64 }}
      QLCT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.QLCT_ANDROID_KEYSTORE_PASSWORD }}
      QLCT_ANDROID_KEY_PASSWORD: ${{ secrets.QLCT_ANDROID_KEY_PASSWORD }}
      QLCT_ANDROID_KEY_ALIAS: ${{ secrets.QLCT_ANDROID_KEY_ALIAS }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Stability Gate
        run: npm run test:stability

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build web bundle
        run: npm run build

      - name: Require fixed release signing on main
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          if ([string]::IsNullOrWhiteSpace($env:QLCT_ANDROID_KEYSTORE_BASE64)) { throw 'Missing QLCT_ANDROID_KEYSTORE_BASE64 secret' }
          if ([string]::IsNullOrWhiteSpace($env:QLCT_ANDROID_KEYSTORE_PASSWORD)) { throw 'Missing QLCT_ANDROID_KEYSTORE_PASSWORD secret' }
          if ([string]::IsNullOrWhiteSpace($env:QLCT_ANDROID_KEY_PASSWORD)) { throw 'Missing QLCT_ANDROID_KEY_PASSWORD secret' }
          if ([string]::IsNullOrWhiteSpace($env:QLCT_ANDROID_KEY_ALIAS)) { throw 'Missing QLCT_ANDROID_KEY_ALIAS secret' }

      - name: Build signed APK
        shell: pwsh
        run: ./android-wrapper/build-apk.ps1

      - name: Verify APK exists
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath './HNL-QLTC-Android.apk')) { throw 'APK was not created' }
          Get-Item './HNL-QLTC-Android.apk' | Format-List Name,Length,LastWriteTime

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-Android-${{ github.run_number }}
          path: HNL-QLTC-Android.apk
          if-no-files-found: error
          retention-days: 30
