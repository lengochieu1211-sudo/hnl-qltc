name: Gate Orphan Repair UI V3

on:
  push:
    branches:
      - gate/orphan-repair-ui-v3-20260909

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout isolated gate branch
        uses: actions/checkout@v4
        with:
          ref: gate/orphan-repair-ui-v3-20260909
          fetch-depth: 2

      - name: Apply certified local patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, gzip
          from pathlib import Path
          payload = Path('.gate/orphan_ui.patch.gz.b64').read_text(encoding='utf-8').strip()
          patch = gzip.decompress(base64.b64decode(payload))
          Path('/tmp/orphan_ui.patch').write_bytes(patch)
          PY
          git apply --check /tmp/orphan_ui.patch
          git apply /tmp/orphan_ui.patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Focused orphan and Health Center gates
        shell: bash
        run: |
          node scripts/stability-gate.mjs
          node scripts/source-lint.mjs
          npx tsx scripts/health-center-navigation-golden.ts
          npx tsx scripts/health-center-orphan-golden.ts
          npx tsx scripts/ai-external-context-golden.ts

      - name: Full verify
        run: npm run verify

      - name: Scope guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only f4dfee32e84d38af966b9ee7500e6ae3934cffa3 -- \
            package.json package-lock.json .firebaserc firebase.json firestore.rules storage.rules \
            .github/workflows/build.yml .github/workflows/firebase-hosting-merge.yml \
            .github/workflows/firebase-dev-environment.yml .github/workflows/windows-exe-dev.yml \
            .github/workflows/android-apk-dev.yml | tee /tmp/protected.txt
          test ! -s /tmp/protected.txt
          git diff --name-only f4dfee32e84d38af966b9ee7500e6ae3934cffa3 -- \
            src/components/RoomHighlightModal.tsx \
            src/components/FloorPlanDefectTab.tsx \
            src/components/GoogleConfigTab.tsx \
            src/components/BottomNav.tsx \
            src/healthCenter/HealthCenterPanelBase.tsx \
            scripts/health-center-navigation-golden.ts \
            scripts/stability-gate.mjs | sort > /tmp/changed.txt
          test "$(wc -l < /tmp/changed.txt)" -eq 7
          echo 'Protected config unchanged + exact 7-file candidate scope: PASS'

      - name: Commit verified source patch to gate branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/RoomHighlightModal.tsx \
            src/components/FloorPlanDefectTab.tsx \
            src/components/GoogleConfigTab.tsx \
            src/components/BottomNav.tsx \
            src/healthCenter/HealthCenterPanelBase.tsx \
            scripts/health-center-navigation-golden.ts \
            scripts/stability-gate.mjs
          git commit -m "fix: complete orphan category repair UX"
          git push origin HEAD:gate/orphan-repair-ui-v3-20260909
