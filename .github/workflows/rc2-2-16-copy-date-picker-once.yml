name: RC2.2.16 Crew Copy Date Picker Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc2-2-16-copy-date-picker-once.yml'

permissions:
  contents: write

jobs:
  patch_test_commit_deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply exact crew copy date-picker patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('src/components/CrewTab.tsx')
          s = p.read_text(encoding='utf-8')

          anchor = "  const [copySourceDate, setCopySourceDate] = useState('');\n"
          insert = anchor + "  const [showCopyDatePicker, setShowCopyDatePicker] = useState(false);\n  const [copyDatePickerValue, setCopyDatePickerValue] = useState('');\n"
          if anchor not in s or 'showCopyDatePicker' in s:
              raise SystemExit('Copy picker state anchor missing/already patched')
          s = s.replace(anchor, insert, 1)

          pattern = re.compile(r"  const handleCopyFromYesterdayClick = \(\) => \{.*?\n  \};", re.S)
          replacement = '''  const handleOpenCopyDatePicker = () => {
            if (!canOperate) return;
            const d = new Date(`${selectedDate}T12:00:00`);
            d.setDate(d.getDate() - 1);
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            setCopyDatePickerValue(`${year}-${month}-${day}`);
            setShowCopyDatePicker((value) => !value);
          };'''
          s, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Copy handler patch count={n}')

          old = '''              <button
                onClick={handleCopyFromYesterdayClick}
                className="flex-1 flex items-center justify-center gap-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold py-2.5 px-4 rounded-xl shadow-sm transition text-xs"
                title="Sao chép toàn bộ quân số của ngày liền trước"
              >
                <Copy className="w-3.5 h-3.5" /> Sao chép quân số hôm qua
              </button>
            </div>
'''
          new = '''              <button
                onClick={handleOpenCopyDatePicker}
                className="flex-1 flex items-center justify-center gap-2 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold py-2.5 px-4 rounded-xl shadow-sm transition text-xs"
                title="Chọn ngày nguồn để sao chép quân số"
              >
                <Copy className="w-3.5 h-3.5" /> Sao chép quân số
              </button>
            </div>

            {showCopyDatePicker && (
              <div className="mb-4 -mt-2 rounded-xl border border-indigo-200 bg-indigo-50/70 p-3">
                <div className="text-[11px] font-bold text-indigo-800 mb-2">Chọn ngày cần sao chép quân số</div>
                <div className="flex items-center gap-2">
                  <input
                    type="date"
                    max={getTodayString()}
                    value={copyDatePickerValue}
                    onChange={(e) => setCopyDatePickerValue(e.target.value)}
                    className="flex-1 min-w-0 bg-white border border-indigo-200 rounded-xl px-3 py-2.5 text-sm font-bold text-slate-800"
                    aria-label="Ngày nguồn sao chép quân số"
                  />
                  <button
                    type="button"
                    disabled={!copyDatePickerValue || copyDatePickerValue === selectedDate}
                    onClick={() => {
                      requestCopyFromDate(copyDatePickerValue);
                      setShowCopyDatePicker(false);
                    }}
                    className="shrink-0 rounded-xl bg-indigo-600 px-4 py-2.5 text-xs font-bold text-white disabled:opacity-40 disabled:cursor-not-allowed"
                  >
                    Sao chép
                  </button>
                </div>
              </div>
            )}
'''
          if old not in s:
              raise SystemExit('Copy button UI target not found')
          s = s.replace(old, new, 1)
          s = s.replace('Ấn nút "Ghi nhận quân số" hoặc "Sao chép quân số hôm qua" để điền nhanh.', 'Ấn nút "Ghi nhận quân số" hoặc "Sao chép quân số" để điền nhanh.', 1)
          if 'handleCopyFromYesterdayClick' in s or 'Sao chép quân số hôm qua' in s:
              raise SystemExit('Old yesterday-only copy UI remains')
          p.write_text(s, encoding='utf-8')
          PY
      - run: npm ci
      - run: npm run test:stability
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:rules
      - run: npm run security:audit
      - run: npm run build
      - name: Commit certified source patch
        shell: bash
        run: |
          test -n "$(git status --porcelain -- src/components/CrewTab.tsx)" || { echo 'No source diff'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/CrewTab.tsx
          git commit -m 'fix: choose source date when copying crew records'
          git push origin HEAD:main
      - name: Deploy Hosting site hnlqltc
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only hosting --config firebase.prod.json --project com-example-qlct-61329 --non-interactive
          echo 'PROD Hosting: https://hnlqltc.web.app'
