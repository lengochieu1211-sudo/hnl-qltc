name: Gate Materialize Orphan-Safe AI Context

on:
  push:
    branches:
      - gate/ai-health-counter-20260909

permissions:
  contents: write

jobs:
  materialize-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout isolated gate branch
        uses: actions/checkout@v4
        with:
          ref: gate/ai-health-counter-20260909
          fetch-depth: 0

      - name: Enforce exact DEV baseline
        shell: bash
        run: |
          git merge-base --is-ancestor e9b28283560fe7600879a7b983032ef4f45c6cc0 HEAD
          test "$(git rev-parse e9b28283560fe7600879a7b983032ef4f45c6cc0)" = "e9b28283560fe7600879a7b983032ef4f45c6cc0"

      - name: Apply orphan-safe AI context and regression gates
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          root = Path('.')
          p = root / 'src/ai/data/externalAiContext.ts'
          s = p.read_text(encoding='utf-8')

          anchor = """function buildTeamResolver(snapshot: HnlAiProjectSnapshot) {
            const teamNameById = new Map<string, string>();
            const teamByName = new Map<string, { id: string; name: string }>();
            for (const team of active(snapshot.teams)) {
              const id = String(team.id || '').trim();
              const name = safeText(team.name).trim();
              if (id && name) teamNameById.set(id, name);
              if (name) teamByName.set(normalizedText(name), { id, name });
            }
            return (teamId?: string, teamName?: string) => {
              const id = String(teamId || '').trim();
              const byId = id ? teamNameById.get(id) : '';
              if (byId) return { teamId: id, teamName: byId };
              const name = safeText(teamName || '').trim();
              const declared = name ? teamByName.get(normalizedText(name)) : undefined;
              if (declared) return { teamId: declared.id || id, teamName: declared.name };
              return { teamId: id, teamName: name };
            };
          }
          """.replace('          ', '')
          if anchor not in s:
              raise SystemExit('buildTeamResolver anchor not found')
          insert = anchor + """

          interface ActiveWorkCategoryRef {
            workCategoryId: string;
            workCategory: string;
          }

          /**
           * Work-volume rows are the active HNL work-category registry. Room/category/sub-item
           * references that no longer resolve here are stale/orphan business links. External AI
           * must never treat those stale labels as active quantities.
           */
          function buildWorkCategoryResolver(snapshot: HnlAiProjectSnapshot) {
            const byId = new Map<string, ActiveWorkCategoryRef>();
            const byName = new Map<string, ActiveWorkCategoryRef>();
            for (const item of active(snapshot.workVolumes)) {
              const canonicalId = String(item.workCategoryId || item.id || '').trim();
              const canonicalName = safeText(item.title || '').trim();
              if (!canonicalId && !canonicalName) continue;
              const ref = { workCategoryId: canonicalId, workCategory: canonicalName };
              for (const id of [item.id, item.workCategoryId]) {
                const normalizedId = String(id || '').trim();
                if (normalizedId) byId.set(normalizedId, ref);
              }
              const normalizedName = normalizedText(canonicalName);
              if (normalizedName) byName.set(normalizedName, ref);
            }
            return (workCategoryId?: string, workCategoryName?: string): ActiveWorkCategoryRef | null => {
              const id = String(workCategoryId || '').trim();
              const suppliedName = safeText(workCategoryName || '').trim();
              if (id && byId.has(id)) {
                const ref = byId.get(id)!;
                return { ...ref, workCategory: suppliedName || ref.workCategory };
              }
              const name = normalizedText(suppliedName);
              if (name && byName.has(name)) return byName.get(name)!;
              return null;
            };
          }

          function collectOrphanWorkCategoryRefs(snapshot: HnlAiProjectSnapshot) {
            const resolveCategory = buildWorkCategoryResolver(snapshot);
            const refs = new Set<string>();
            const add = (source: string, ownerId: string, workCategoryId?: string, workCategoryName?: string) => {
              const id = String(workCategoryId || '').trim();
              const name = safeText(workCategoryName || '').trim();
              if ((!id && !name) || resolveCategory(id, name)) return;
              refs.add(`${source}:${ownerId}:${id || normalizedText(name)}`);
            };
            for (const room of active(snapshot.rooms)) {
              if ((Number(room.workVolume) || 0) > 0 || room.workCategoryId || room.workCategory) {
                add('room', room.id, room.workCategoryId, room.workCategory);
              }
              for (const [raw, volume] of Object.entries(room.categoryVolumes || {})) {
                if ((Number(volume) || 0) > 0) add('room-category', room.id, undefined, raw);
              }
              for (const sub of room.subItems || []) {
                if (sub.workCategoryId || sub.category) add('sub-item', `${room.id}:${sub.id || ''}`, sub.workCategoryId, sub.category);
              }
            }
            return refs;
          }
          """.replace('          ', '')
          s = s.replace(anchor, insert, 1)

          old = """function buildQuantityRows(snapshot: HnlAiProjectSnapshot): QuantityRow[] {
            const result: QuantityRow[] = [];
            const resolveTeam = buildTeamResolver(snapshot);
            const resolveFloor = buildFloorResolver(snapshot);
          """.replace('          ', '')
          new = """function buildQuantityRows(snapshot: HnlAiProjectSnapshot): QuantityRow[] {
            const result: QuantityRow[] = [];
            const resolveTeam = buildTeamResolver(snapshot);
            const resolveFloor = buildFloorResolver(snapshot);
            const resolveCategory = buildWorkCategoryResolver(snapshot);
          """.replace('          ', '')
          if old not in s: raise SystemExit('buildQuantityRows anchor missing')
          s = s.replace(old, new, 1)

          old = """    const roomTeam = resolveTeam(room.teamId, room.assignedTeam);
              const base = {
                floorId: room.floorId || '',
                floorName: resolveFloor(room.floorId, room.floorName),
                roomId: room.id,
                roomName: safeText(room.roomName || ''),
                teamId: roomTeam.teamId,
                teamName: roomTeam.teamName,
                workCategoryId: room.workCategoryId || '',
                workCategory: safeText(room.workCategory || ''),
                updatedAt: finiteNumber(room.updatedAt),
              };
          """.replace('          ', '')
          new = """    const roomTeam = resolveTeam(room.teamId, room.assignedTeam);
              const roomCategory = resolveCategory(room.workCategoryId, room.workCategory);
              const base = {
                floorId: room.floorId || '',
                floorName: resolveFloor(room.floorId, room.floorName),
                roomId: room.id,
                roomName: safeText(room.roomName || ''),
                teamId: roomTeam.teamId,
                teamName: roomTeam.teamName,
                workCategoryId: roomCategory?.workCategoryId || '',
                workCategory: roomCategory?.workCategory || '',
                updatedAt: finiteNumber(room.updatedAt),
              };
          """.replace('          ', '')
          if old not in s: raise SystemExit('room base block missing')
          s = s.replace(old, new, 1)

          old = """      for (const [category, value] of categoryEntries) {
                const categoryName = safeText(category || base.workCategory);
                const relatedSubItems = (room.subItems || []).filter((item) => sameCategory(categoryName, base.workCategoryId, item));
                const relatedTeams = Array.from(new Map(
                  relatedSubItems
                    .map((item) => resolveTeam(item.teamId, item.assignedTeam))
                    .filter((team) => team.teamId || team.teamName)
                    .map((team) => [`${team.teamId}|${normalizedText(team.teamName)}`, team] as const),
                ).values());
                const categoryTeam = relatedTeams.length === 1 ? relatedTeams[0] : roomTeam;
                result.push({
                  source: 'room-category',
                  ...base,
                  teamId: categoryTeam.teamId,
                  teamName: categoryTeam.teamName,
                  workCategory: categoryName,
                  item: safeText(category || base.workCategory || room.roomName),
                  volume: Number(value),
                  unit: safeText(room.categoryVolumeUnits?.[category] || room.volumeUnit || ''),
                  status: room.inspectionStatus || '',
                });
              }
          """.replace('          ', '')
          new = """      for (const [category, value] of categoryEntries) {
                const categoryName = safeText(category || base.workCategory);
                const relatedSubItems = (room.subItems || []).filter((item) => sameCategory(categoryName, base.workCategoryId, item));
                const relatedCategoryRefs = Array.from(new Map(
                  relatedSubItems
                    .map((item) => resolveCategory(item.workCategoryId, item.category))
                    .filter((ref): ref is ActiveWorkCategoryRef => Boolean(ref))
                    .map((ref) => [`${ref.workCategoryId}|${normalizedText(ref.workCategory)}`, ref] as const),
                ).values());
                const categoryRef = resolveCategory(undefined, categoryName)
                  || (relatedCategoryRefs.length === 1 ? relatedCategoryRefs[0] : null);
                if (!categoryRef) continue;
                const relatedTeams = Array.from(new Map(
                  relatedSubItems
                    .map((item) => resolveTeam(item.teamId, item.assignedTeam))
                    .filter((team) => team.teamId || team.teamName)
                    .map((team) => [`${team.teamId}|${normalizedText(team.teamName)}`, team] as const),
                ).values());
                const categoryTeam = relatedTeams.length === 1 ? relatedTeams[0] : roomTeam;
                result.push({
                  source: 'room-category',
                  ...base,
                  teamId: categoryTeam.teamId,
                  teamName: categoryTeam.teamName,
                  workCategoryId: categoryRef.workCategoryId,
                  workCategory: categoryRef.workCategory,
                  item: categoryRef.workCategory || room.roomName,
                  volume: Number(value),
                  unit: safeText(room.categoryVolumeUnits?.[category] || room.volumeUnit || ''),
                  status: room.inspectionStatus || '',
                });
              }
          """.replace('          ', '')
          if old not in s: raise SystemExit('category block missing')
          s = s.replace(old, new, 1)

          old = """      for (const item of subRows) {
                const itemTeam = resolveTeam(item.teamId || base.teamId, item.assignedTeam || base.teamName);
                result.push({
                  source: 'sub-item',
                  ...base,
                  teamId: itemTeam.teamId,
                  teamName: itemTeam.teamName,
                  workCategoryId: item.workCategoryId || base.workCategoryId,
                  workCategory: safeText(item.category || base.workCategory),
                  item: safeText(item.name || item.category || base.workCategory),
                  volume: Number(item.workVolume),
                  unit: safeText(item.volumeUnit || room.volumeUnit || ''),
                  status: item.status || '',
                });
              }
          """.replace('          ', '')
          new = """      for (const item of subRows) {
                const itemTeam = resolveTeam(item.teamId || base.teamId, item.assignedTeam || base.teamName);
                const categoryRef = resolveCategory(item.workCategoryId || base.workCategoryId, item.category || base.workCategory);
                if (!categoryRef) continue;
                result.push({
                  source: 'sub-item',
                  ...base,
                  teamId: itemTeam.teamId,
                  teamName: itemTeam.teamName,
                  workCategoryId: categoryRef.workCategoryId,
                  workCategory: categoryRef.workCategory,
                  item: safeText(item.name || categoryRef.workCategory),
                  volume: Number(item.workVolume),
                  unit: safeText(item.volumeUnit || room.volumeUnit || ''),
                  status: item.status || '',
                });
              }
          """.replace('          ', '')
          if old not in s: raise SystemExit('sub-item block missing')
          s = s.replace(old, new, 1)

          old = """    const roomVolume = finiteNumber(room.workVolume);
              if (roomVolume !== null) {
                result.push({
                  source: 'room-total',
                  ...base,
                  item: safeText(base.workCategory || room.roomName),
                  volume: roomVolume,
                  unit: safeText(room.volumeUnit || ''),
                  status: room.inspectionStatus || '',
                });
              }
          """.replace('          ', '')
          new = """    const roomVolume = finiteNumber(room.workVolume);
              if (roomVolume !== null && roomCategory) {
                result.push({
                  source: 'room-total',
                  ...base,
                  workCategoryId: roomCategory.workCategoryId,
                  workCategory: roomCategory.workCategory,
                  item: roomCategory.workCategory || room.roomName,
                  volume: roomVolume,
                  unit: safeText(room.volumeUnit || ''),
                  status: room.inspectionStatus || '',
                });
              }
          """.replace('          ', '')
          if old not in s: raise SystemExit('room-total block missing')
          s = s.replace(old, new, 1)

          start = s.index('function rawRoomRows(')
          end = s.index('\nfunction rawCrewRows', start)
          raw_room = """function rawRoomRows(snapshot: HnlAiProjectSnapshot, targets: Array<{ id: string; name: string }>) {
            const resolveFloor = buildFloorResolver(snapshot);
            const resolveCategory = buildWorkCategoryResolver(snapshot);
            return active(snapshot.rooms)
              .map((room) => {
                const roomCategory = resolveCategory(room.workCategoryId, room.workCategory);
                const roomHasExplicitCategory = Boolean(String(room.workCategoryId || '').trim() || String(room.workCategory || '').trim());
                return {
                  id: room.id,
                  floorId: room.floorId || '',
                  floorName: resolveFloor(room.floorId, room.floorName),
                  roomName: safeText(room.roomName),
                  workCategoryId: roomCategory?.workCategoryId || '',
                  workCategory: roomCategory?.workCategory || '',
                  orphanWorkCategory: roomHasExplicitCategory && !roomCategory,
                  teamId: room.teamId || '',
                  assignedTeam: safeText(room.assignedTeam || ''),
                  inspectionStatus: room.inspectionStatus,
                  frameStatus: room.frameStatus,
                  boardStatus: room.boardStatus,
                  targetFrameDate: room.targetFrameDate || '',
                  targetBoardDate: room.targetBoardDate || '',
                  subItems: (room.subItems || []).slice(0, MAX_SUBITEMS_PER_ROOM).map((item) => {
                    const itemCategory = resolveCategory(item.workCategoryId, item.category);
                    const itemHasExplicitCategory = Boolean(String(item.workCategoryId || '').trim() || String(item.category || '').trim());
                    return {
                      id: item.id,
                      name: safeText(item.name),
                      category: itemCategory?.workCategory || '',
                      workCategoryId: itemCategory?.workCategoryId || '',
                      orphanWorkCategory: itemHasExplicitCategory && !itemCategory,
                      teamId: item.teamId || '',
                      assignedTeam: safeText(item.assignedTeam || ''),
                      workVolume: itemCategory ? finiteNumber(item.workVolume) : null,
                      volumeUnit: itemCategory ? safeText(item.volumeUnit || '') : '',
                      status: item.status,
                      inspectionStatus: item.inspectionStatus || '',
                      targetDate: item.targetDate || '',
                    };
                  }),
                };
              })
              .filter((room) => targets.length === 0 || isTeamMatch(room, targets) || room.subItems.some((item) => isTeamMatch(item, targets)));
          }
          """.replace('          ', '')
          s = s[:start] + raw_room + s[end:]

          old = """  const result: Record<string, unknown> = {
              project: { id: snapshot.projectId, name: safeText(snapshot.projectName || ''), asOf: snapshot.asOf, freshness: snapshot.freshness },
              privacy: 'read-only sanitized HNL project context; credentials/contact data excluded',
            };
          """.replace('          ', '')
          new = """  const result: Record<string, unknown> = {
              project: { id: snapshot.projectId, name: safeText(snapshot.projectName || ''), asOf: snapshot.asOf, freshness: snapshot.freshness },
              privacy: 'read-only sanitized HNL project context; credentials/contact data excluded',
            };
            const orphanWorkCategoryRefs = collectOrphanWorkCategoryRefs(snapshot);
            if (orphanWorkCategoryRefs.size > 0) {
              result.dataQuality = {
                omittedOrphanWorkCategoryRefs: orphanWorkCategoryRefs.size,
                policy: 'Stale/deleted work-category references are excluded from active AI quantity/progress facts. Review them in HNL Health Center; never infer or auto-delete.',
              };
            }
          """.replace('          ', '')
          if old not in s: raise SystemExit('context result block missing')
          s = s.replace(old, new, 1)

          old = """    grounding: 'Every numeric conclusion must be traceable to supplied rows and preserve team/floor/category/item/date/unit scope.',
              historicalQuantity: 'Quantity is a current snapshot unless a dated immutable quantity ledger exists. Do not assign snapshot quantity to a past date range.',
          """.replace('          ', '')
          new = """    grounding: 'Every numeric conclusion must be traceable to supplied rows and preserve team/floor/category/item/date/unit scope.',
              orphanReferences: 'Stale/deleted work-category references are omitted from active facts. Never restore, count, relink or delete them from AI output; direct users to HNL Health Center for confirmation.',
              historicalQuantity: 'Quantity is a current snapshot unless a dated immutable quantity ledger exists. Do not assign snapshot quantity to a past date range.',
          """.replace('          ', '')
          if old not in s: raise SystemExit('AI contract block missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p = root / 'scripts/ai-external-context-golden.ts'
          s = p.read_text(encoding='utf-8')
          anchor = "assert.equal(teamAttributed.quantityDetails.rows[0].floorName, 'Tầng 1');\n\nconst payload = buildExternalAiQuestionPayload(\n"
          if anchor not in s: raise SystemExit('external-context golden anchor missing')
          block = """assert.equal(teamAttributed.quantityDetails.rows[0].floorName, 'Tầng 1');

          // Regression: deleted/orphan work-category labels must never flow into active AI quantity facts.
          const orphanCategoryLabel = 'Trần Thạch Cao Khung Chìm Tấm Tiêu Chuẩn';
          const orphanCategorySnapshot = {
            ...snapshot,
            rooms: [
              {
                id: 'room-valid-category', roomName: 'C01', floorId: 'f1', floorName: '', teamId: 'team-nguyen', assignedTeam: 'Đội Nguyên',
                workCategoryId: 'cat-ceiling', workCategory: 'Trần', workVolume: 10, volumeUnit: 'm2', inspectionStatus: 'Đang làm', updatedAt: 3, subItems: [],
              },
              {
                id: 'room-orphan-category', roomName: 'C02', floorId: 'f1', floorName: '', teamId: 'team-nguyen', assignedTeam: 'Đội Nguyên',
                categoryVolumes: { [orphanCategoryLabel]: 25 }, categoryVolumeUnits: { [orphanCategoryLabel]: 'm2' },
                inspectionStatus: 'Đang làm', updatedAt: 4, subItems: [],
              },
            ],
          } as any;
          const orphanFiltered = buildExternalAiProjectContext(orphanCategorySnapshot, {
            progress: true, quantities: true, defects: false, crew: false, inventory: false, checklist: false,
          }) as any;
          assert.equal(orphanFiltered.dataQuality.omittedOrphanWorkCategoryRefs, 1);
          assert.equal(JSON.stringify(orphanFiltered.quantityDetails).includes(orphanCategoryLabel), false, 'orphan category must be removed from active quantity rows');
          assert.equal(JSON.stringify(orphanFiltered.quantitySummaryByTeamAndCategory).includes(orphanCategoryLabel), false, 'orphan category must be removed from active quantity summary');
          assert.equal(orphanFiltered.quantityDetails.rows.length, 1, 'only the active category quantity row is allowed through');
          assert.equal(orphanFiltered.quantityDetails.rows[0].volume, 10);
          const orphanQuestionPayload = buildExternalAiQuestionPayload(
            'Có bao nhiêu đội thi công và khối lượng hạng mục như nào?',
            orphanCategorySnapshot,
            { progress: true, quantities: true, defects: false, crew: false, inventory: false, checklist: false },
            { fullProjectRaw: true },
          );
          assert.equal(orphanQuestionPayload.includes(orphanCategoryLabel), false, 'deleted category label must not leak into full-project AI prompt');
          assert.match(orphanQuestionPayload, /omittedOrphanWorkCategoryRefs/);
          assert.match(orphanQuestionPayload, /Health Center/);

          const payload = buildExternalAiQuestionPayload(
          """.replace('          ', '')
          s = s.replace(anchor, block, 1)
          p.write_text(s, encoding='utf-8')

          p = root / 'scripts/health-center-orphan-golden.ts'
          s = p.read_text(encoding='utf-8')
          old = "  'MATERIAL_NORM_WORK_CATEGORY_NOT_FOUND',\n  'ROOM_ORPHAN_WORK_CATEGORY_REFERENCE',\n"
          new = "  'MATERIAL_NORM_WORK_CATEGORY_NOT_FOUND',\n  'MATERIAL_NORM_ORPHAN_WORK_CATEGORY',\n  'ROOM_ORPHAN_WORK_CATEGORY_REFERENCE',\n"
          if old not in s: raise SystemExit('health orphan rule anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = root / 'scripts/ai-audit-golden.ts'
          s = p.read_text(encoding='utf-8')
          old = "import { auditProjectIntegrity } from '../src/ai/audit/projectAudit';\nimport { createHnlAiProjectSnapshot } from '../src/ai/data/projectSnapshot';\n"
          new = "import { auditProjectIntegrity } from '../src/ai/audit/projectAudit';\nimport { auditProjectViaHealthCenter } from '../src/ai/audit/healthCenterAiAudit';\nimport { createHnlAiProjectSnapshot } from '../src/ai/data/projectSnapshot';\nimport { buildHealthCenterReport } from '../src/healthCenter/healthCenterEngine';\n"
          if old not in s: raise SystemExit('ai audit import anchor missing')
          s = s.replace(old, new, 1)
          anchor = "const projectAudit = auditProjectIntegrity({ context, snapshot });\n"
          block = """const healthCenterReport = buildHealthCenterReport({ context, snapshot });
          const healthCenterAi = auditProjectViaHealthCenter({ context, snapshot });
          const healthCenterReviewFact = healthCenterAi.facts.find((fact) => fact.id === 'health-center:review');
          assert.ok(healthCenterReviewFact, 'AI Health Center adapter must export review fact');
          assert.equal(healthCenterReviewFact!.value, healthCenterReport.needsConfirmationCount, 'AI review fact must count Health Center NEEDS_CONFIRMATION action class');
          assert.ok(healthCenterReport.needsConfirmationCount > 0, 'golden fixture must exercise NEEDS_CONFIRMATION count');

          const projectAudit = auditProjectIntegrity({ context, snapshot });
          """.replace('          ', '')
          if anchor not in s: raise SystemExit('ai audit project anchor missing')
          p.write_text(s.replace(anchor, block, 1), encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Focused orphan and AI regression gates
        run: |
          npm run test:ai-external-context
          npm run test:ai-audit
          npm run test:health-center

      - name: Full source gate
        run: npm run verify

      - name: Commit candidate only to isolated gate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/data/externalAiContext.ts scripts/ai-external-context-golden.ts scripts/ai-audit-golden.ts scripts/health-center-orphan-golden.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: exclude orphan work categories from AI active facts"
          git push origin HEAD:gate/ai-health-counter-20260909
