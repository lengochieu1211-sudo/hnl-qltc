name: One-shot HNL Share Center + Diagnostics UI

on:
  push:
    branches: [feature/share-center-ui-cleanup]
    paths:
      - '.github/workflows/one-shot-share-center-ui-cleanup.yml'

permissions:
  contents: write

jobs:
  patch_and_certify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/share-center-ui-cleanup
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply share center source patch
        run: python3 scripts/patch-share-center.py

      - name: Install exact dependencies
        run: npm ci

      - name: Share center golden
        run: npx tsx scripts/share-center-golden.ts

      - name: Existing HNL stability regression
        run: npm run test:stability

      - name: TypeScript
        run: npm run typecheck

      - name: Lint and source secret scan
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify package lock unchanged
        shell: bash
        run: |
          git diff --exit-code -- package.json package-lock.json || {
            echo '::error::Share/UI patch must not change package.json or package-lock.json.'
            exit 1
          }

      - name: Commit certified implementation and remove one-shot patcher
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-share-center.py
          rm -f .github/workflows/one-shot-share-center-ui-cleanup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src android-wrapper scripts/share-center-golden.ts .github/workflows/one-shot-share-center-ui-cleanup.yml scripts/patch-share-center.py
          if git diff --cached --quiet; then
            echo 'No implementation changes to commit.'
            exit 0
          fi
          git commit -m 'feat(dev): add system share center and collapsible diagnostics'
          git push origin HEAD:feature/share-center-ui-cleanup
