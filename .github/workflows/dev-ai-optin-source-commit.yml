name: HNL QLTC DEV AI Opt-in Source Commit

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dev-ai-optin-source-commit.yml'

permissions:
  contents: write

jobs:
  source_commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: DEV-only guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dev'
          test "$(git branch --show-current)" = 'dev'
          test -f .github/workflows/dev-ai-external-optin-autopatch.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Reuse verified patch recipe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src = Path('.github/workflows/dev-ai-external-optin-autopatch.yml').read_text(encoding='utf-8').splitlines()
          start = next(i for i, line in enumerate(src) if line.strip() == '- name: Apply root-fix for external AI opt-in and privacy minimization')
          run_line = next(i for i in range(start + 1, len(src)) if src[i].strip() == 'run: |')
          end = next(i for i in range(run_line + 1, len(src)) if src[i].startswith('      - name:'))
          code = []
          for line in src[run_line + 1:end]:
              code.append(line[10:] if line.startswith('          ') else line)
          compiled = '\n'.join(code) + '\n'
          exec(compile(compiled, '<autopatch-recipe>', 'exec'), {'__name__': '__main__'})
          PY
          # The first verifier proved this runtime-workflow edit is valid, but GitHub's
          # workflow token cannot push workflow-file mutations. Commit source separately;
          # the connector will wire the permanent regression into the runtime gate next.
          git checkout -- .github/workflows/dev-runtime-golden.yml

      - name: Verify exact source payload
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:ai-core
          npm run test:ai-tools
          npm run test:ai-audit
          npm run test:ai-planner
          npm run test:ai-provider
          npm run test:ai-gateway
          npm run test:ai-external-context
          npm run test:ai-export
          npm run typecheck
          npm run lint
          npm run build
          git diff --check
          grep -q 'Cho phép AI bên ngoài sử dụng dữ liệu HNL trong câu hỏi này' src/features/ai/AiAssistantPage.tsx
          grep -q 'const MAX_ROWS_PER_COLLECTION = 60' src/ai/data/externalAiContext.ts
          test "$(git diff --name-only | grep -c '^\.github/workflows/' || true)" = '0'

      - name: Commit verified source to DEV
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/features/ai/AiAssistantPage.tsx src/ai/data/externalAiContext.ts scripts/ai-external-context-golden.ts package.json
          git commit -m 'feat(dev): add per-question external AI data opt-in hardening'
          git push origin HEAD:dev
