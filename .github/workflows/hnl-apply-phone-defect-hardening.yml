name: HNL Apply Phone Defect Hardening

on:
  push:
    branches:
      - fix/post-pr53-phone-defect-hardening
    paths:
      - '.hnl-bootstrap/**'
      - '.github/workflows/hnl-apply-phone-defect-hardening.yml'

permissions:
  contents: write

jobs:
  apply-patch:
    if: ${{ hashFiles('.hnl-bootstrap/*.patch') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply exact audited patches
        shell: bash
        run: |
          set -euo pipefail
          for patch in .hnl-bootstrap/*.patch; do
            echo "Checking ${patch}"
            git apply --check "${patch}"
          done
          for patch in .hnl-bootstrap/*.patch; do
            echo "Applying ${patch}"
            git apply "${patch}"
          done

      - name: Commit hardened source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/FloorPlanDefectTab.tsx src/components/SecurityModal.tsx
          git diff --cached --check
          git commit -m "Fix Android phone focus and harden defect linkage"
          git push origin HEAD:${GITHUB_REF_NAME}
