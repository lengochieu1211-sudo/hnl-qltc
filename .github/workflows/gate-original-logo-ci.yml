name: Gate Original HNL Logo Full CI

on:
  push:
    branches:
      - gate/original-logo-runtime-20260909

permissions:
  contents: read

jobs:
  verify_source:
    name: Full verify without deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BUILD_ID: gate-${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout isolated gate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce baseline and intended file scope
        shell: bash
        run: |
          git cat-file -e 19a7685cdd4d1cd53f2f011349370661146e0cd9^{commit}
          python <<'PY'
          import subprocess
          base = '19a7685cdd4d1cd53f2f011349370661146e0cd9'
          allowed = {
              'desktop-wrapper/build-launcher.ps1',
              'index.html',
              'public/hnl-logo-original-16.png',
              'public/hnl-logo-original-20.png',
              'public/hnl-logo-original-24.png',
              'public/hnl-logo-original-28.png',
              'public/hnl-logo-original-32.png',
              'public/hnl-logo-original-40.png',
              'public/hnl-logo-original-48.png',
              'public/hnl-logo-original-192.png',
              'public/hnl-logo-original-512.png',
              'public/manifest.json',
              'public/sw.js',
              'scripts/desktop-launcher-golden.mjs',
              'scripts/source-lint.mjs',
              'scripts/stability-gate.mjs',
              'scripts/windows-icon-golden.ps1',
              'src/components/FloorPlanDefectTab.tsx',
              '.github/workflows/gate-original-logo-ci.yml',
          }
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..HEAD'], text=True
          ).splitlines()))
          unexpected = sorted(changed - allowed)
          missing = sorted((allowed - {'.github/workflows/gate-original-logo-ci.yml'}) - changed)
          if unexpected:
              raise SystemExit('Unexpected changed files: ' + ', '.join(unexpected))
          if missing:
              raise SystemExit('Expected candidate files missing: ' + ', '.join(missing))
          print('Candidate scope PASS:', len(changed), 'changed files including temporary CI workflow')
          PY
          git diff --exit-code 19a7685cdd4d1cd53f2f011349370661146e0cd9..HEAD -- \
            package.json package-lock.json .firebaserc firebase.json firebase.prod.json \
            firestore.rules storage.rules database.rules.json \
            .github/workflows/build.yml \
            .github/workflows/firebase-hosting-merge.yml \
            .github/workflows/firebase-hosting-pull-request.yml \
            .github/workflows/firebase-dev-environment.yml \
            .github/workflows/windows-exe-dev.yml \
            .github/workflows/android-apk-dev.yml

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Python for logo identity gate
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify runtime frames are exact resizes of canonical HNL logo
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check pillow==12.3.0
          python <<'PY'
          from pathlib import Path
          from PIL import Image, ImageChops
          root = Path('.')
          source = Image.open(root / 'public/icon.png').convert('RGBA')
          for size in (16,20,24,28,32,40,48,192,512):
              expected = source.resize((size,size), Image.Resampling.LANCZOS)
              actual = Image.open(root / f'public/hnl-logo-original-{size}.png').convert('RGBA')
              if actual.size != (size,size):
                  raise SystemExit(f'{size}: wrong dimensions {actual.size}')
              if ImageChops.difference(expected, actual).getbbox() is not None:
                  raise SystemExit(f'{size}: runtime frame differs from canonical public/icon.png resize')
              print(f'PASS canonical logo frame {size}x{size}')
          PY

      - name: Install exact locked dependencies
        run: npm ci

      - name: Complete verification gate
        run: npm run verify

  windows_runtime_icon:
    name: Windows original-logo runtime golden
    needs: verify_source
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      DEV_FIREBASE_PROJECT_ID: hnl-qltc-dev
      PROD_FIREBASE_PROJECT_ID: com-example-qlct-61329
      DEV_R2_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
      PROD_R2_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      DEV_AI_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
      PROD_AI_URL: https://hnl-qltc-ai-gateway.lengochieu1211.workers.dev
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyB6y060Mji2684mB-g1qYHoEJ-F1ep5q5M
      VITE_FIREBASE_AUTH_DOMAIN: hnl-qltc-dev.web.app
      VITE_FIREBASE_PROJECT_ID: hnl-qltc-dev
      VITE_FIREBASE_STORAGE_BUCKET: hnl-qltc-dev.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1036808734475"
      VITE_FIREBASE_APP_ID: 1:1036808734475:web:e124b3ff0c50369393840e
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_HNL_AI_ENABLED: "true"
      VITE_HNL_AI_GATEWAY_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
      VITE_BUILD_ID: gate-${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
      QLCT_RELEASE_TAG: 6.3.0-dev-gate
    steps:
      - name: Checkout isolated gate branch
        uses: actions/checkout@v4

      - name: Gate isolation check
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/gate/original-logo-runtime-20260909') { throw "Unexpected ref: $env:GITHUB_REF" }
          if ($env:VITE_FIREBASE_PROJECT_ID -ne $env:DEV_FIREBASE_PROJECT_ID) { throw 'Gate must use DEV Firebase configuration' }
          if ($env:VITE_FIREBASE_PROJECT_ID -eq $env:PROD_FIREBASE_PROJECT_ID) { throw 'REFUSING PROD Firebase in gate' }
          if ($env:VITE_R2_GATEWAY_URL -ne $env:DEV_R2_URL -or $env:VITE_R2_GATEWAY_URL -eq $env:PROD_R2_URL) { throw 'REFUSING non-DEV R2 in gate' }
          if ($env:VITE_HNL_AI_GATEWAY_URL -ne $env:DEV_AI_URL -or $env:VITE_HNL_AI_GATEWAY_URL -eq $env:PROD_AI_URL) { throw 'REFUSING non-DEV AI gateway in gate' }
          Write-Host 'Gate DEV isolation: PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Stability TypeScript Lint Security Build
        shell: pwsh
        run: |
          npm run test:stability
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run lint
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run security:audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Desktop launcher source golden
        run: node scripts/desktop-launcher-golden.mjs

      - name: Rewrite launcher to isolated DEV runtime
        shell: pwsh
        run: |
          $path = './desktop-wrapper/QLTCAnPhuLauncher.cs'
          $utf8 = New-Object System.Text.UTF8Encoding($true)
          $text = Get-Content -Raw -LiteralPath $path
          $text = $text.Replace('private const string AppBaseUrl = "https://hnlqltc.web.app/?app=desktop";', 'private const string AppBaseUrl = "https://hnl-qltc-dev.web.app/?app=desktop&env=dev";')
          $text = $text.Replace('private const string ProductName = "HNL Quản Lý Thi Công";', 'private const string ProductName = "HNL QLTC DEV GATE";')
          $text = $text.Replace('"QLTCAnPhu"', '"QLTCAnPhuDEVGate"')
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, $utf8)
          $after = Get-Content -Raw -LiteralPath $path
          if ($after -match 'https://hnlqltc\.web\.app/\?app=desktop') { throw 'REFUSING PROD Hosting target in gate launcher' }
          if ($after -notmatch 'https://hnl-qltc-dev\.web\.app/\?app=desktop&env=dev') { throw 'DEV launcher rewrite failed' }

      - name: Build temporary Windows DEV gate EXE
        shell: pwsh
        run: ./desktop-wrapper/build-launcher.ps1

      - name: Windows original-logo icon golden
        shell: pwsh
        run: ./scripts/windows-icon-golden.ps1

      - name: Verify temporary EXE
        shell: pwsh
        run: |
          $exe = Resolve-Path './HNL-QLTC-Windows.exe'
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 4096) { throw "EXE unexpectedly small: $($item.Length)" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe
          Move-Item -Force './HNL-QLTC-Windows.exe' './HNL-QLTC-Windows-DEV-GATE.exe'

      - name: Upload non-production gate evidence
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-Original-Logo-Gate-${{ github.run_number }}
          path: |
            HNL-QLTC-Windows-DEV-GATE.exe
            icon-golden-evidence/**
          if-no-files-found: error
          retention-days: 7
