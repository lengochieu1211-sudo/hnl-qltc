name: One-shot HNL AI UI integration

on:
  push:
    branches: [feature/hnl-ai-assistant]
    paths:
      - '.github/workflows/one-shot-ai-ui-integration.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout isolated AI branch
        uses: actions/checkout@v4
        with:
          ref: feature/hnl-ai-assistant
          fetch-depth: 0

      - name: Apply HNL AI UI integration
        run: python3 scripts/patch-ai-ui-integration.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate integration
        env:
          VITE_APP_ENV: DEV
          VITE_RUNTIME_BACKEND: firebase-only
          VITE_HNL_AI_ENABLED: 'true'
          VITE_HNL_AI_GATEWAY_URL: 'https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev'
        run: |
          npm ci
          npm run test:ai-core
          npm run test:ai-tools
          npm run test:ai-audit
          npm run test:ai-planner
          npm run test:ai-provider
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit integration
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-ai-ui-integration.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/App.tsx scripts/patch-ai-ui-integration.py
          git diff --cached --check
          git commit -m 'feat(ai): integrate feature-gated HNL AI Assistant UI'
          git push origin HEAD:feature/hnl-ai-assistant
