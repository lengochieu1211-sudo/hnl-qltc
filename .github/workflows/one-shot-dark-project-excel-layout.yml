name: One-shot dark project card and Excel export repair

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-dark-project-excel-layout.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Patch dark project card and Excel export
        run: python3 scripts/patch-dark-project-excel-layout.py

      - name: Install dependencies
        run: npm ci

      - name: Stability Gate
        run: npm run test:stability

      - name: Room Excel Golden
        run: npx tsx scripts/room-excel-roundtrip-golden.ts

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Commit validated repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-dark-project-excel-layout.py
          rm -f .github/workflows/one-shot-dark-project-excel-layout.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'fix(dev): dark project card and professional room Excel export'
          git push origin HEAD:dev
