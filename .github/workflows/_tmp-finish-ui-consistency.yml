name: TEMP Finish UI Consistency

on:
  push:
    branches:
      - ux/clean-open-controls-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/clean-open-controls-20260910
      - name: Apply staged patch
        run: python scripts/_tmp-finish-ui-consistency.py
      - name: Validate focused UI gate
        run: |
          npm ci
          npm run test:ui-entry-ux
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit final source patch
        run: |
          rm -f .github/workflows/_tmp-finish-ui-consistency.yml scripts/_tmp-finish-ui-consistency.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ui): lock unified entry and disclosure UX"
          git push origin HEAD:ux/clean-open-controls-20260910
