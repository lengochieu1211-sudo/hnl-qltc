name: RC2.2.15 R2 Deploy Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc2215-r2-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy_r2_worker:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify RC2.2.15 Worker source and existing identities
        shell: bash
        run: |
          set -euo pipefail
          grep -F "const GATEWAY_VERSION = '6.3.0-rc2.2.15'" cloudflare/r2-gateway/worker.js
          grep -F "accessPolicy: 'canonical-email-first'" cloudflare/r2-gateway/worker.js
          grep -F "bucket_name = \"hnl-qltc-media\"" cloudflare/r2-gateway/wrangler.toml
          grep -F "FIREBASE_PROJECT_ID = \"com-example-qlct-61329\"" cloudflare/r2-gateway/wrangler.toml

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Require existing Cloudflare deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::MISSING_CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::MISSING_CLOUDFLARE_ACCOUNT_ID'; exit 1; }

      - name: Deploy existing HNL QLTC R2 Worker
        working-directory: cloudflare/r2-gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.ci.toml <<'WRANGLER_EOF'
          name = "hnl-qltc-r2-gateway"
          main = "worker.js"
          compatibility_date = "2026-08-30"

          [[r2_buckets]]
          binding = "HNL_QLTC_MEDIA"
          bucket_name = "hnl-qltc-media"

          [vars]
          FIREBASE_PROJECT_ID = "com-example-qlct-61329"
          SUPER_ADMIN_EMAIL = "lengochieu1211@gmail.com"
          ALLOWED_ORIGINS = "https://hnlqltc.web.app,https://com-example-qlct-61329.web.app,https://com-example-qlct-61329.firebaseapp.com"
          MAX_UPLOAD_BYTES = "26214400"
          WRANGLER_EOF
          trap 'rm -f wrangler.ci.toml' EXIT
          npx --yes wrangler@4.33.0 deploy --config wrangler.ci.toml

      - name: Certify live Worker version and access policy
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --retry 8 --retry-delay 2 \
            'https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev/health?release=rc2.2.15' \
            | tee /tmp/r2-health.json
          grep -q '"ok":true' /tmp/r2-health.json
          grep -q '"version":"6.3.0-rc2.2.15"' /tmp/r2-health.json
          grep -q '"accessPolicy":"canonical-email-first"' /tmp/r2-health.json
