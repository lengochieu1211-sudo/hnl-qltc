name: One-shot Room Excel round-trip repair

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-room-excel-roundtrip-fix.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Patch room Excel export/import round-trip
        run: python3 scripts/patch-room-excel-roundtrip.py

      - name: Validate room Excel round-trip repair
        run: |
          npm ci
          npx tsx scripts/room-excel-roundtrip-golden.ts
          npx tsx scripts/defect-linkage-golden.ts
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit source repair
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/patch-room-excel-roundtrip.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/FloorPlanDefectTab.tsx scripts/room-excel-roundtrip-golden.ts scripts/patch-room-excel-roundtrip.py
          git diff --cached --check
          git commit -m 'fix(dev): round-trip room work items and teams through Excel'
          git push origin HEAD:dev
