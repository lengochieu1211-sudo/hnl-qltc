name: HNL QLTC Apply Audit Hardening Candidate

on:
  push:
    branches: [audit-hardening-20260913]
    paths: ['.github/workflows/audit-hardening-bootstrap.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30
          ref: audit-hardening-20260913
      - name: Verify base and materialize exact patch
        shell: bash
        run: |
          set -euo pipefail
          BASE='663fb5eadd151ba4e9ec9ec8dcc7960cb636a6dd'
          git merge-base --is-ancestor "$BASE" HEAD
          cat .audit-bootstrap/patch.part.* > /tmp/audit-hardening.patch.gz.b64
          echo '5b9aa8b6a60a5df7f7a9eec99923d2482684fd936eae70bc6edb3a7766f7621f  /tmp/audit-hardening.patch.gz.b64' | sha256sum -c -
          base64 -d /tmp/audit-hardening.patch.gz.b64 | gzip -d > /tmp/audit-hardening.patch
          echo '3eab417d5af8f75771543c4e70c3972b739d4ca042a50ed8d71fa8cbfe491d33  /tmp/audit-hardening.patch' | sha256sum -c -
          git apply --check /tmp/audit-hardening.patch
          git apply /tmp/audit-hardening.patch
          git diff --check
      - name: Candidate static guards
        shell: bash
        run: |
          set -euo pipefail
          node scripts/audit-hardening-golden.mjs
          node scripts/stability-gate.mjs
          node scripts/source-lint.mjs
      - name: Commit non-workflow candidate source only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- . ':(exclude).github/workflows/**' ':(exclude).audit-bootstrap/**'
          git diff --cached --check
          git commit -m 'fix(candidate): harden lifecycle RBAC financial and media guards'
          git push origin HEAD:audit-hardening-20260913
