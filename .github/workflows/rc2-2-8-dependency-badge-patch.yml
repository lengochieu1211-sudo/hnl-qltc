name: RC2.2.8 Dependency Badge Patch

on:
  push:
    branches:
      - rc2-2-8-data-integrity-master-gate
    paths:
      - scripts/rc2_2_8_dependency_badge_patch.py
      - .github/workflows/rc2-2-8-dependency-badge-patch.yml

permissions:
  contents: write

jobs:
  apply_and_verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc2-2-8-data-integrity-master-gate
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply asserted UI/CI patch
        run: python3 scripts/rc2_2_8_dependency_badge_patch.py

      - name: Pin Firebase JS SDK 12.18.0 and refresh lock
        run: |
          npm pkg set dependencies.firebase=12.18.0
          npm install --package-lock-only --ignore-scripts
          node -e "const p=require('./package.json'); if(p.dependencies.firebase!=='12.18.0') process.exit(1); console.log('firebase package pinned',p.dependencies.firebase)"

      - name: Apply safe npm audit lockfile fixes
        run: npm audit fix --package-lock-only --ignore-scripts || true

      - name: Install locked dependencies
        run: npm ci

      - name: Verify installed Firebase SDK
        run: node -e "const p=require('./node_modules/firebase/package.json'); if(p.version!=='12.18.0'){console.error('Expected firebase 12.18.0, got',p.version);process.exit(1)} console.log('firebase installed',p.version)"

      - name: Stability Gate
        run: npm run test:stability

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Firebase Rules compile and emulator behavior
        run: npm run test:rules

      - name: Production critical security audit
        run: npm run security:audit

      - name: Build
        run: npm run build

      - name: Remove one-shot patch machinery
        run: |
          rm -f scripts/rc2_2_8_dependency_badge_patch.py
          rm -f .github/workflows/rc2-2-8-dependency-badge-patch.yml

      - name: Commit verified WIP patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "RC2.2.8: pin Firebase 12.18 and clarify runtime badges [rc2.2.8-deps]"
          git push origin HEAD:rc2-2-8-data-integrity-master-gate
