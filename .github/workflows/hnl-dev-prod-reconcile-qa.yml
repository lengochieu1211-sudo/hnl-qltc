name: HNL DEV current + PROD fix parity - staged full regression, NO PUSH OR DEPLOY
on:
  push:
    branches:
      - qa/dev-prod-safe-reconcile-20261101
permissions:
  contents: read
concurrency:
  group: hnl-dev-prod-reconcile-qa
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Guard pinned GitHub sources, exact scope and protection
        shell: bash
        run: |
          set -euo pipefail
          DEV=6073580c0d5ebcce1b6669f531d7140c384a78d3
          MAIN=1c2b7d663d51d51aa45010e533d8e035e22adf59
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/qa/dev-prod-safe-reconcile-20261101
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$DEV"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN"
          git merge-base --is-ancestor "$DEV" "$GITHUB_SHA"
          printf '%s\n' '.github/workflows/hnl-dev-prod-reconcile-qa.yml' 'scripts/qa-dev-prod-conflict-resolve.py' > "$RUNNER_TEMP/allowed.txt"
          git diff --name-only "$DEV" HEAD > "$RUNNER_TEMP/actual.txt"
          diff -u "$RUNNER_TEMP/allowed.txt" "$RUNNER_TEMP/actual.txt"
          git config user.name "HNL-QA-Reconcile"
          git config user.email "qa-reconcile@users.noreply.github.com"
      - name: Three-way merge with all 11 intentional resolutions and no PROD writes
        shell: bash
        run: |
          set -euo pipefail
          DEV=6073580c0d5ebcce1b6669f531d7140c384a78d3
          MAIN=1c2b7d663d51d51aa45010e533d8e035e22adf59
          git fetch --no-tags origin main
          test "$(git rev-parse origin/main)" = "$MAIN"
          set +e
          git merge --no-commit --no-ff origin/main > "$RUNNER_TEMP/merge.log" 2>&1
          result=$?
          set -e
          test "$result" = 1 || { echo 'Expected reviewable conflicts; missing means drift'; cat "$RUNNER_TEMP/merge.log"; exit 1; }
          git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
          test "$(wc -l < "$RUNNER_TEMP/conflicts.txt" | tr -d ' ')" = 11
          python3 scripts/qa-dev-prod-conflict-resolve.py
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          test -z "$(git grep -l -e '^<<<<<<< ' -e '^>>>>>>> ' -- src scripts || true)"
          git diff --cached --check
          mkdir -p output
          cp "$RUNNER_TEMP/conflicts.txt" output/CONFLICT-RESOLUTION-11-FILES.txt
          git rm -f .github/workflows/hnl-dev-prod-reconcile-qa.yml scripts/qa-dev-prod-conflict-resolve.py
          git diff --cached --name-only > output/MERGE-CHANGED-FILES-RELATIVE-TO-QA.txt
          printf 'DEV=%s\nMAIN=%s\nNO_PROD_WRITES=true\nNO_DEV_DEPLOY=true\nSOURCE_SCOPE=DEV_LATEST_PLUS_PROD_HISTORY\n' "$DEV" "$MAIN" > output/SOURCE-PINS.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: npm ci / package lock identity / TypeScript / lint / Firestore Rules
        shell: bash
        run: |
          set -euo pipefail
          node -e "const a=require('./package.json'),b=require('./package-lock.json');if(a.version!==b.version||a.name!==b.name)process.exit(2)"
          npm ci
          npm run typecheck
          npm run lint
          npm run test:rules
      - name: Deep data, permissions, offline, Chat, warehouse, UI regression
        shell: bash
        run: |
          set -euo pipefail
          npm run test:firestore-restore-gate
          npm run test:stability
          npm run test:rbac
          npm run test:offline
      - name: Production-ready Web static build only (no deploy)
        shell: bash
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          # Do not build with PROD secrets; no Firebase SDK or deploy credentials supplied.
          echo 'QA reconcile: Web build completed without Firebase PROD credentials.'
      - name: Create reviewable local merge commit, source ZIP, patch ZIP (still NO PUSH)
        shell: bash
        run: |
          set -euo pipefail
          DEV=6073580c0d5ebcce1b6669f531d7140c384a78d3
          MAIN=1c2b7d663d51d51aa45010e533d8e035e22adf59
          git commit -m 'reconcile(dev): preserve DEV features while incorporating PROD fixes [CI staging only]'
          git diff --name-only "$DEV" HEAD > output/PATCH-CHANGED-FILES.txt
          test "$(git rev-list --parents -n1 HEAD | wc -w)" = 3
          git archive --format=zip --output=output/DEV-PROD-RECONCILED-FULL.zip HEAD
          git archive --format=zip --output=output/DEV-PROD-RECONCILED-PATCH.zip HEAD $(cat output/PATCH-CHANGED-FILES.txt)
          unzip -t output/DEV-PROD-RECONCILED-FULL.zip > "$RUNNER_TEMP/full-test.txt"
          unzip -t output/DEV-PROD-RECONCILED-PATCH.zip > "$RUNNER_TEMP/patch-test.txt"
          printf 'STAGED_LOCAL_MERGE_HEAD=%s\nDEV_PARENT=%s\nPROD_PARENT=%s\nPUSHED_TO_GITHUB=false\nDEPLOYED=false\n' "$(git rev-parse HEAD)" "$DEV" "$MAIN" >> output/SOURCE-PINS.txt
          sha256sum output/*.zip > output/SHA256SUMS.txt
          cat output/SOURCE-PINS.txt
      - name: Upload FULL/PATCH/audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNL-DEV-PROD-RECONCILED-CI-EVIDENCE-${{ github.sha }}
          path: output/**
          retention-days: 30
          if-no-files-found: warn
