name: P21.92 Chat client-first compatibility (OLD Rules, DEMO ONLY)
on:
  push:
    branches: [audit/p2192-chat-phased-compat-20261030]
    paths:
      - scripts/p2192-chat-new-client-old-rules.mjs
      - .github/workflows/p2192-chat-phased-compat.yml
permissions:
  contents: read
jobs:
  client_first_old_rules:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GCLOUD_PROJECT: demo-hnl-qltc-p2192
      FIREBASE_PROJECT_ID: demo-hnl-qltc-p2192
      FIRESTORE_EMULATOR_HOST: 127.0.0.1:8080
      FIREBASE_AUTH_EMULATOR_HOST: 127.0.0.1:9099
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Fail closed on unexpected refs or scope
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/audit/p2192-chat-phased-compat-20261030'
          test "$(git ls-remote origin refs/heads/release/prod-9-groups-no-auth-20261029 | cut -f1)" = 'ce6f4e586b70f76a6c94ab8ae4a966b8e841e2e0'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 'b2557860fbb3b128b5f2c9863e99d0f8b1f78686'
          test "$(git merge-base HEAD ce6f4e586b70f76a6c94ab8ae4a966b8e841e2e0)" = 'ce6f4e586b70f76a6c94ab8ae4a966b8e841e2e0'
          observed="$(git diff --name-only ce6f4e586b70f76a6c94ab8ae4a966b8e841e2e0 HEAD | sort)"
          expected="$(printf '%s\n' .github/workflows/p2192-chat-phased-compat.yml scripts/p2192-chat-new-client-old-rules.mjs | sort)"
          test "$observed" = "$expected"
          test "$GCLOUD_PROJECT" = demo-hnl-qltc-p2192
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned dependencies
        run: npm ci
      - name: Run OLD main Rules with NEW client batch in demo emulator
        shell: bash
        run: |
          set -euo pipefail
          git show b2557860fbb3b128b5f2c9863e99d0f8b1f78686:firestore.rules > .p2192-old.rules
          node -e "const fs=require('fs');const c=JSON.parse(fs.readFileSync('firebase.rules-ci.json'));c.firestore.rules='.p2192-old.rules';fs.writeFileSync('.p2192-old.firebase.json',JSON.stringify(c))"
          npx --yes firebase-tools@13.35.1 emulators:exec --config .p2192-old.firebase.json --only auth,firestore --project demo-hnl-qltc-p2192 "node scripts/p2192-chat-new-client-old-rules.mjs"
      - name: Preserve sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNL-P2192-CLIENT-FIRST-OLD-RULES
          path: evidence/P2192-CLIENT-FIRST-OLD-RULES.json
          if-no-files-found: warn
          retention-days: 30
