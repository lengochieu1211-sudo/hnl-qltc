name: RC2.2.16 R2 PROD Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc2216-r2-prod-once.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Require Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::MISSING_CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::MISSING_CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Verify exact RC2.2.16 Worker identity
        shell: bash
        run: |
          set -euo pipefail
          grep -F "GATEWAY_VERSION = '6.3.0-rc2.2.16'" cloudflare/r2-gateway/worker.js
          grep -F "'https://hnlqltc.web.app'" cloudflare/r2-gateway/worker.js
      - name: Deploy exact existing Worker and bucket
        working-directory: cloudflare/r2-gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.ci.toml <<'EOF'
          name = "hnl-qltc-r2-gateway"
          main = "worker.js"
          compatibility_date = "2026-08-30"

          [[r2_buckets]]
          binding = "HNL_QLTC_MEDIA"
          bucket_name = "hnl-qltc-media"

          [vars]
          FIREBASE_PROJECT_ID = "com-example-qlct-61329"
          SUPER_ADMIN_EMAIL = "lengochieu1211@gmail.com"
          ALLOWED_ORIGINS = "https://hnlqltc.web.app,https://com-example-qlct-61329.web.app,https://com-example-qlct-61329.firebaseapp.com"
          MAX_UPLOAD_BYTES = "26214400"
          EOF
          trap 'rm -f wrangler.ci.toml' EXIT
          npx --yes wrangler@4.33.0 deploy --config wrangler.ci.toml
      - name: Certify health and browser PUT CORS
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev'
          curl --fail --silent --show-error --retry 5 --retry-delay 2 "$BASE/health" | tee /tmp/health.json
          grep -q '"version":"6.3.0-rc2.2.16"' /tmp/health.json
          grep -q '"accessPolicy":"canonical-email-first"' /tmp/health.json
          curl --fail --silent --show-error -X OPTIONS -D /tmp/cors.headers -o /tmp/cors.body \
            -H 'Origin: https://hnlqltc.web.app' \
            -H 'Access-Control-Request-Method: PUT' \
            -H 'Access-Control-Request-Headers: authorization,content-type,x-hnl-metadata' \
            "$BASE/v1/object?key=projects/cors-probe/media/diagnostics/probe/original.jpg"
          cat /tmp/cors.headers
          grep -qi '^access-control-allow-origin: https://hnlqltc.web.app' /tmp/cors.headers
          grep -qi '^access-control-allow-methods:.*PUT' /tmp/cors.headers
          grep -qi '^access-control-allow-headers:.*Authorization' /tmp/cors.headers
          grep -qi '^access-control-allow-headers:.*X-HNL-Metadata' /tmp/cors.headers
