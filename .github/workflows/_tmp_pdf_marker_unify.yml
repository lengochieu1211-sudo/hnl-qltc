name: TEMP PDF Marker Unify Certification

on:
  push:
    branches:
      - fix/pdf-marker-legend-defect-sort-unify

permissions:
  contents: write

jobs:
  certify-and-materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/pdf-marker-legend-defect-sort-unify
          fetch-depth: 0

      - name: Apply source patch
        run: python3 scripts/_tmp_apply_pdf_marker_unify.py

      - name: Verify patch scope
        shell: bash
        run: |
          git diff --check
          git status --short
          git diff -- src/components/ExportPdfModal.tsx src/components/GoogleAuthHeader.tsx

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stability Gate
        run: npm run test:stability

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Firebase Rules + emulator
        run: npm run test:rules

      - name: Security audit
        run: npm run security:audit

      - name: Production build
        run: npm run build

      - name: Materialize certified source and remove temporary files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f scripts/_tmp_apply_pdf_marker_unify.py .github/workflows/_tmp_pdf_marker_unify.yml
          git add src/components/ExportPdfModal.tsx src/components/GoogleAuthHeader.tsx
          git add -u scripts/_tmp_apply_pdf_marker_unify.py .github/workflows/_tmp_pdf_marker_unify.yml
          git diff --cached --check
          git commit -m "fix: unify PDF markers sorting and compact project header"
          git push origin HEAD:fix/pdf-marker-legend-defect-sort-unify
