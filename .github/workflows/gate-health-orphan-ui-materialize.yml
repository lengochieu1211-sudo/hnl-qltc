name: Gate Unified Health Center And Orphan Safe AI

on:
  push:
    branches:
      - gate/ai-health-counter-20260909

permissions:
  contents: write

jobs:
  materialize_verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated gate branch
        uses: actions/checkout@v4
        with:
          ref: gate/ai-health-counter-20260909
          fetch-depth: 0

      - name: Baseline guard
        shell: bash
        run: git merge-base --is-ancestor e9b28283560fe7600879a7b983032ef4f45c6cc0 HEAD

      - name: Apply source patch
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          root = Path('.')

          # 1) External AI: active work-category registry + orphan fail-closed filtering.
          p = root / 'src/ai/data/externalAiContext.ts'
          s = p.read_text(encoding='utf-8')
          marker = "function sameCategory(categoryName: string, categoryId: string, subItem: { category?: string; workCategoryId?: string }): boolean {"
          if 'function buildWorkCategoryResolver(' not in s:
              i = s.index(marker)
              helper = '''interface ActiveWorkCategoryRef {
            workCategoryId: string;
            workCategory: string;
          }

          function buildWorkCategoryResolver(snapshot: HnlAiProjectSnapshot) {
            const byId = new Map<string, ActiveWorkCategoryRef>();
            const byName = new Map<string, ActiveWorkCategoryRef>();
            for (const item of active(snapshot.workVolumes)) {
              const canonicalId = String(item.workCategoryId || item.id || '').trim();
              const canonicalName = safeText(item.title || '').trim();
              if (!canonicalId && !canonicalName) continue;
              const ref = { workCategoryId: canonicalId, workCategory: canonicalName };
              for (const id of [item.id, item.workCategoryId]) {
                const normalizedId = String(id || '').trim();
                if (normalizedId) byId.set(normalizedId, ref);
              }
              const normalizedName = normalizedText(canonicalName);
              if (normalizedName) byName.set(normalizedName, ref);
            }
            return (workCategoryId?: string, workCategoryName?: string): ActiveWorkCategoryRef | null => {
              const id = String(workCategoryId || '').trim();
              const suppliedName = safeText(workCategoryName || '').trim();
              if (id && byId.has(id)) {
                const ref = byId.get(id)!;
                return { ...ref, workCategory: suppliedName || ref.workCategory };
              }
              const name = normalizedText(suppliedName);
              if (name && byName.has(name)) return byName.get(name)!;
              return null;
            };
          }

          function collectOrphanWorkCategoryRefs(snapshot: HnlAiProjectSnapshot) {
            const resolveCategory = buildWorkCategoryResolver(snapshot);
            const refs = new Set<string>();
            const add = (source: string, ownerId: string, workCategoryId?: string, workCategoryName?: string) => {
              const id = String(workCategoryId || '').trim();
              const name = safeText(workCategoryName || '').trim();
              if ((!id && !name) || resolveCategory(id, name)) return;
              refs.add(`${source}:${ownerId}:${id || normalizedText(name)}`);
            };
            for (const room of active(snapshot.rooms)) {
              if ((Number(room.workVolume) || 0) > 0 || room.workCategoryId || room.workCategory) add('room', room.id, room.workCategoryId, room.workCategory);
              for (const [raw, volume] of Object.entries(room.categoryVolumes || {})) {
                if ((Number(volume) || 0) > 0) add('room-category', room.id, undefined, raw);
              }
              for (const sub of room.subItems || []) {
                if (sub.workCategoryId || sub.category) add('sub-item', `${room.id}:${sub.id || ''}`, sub.workCategoryId, sub.category);
              }
            }
            return refs;
          }

          '''.replace('          ', '')
              s = s[:i] + helper + s[i:]

          s = s.replace(
              "  const resolveFloor = buildFloorResolver(snapshot);\n\n  for (const room of active(snapshot.rooms)) {\n    const roomTeam = resolveTeam(room.teamId, room.assignedTeam);",
              "  const resolveFloor = buildFloorResolver(snapshot);\n  const resolveCategory = buildWorkCategoryResolver(snapshot);\n\n  for (const room of active(snapshot.rooms)) {\n    const roomTeam = resolveTeam(room.teamId, room.assignedTeam);\n    const roomCategory = resolveCategory(room.workCategoryId, room.workCategory);",
              1,
          )
          s = s.replace("      workCategoryId: room.workCategoryId || '',\n      workCategory: safeText(room.workCategory || ''),", "      workCategoryId: roomCategory?.workCategoryId || '',\n      workCategory: roomCategory?.workCategory || '',", 1)

          start = s.index('    if (categoryEntries.length > 0) {')
          end = s.index('    const subRows =', start)
          s = s[:start] + '''    if (categoryEntries.length > 0) {
            for (const [category, value] of categoryEntries) {
              const categoryName = safeText(category || base.workCategory);
              const relatedSubItems = (room.subItems || []).filter((item) => sameCategory(categoryName, base.workCategoryId, item));
              const relatedCategoryRefs = Array.from(new Map(
                relatedSubItems
                  .map((item) => resolveCategory(item.workCategoryId, item.category))
                  .filter((ref): ref is ActiveWorkCategoryRef => Boolean(ref))
                  .map((ref) => [`${ref.workCategoryId}|${normalizedText(ref.workCategory)}`, ref] as const),
              ).values());
              const categoryRef = resolveCategory(undefined, categoryName)
                || (relatedCategoryRefs.length === 1 ? relatedCategoryRefs[0] : null);
              if (!categoryRef) continue;
              const relatedTeams = Array.from(new Map(
                relatedSubItems
                  .map((item) => resolveTeam(item.teamId, item.assignedTeam))
                  .filter((team) => team.teamId || team.teamName)
                  .map((team) => [`${team.teamId}|${normalizedText(team.teamName)}`, team] as const),
              ).values());
              const categoryTeam = relatedTeams.length === 1 ? relatedTeams[0] : roomTeam;
              result.push({
                source: 'room-category',
                ...base,
                teamId: categoryTeam.teamId,
                teamName: categoryTeam.teamName,
                workCategoryId: categoryRef.workCategoryId,
                workCategory: categoryRef.workCategory,
                item: categoryRef.workCategory || room.roomName,
                volume: Number(value),
                unit: safeText(room.categoryVolumeUnits?.[category] || room.volumeUnit || ''),
                status: room.inspectionStatus || '',
              });
            }
            continue;
          }

          '''.replace('          ', '') + s[end:]

          start = s.index('    const subRows =')
          end = s.index('    const roomVolume =', start)
          s = s[:start] + '''    const subRows = (room.subItems || []).filter((item) => finiteNumber(item.workVolume) !== null);
            if (subRows.length > 0) {
              for (const item of subRows) {
                const itemTeam = resolveTeam(item.teamId || base.teamId, item.assignedTeam || base.teamName);
                const categoryRef = resolveCategory(item.workCategoryId || base.workCategoryId, item.category || base.workCategory);
                if (!categoryRef) continue;
                result.push({
                  source: 'sub-item',
                  ...base,
                  teamId: itemTeam.teamId,
                  teamName: itemTeam.teamName,
                  workCategoryId: categoryRef.workCategoryId,
                  workCategory: categoryRef.workCategory,
                  item: safeText(item.name || categoryRef.workCategory),
                  volume: Number(item.workVolume),
                  unit: safeText(item.volumeUnit || room.volumeUnit || ''),
                  status: item.status || '',
                });
              }
              continue;
            }

          '''.replace('          ', '') + s[end:]
          s = s.replace("    if (roomVolume !== null) {\n      result.push({\n        source: 'room-total',\n        ...base,\n        item: safeText(base.workCategory || room.roomName),", "    if (roomVolume !== null && roomCategory) {\n      result.push({\n        source: 'room-total',\n        ...base,\n        workCategoryId: roomCategory.workCategoryId,\n        workCategory: roomCategory.workCategory,\n        item: roomCategory.workCategory || room.roomName,", 1)

          start = s.index('function rawRoomRows(')
          end = s.index('\nfunction rawCrewRows', start)
          raw_room = '''function rawRoomRows(snapshot: HnlAiProjectSnapshot, targets: Array<{ id: string; name: string }>) {
            const resolveFloor = buildFloorResolver(snapshot);
            const resolveCategory = buildWorkCategoryResolver(snapshot);
            return active(snapshot.rooms)
              .map((room) => {
                const roomCategory = resolveCategory(room.workCategoryId, room.workCategory);
                const roomHasExplicitCategory = Boolean(String(room.workCategoryId || '').trim() || String(room.workCategory || '').trim());
                return {
                  id: room.id,
                  floorId: room.floorId || '',
                  floorName: resolveFloor(room.floorId, room.floorName),
                  roomName: safeText(room.roomName),
                  workCategoryId: roomCategory?.workCategoryId || '',
                  workCategory: roomCategory?.workCategory || '',
                  orphanWorkCategory: roomHasExplicitCategory && !roomCategory,
                  teamId: room.teamId || '',
                  assignedTeam: safeText(room.assignedTeam || ''),
                  inspectionStatus: room.inspectionStatus,
                  frameStatus: room.frameStatus,
                  boardStatus: room.boardStatus,
                  targetFrameDate: room.targetFrameDate || '',
                  targetBoardDate: room.targetBoardDate || '',
                  subItems: (room.subItems || []).slice(0, MAX_SUBITEMS_PER_ROOM).map((item) => {
                    const itemCategory = resolveCategory(item.workCategoryId, item.category);
                    const itemHasExplicitCategory = Boolean(String(item.workCategoryId || '').trim() || String(item.category || '').trim());
                    return {
                      id: item.id,
                      name: safeText(item.name),
                      category: itemCategory?.workCategory || '',
                      workCategoryId: itemCategory?.workCategoryId || '',
                      orphanWorkCategory: itemHasExplicitCategory && !itemCategory,
                      teamId: item.teamId || '',
                      assignedTeam: safeText(item.assignedTeam || ''),
                      workVolume: itemCategory ? finiteNumber(item.workVolume) : null,
                      volumeUnit: itemCategory ? safeText(item.volumeUnit || '') : '',
                      status: item.status,
                      inspectionStatus: item.inspectionStatus || '',
                      targetDate: item.targetDate || '',
                    };
                  }),
                };
              })
              .filter((room) => targets.length === 0 || isTeamMatch(room, targets) || room.subItems.some((item) => isTeamMatch(item, targets)));
          }
          '''.replace('          ', '')
          s = s[:start] + raw_room + s[end:]

          result_marker = "    privacy: 'read-only sanitized HNL project context; credentials/contact data excluded',\n  };"
          if 'omittedOrphanWorkCategoryRefs' not in s:
              replacement = result_marker + "\n  const orphanWorkCategoryRefs = collectOrphanWorkCategoryRefs(snapshot);\n  if (orphanWorkCategoryRefs.size > 0) {\n    result.dataQuality = {\n      omittedOrphanWorkCategoryRefs: orphanWorkCategoryRefs.size,\n      policy: 'Stale/deleted work-category references are excluded from active AI quantity/progress facts. Review them in HNL Health Center; never infer or auto-delete.',\n    };\n  }"
              if result_marker not in s: raise SystemExit('external result marker missing')
              s = s.replace(result_marker, replacement, 1)
          grounding = "    grounding: 'Every numeric conclusion must be traceable to supplied rows and preserve team/floor/category/item/date/unit scope.',"
          if 'orphanReferences:' not in s:
              s = s.replace(grounding, grounding + "\n    orphanReferences: 'Stale/deleted work-category references are omitted from active facts. Never restore, count, relink or delete them from AI output; direct users to HNL Health Center for confirmation.',", 1)
          p.write_text(s, encoding='utf-8')

          # 2) App: canonical room deep-link maps to Floorplan.
          p = root / 'src/App.tsx'; s = p.read_text(encoding='utf-8')
          old = "        : detail.entityType === 'defect'\n          ? 'floorplan'"
          new = "        : detail.entityType === 'defect' || detail.entityType === 'room' || detail.entityType === 'floor'\n          ? 'floorplan'"
          if old not in s and new not in s: raise SystemExit('App diagnostic tab marker missing')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # 3) Health Center wrapper: true room navigation, no DOM-text click hack.
          p = root / 'src/healthCenter/HealthCenterPanel.tsx'; s = p.read_text(encoding='utf-8')
          if 'function openRoomCardAfterTabSwitch' in s:
              a = s.index('function openRoomCardAfterTabSwitch')
              b = s.index('export const HealthCenterPanel', a)
              s = s[:a] + s[b:]
          room_block = re.compile(r"    if \(request\.entityType === 'room' && request\.floorId && request\.roomName\) \{.*?\n    \}\n", re.S)
          replacement = """    if (request.entityType === 'room') {
              try { sessionStorage.setItem('qlct_diagnostic_navigation_request', JSON.stringify(request)); } catch (_) {}
              window.dispatchEvent(new CustomEvent('qlct-diagnostic-open-entity', { detail: request }));
              return true;
            }
          """.replace('          ', '')
          s, n = room_block.subn(replacement, s, count=1)
          if n != 1: raise SystemExit(f'Health room navigate block count={n}')
          s = s.replace("if (!button || !/Xem bản ghi/i.test(String(button.textContent || ''))) return;", "if (!button || !/(Xem bản ghi|Xử lý)/i.test(String(button.textContent || ''))) return;", 1)
          p.write_text(s, encoding='utf-8')

          # 4) Floorplan consumes exact roomId from Health Center and opens edit modal.
          p = root / 'src/components/FloorPlanDefectTab.tsx'; s = p.read_text(encoding='utf-8')
          if 'HEALTH_CENTER_ROOM_OPEN' not in s:
              marker = '  const fitFloorPlan = () => {'
              i = s.index(marker)
              effect = '''  useEffect(() => {
                const consumeHealthCenterRoom = (request: any, source: 'storage' | 'event') => {
                  if (!request || request.entityType !== 'room') return false;
                  if (request.projectId && request.projectId !== currentProjectId) return false;
                  const roomId = String(request.entityId || request.roomId || '').trim();
                  if (!roomId) return false;
                  const room = roomProgressList.find((item) => item.id === roomId);
                  if (!room) return false;
                  const floorId = room.floorId || String(request.floorId || '').trim();
                  setViewMode('highlight');
                  if (floorId && floorId !== selectedFloorId) setSelectedFloorId(floorId);
                  setSelectedRoomForEdit(room);
                  setNewRoomClickPos(undefined);
                  setNewRoomRect(undefined);
                  setNewRoomPoints(undefined);
                  setIsRoomModalOpen(true);
                  try { sessionStorage.removeItem('qlct_diagnostic_navigation_request'); } catch (_) {}
                  appendRuntimeDiagnostic({
                    level: 'info', area: 'health-center-navigation', projectId: currentProjectId,
                    code: 'HEALTH_CENTER_ROOM_OPEN', message: `source=${source} room=${room.id} floor=${floorId}`,
                  });
                  requestAnimationFrame(() => requestAnimationFrame(() => focusPlanPoint(room.x + room.width / 2, room.y + room.height / 2, false)));
                  return true;
                };

                try {
                  const raw = sessionStorage.getItem('qlct_diagnostic_navigation_request');
                  if (raw) consumeHealthCenterRoom(JSON.parse(raw), 'storage');
                } catch (_) {}
                const onOpenEntity = (event: Event) => consumeHealthCenterRoom((event as CustomEvent<any>).detail, 'event');
                window.addEventListener('qlct-diagnostic-open-entity', onOpenEntity as EventListener);
                return () => window.removeEventListener('qlct-diagnostic-open-entity', onOpenEntity as EventListener);
              }, [currentProjectId, roomProgressList, selectedFloorId]);

          '''.replace('          ', '')
              s = s[:i] + effect + s[i:]
          p.write_text(s, encoding='utf-8')

          # 5) Health Center issue CTA: orphan room becomes explicit Xử lý.
          p = root / 'src/healthCenter/HealthCenterPanelBase.tsx'; s = p.read_text(encoding='utf-8')
          old = '<ExternalLink className="h-3 w-3" /> Xem bản ghi</button>'
          new = '<ExternalLink className="h-3 w-3" /> {issue.ruleId === \'ROOM_ORPHAN_WORK_CATEGORY_REFERENCE\' && userRole === \'ADMIN\' ? \'Xử lý\' : \'Xem bản ghi\'}</button>'
          if old not in s and new not in s: raise SystemExit('Health CTA marker missing')
          s = s.replace(old, new, 1)
          s = s.replace('<ShieldCheck className="h-4 w-4 text-emerald-600" /> HNL Health Center</div>\n        <div className="mt-1 text-[10px] font-semibold text-slate-500">Hệ thống · Chẩn đoán · Audit dữ liệu · một nguồn kết quả duy nhất</div>', '<ShieldCheck className="h-4 w-4 text-emerald-600" /> Audit dữ liệu & liên kết</div>\n        <div className="mt-1 text-[10px] font-semibold text-slate-500">Phát hiện orphan · mở đúng bản ghi · sửa có xác nhận · không tự xóa lịch sử</div>', 1)
          p.write_text(s, encoding='utf-8')

          # 6) Google Config: one compact HNL Health Center section, diagnostics nested as system status.
          p = root / 'src/components/GoogleConfigTab.tsx'; s = p.read_text(encoding='utf-8')
          s = s.replace('<ShieldCheck className="h-4 w-4 text-emerald-600" /> Hệ thống & Chẩn đoán', '<ShieldCheck className="h-4 w-4 text-emerald-600" /> HNL Health Center', 1)
          s = s.replace('Nhấn để mở trạng thái đồng bộ, ảnh và công cụ chẩn đoán.', 'Hệ thống · đồng bộ · ảnh · audit dữ liệu · xử lý liên kết trong một nơi.', 1)
          s = s.replace('<ShieldCheck className="w-4 h-4 text-emerald-600" /> Hệ thống & Chẩn đoán', '<ShieldCheck className="w-4 h-4 text-emerald-600" /> Trạng thái hệ thống & đồng bộ', 1)
          p.write_text(s, encoding='utf-8')

          # 7) Focused regression tests.
          p = root / 'scripts/ai-external-context-golden.ts'; s = p.read_text(encoding='utf-8')
          if 'orphanCategoryLabel' not in s:
              marker = "const payload = buildExternalAiQuestionPayload(\n"
              i = s.index(marker)
              test = '''// Deleted/orphan work-category labels must not leak into active AI facts or whole-project prompts.
              const orphanCategoryLabel = 'Trần Thạch Cao Khung Chìm Tấm Tiêu Chuẩn';
              const orphanSnapshot = {
                ...snapshot,
                rooms: [
                  { ...manyRooms[0], id: 'valid-room', workVolume: 10 },
                  { id: 'orphan-room', roomName: 'Quầy A4', floorId: 'f1', floorName: '', teamId: 'team-nguyen', assignedTeam: 'Đội Nguyên', categoryVolumes: { [orphanCategoryLabel]: 76.58 }, categoryVolumeUnits: { [orphanCategoryLabel]: 'm2' }, inspectionStatus: 'Chưa nghiệm thu', frameStatus: 'Đang làm', boardStatus: 'Đang làm', updatedAt: 2, subItems: [] },
                ],
              } as any;
              const orphanContext = buildExternalAiProjectContext(orphanSnapshot, { progress: true, quantities: true, defects: false, crew: false, inventory: false, checklist: false }) as any;
              assert.equal(orphanContext.dataQuality.omittedOrphanWorkCategoryRefs, 1);
              assert.equal(JSON.stringify(orphanContext.quantityDetails).includes(orphanCategoryLabel), false);
              assert.equal(JSON.stringify(orphanContext.quantitySummaryByTeamAndCategory).includes(orphanCategoryLabel), false);
              const orphanPayload = buildExternalAiQuestionPayload('Có bao nhiêu đội thi công và khối lượng hạng mục như nào?', orphanSnapshot, { progress: true, quantities: true, defects: false, crew: false, inventory: false, checklist: false }, { fullProjectRaw: true });
              assert.equal(orphanPayload.includes(orphanCategoryLabel), false, 'orphan category label must not leak into AI prompt');
              assert.match(orphanPayload, /omittedOrphanWorkCategoryRefs/);
              assert.match(orphanPayload, /Health Center/);

              '''.replace('              ', '')
              s = s[:i] + test + s[i:]
          p.write_text(s, encoding='utf-8')

          p = root / 'scripts/health-center-navigation-golden.ts'; s = p.read_text(encoding='utf-8')
          if "HEALTH_CENTER_ROOM_OPEN" not in s:
              s = s.replace("import assert from 'node:assert/strict';", "import assert from 'node:assert/strict';\nimport fs from 'node:fs';", 1)
              s = s.replace("console.log('health-center-navigation-golden: PASS');", "const appSource = fs.readFileSync('src/App.tsx', 'utf8');\nconst panelSource = fs.readFileSync('src/healthCenter/HealthCenterPanel.tsx', 'utf8');\nconst floorSource = fs.readFileSync('src/components/FloorPlanDefectTab.tsx', 'utf8');\nconst configSource = fs.readFileSync('src/components/GoogleConfigTab.tsx', 'utf8');\nassert.match(appSource, /entityType === 'room'.*'floorplan'/s, 'App must map room diagnostic navigation to Floorplan');\nassert.match(panelSource, /entityType === 'room'[\\s\\S]*qlct_diagnostic_navigation_request[\\s\\S]*qlct-diagnostic-open-entity/, 'Health Center must dispatch canonical room navigation');\nassert.match(floorSource, /HEALTH_CENTER_ROOM_OPEN/, 'Floorplan must consume exact Health Center room deep-link');\nassert.match(configSource, /HNL Health Center/);\nassert.match(configSource, /Trạng thái hệ thống & đồng bộ/);\nconsole.log('health-center-navigation-golden: PASS');", 1)
          p.write_text(s, encoding='utf-8')

          p = root / 'scripts/ai-audit-golden.ts'; s = p.read_text(encoding='utf-8')
          if 'health-center:review' not in s:
              s = s.replace("import { auditProjectIntegrity } from '../src/ai/audit/projectAudit';", "import { auditProjectIntegrity } from '../src/ai/audit/projectAudit';\nimport { auditProjectViaHealthCenter } from '../src/ai/audit/healthCenterAiAudit';\nimport { buildHealthCenterReport } from '../src/healthCenter/healthCenterEngine';", 1)
              marker = 'const projectAudit = auditProjectIntegrity({ context, snapshot });\n'
              test = "const healthReport = buildHealthCenterReport({ context, snapshot });\nconst healthAi = auditProjectViaHealthCenter({ context, snapshot });\nconst reviewFact = healthAi.facts.find((fact) => fact.id === 'health-center:review');\nassert.ok(reviewFact);\nassert.equal(reviewFact!.value, healthReport.needsConfirmationCount, 'AI review fact must use NEEDS_CONFIRMATION action class');\n"
              if marker not in s: raise SystemExit('AI audit marker missing')
              s = s.replace(marker, test + marker, 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Focused regression gates
        run: |
          npm run test:ai-external-context
          npm run test:ai-audit
          npm run test:health-center

      - name: Full verification
        run: npm run verify

      - name: Commit candidate changes only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ai/data/externalAiContext.ts src/App.tsx src/healthCenter/HealthCenterPanel.tsx src/components/FloorPlanDefectTab.tsx src/healthCenter/HealthCenterPanelBase.tsx src/components/GoogleConfigTab.tsx scripts/ai-external-context-golden.ts scripts/health-center-navigation-golden.ts scripts/ai-audit-golden.ts
          git diff --cached --quiet && exit 0
          git commit -m "fix: unify Health Center and block orphan AI facts"
          git push origin HEAD:gate/ai-health-counter-20260909
