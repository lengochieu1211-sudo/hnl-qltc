name: RC2.2.8 Firebase App ID Evidence
on:
  push:
    branches:
      - rc2-2-8-prod-release-evidence
    paths:
      - '.github/workflows/rc2-2-8-firebase-appid-evidence.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Read public Firebase Hosting init config
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS -H 'Cache-Control: no-cache' https://hnlqltc.web.app/__/firebase/init.json -o /tmp/init.json
          node -e "const fs=require('fs');const x=JSON.parse(fs.readFileSync('/tmp/init.json','utf8')); console.log('projectId='+x.projectId); console.log('appId='+x.appId); console.log('authDomain='+x.authDomain); console.log('storageBucket='+x.storageBucket); if(x.projectId!=='com-example-qlct-61329') process.exit(2); if(!/^1:119152410850:web:/.test(x.appId||'')) process.exit(3);"
