name: TEMP Apply Material Sort Golden

on:
  push:
    branches: [dev]
    paths:
      - .github/workflows/tmp-material-sort-golden-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dev
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Update Material Need quick-sort regression contract
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/ui-entry-ux-golden.ts')
          s = p.read_text()
          old = '''assert(warehouse.includes('<QuickSortBar') && warehouse.includes("{ key: 'date', label: 'Ngày', kind: 'date', defaultOrder: 'desc' }") && warehouse.includes("{ key: 'material', label: 'Vật tư', kind: 'alpha' }") && warehouse.includes("{ key: 'location', label: 'Vị trí / Tầng', kind: 'alpha' }") && warehouse.includes("{ key: 'handler', label: 'Người thực hiện', kind: 'alpha' }") && warehouse.includes("setMaterialNeedSortBy('date'); setMaterialNeedSortOrder('desc')"), 'Material Need must reuse the common Warehouse QuickSortBar: Ngày · Vật tư · Vị trí/Tầng · Người thực hiện · Mới nhất · Mặc định');'''
          new = '''assert(warehouse.includes('<QuickSortBar') && warehouse.includes("{ key: 'material', label: 'Vật tư', kind: 'alpha', defaultOrder: 'asc' }") && warehouse.includes("{ key: 'category', label: 'Nhóm vật tư', kind: 'alpha', defaultOrder: 'asc' }") && warehouse.includes("{ key: 'remaining', label: 'Còn cần', kind: 'number', defaultOrder: 'desc' }") && warehouse.includes("{ key: 'deficit', label: 'Thiếu', kind: 'number', defaultOrder: 'desc' }") && warehouse.includes("{ key: 'stock', label: 'Tồn kho', kind: 'number', defaultOrder: 'desc' }") && warehouse.includes("setMaterialNeedSortBy('default'); setMaterialNeedSortOrder('asc')"), 'Material Need QuickSortBar must use intrinsic need-line semantics: Vật tư · Nhóm vật tư · Còn cần · Thiếu · Tồn kho · Mặc định');
assert(!warehouse.includes("{ key: 'date', label: 'Ngày', kind: 'date'") && !warehouse.includes("{ key: 'location', label: 'Vị trí / Tầng', kind: 'alpha' }") && !warehouse.includes("{ key: 'handler', label: 'Người thực hiện', kind: 'alpha' }"), 'Material Need must not sort aggregate need rows by unrelated warehouse transaction date/location/handler metadata');'''
          if old not in s:
              raise SystemExit('Old Material Need quick-sort regression assertion not found')
          p.write_text(s.replace(old, new))
          PY
          git diff --check
      - name: Install exact dependencies
        run: npm ci
      - name: Material Need UI golden
        run: npm run test:ui-entry-ux
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Commit regression update to DEV
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ui-entry-ux-golden.ts
          git commit -m "test(dev): align material need sort regression contract"
          git push origin HEAD:dev
