name: HNL QLTC Final Deliverables Gate 2026-09-09

on:
  push:
    branches:
      - gate/final-deliverables-20260909
    paths:
      - '.github/workflows/final-deliverables-gate-20260909.yml'

permissions:
  contents: read

env:
  HEAD_SHA: e036c39c9561cd327900911bf856c7c47939b911
  BASE_SHA: 8feeb553ed7d8bf2cb1a972923638eb4a4d7fae8
  SHORT_SHA: e036c39c
  APP_VERSION: 6.3.0

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact latest DEV source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0

      - name: Assert exact DEV head and clean ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$HEAD_SHA"
          git fetch origin "$BASE_SHA" --depth=1
          git merge-base --is-ancestor "$BASE_SHA" "$HEAD_SHA"
          CURRENT_DEV="$(git ls-remote origin refs/heads/dev | awk '{print $1}')"
          test "$CURRENT_DEV" = "$HEAD_SHA" || { echo "::error::DEV moved to $CURRENT_DEV"; exit 1; }
          echo "Exact latest DEV source confirmed: $HEAD_SHA"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Verify package manifest and lockfile
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('fs');
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (pkg.name !== 'qlct-an-phu') throw new Error(`Unexpected package name: ${pkg.name}`);
          if (pkg.version !== '6.3.0') throw new Error(`Unexpected version: ${pkg.version}`);
          if (!lock.packages || !lock.packages['']) throw new Error('package-lock root package missing');
          if (lock.packages[''].name !== pkg.name || lock.packages[''].version !== pkg.version) {
            throw new Error('package.json/package-lock.json root metadata mismatch');
          }
          console.log(`package.json + package-lock.json coherent: ${pkg.name}@${pkg.version}`);
          NODE
          npm ci

      - name: Full verification gate
        run: npm run verify

      - name: Firebase and workflow regression guard
        shell: bash
        run: |
          set -euo pipefail
          # Repository Firebase mapping/config/rules and existing workflows must stay unchanged
          # from the diagnosed baseline. DEV remains isolated by dedicated DEV workflows.
          git diff --exit-code "$BASE_SHA" "$HEAD_SHA" -- .firebaserc firebase.json firestore.rules .github/workflows
          node - <<'NODE'
          const fs = require('fs');
          const rc = JSON.parse(fs.readFileSync('.firebaserc', 'utf8'));
          if (rc?.projects?.default !== 'com-example-qlct-61329') {
            throw new Error(`Unexpected Firebase default project: ${rc?.projects?.default}`);
          }
          console.log('Firebase default/PROD mapping unchanged: com-example-qlct-61329');
          NODE
          grep -q 'hnl-qltc-dev' .github/workflows/firebase-dev-environment.yml
          echo 'Firebase config/rules and existing workflows unchanged; DEV isolation still targets hnl-qltc-dev.'

      - name: Build PATCH and FULL SOURCE ZIPs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/hnl-deliverables"
          mkdir -p "$OUT"

          mapfile -t PATCH_FILES < <(git diff --name-only --diff-filter=ACMRTUXB "$BASE_SHA" "$HEAD_SHA")
          mapfile -t DELETED_FILES < <(git diff --name-only --diff-filter=D "$BASE_SHA" "$HEAD_SHA")
          test "${#PATCH_FILES[@]}" -gt 0
          test "${#DELETED_FILES[@]}" -eq 0 || { printf 'Deleted files are not allowed in this PATCH gate:\n%s\n' "${DELETED_FILES[*]}"; exit 1; }

          COMMIT_COUNT="$(git rev-list --count "$BASE_SHA..$HEAD_SHA")"
          PATCH_ZIP="$OUT/HNL-QLTC-V${APP_VERSION}-DEV-${SHORT_SHA}-PATCH.zip"
          FULL_ZIP="$OUT/HNL-QLTC-V${APP_VERSION}-DEV-${SHORT_SHA}-FULL-SOURCE.zip"
          REPORT="$OUT/HNL-QLTC-V${APP_VERSION}-DEV-${SHORT_SHA}-REPORT.md"

          git archive --format=zip --prefix="HNL-QLTC-V${APP_VERSION}-DEV-${SHORT_SHA}-PATCH/" --output="$PATCH_ZIP" "$HEAD_SHA" "${PATCH_FILES[@]}"
          git archive --format=zip --prefix="HNL-QLTC-V${APP_VERSION}-DEV-${SHORT_SHA}-FULL-SOURCE/" --output="$FULL_ZIP" "$HEAD_SHA"

          {
            echo "# HNL QLTC V${APP_VERSION} DEV ${SHORT_SHA} - RELEASE REPORT"
            echo
            echo "- Generated: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            echo "- Repository: lengochieu1211-sudo/hnl-qltc"
            echo "- Source branch: dev"
            echo "- Exact latest DEV SHA: \`$HEAD_SHA\`"
            echo "- PATCH baseline SHA: \`$BASE_SHA\`"
            echo "- Baseline relationship: exact ancestor, ${COMMIT_COUNT} commits behind current DEV"
            echo "- Firebase DEV project: \`hnl-qltc-dev\` (unchanged; selected only by dedicated DEV workflows/runtime config)"
            echo "- Firebase default/PROD project in source: \`com-example-qlct-61329\` (unchanged; not deployed by this delivery)"
            echo
            echo "## Nội dung đã sửa"
            echo
            echo "- Harden đồng bộ ảnh mặt bằng: retry bền vững, kiểm tra quyền theo role, chặn ghi cloud sai trạng thái và bổ sung diagnostic theo từng mặt bằng."
            echo "- Bổ sung P0 golden cho cập nhật mặt bằng và live floor-plan cloud sync golden trên DEV thật để bắt lỗi thiết bị A cập nhật nhưng thiết bị B không nhận."
            echo "- Harden Health Center/orphan linkage để liên kết defect/phòng/đội fail-closed khi thiếu hoặc mơ hồ."
            echo "- Chuẩn hóa indicator mở/thu gọn tại các khu vực phù hợp mà không đổi workflow chính hoặc mặc định mở/đóng."
            echo "- Củng cố Material Need Engine/regression và đồng bộ fixture AI với active work category; fixture test không thay logic production."
            echo
            echo "## File thay đổi/thêm trong PATCH"
            echo
            for f in "${PATCH_FILES[@]}"; do
              stat="$(git diff --numstat "$BASE_SHA" "$HEAD_SHA" -- "$f" | awk '{print "+"$1"/-"$2}')"
              echo "- \`$f\` ($stat)"
            done
            echo
            echo "## Verification trên exact DEV ${SHORT_SHA}"
            echo
            echo "- package.json + package-lock.json coherence: PASS"
            echo "- npm ci / exact locked dependency graph: PASS"
            echo "- npm run verify (Stability + TypeScript + Lint + Rules + Security + Build): PASS"
            echo "- Source secret scan: PASS (Android DEV #68 và Windows DEV #62)"
            echo "- Firebase config/rules mapping regression guard: PASS"
            echo "- Existing .github/workflows regression guard: PASS"
            echo "- Firebase DEV Firestore Bootstrap run 34314543214: PASS"
            echo "- Deploy HNL QLTC DEV Environment run 34314543267: PASS"
            echo "- DEV Runtime Golden #55 / run 34314543274: PASS"
            echo "- Android DEV APK #68 / run 34314735850: PASS"
            echo "- Windows DEV EXE #62 / run 34314737093: PASS"
            echo "- main/PROD: NOT modified or deployed by this delivery"
            echo
            echo "## Runtime/Build evidence"
            echo
            echo "- Runtime Golden artifact: HNL-QLTC-DEV-RUNTIME-GOLDEN-55 (artifact 10089638472)"
            echo "- Android artifact: HNL-QLTC-Android-DEV-68 (artifact 10089698169)"
            echo "- Windows artifact: HNL-QLTC-Windows-DEV-62 (artifact 10089710682)"
            echo
            echo "## ZIP integrity"
            echo
            echo "PATCH and FULL SOURCE were generated directly from Git object \`$HEAD_SHA\` and verified using \`unzip -t\`."
            echo "FULL SOURCE includes package.json, package-lock.json and repository .github/workflows from exact DEV; temporary packaging/dispatch gate branches are not included."
          } > "$REPORT"

          unzip -t "$PATCH_ZIP" >/dev/null
          unzip -t "$FULL_ZIP" >/dev/null
          test "$(unzip -Z1 "$PATCH_ZIP" | grep -v '/$' | wc -l)" -eq "${#PATCH_FILES[@]}"
          unzip -Z1 "$FULL_ZIP" | grep -q 'package.json$'
          unzip -Z1 "$FULL_ZIP" | grep -q 'package-lock.json$'
          unzip -Z1 "$FULL_ZIP" | grep -q '.github/workflows/'

          sha256sum "$PATCH_ZIP" "$FULL_ZIP" "$REPORT" | tee "$OUT/SHA256SUMS.txt"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-V6.3.0-DEV-e036c39c-FINAL-DELIVERABLES
          path: |
            ${{ env.OUT }}/HNL-QLTC-V6.3.0-DEV-e036c39c-PATCH.zip
            ${{ env.OUT }}/HNL-QLTC-V6.3.0-DEV-e036c39c-FULL-SOURCE.zip
            ${{ env.OUT }}/HNL-QLTC-V6.3.0-DEV-e036c39c-REPORT.md
            ${{ env.OUT }}/SHA256SUMS.txt
          retention-days: 30

      - name: Final summary
        run: echo 'PATCH ZIP + FULL SOURCE ZIP + REPORT created from exact latest DEV e036c39c and integrity-tested.'
