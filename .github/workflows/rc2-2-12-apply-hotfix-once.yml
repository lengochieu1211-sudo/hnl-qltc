name: RC2.2.12 Apply Android Gallery Hotfix Once

on:
  push:
    branches:
      - rc2-2-12-android-gallery-picker-hotfix

permissions:
  contents: write

jobs:
  apply_hotfix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Decode and verify patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d rc2212_payload.b64 > /tmp/rc2212.patch
          echo "527e2b9be3c0b007e5f88b84e2c9f46d9b06c259857f25a225b649ebc4641241  /tmp/rc2212.patch" | sha256sum -c -
          git apply --check /tmp/rc2212.patch
          git apply /tmp/rc2212.patch
          git diff --check

      - name: Source regression gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stability-gate.mjs
          node scripts/offline-golden.mjs
          node scripts/category-golden.mjs
          node scripts/firebase-only-golden.mjs
          node scripts/firebase-only-legacy-audit.mjs --self-test
          node scripts/emulator-golden.mjs
          node scripts/rbac-matrix.mjs
          node scripts/r2-gateway-golden.mjs
          node scripts/desktop-launcher-golden.mjs
          node scripts/auth-popup-golden.mjs
          node scripts/source-lint.mjs

      - name: Commit verified source hotfix
        shell: bash
        run: |
          set -euo pipefail
          git rm rc2212_payload.b64
          git add android-wrapper/src/com/qlct/app/MainActivity.java scripts/stability-gate.mjs desktop-wrapper/release-tag.txt scripts/desktop-launcher-golden.mjs
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: isolate Android gallery picker from camera capture"
          git push origin HEAD:rc2-2-12-android-gallery-picker-hotfix
