name: Report Photo R2 + Mobile Auth Hotfix

on:
  push:
    branches:
      - hotfix/report-photo-r2-tolerant-20260901
    paths:
      - '.github/workflows/report-photo-r2-tolerant-hotfix.yml'

permissions:
  contents: write

jobs:
  patch_test_materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/report-photo-r2-tolerant-20260901
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Apply certified hotfix diff
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/hotfix.patch
          git apply --check /tmp/hotfix.patch
          git apply /tmp/hotfix.patch
          grep -q "signInWithRedirect(auth, provider)" src/lib/firebase.ts
          grep -q "getProjectPhotosWithBinary(activeProjectId, false)" src/components/ExportPdfModal.tsx
          grep -q "reportPhotoWarning" src/components/ExportPdfModal.tsx
          grep -q "getProjectPhotosWithBinary(projectId: string, requireBinary = false)" src/utils/photoStorage.ts
          grep -q "từ chối tạo backup không đầy đủ" src/utils/photoStorage.ts
      - run: npm ci
      - name: Stability
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rules
        run: npm run test:rules
      - name: Security
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Commit certified source and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'HNL QLTC CI'
          git config user.email 'actions@users.noreply.github.com'
          git rm .github/workflows/report-photo-r2-tolerant-hotfix.yml
          git add src/lib/firebase.ts src/components/GoogleAuthModal.tsx src/components/ExportPdfModal.tsx scripts/stability-gate.mjs
          git commit -m 'fix: stabilize mobile Google auth and tolerate missing report photos'
          git push origin HEAD:hotfix/report-photo-r2-tolerant-20260901
