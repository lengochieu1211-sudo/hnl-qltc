name: Build HNL QLTC Windows DEV EXE

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'desktop-wrapper/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/firebase-rules-check.mjs'
      - 'scripts/desktop-launcher-golden.mjs'
      - 'scripts/windows-icon-golden.ps1'
      - '.github/workflows/windows-exe-dev.yml'

permissions:
  contents: read

env:
  DEV_FIREBASE_PROJECT_ID: hnl-qltc-dev
  PROD_FIREBASE_PROJECT_ID: com-example-qlct-61329
  DEV_HOSTING_URL: https://hnl-qltc-dev.web.app
  PROD_HOSTING_URL: https://hnlqltc.web.app
  DEV_R2_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
  PROD_R2_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
  DEV_AI_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
  PROD_AI_URL: https://hnl-qltc-ai-gateway.lengochieu1211.workers.dev

jobs:
  build_dev_exe:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyB6y060Mji2684mB-g1qYHoEJ-F1ep5q5M
      VITE_FIREBASE_AUTH_DOMAIN: hnl-qltc-dev.web.app
      VITE_FIREBASE_PROJECT_ID: hnl-qltc-dev
      VITE_FIREBASE_STORAGE_BUCKET: hnl-qltc-dev.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1036808734475"
      VITE_FIREBASE_APP_ID: 1:1036808734475:web:e124b3ff0c50369393840e
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_HNL_AI_ENABLED: "true"
      VITE_HNL_AI_GATEWAY_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
      QLCT_RELEASE_TAG: 6.3.0-dev

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: DEV desktop isolation gate
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/dev') { throw "REFUSING: DEV EXE must run on dev, got $env:GITHUB_REF" }
          if ($env:VITE_FIREBASE_PROJECT_ID -ne $env:DEV_FIREBASE_PROJECT_ID) { throw 'REFUSING: Firebase project is not HNL QLTC DEV' }
          if ($env:VITE_FIREBASE_PROJECT_ID -eq $env:PROD_FIREBASE_PROJECT_ID) { throw 'REFUSING: DEV EXE points to PROD Firebase' }
          if ($env:VITE_R2_GATEWAY_URL -ne $env:DEV_R2_URL -or $env:VITE_R2_GATEWAY_URL -eq $env:PROD_R2_URL) { throw 'REFUSING: DEV EXE R2 isolation failed' }
          if ($env:VITE_HNL_AI_GATEWAY_URL -ne $env:DEV_AI_URL -or $env:VITE_HNL_AI_GATEWAY_URL -eq $env:PROD_AI_URL) { throw 'REFUSING: DEV EXE AI isolation failed' }
          if ($env:VITE_HNL_AI_ENABLED -ne 'true') { throw 'REFUSING: HNL AI is not enabled in DEV EXE' }
          Write-Host 'Windows DEV isolation gate: PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: HNL AI and existing app gates
        shell: pwsh
        run: |
          npm run test:ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-planner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-provider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-gateway
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:stability
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and source secret scan
        run: npm run lint

      - name: Firebase Rules regression
        run: npm run test:rules

      - name: Production dependency critical security audit
        run: npm run security:audit

      - name: Build DEV web bundle
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = Get-ChildItem './dist/assets' -File -ErrorAction Stop
          $combined = ($assets | ForEach-Object { Get-Content -Raw -LiteralPath $_.FullName -ErrorAction SilentlyContinue }) -join "`n"
          if ($combined -notmatch 'HNL AI Assistant') { throw 'AI UI marker missing from DEV Windows web bundle' }
          if ($combined -notmatch 'hnl-qltc-ai-gateway-dev') { throw 'DEV AI gateway missing from DEV Windows web bundle' }

      - name: Certify untouched PROD-default launcher source
        run: node scripts/desktop-launcher-golden.mjs

      - name: Isolate launcher URL, product label, and browser profile for DEV
        shell: pwsh
        run: |
          $path = './desktop-wrapper/QLTCAnPhuLauncher.cs'
          $utf8 = New-Object System.Text.UTF8Encoding($true)
          $text = Get-Content -Raw -LiteralPath $path
          $text = $text.Replace('private const string AppBaseUrl = "https://hnlqltc.web.app/?app=desktop";', 'private const string AppBaseUrl = "https://hnl-qltc-dev.web.app/?app=desktop&env=dev";')
          $text = $text.Replace('private const string ProductName = "HNL Quản Lý Thi Công";', 'private const string ProductName = "HNL QLTC DEV";')
          $text = $text.Replace('"QLTCAnPhu"', '"QLTCAnPhuDEV"')
          [System.IO.File]::WriteAllText((Resolve-Path $path), $text, $utf8)

          $after = Get-Content -Raw -LiteralPath $path
          if ($after -notmatch 'https://hnl-qltc-dev\.web\.app/\?app=desktop&env=dev') { throw 'DEV desktop URL rewrite failed' }
          if ($after -match 'https://hnlqltc\.web\.app/\?app=desktop') { throw 'REFUSING: PROD Hosting remains in DEV launcher target' }
          if ($after -notmatch '"HNL QLTC DEV"') { throw 'DEV desktop product label rewrite failed' }
          if ($after -notmatch '"QLTCAnPhuDEV"') { throw 'DEV desktop profile isolation failed' }
          Write-Host 'DEV launcher rewrite: PASS'

      - name: Build portable Windows DEV EXE
        shell: pwsh
        run: ./desktop-wrapper/build-launcher.ps1

      - name: Windows taskbar icon golden
        shell: pwsh
        run: ./scripts/windows-icon-golden.ps1

      - name: Verify DEV EXE
        shell: pwsh
        run: |
          $source = Get-Content -Raw -LiteralPath './desktop-wrapper/QLTCAnPhuLauncher.cs'
          if ($source -match 'https://hnlqltc\.web\.app/\?app=desktop') { throw 'REFUSING: built DEV launcher source contains PROD target' }
          if ($source -notmatch 'QLTCAnPhuDEV') { throw 'DEV profile isolation marker missing' }
          $exe = Resolve-Path './HNL-QLTC-Windows.exe'
          if (-not (Test-Path -LiteralPath $exe)) { throw 'DEV EXE was not created' }
          $item = Get-Item -LiteralPath $exe
          if ($item.Length -lt 4096) { throw "DEV EXE is unexpectedly small: $($item.Length) bytes" }
          $assembly = [System.Reflection.AssemblyName]::GetAssemblyName($exe)
          Write-Host "EXE: $($item.FullName)"
          Write-Host "Size: $($item.Length)"
          Write-Host "Assembly version: $($assembly.Version)"
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe
          Move-Item -Force './HNL-QLTC-Windows.exe' './HNL-QLTC-Windows-DEV.exe'

      - name: Upload Windows DEV EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-Windows-DEV-${{ github.run_number }}
          path: |
            HNL-QLTC-Windows-DEV.exe
            icon-golden-evidence/**
          if-no-files-found: error
          retention-days: 30
