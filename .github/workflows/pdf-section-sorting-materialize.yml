name: PDF Section Sorting Materialize

on:
  push:
    branches:
      - feature/pdf-section-sorting-20260901
    paths:
      - '.github/workflows/pdf-section-sorting-materialize.yml'

permissions:
  contents: write

jobs:
  patch_test_materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-section-sorting-20260901
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 scripts/tmp-pdf-section-sorting-patch.py
      - run: npm ci
      - name: Stability
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rules
        run: npm run test:rules
      - name: Security
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Commit certified source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pdf-section-sorting-materialize.yml scripts/tmp-pdf-section-sorting-patch.py
          git config user.name "lengochieu1211-sudo"
          git config user.email "lengochieu1211@gmail.com"
          git add src/components/ExportPdfModal.tsx .github/workflows/pdf-section-sorting-materialize.yml scripts/tmp-pdf-section-sorting-patch.py
          git commit -m "feat: add per-section PDF sorting controls"
          git push origin HEAD:feature/pdf-section-sorting-20260901
