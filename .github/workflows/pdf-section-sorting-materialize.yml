name: PDF Section Sorting Materialize

on:
  push:
    branches:
      - feature/pdf-section-sorting-20260901
    paths:
      - '.github/workflows/pdf-section-sorting-materialize.yml'

permissions:
  contents: write

jobs:
  patch_test_materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/pdf-section-sorting-20260901
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply PDF sorting feature
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/ExportPdfModal.tsx')
          s = p.read_text(encoding='utf-8')

          def rep(old, new, label, count=1):
              global s
              actual = s.count(old)
              if actual < count:
                  raise SystemExit(f'{label}: expected at least {count}, found {actual}')
              s = s.replace(old, new, count)
              print('patched', label)

          rep(
          "  const [defectReportSortMode, setDefectReportSortMode] = useState<'floor-room-category' | 'room-floor-category' | 'category-floor-room' | 'created-desc' | 'status-due'>('floor-room-category');\n",
          "  const [defectReportSortMode, setDefectReportSortMode] = useState<'floor-room-category' | 'room-floor-category' | 'category-floor-room' | 'created-desc' | 'status-due'>('floor-room-category');\n  const [warehouseReportSortMode, setWarehouseReportSortMode] = useState<'material-asc' | 'material-desc' | 'stock-desc' | 'stock-asc' | 'status-material'>('material-asc');\n  const [workVolumeReportSortMode, setWorkVolumeReportSortMode] = useState<'category-title' | 'title-asc' | 'planned-desc' | 'actual-desc' | 'progress-desc'>('category-title');\n  const [floorPlanReportSortMode, setFloorPlanReportSortMode] = useState<'floor-asc' | 'floor-desc' | 'defect-desc' | 'room-desc'>('floor-asc');\n  const [roomReportSortMode, setRoomReportSortMode] = useState<'floor-room' | 'room-floor' | 'category-floor-room' | 'work-status' | 'inspection-status' | 'team-floor-room'>('floor-room');\n  const [crewReportSortMode, setCrewReportSortMode] = useState<'date-desc' | 'date-asc' | 'team-date' | 'floor-date' | 'workers-desc'>('date-desc');\n  const [checklistReportSortMode, setChecklistReportSortMode] = useState<'floor-category' | 'category-floor' | 'status-floor' | 'title-asc'>('floor-category');\n",
          'sorting states')

          rep(
          "  const filteredRooms = roomProgressList.filter((r) => {\n    const fp = effectiveFloorPlans.find(f => f.id === r.floorId);\n    if (!fp) return false;\n    if (isAllSelected) return true;\n    return selectedFloors.includes(fp.floorName);\n  });\n\n  const filteredCrew = crewRecords.filter((c) => {\n",
          "  const filteredRooms = roomProgressList.filter((r) => {\n    const fp = effectiveFloorPlans.find(f => f.id === r.floorId);\n    if (!fp) return false;\n    if (isAllSelected) return true;\n    return selectedFloors.includes(fp.floorName);\n  });\n\n  const getRoomSortCategory = (room: RoomProgressItem): string => String(\n    Object.keys(room.categoryVolumes || {})[0]\n      || (room.subItems || []).find((sub) => sub.category)?.category\n      || room.workCategory\n      || ''\n  );\n\n  const getRoomSortWorkStatus = (room: RoomProgressItem): string => {\n    const subs = room.subItems || [];\n    if (subs.length > 0) {\n      if (subs.every((sub) => sub.status === 'Đã hoàn thành')) return 'Đã hoàn thành';\n      if (subs.some((sub) => sub.status === 'Đang làm' || sub.status === 'Đã hoàn thành')) return 'Đang làm';\n      return 'Chưa làm';\n    }\n    if (room.frameStatus === 'Đã hoàn thành' && room.boardStatus === 'Đã hoàn thành') return 'Đã hoàn thành';\n    if (room.frameStatus === 'Đang làm' || room.boardStatus === 'Đang làm' || room.frameStatus === 'Đã hoàn thành' || room.boardStatus === 'Đã hoàn thành') return 'Đang làm';\n    return 'Chưa làm';\n  };\n\n  const sortedStockSummary = stockSummary.slice().sort((a, b) => {\n    if (warehouseReportSortMode === 'material-desc') return compareTextVi(b.materialName, a.materialName);\n    if (warehouseReportSortMode === 'stock-desc') return Number(b.currentStock || 0) - Number(a.currentStock || 0) || compareTextVi(a.materialName, b.materialName);\n    if (warehouseReportSortMode === 'stock-asc') return Number(a.currentStock || 0) - Number(b.currentStock || 0) || compareTextVi(a.materialName, b.materialName);\n    if (warehouseReportSortMode === 'status-material') return compareTextVi(a.status, b.status) || compareTextVi(a.materialName, b.materialName);\n    return compareTextVi(a.materialName, b.materialName);\n  });\n\n  const sortedWorkVolumes = workVolumes.slice().sort((a, b) => {\n    const titleCmp = compareTextVi(a.title, b.title);\n    const categoryCmp = compareTextVi(a.category, b.category);\n    if (workVolumeReportSortMode === 'title-asc') return titleCmp || categoryCmp;\n    if (workVolumeReportSortMode === 'planned-desc') return Number(b.planned || 0) - Number(a.planned || 0) || titleCmp;\n    if (workVolumeReportSortMode === 'actual-desc') return Number(b.actual || 0) - Number(a.actual || 0) || titleCmp;\n    if (workVolumeReportSortMode === 'progress-desc') {\n      const aProgress = Number(a.planned || 0) > 0 ? Number(a.actual || 0) / Number(a.planned || 1) : 0;\n      const bProgress = Number(b.planned || 0) > 0 ? Number(b.actual || 0) / Number(b.planned || 1) : 0;\n      return bProgress - aProgress || titleCmp;\n    }\n    return categoryCmp || titleCmp;\n  });\n\n  const sortedRooms = filteredRooms.slice().sort((a, b) => {\n    const aFloor = effectiveFloorPlans.find((f) => f.id === a.floorId)?.floorName || '';\n    const bFloor = effectiveFloorPlans.find((f) => f.id === b.floorId)?.floorName || '';\n    const floorCmp = compareTextVi(aFloor, bFloor);\n    const roomCmp = compareTextVi(a.roomName, b.roomName);\n    const categoryCmp = compareTextVi(getRoomSortCategory(a), getRoomSortCategory(b));\n    if (roomReportSortMode === 'room-floor') return roomCmp || floorCmp || categoryCmp;\n    if (roomReportSortMode === 'category-floor-room') return categoryCmp || floorCmp || roomCmp;\n    if (roomReportSortMode === 'work-status') return compareTextVi(getRoomSortWorkStatus(a), getRoomSortWorkStatus(b)) || floorCmp || roomCmp;\n    if (roomReportSortMode === 'inspection-status') return compareTextVi(a.inspectionStatus, b.inspectionStatus) || floorCmp || roomCmp;\n    if (roomReportSortMode === 'team-floor-room') return compareTextVi(a.assignedTeam, b.assignedTeam) || floorCmp || roomCmp;\n    return floorCmp || roomCmp || categoryCmp;\n  });\n\n  const sortedChecklist = filteredChecklist.slice().sort((a, b) => {\n    const floorCmp = compareTextVi(a.floorName, b.floorName);\n    const categoryCmp = compareTextVi(a.category, b.category);\n    if (checklistReportSortMode === 'category-floor') return categoryCmp || floorCmp || compareTextVi(a.title, b.title);\n    if (checklistReportSortMode === 'status-floor') return compareTextVi(a.status, b.status) || floorCmp || categoryCmp;\n    if (checklistReportSortMode === 'title-asc') return compareTextVi(a.title, b.title) || floorCmp || categoryCmp;\n    return floorCmp || categoryCmp || compareTextVi(a.title, b.title);\n  });\n\n  const filteredCrew = crewRecords.filter((c) => {\n",
          'sorted section collections')

          rep(
          "  }).sort((a, b) => {\n    const dateCompare = a.date.localeCompare(b.date);\n    if (dateCompare !== 0) return dateCompare;\n    return a.teamName.localeCompare(b.teamName);\n  });\n",
          "  }).sort((a, b) => {\n    const dateAsc = compareTextVi(a.date, b.date);\n    const dateDesc = compareTextVi(b.date, a.date);\n    const teamCmp = compareTextVi(a.teamName, b.teamName);\n    const floorCmp = compareTextVi(a.floorName, b.floorName);\n    if (crewReportSortMode === 'date-asc') return dateAsc || teamCmp || floorCmp;\n    if (crewReportSortMode === 'team-date') return teamCmp || dateDesc || floorCmp;\n    if (crewReportSortMode === 'floor-date') return floorCmp || dateDesc || teamCmp;\n    if (crewReportSortMode === 'workers-desc') return Number(b.workerCount || 0) - Number(a.workerCount || 0) || dateDesc || teamCmp;\n    return dateDesc || teamCmp || floorCmp;\n  });\n",
          'crew dynamic sorting')

          rep(
          "    const targetFloorPlans = (isAllSelected ? effectiveFloorPlans : effectiveFloorPlans.filter(fp => selectedFloors.includes(fp.floorName)))\n      .filter(fp => {\n        if (!skipEmptyFloors) return true;\n        const fpRooms = roomProgressList.filter(r => r.floorId === fp.id);\n        const fpDefects = defectsWithDisplayCode.filter(d => d.floorName === fp.floorName || d.floorId === fp.id);\n        return fpRooms.length > 0 || fpDefects.length > 0;\n      });\n",
          "    const targetFloorPlans = (isAllSelected ? effectiveFloorPlans : effectiveFloorPlans.filter(fp => selectedFloors.includes(fp.floorName)))\n      .filter(fp => {\n        if (!skipEmptyFloors) return true;\n        const fpRooms = roomProgressList.filter(r => r.floorId === fp.id);\n        const fpDefects = defectsForReport.filter(d => d.floorName === fp.floorName || d.floorId === fp.id);\n        return fpRooms.length > 0 || fpDefects.length > 0;\n      })\n      .sort((a, b) => {\n        const floorCmp = compareTextVi(a.floorName, b.floorName);\n        if (floorPlanReportSortMode === 'floor-desc') return -floorCmp;\n        if (floorPlanReportSortMode === 'defect-desc') {\n          const aCount = defectsForReport.filter((d) => d.floorName === a.floorName || d.floorId === a.id).length;\n          const bCount = defectsForReport.filter((d) => d.floorName === b.floorName || d.floorId === b.id).length;\n          return bCount - aCount || floorCmp;\n        }\n        if (floorPlanReportSortMode === 'room-desc') {\n          const aCount = roomProgressList.filter((r) => r.floorId === a.id).length;\n          const bCount = roomProgressList.filter((r) => r.floorId === b.id).length;\n          return bCount - aCount || floorCmp;\n        }\n        return floorCmp;\n      });\n",
          'floor plan sorting')

          s = s.replace("${stockSummary.map((item, idx) => `", "${sortedStockSummary.map((item, idx) => `", 1)
          s = s.replace("${workVolumes.map((wv, idx) => `", "${sortedWorkVolumes.map((wv, idx) => `", 1)
          s = s.replace("${filteredRooms.map(r => {", "${sortedRooms.map(r => {", 1)
          s = s.replace("${filteredChecklist.map(c => `", "${sortedChecklist.map(c => `", 1)
          s = s.replace("const fpDefects = defectsWithDisplayCode.filter(d => d.floorName === fp.floorName || d.floorId === fp.id);", "const fpDefects = defectsForReport.filter(d => d.floorName === fp.floorName || d.floorId === fp.id);")
          s = s.replace("const defectsWithImages = defectsWithDisplayCode.filter(d => {", "const defectsWithImages = defectsForReport.filter(d => {", 1)

          anchor = "          {/* Defect list grouping/sorting - display-only; map marker placement is intentionally unchanged. */}\n"
          if anchor not in s:
              raise SystemExit('sorting UI anchor not found')
          ui = """          {/* Sorting for each report section. Photo appendices intentionally inherit their parent table order. */}
          <details open className="group bg-slate-50 border border-slate-200 rounded-2xl overflow-hidden">
            <summary className="cursor-pointer select-none px-3 py-2.5 text-[11px] font-extrabold text-slate-800 flex items-center justify-between gap-2">
              <span>↕️ Sắp xếp từng phần trong PDF</span>
              <span className="text-[10px] text-slate-400 group-open:hidden">Mở</span>
              <span className="text-[10px] text-slate-400 hidden group-open:inline">Thu gọn</span>
            </summary>
            <div className="border-t border-slate-200 p-3 grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <label className="space-y-1">
                <span className="block text-[10px] font-bold text-slate-600">Kho vật tư</span>
                <select value={warehouseReportSortMode} onChange={(e) => setWarehouseReportSortMode(e.target.value as typeof warehouseReportSortMode)} className="w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-[11px] font-semibold">
                  <option value="material-asc">Tên vật tư A → Z</option>
                  <option value="material-desc">Tên vật tư Z → A</option>
                  <option value="stock-desc">Tồn kho nhiều → ít</option>
                  <option value="stock-asc">Tồn kho ít → nhiều</option>
                  <option value="status-material">Trạng thái → Tên vật tư</option>
                </select>
              </label>
              <label className="space-y-1">
                <span className="block text-[10px] font-bold text-slate-600">Khối lượng thi công</span>
                <select value={workVolumeReportSortMode} onChange={(e) => setWorkVolumeReportSortMode(e.target.value as typeof workVolumeReportSortMode)} className="w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-[11px] font-semibold">
                  <option value="category-title">Phân loại → Hạng mục</option>
                  <option value="title-asc">Hạng mục A → Z</option>
                  <option value="planned-desc">KL kế hoạch lớn → nhỏ</option>
                  <option value="actual-desc">KL thực hiện lớn → nhỏ</option>
                  <option value="progress-desc">% hoàn thành cao → thấp</option>
                </select>
              </label>
              <label className="space-y-1">
                <span className="block text-[10px] font-bold text-slate-600">Mặt bằng</span>
                <select value={floorPlanReportSortMode} onChange={(e) => setFloorPlanReportSortMode(e.target.value as typeof floorPlanReportSortMode)} className="w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-[11px] font-semibold">
                  <option value="floor-asc">Tầng thấp → cao / A → Z</option>
                  <option value="floor-desc">Tầng cao → thấp / Z → A</option>
                  <option value="defect-desc">Tầng nhiều Defect → ít</option>
                  <option value="room-desc">Tầng nhiều Căn/Phòng → ít</option>
                </select>
              </label>
              <label className="space-y-1">
                <span className="block text-[10px] font-bold text-slate-600">Tiến độ Căn / Phòng</span>
                <select value={roomReportSortMode} onChange={(e) => setRoomReportSortMode(e.target.value as typeof roomReportSortMode)} className="w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-[11px] font-semibold">
                  <option value="floor-room">Tầng → Căn/Phòng</option>
                  <option value="room-floor">Căn/Phòng → Tầng</option>
                  <option value="category-floor-room">Hạng mục → Tầng → Căn/Phòng</option>
                  <option value="work-status">Trạng thái thi công → Tầng/Phòng</option>
                  <option value="inspection-status">Nghiệm thu → Tầng/Phòng</option>
                  <option value="team-floor-room">Đội → Tầng → Căn/Phòng</option>
                </select>
              </label>
              <label className="space-y-1">
                <span className="block text-[10px] font-bold text-slate-600">Nhật ký nhân công + phụ lục ảnh</span>
                <select value={crewReportSortMode} onChange={(e) => setCrewReportSortMode(e.target.value as typeof crewReportSortMode)} className="w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-[11px] font-semibold">
                  <option value="date-desc">Ngày mới → cũ</option>
                  <option value="date-asc">Ngày cũ → mới</option>
                  <option value="team-date">Đội → Ngày mới nhất</option>
                  <option value="floor-date">Tầng → Ngày mới nhất</option>
                  <option value="workers-desc">Quân số nhiều → ít</option>
                </select>
              </label>
              <label className="space-y-1">
                <span className="block text-[10px] font-bold text-slate-600">Checklist</span>
                <select value={checklistReportSortMode} onChange={(e) => setChecklistReportSortMode(e.target.value as typeof checklistReportSortMode)} className="w-full rounded-lg border border-slate-300 bg-white px-2 py-1.5 text-[11px] font-semibold">
                  <option value="floor-category">Tầng → Hạng mục</option>
                  <option value="category-floor">Hạng mục → Tầng</option>
                  <option value="status-floor">Kết quả → Tầng</option>
                  <option value="title-asc">Tiêu chí A → Z</option>
                </select>
              </label>
            </div>
            <p className="px-3 pb-3 text-[10px] text-slate-500">Phụ lục ảnh Defect đi theo thứ tự Defect bên dưới; phụ lục ảnh nhân công đi theo đúng thứ tự Nhật ký nhân công.</p>
          </details>

"""
          s = s.replace(anchor, ui + anchor, 1)

          required = [
              'warehouseReportSortMode', 'workVolumeReportSortMode', 'floorPlanReportSortMode',
              'roomReportSortMode', 'crewReportSortMode', 'checklistReportSortMode',
              'sortedStockSummary.map', 'sortedWorkVolumes.map', 'sortedRooms.map', 'sortedChecklist.map',
              'const defectsWithImages = defectsForReport.filter',
              'Nhật ký nhân công + phụ lục ảnh'
          ]
          for token in required:
              if token not in s:
                  raise SystemExit(f'missing required token: {token}')
          p.write_text(s, encoding='utf-8')
          PY
      - run: npm ci
      - name: Stability
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rules
        run: npm run test:rules
      - name: Security
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Commit certified source and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pdf-section-sorting-materialize.yml
          git config user.name "lengochieu1211-sudo"
          git config user.email "lengochieu1211@gmail.com"
          git add src/components/ExportPdfModal.tsx .github/workflows/pdf-section-sorting-materialize.yml
          git commit -m "feat: add per-section PDF sorting controls"
          git push origin HEAD:feature/pdf-section-sorting-20260901
