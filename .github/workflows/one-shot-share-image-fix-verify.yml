name: One-shot share image fix verify

on:
  push:
    branches:
      - feature/ai-data-optin-live-models
    paths:
      - 'src/utils/shareUtils.ts'
      - '.github/workflows/one-shot-share-image-fix-verify.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/ai-data-optin-live-models
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Share image regression guard
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const s = fs.readFileSync('src/utils/shareUtils.ts', 'utf8');
          const checks = [
            ['binary MIME is authoritative', "const actualMimeType = decoded.mimeType || attachment.mimeType || 'image/jpeg'"],
            ['native bridge MIME is authoritative', "const actualMimeType = item.mimeType || attachment.mimeType || 'image/jpeg'"],
            ['share filename matches MIME', 'normalizeShareFileName'],
            ['browser avoids mixed files+URL payload', "const shareData: ShareData = { title, text: shareText || undefined, files }"]
          ];
          for (const [name, needle] of checks) {
            if (!s.includes(needle)) throw new Error(`Missing guard: ${name}`);
            console.log(`PASS: ${name}`);
          }
          NODE

      - name: Stability Gate
        run: npm run test:stability

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Firebase rules check
        run: npm run test:rules

      - name: Build
        run: npm run build

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout feature/ai-data-optin-live-models
          git pull --ff-only origin feature/ai-data-optin-live-models
          rm -f .github/workflows/one-shot-share-image-fix-verify.yml
          if git diff --quiet; then exit 0; fi
          git add .github/workflows/one-shot-share-image-fix-verify.yml
          git commit -m 'chore(dev): remove one-shot share image verifier'
          git push origin HEAD:feature/ai-data-optin-live-models
