name: HNL PR381 candidate DEV Backup expiring preview (NO LIVE / NO PROD)
on:
  push:
    branches:
      - qa/prod10-pr381-devbackup-preview-20261102
permissions:
  contents: read
concurrency:
  group: hnl-pr381-devbackup-preview
  cancel-in-progress: false
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      BACKUP_PROJECT: hnl-qltc-dev-backup
      BACKUP_CHANNEL: qa375nov01
      VITE_APP_ENV: DEV
      VITE_QA_PREVIEW_GOOGLE_POPUP: 'true'
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway-dev-backup.lengochieu1211.workers.dev
      VITE_HNL_AI_ENABLED: 'false'
      VITE_ENABLE_LEGACY_DRIVE_READ: 'true'
      VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
      VITE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_USE_FIREBASE_EMULATORS: 'false'
      VITE_FIREBASE_AUTH_DOMAIN: hnl-qltc-dev-backup.web.app
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: REFUSE wrong source, wrong project, PROD accounts or scope drift
        env:
          FIREBASE_BACKUP_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV_BACKUP }}
        shell: bash
        run: |
          set -euo pipefail
          BASE=6af4339a27e19351f7371bee7ac1f10215bc95cb
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/qa/prod10-pr381-devbackup-preview-20261102
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 1c2b7d663d51d51aa45010e533d8e035e22adf59
          git merge-base --is-ancestor "$BASE" "$GITHUB_SHA"
          printf '%s\n' '.github/workflows/prod10-pr381-devbackup-preview.yml' 'src/lib/firebaseBase.ts' > "$RUNNER_TEMP/approved-files.txt"
          git diff --name-only "$BASE" HEAD > "$RUNNER_TEMP/actual-files.txt"
          diff -u "$RUNNER_TEMP/approved-files.txt" "$RUNNER_TEMP/actual-files.txt"
          test "$BACKUP_PROJECT" = hnl-qltc-dev-backup
          test "$BACKUP_CHANNEL" = qa375nov01
          test "$VITE_APP_ENV" = DEV
          test "$VITE_QA_PREVIEW_GOOGLE_POPUP" = true
          test "$VITE_USE_FIREBASE_EMULATORS" = false
          test "$VITE_FIREBASE_AUTH_DOMAIN" = hnl-qltc-dev-backup.web.app
          test "$VITE_R2_GATEWAY_URL" = https://hnl-qltc-r2-gateway-dev-backup.lengochieu1211.workers.dev
          test "$VITE_ENABLE_LEGACY_DRIVE_WRITE" = false
          test -n "${FIREBASE_BACKUP_SERVICE_ACCOUNT:-}"
          node - <<'NODE'
          const a=JSON.parse(process.env.FIREBASE_BACKUP_SERVICE_ACCOUNT);
          if(a.type!=='service_account'||a.project_id!=='hnl-qltc-dev-backup'||!a.private_key||!a.client_email)
            throw Error('Refuse wrong Firebase credentials; DEV Backup account only');
          console.log('DEV Backup project/account isolation PASS');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Load actual existing DEV Backup SDK config without creating apps
        env:
          FIREBASE_BACKUP_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV_BACKUP }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/devbackup-sa.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          printf '%s' "$FIREBASE_BACKUP_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 apps:list WEB --project "$BACKUP_PROJECT" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(node - "$RUNNER_TEMP/apps.json" <<'NODE'
          const j=require(process.argv[2]),apps=Array.isArray(j.result)?j.result:[];
          const app=apps.find(x=>x.platform==='WEB'||String(x.appId||'').includes(':web:'));
          if(!app?.appId)throw Error('Missing pre-existing DEV Backup Web app');
          process.stdout.write(app.appId);
          NODE
          )"
          npx --yes firebase-tools@13.35.1 apps:sdkconfig WEB "$APP_ID" --project "$BACKUP_PROJECT" --json > "$RUNNER_TEMP/sdk.json"
          node - "$RUNNER_TEMP/sdk.json" <<'NODE'
          const fs=require('fs'),data=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const keys=['apiKey','appId','messagingSenderId','projectId','authDomain','storageBucket'],out={};
          function extract(v){
            if(!v)return;
            if(typeof v==='string'){try{extract(JSON.parse(v));}catch{}
              for(const k of keys){const m=v.match(new RegExp(k+'\\s*:\\s*["\\x27]([^"\\x27]+)["\\x27]'));if(m&&!out[k])out[k]=m[1];}
            }else if(Array.isArray(v))v.forEach(extract);else if(typeof v==='object'){
              for(const [k,x] of Object.entries(v)){if(keys.includes(k)&&typeof x==='string'&&!out[k])out[k]=x;extract(x);}
            }
          }extract(data);
          if(out.projectId!=='hnl-qltc-dev-backup'||!out.apiKey||!out.appId||!out.messagingSenderId)throw Error('Missing correct DEV Backup SDK identity');
          out.authDomain='hnl-qltc-dev-backup.web.app';
          out.storageBucket ||= 'hnl-qltc-dev-backup.firebasestorage.app';
          const names={apiKey:'API_KEY',appId:'APP_ID',messagingSenderId:'MESSAGING_SENDER_ID',projectId:'PROJECT_ID',authDomain:'AUTH_DOMAIN',storageBucket:'STORAGE_BUCKET'};
          fs.appendFileSync(process.env.GITHUB_ENV,Object.entries(names).map(([k,n])=>'VITE_FIREBASE_'+n+'='+out[k]).join('\n')+'\n');
          console.log('DEV Backup SDK verified');
          NODE
      - name: Build exact PROD candidate app using DEV Backup backend (not PROD)
        shell: bash
        run: |
          set -euo pipefail
          node -e "const a=require('./package.json'),b=require('./package-lock.json');if(a.version!==b.version||a.name!==b.name)process.exit(1)"
          npm ci
          npm run typecheck
          npm run lint
          npm run test:rules
          node scripts/auth-popup-golden.mjs
          npm run build
          test -s dist/index.html
          grep -R -q 'hnl-qltc-dev-backup' dist/assets
          grep -R -q 'qa375nov01' dist/assets
          ! grep -R -q 'hnl-qltc-r2-gateway\.lengochieu1211\.workers\.dev' dist/assets
          rm -f dist/server.cjs dist/server.cjs.map
      - name: Publish expiring DEV Backup preview channel ONLY (NEVER LIVE)
        env:
          FIREBASE_BACKUP_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV_BACKUP }}
        shell: bash
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/devbackup-sa.json"
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS" qa381-devbackup-hosting-only.json' EXIT
          printf '%s' "$FIREBASE_BACKUP_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          node - <<'NODE'
          const fs=require('fs');const config=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          if(config.hosting?.public!=='dist')throw Error('Unexpected Hosting public root');
          fs.writeFileSync('qa381-devbackup-hosting-only.json',JSON.stringify({hosting:{...config.hosting,site:'hnl-qltc-dev-backup'}}));
          NODE
          npx --yes firebase-tools@13.35.1 hosting:channel:deploy "$BACKUP_CHANNEL" --project "$BACKUP_PROJECT" --config "$GITHUB_WORKSPACE/qa381-devbackup-hosting-only.json" --expires 7d --non-interactive --json > "$RUNNER_TEMP/preview.json"
          node - <<'NODE'
          const fs=require('fs');
          const t=fs.readFileSync(process.env.RUNNER_TEMP+'/preview.json','utf8');
          const found=t.match(/https:\/\/hnl-qltc-dev-backup--qa375nov01-[a-z0-9-]+\.web\.app/g);
          if(!found)throw Error('Preview URL not proven for exact DEV Backup channel');
          const url=found[0];
          fs.appendFileSync(process.env.GITHUB_ENV,'QA381_PREVIEW_URL='+url+'\n');
          fs.writeFileSync('QA381-DEV-BACKUP-PREVIEW-REPORT.json',JSON.stringify({
            candidateHead:'6af4339a27e19351f7371bee7ac1f10215bc95cb',
            qaBranchHead:process.env.GITHUB_SHA,
            environment:'DEV',projectId:'hnl-qltc-dev-backup',r2Gateway:'dev-backup',
            previewUrl:url,liveChanged:false,prodChanged:false,rulesChanged:false,
            note:'Preview smoke is NOT signed-in Golden'
          },null,2));
          console.log('PREVIEW='+url);
          NODE
      - name: Verify preview HTTP and hashed asset from isolated URL
        shell: bash
        run: |
          set -euo pipefail
          test -n "${QA381_PREVIEW_URL:-}"
          STATUS="$(curl -L -sS --retry 5 --retry-delay 2 -o "$RUNNER_TEMP/preview.html" -w '%{http_code}' "$QA381_PREVIEW_URL/?candidate=33a24cc")"
          test "$STATUS" = 200
          grep -q 'id="root"' "$RUNNER_TEMP/preview.html"
          echo 'DEV Backup preview HTTP 200. Not a PROD publish or authenticated Golden.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: QA381-DEV-BACKUP-PREVIEW-${{ github.sha }}
          path: QA381-DEV-BACKUP-PREVIEW-REPORT.json
          retention-days: 3
          if-no-files-found: warn
