name: RC2.2.16 Photo Finalization

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Patch photo reconcile + floor-plan RBAC retry
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/lib/photoCloudSync.ts')
          s = p.read_text()

          old = """  if (cloudData && cloudUpdatedAt >= localUpdatedAt && cloudDeleteStateMatches && cloudHasResolvedBinaryState && (photo.deleted || currentProviderBacked) && !currentProviderRepairMode) return;
  if (localIsStale && !binaryRepairMode) {
    throw new Error(`PHOTO_CONFLICT:${photo.id}: Cloud revision mới hơn; giữ Cloud và chờ realtime hòa giải.`);
  }
  if (cloudData && !cloudDeleteStateMatches && cloudUpdatedAt >= localUpdatedAt) {
    throw new Error(`PHOTO_CONFLICT:${photo.id}: trạng thái xóa trên Cloud mới hơn local.`);
  }

  const now = Date.now();
  const nextRevision = binaryRepairMode
    ? Math.max(cloudRevision + 1, localRevision + 1, 1)
    : Math.max(localRevision, 1);
"""
          new = """  const reconcileCloudIntoLocal = async () => {
    if (!cloudData) return;
    const cloudPhoto = { id: photo.id, ...cloudData } as PhotoAttachment;
    await mergeCloudPhotoMetadata(projectId, [cloudPhoto], [cloudPhoto]);
  };

  if (cloudData && cloudUpdatedAt >= localUpdatedAt && cloudDeleteStateMatches && cloudHasResolvedBinaryState && (photo.deleted || currentProviderBacked) && !currentProviderRepairMode) {
    await reconcileCloudIntoLocal();
    return;
  }
  if (localIsStale && !binaryRepairMode) {
    await reconcileCloudIntoLocal();
    return;
  }
  if (cloudData && !cloudDeleteStateMatches && cloudUpdatedAt >= localUpdatedAt) {
    await reconcileCloudIntoLocal();
    return;
  }

  const now = Date.now();
  // Any write to an existing photo document must advance the Firestore lifecycle
  // revision. Older releases could leave a pending/legacy metadata row with the same
  // revision as the uploader's local outbox; reusing that revision is rejected by
  // lifecycleUpdateIsMonotonic() and strands the binary forever on the uploader.
  const nextRevision = cloudData
    ? Math.max(cloudRevision + 1, localRevision + 1, 1)
    : Math.max(localRevision, 1);
"""
          if old not in s:
              raise SystemExit('photo conflict/revision patch anchor not found')
          s = s.replace(old, new, 1)

          old = """      updatedAt: localUpdatedAt || now,
      binaryUploadState: 'deleted',
"""
          new = """      updatedAt: Math.max(localUpdatedAt || 0, cloudData ? cloudUpdatedAt + 1 : 0, now),
      binaryUploadState: 'deleted',
"""
          if old not in s:
              raise SystemExit('photo delete updatedAt patch anchor not found')
          s = s.replace(old, new, 1)

          old = """  const contentVersion = binaryRepairMode
    ? Math.max(cloudUpdatedAt + 1, now)
    : (localUpdatedAt || now);
"""
          new = """  // updatedAt is lifecycle-controlled too. A pre-existing pending row can have a
  // newer timestamp than the local photo even when it has no durable binary pointer.
  // Always advance it when replacing that row with verified R2 metadata.
  const contentVersion = Math.max(
    localUpdatedAt || 0,
    cloudData ? cloudUpdatedAt + 1 : 0,
    now,
  );
"""
          if old not in s:
              raise SystemExit('photo contentVersion patch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('src/lib/floorPlanImageSync.ts')
          s = p.read_text()
          old = "import { compressImageToBlob } from '../utils/imageCompressor';\n"
          new = old + "import { getCurrentUserRole } from '../utils/securityUtils';\n"
          if old not in s:
              raise SystemExit('floor-plan import patch anchor not found')
          s = s.replace(old, new, 1)

          old = """export async function syncFloorPlanImageToCloud(projectId: string, plan: FloorPlan): Promise<Partial<FloorPlan> | null> {
  if (!projectId || !plan?.id || !isLocalFloorPlanBinaryUrl(plan.imageUrl)) return null;
"""
          new = """export async function syncFloorPlanImageToCloud(projectId: string, plan: FloorPlan): Promise<Partial<FloorPlan> | null> {
  if (!projectId || !plan?.id || !isLocalFloorPlanBinaryUrl(plan.imageUrl)) return null;
  // Floor-plan structure is ADMIN-owned by the Master RBAC. EDITOR can read the
  // hydrated image but must never enter an upload/migration retry loop that R2/Rules
  // will correctly reject with WRITE_DENIED.
  if (getCurrentUserRole() !== 'ADMIN') return null;
"""
          if old not in s:
              raise SystemExit('floor-plan sync role patch anchor not found')
          s = s.replace(old, new, 1)

          old = """export function floorPlanNeedsCloudUpload(plan: FloorPlan): boolean {
  if (!plan?.id || !isLocalFloorPlanBinaryUrl(plan.imageUrl)) return false;
"""
          new = """export function floorPlanNeedsCloudUpload(plan: FloorPlan): boolean {
  if (getCurrentUserRole() !== 'ADMIN') return false;
  if (!plan?.id || !isLocalFloorPlanBinaryUrl(plan.imageUrl)) return false;
"""
          if old not in s:
              raise SystemExit('floor-plan needs-upload role patch anchor not found')
          s = s.replace(old, new, 1)

          old = """    try {
      await syncFloorPlanImageToCloud(projectId, plan);
      uploaded++;
    } catch (err) {
"""
          new = """    try {
      const result = await syncFloorPlanImageToCloud(projectId, plan);
      if (result) uploaded++;
      else skipped++;
    } catch (err) {
"""
          if old not in s:
              raise SystemExit('floor-plan result-count patch anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

      - name: Install
        run: npm ci
      - name: Verify full gate
        run: npm run verify
      - name: Commit finalized source and remove one-shot workflow
        shell: bash
        run: |
          rm -f .github/workflows/rc2-2-16-photo-finalize.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/photoCloudSync.ts src/lib/floorPlanImageSync.ts .github/workflows/rc2-2-16-photo-finalize.yml
          git commit -m "fix: finalize cross-account photo reconcile"
          git push origin HEAD:main
