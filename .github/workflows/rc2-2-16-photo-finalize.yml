name: RC2.2.16 Photo Finalization

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply final photo patch
        run: python scripts/rc2_2_16_photo_finalize.py
      - name: Install dependencies
        run: npm ci
      - name: Verify full gate
        run: npm run verify
      - name: Commit verified source
        run: |
          rm -f .github/workflows/rc2-2-16-photo-finalize.yml
          rm -f scripts/rc2_2_16_photo_finalize.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/lib/photoCloudSync.ts src/lib/floorPlanImageSync.ts .github/workflows/rc2-2-16-photo-finalize.yml scripts/rc2_2_16_photo_finalize.py
          git commit -m "fix: finalize cross-account photo reconcile"
          git push origin HEAD:main
