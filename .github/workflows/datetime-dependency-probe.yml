name: HNL QLTC DEV dependency scope probe (NO DEPLOY)
on:
  pull_request:
    paths:
      - '.github/workflows/datetime-dependency-probe.yml'
      - 'package-lock.json'
      - 'package.json'
      - 'src/**'
      - 'scripts/**'
permissions:
  contents: read
jobs:
  dependency_scope_probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline audit
        run: npm audit --omit=dev --audit-level=high > audit-before.txt 2>&1 || true
      - name: Propose moving only Vite build tooling into devDependencies
        run: |
          node --input-type=module -e '
          import fs from "node:fs";
          const path="package.json";
          const pkg=JSON.parse(fs.readFileSync(path,"utf8"));
          const names=["vite","@vitejs/plugin-react","@tailwindcss/vite"];
          for (const name of names) {
            if (!pkg.dependencies[name]) throw new Error("Missing expected dependency "+name);
            pkg.devDependencies[name]=pkg.dependencies[name];
            delete pkg.dependencies[name];
          }
          pkg.devDependencies=Object.fromEntries(Object.entries(pkg.devDependencies).sort(([a],[b])=>a.localeCompare(b)));
          fs.writeFileSync(path,JSON.stringify(pkg,null,2)+"\n");
          '
          npm install --package-lock-only --ignore-scripts --no-audit
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high > audit-after-production.txt 2>&1 || true
          npm audit --audit-level=high > audit-after-all.txt 2>&1 || true
          git diff -- package.json > package-json.diff
          git diff -- package-lock.json > package-lock.diff
          sha256sum package.json package-lock.json > lockfile-sha256.txt
      - name: Upload read-only remediation proposal
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-DEV-DATETIME-DEPENDENCY-SCOPE-PROPOSAL
          path: |
            package.json
            package-lock.json
            package-json.diff
            package-lock.diff
            audit-before.txt
            audit-after-production.txt
            audit-after-all.txt
            lockfile-sha256.txt
          retention-days: 7
          if-no-files-found: error
