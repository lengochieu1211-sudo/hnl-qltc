name: RC2.2.8 Project Name Edit Hotfix

on:
  push:
    branches:
      - rc2-2-8-data-integrity-master-gate
    paths:
      - scripts/rc2_2_8_project_name_edit_hotfix.py
      - .github/workflows/rc2-2-8-project-name-edit-hotfix.yml

permissions:
  contents: write

jobs:
  apply_and_verify:
    if: ${{ !contains(github.event.head_commit.message, '[project-name-edit-hotfix]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rc2-2-8-data-integrity-master-gate
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply asserted project-name patch
        run: python3 scripts/rc2_2_8_project_name_edit_hotfix.py

      - name: Install locked dependencies
        run: npm ci

      - name: Stability Gate
        run: npm run test:stability

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Firebase Rules behavior
        run: npm run test:rules

      - name: Production critical security audit
        run: npm run security:audit

      - name: Build
        run: npm run build

      - name: Commit verified source patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/GoogleAuthHeader.tsx scripts/rbac-matrix.mjs
          git diff --cached --check
          git commit -m "RC2.2.8: fix stale project-name edit draft [project-name-edit-hotfix]"
          git push origin HEAD:rc2-2-8-data-integrity-master-gate
