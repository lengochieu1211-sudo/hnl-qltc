name: Material Category Identity Gate

on:
  push:
    branches: [gate/material-category-identity-20260909]
    paths:
      - '.gate/apply-material-category-identity.py'
      - '.github/workflows/material-category-identity-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout gate branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct exact candidate on current DEV
        shell: bash
        run: |
          set -euo pipefail
          BASE='6f26b879e67d004aeb49096927d3c23ecff6a18c'
          TRANSFORMER="$(mktemp)"
          git show "gate/material-category-identity-20260909:.gate/apply-material-category-identity.py" > "$TRANSFORMER"
          git checkout --detach "$BASE"
          python "$TRANSFORMER"
          git diff --name-only | sort > /tmp/actual.txt
          printf '%s\n' \
            'scripts/material-need-golden.ts' \
            'src/components/MaterialNormModal.tsx' \
            'src/healthCenter/healthCenterEngine.ts' \
            'src/utils/materialNeedEngine.ts' | sort > /tmp/expected.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git diff --exit-code -- package.json package-lock.json .firebaserc firebase.json firebase.prod.json firestore.rules storage.rules .github/workflows
      - name: Install exact dependencies
        run: npm ci
      - name: Focused material and AI regressions
        run: |
          npm run test:material-need
          npm run test:health-center
          npm run test:ai-tools
      - name: Full release gate
        run: npm run verify
      - name: Final candidate scope
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only | sort > /tmp/final.txt
          diff -u /tmp/expected.txt /tmp/final.txt
