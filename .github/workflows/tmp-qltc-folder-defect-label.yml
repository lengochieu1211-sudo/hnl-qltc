name: TEMP QLTC Folder Defect Appendix Gate

on:
  push:
    branches:
      - fix/android-qltc-folder-defect-appendix-label

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply patch
        run: python3 scripts/tmp-fix-qltc-folder-defect-label.py
      - name: Install dependencies
        run: npm ci
      - name: Verify source
        run: npm run verify
      - name: Commit source changes when needed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-wrapper/src/com/qlct/app/MainActivity.java src/components/ExportPdfModal.tsx
          if git diff --cached --quiet; then
            echo "No source changes to commit."
          else
            git commit -m "fix: QLTC Android folder and Defect appendix label"
            git push
          fi
