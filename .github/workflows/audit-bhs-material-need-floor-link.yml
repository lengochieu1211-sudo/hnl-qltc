name: HNL QLTC DEV BHS Material Need Floor Link Audit

on:
  push:
    branches:
      - audit/dev-bhs-material-need-floor-link-20260915

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: e4839af06a786d87dcd815cb7de1fe44f261c657
      DEV_SHA: 00285910d6cd9d0b07b82de3fe1533e34bdf1bfd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Guard exact certified base and apply BHS fix
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "$GITHUB_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse origin/dev)" = "$DEV_SHA"
          test "$(git diff --name-only "$BASE_SHA...$GITHUB_SHA" | sort | tr '\n' ' ')" = ".github/workflows/audit-bhs-material-need-floor-link.yml "
          git checkout --detach "$BASE_SHA"
          cat > "$RUNNER_TEMP/bhs-fix.patch.gz.b64" <<'PATCH_B64'

PATCH_B64
          tr -d '[:space:]' < "$RUNNER_TEMP/bhs-fix.patch.gz.b64" | base64 -d | gzip -d > "$RUNNER_TEMP/bhs-fix.patch"
          git apply --check "$RUNNER_TEMP/bhs-fix.patch"
          git apply "$RUNNER_TEMP/bhs-fix.patch"
          git diff --check
          test "$(git diff --name-only | sort | tr '\n' ' ')" = "scripts/ai-audit-golden.ts scripts/linkage-calculation-golden.ts src/ai/audit/quantityAudit.ts src/healthCenter/healthCenterEngine.ts src/utils/linkageIntegrity.ts src/utils/materialNeedEngine.ts "
          git diff --exit-code -- package.json package-lock.json .firebaserc firebase.json
      - name: Install exact dependencies
        run: npm ci
      - name: Targeted BHS regressions
        run: npm run test:linkage-calculation && npm run test:material-need && npm run test:ai-audit && npm run test:health-center
      - name: Full certification
        run: npm run verify
      - name: Create clean ready commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/ai-audit-golden.ts scripts/linkage-calculation-golden.ts src/ai/audit/quantityAudit.ts src/healthCenter/healthCenterEngine.ts src/utils/linkageIntegrity.ts src/utils/materialNeedEngine.ts
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = "scripts/ai-audit-golden.ts scripts/linkage-calculation-golden.ts src/ai/audit/quantityAudit.ts src/healthCenter/healthCenterEngine.ts src/utils/linkageIntegrity.ts src/utils/materialNeedEngine.ts "
          git commit -m "fix(dev): restore BHS material need floor linkage"
          git push origin HEAD:refs/heads/audit/dev-bhs-material-need-floor-link-ready-20260915 --force
          git rev-parse HEAD | tee ready-sha.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bhs-material-need-ready-sha
          path: ready-sha.txt
          if-no-files-found: error
