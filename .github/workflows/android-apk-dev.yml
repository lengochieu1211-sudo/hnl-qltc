name: Build HNL QLTC Android DEV APK
# DEV certification build. Runs HNL AI + existing app gates and never uses PROD signing.

on:
  workflow_dispatch:
  push:
    branches: [dev]
    paths:
      - 'android-wrapper/**'
      - 'src/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'scripts/firebase-rules-check.mjs'
      - '.github/workflows/android-apk-dev.yml'

permissions:
  contents: read

env:
  DEV_FIREBASE_PROJECT_ID: hnl-qltc-dev
  PROD_FIREBASE_PROJECT_ID: com-example-qlct-61329
  DEV_HOSTING_URL: https://hnl-qltc-dev.web.app
  DEV_R2_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
  PROD_R2_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
  DEV_AI_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
  PROD_AI_URL: https://hnl-qltc-ai-gateway.lengochieu1211.workers.dev
  DEV_ANDROID_PACKAGE: com.qlct.app.dev
  PROD_ANDROID_PACKAGE: com.qlct.app

jobs:
  build_dev_apk:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyB6y060Mji2684mB-g1qYHoEJ-F1ep5q5M
      VITE_FIREBASE_AUTH_DOMAIN: hnl-qltc-dev.web.app
      VITE_FIREBASE_PROJECT_ID: hnl-qltc-dev
      VITE_FIREBASE_STORAGE_BUCKET: hnl-qltc-dev.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "1036808734475"
      VITE_FIREBASE_APP_ID: 1:1036808734475:web:e124b3ff0c50369393840e
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_HNL_AI_ENABLED: "true"
      VITE_HNL_AI_GATEWAY_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
      QLCT_WEB_URL: https://hnl-qltc-dev.web.app/?app=android&env=dev
      QLCT_RELEASE_TAG: 6.3.0-dev

    steps:
      - name: Checkout DEV
        uses: actions/checkout@v4

      - name: DEV isolation gate
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/dev') { throw "REFUSING: DEV APK must run on dev, got $env:GITHUB_REF" }
          if ($env:VITE_FIREBASE_PROJECT_ID -ne $env:DEV_FIREBASE_PROJECT_ID) { throw 'REFUSING: Firebase project is not HNL QLTC DEV' }
          if ($env:VITE_FIREBASE_PROJECT_ID -eq $env:PROD_FIREBASE_PROJECT_ID) { throw 'REFUSING: DEV APK points to PROD Firebase' }
          if ($env:VITE_R2_GATEWAY_URL -ne $env:DEV_R2_URL) { throw 'REFUSING: R2 gateway is not DEV' }
          if ($env:VITE_R2_GATEWAY_URL -eq $env:PROD_R2_URL) { throw 'REFUSING: DEV APK points to PROD R2' }
          if ($env:VITE_HNL_AI_GATEWAY_URL -ne $env:DEV_AI_URL) { throw 'REFUSING: AI gateway is not DEV' }
          if ($env:VITE_HNL_AI_GATEWAY_URL -eq $env:PROD_AI_URL) { throw 'REFUSING: DEV APK points to PROD AI' }
          if ($env:VITE_HNL_AI_ENABLED -ne 'true') { throw 'REFUSING: HNL AI is not enabled in DEV APK' }
          if ($env:QLCT_WEB_URL -notlike 'https://hnl-qltc-dev.web.app/*') { throw 'REFUSING: Android wrapper URL is not DEV Hosting' }
          if ($env:QLCT_WEB_URL -match 'hnlqltc\.web\.app|com-example-qlct-61329') { throw 'REFUSING: Android wrapper URL references PROD' }
          if ($env:DEV_ANDROID_PACKAGE -eq $env:PROD_ANDROID_PACKAGE) { throw 'REFUSING: DEV Android package equals PROD package' }
          Write-Host 'Android DEV isolation gate: PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: HNL AI and existing stability gates
        shell: pwsh
        run: |
          npm run test:ai-core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-tools
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-planner
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-provider
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-gateway
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:ai-export
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:stability
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Typecheck
        run: npm run typecheck

      - name: Lint and source secret scan
        run: npm run lint

      - name: Firebase Rules regression
        run: npm run test:rules

      - name: Production dependency critical security audit
        run: npm run security:audit

      - name: Build DEV web bundle
        shell: pwsh
        run: |
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $assets = Get-ChildItem './dist/assets' -File -ErrorAction Stop
          $combined = ($assets | ForEach-Object { Get-Content -Raw -LiteralPath $_.FullName -ErrorAction SilentlyContinue }) -join "`n"
          if ($combined -notmatch 'HNL AI Assistant') { throw 'AI UI marker missing from DEV Android web bundle' }
          if ($combined -notmatch 'hnl-qltc-ai-gateway-dev') { throw 'DEV AI gateway missing from DEV Android web bundle' }

      - name: Isolate Android package, label, and signing for DEV
        shell: pwsh
        run: |
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          $manifest = './android-wrapper/AndroidManifest.xml'
          $manifestText = Get-Content -Raw -LiteralPath $manifest
          $manifestText = $manifestText.Replace($env:PROD_ANDROID_PACKAGE, $env:DEV_ANDROID_PACKAGE)
          $manifestText = $manifestText -replace 'android:label="HNL Quản Lý Thi Công"', 'android:label="HNL QLTC DEV"'
          [System.IO.File]::WriteAllText((Resolve-Path $manifest), $manifestText, $utf8)

          Get-ChildItem './android-wrapper/src' -Recurse -Filter '*.java' | ForEach-Object {
            $javaText = Get-Content -Raw -LiteralPath $_.FullName
            $javaText = $javaText.Replace($env:PROD_ANDROID_PACKAGE, $env:DEV_ANDROID_PACKAGE)
            [System.IO.File]::WriteAllText($_.FullName, $javaText, $utf8)
          }

          $after = Get-Content -Raw -LiteralPath $manifest
          if ($after -notmatch ('package="' + [regex]::Escape($env:DEV_ANDROID_PACKAGE) + '"')) { throw 'DEV package rewrite failed' }
          if ($after -match ('package="' + [regex]::Escape($env:PROD_ANDROID_PACKAGE) + '"')) { throw 'PROD package remains in DEV manifest' }
          if ($after -notmatch 'android:label="HNL QLTC DEV"') { throw 'DEV label rewrite failed' }

          Remove-Item Env:QLCT_ANDROID_KEYSTORE_BASE64 -ErrorAction SilentlyContinue
          Remove-Item Env:QLCT_ANDROID_KEYSTORE_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:QLCT_ANDROID_KEY_PASSWORD -ErrorAction SilentlyContinue
          Remove-Item Env:QLCT_ANDROID_KEY_ALIAS -ErrorAction SilentlyContinue

      - name: Build isolated DEV APK
        shell: pwsh
        run: ./android-wrapper/build-apk.ps1

      - name: Verify DEV APK and embedded target
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath './HNL-QLTC-Android.apk')) { throw 'DEV APK was not created' }
          $strings = Get-Content -Raw -LiteralPath './android-wrapper/res/values/strings.xml'
          if ($strings -notmatch 'https://hnl-qltc-dev\.web\.app/') { throw 'DEV Hosting URL not embedded in wrapper resources' }
          if ($strings -match 'https://hnlqltc\.web\.app|com-example-qlct-61329') { throw 'REFUSING: PROD target leaked into DEV wrapper URL' }
          $manifest = Get-Content -Raw -LiteralPath './android-wrapper/AndroidManifest.xml'
          if ($manifest -notmatch 'package="com\.qlct\.app\.dev"') { throw 'DEV APK package source is not com.qlct.app.dev' }
          Move-Item -Force './HNL-QLTC-Android.apk' './HNL-QLTC-Android-DEV.apk'
          Get-Item './HNL-QLTC-Android-DEV.apk' | Format-List Name,Length,LastWriteTime
          Get-FileHash -Algorithm SHA256 './HNL-QLTC-Android-DEV.apk'

      - name: Upload DEV APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-Android-DEV-${{ github.run_number }}
          path: HNL-QLTC-Android-DEV.apk
          if-no-files-found: error
          retention-days: 30
