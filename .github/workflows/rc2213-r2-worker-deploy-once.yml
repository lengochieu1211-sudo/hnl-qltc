name: RC2.2.13 R2 Worker Deploy Once

on:
  push:
    branches:
      - rc2-2-12-android-gallery-picker-hotfix
    paths:
      - '.github/workflows/rc2213-r2-worker-deploy-once.yml'

permissions:
  contents: read

jobs:
  deploy_r2_worker:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc2-2-12-android-gallery-picker-hotfix
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require Cloudflare deploy secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || { echo '::error::MISSING_CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "${CLOUDFLARE_ACCOUNT_ID:-}" || { echo '::error::MISSING_CLOUDFLARE_ACCOUNT_ID'; exit 1; }
      - name: Deploy existing HNL QLTC R2 Worker
        working-directory: cloudflare/r2-gateway
        shell: bash
        run: |
          set -euo pipefail
          cat > wrangler.ci.toml <<'EOF'
          name = "hnl-qltc-r2-gateway"
          main = "worker.js"
          compatibility_date = "2026-08-30"

          [[r2_buckets]]
          binding = "HNL_QLTC_MEDIA"
          bucket_name = "hnl-qltc-media"

          [vars]
          FIREBASE_PROJECT_ID = "com-example-qlct-61329"
          SUPER_ADMIN_EMAIL = "lengochieu1211@gmail.com"
          ALLOWED_ORIGINS = "https://hnlqltc.web.app,https://com-example-qlct-61329.web.app,https://com-example-qlct-61329.firebaseapp.com"
          MAX_UPLOAD_BYTES = "26214400"
          EOF
          npx --yes wrangler@4.33.0 deploy --config wrangler.ci.toml
          rm -f wrangler.ci.toml
