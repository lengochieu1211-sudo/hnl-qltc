name: HNL DEV Main Hosting LIVE read-only health and source identity (NO DEPLOY)
on:
  push:
    branches: [qa/dev-main-hosting-readonly-20261101]
permissions:
  contents: read
jobs:
  read-only-dev-live:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact DEV source and no-code-change guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=6073580c0d5ebcce1b6669f531d7140c384a78d3
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/qa/dev-main-hosting-readonly-20261101
          test "$(git rev-parse HEAD^)" = "$BASE"
          test "$(git diff --name-only "$BASE" HEAD)" = '.github/workflows/hnl-dev-main-hosting-readonly.yml'
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$BASE"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 1c2b7d663d51d51aa45010e533d8e035e22adf59
      - name: READ ONLY GET live DEV Hosting and release identity (no Firebase keys)
        shell: bash
        run: |
          set -euo pipefail
          ROOT="https://hnl-qltc-dev.web.app"
          mkdir -p evidence
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const urls=[
           ['index','https://hnl-qltc-dev.web.app/'],
           ['release','https://hnl-qltc-dev.web.app/hnl-dev-release.json'],
           ['prod-index','https://hnlqltc.web.app/']
          ];
          const results={checkedAt:new Date().toISOString(),sourceDevHead:'6073580c0d5ebcce1b6669f531d7140c384a78d3',sourceProdHead:'1c2b7d663d51d51aa45010e533d8e035e22adf59',readOnly:true,items:[]};
          for (const [kind,url] of urls) {
            try {
             const response=await fetch(url,{redirect:'follow',signal:AbortSignal.timeout(20000),headers:{'Cache-Control':'no-cache'}});
             const body=await response.text();
             const item={kind,host:new URL(url).hostname,httpStatus:response.status,contentType:response.headers.get('content-type')||'',bytes:Buffer.byteLength(body)};
             if(kind==='release'&&response.ok){
               try {
                const j=JSON.parse(body);
                const possibleHeads=[j.commit,j.sha,j.gitSha,j.gitCommit,j.head,j.headSha,j.sourceSha,j.git?.commit,j.build?.gitCommit].filter(x=>typeof x==='string');
                item.deployedCommitCandidates=possibleHeads;
                item.releaseJsonKeys=Object.keys(j).slice(0,35);
                item.matchesCurrentDevHead=possibleHeads.includes(results.sourceDevHead);
               }catch{item.releaseJsonParse='FAILED';}
             }
             results.items.push(item);
             console.log(JSON.stringify(item));
            }catch(err){
             const item={kind,host:new URL(url).hostname,error:String(err).slice(0,220)};
             results.items.push(item);console.log(JSON.stringify(item));
            }
          }
          results.devIsServing=results.items[0]?.httpStatus===200&&results.items[1]?.httpStatus===200;
          fs.writeFileSync('evidence/DEV-MAIN-HOSTING-READONLY.json',JSON.stringify(results,null,2));
          if (!results.devIsServing) {
            console.error('DEV Hosting is not serving 200 for index + release identity. NO DEPLOY performed.');
            process.exitCode=2;
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: HNL-DEV-MAIN-HOSTING-READONLY-${{ github.sha }}
          path: evidence/DEV-MAIN-HOSTING-READONLY.json
          retention-days: 15
          if-no-files-found: warn
