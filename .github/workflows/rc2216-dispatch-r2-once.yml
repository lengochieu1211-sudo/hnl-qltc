name: RC2.2.16 Dispatch R2 Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc2216-dispatch-r2-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch official R2 deploy workflow
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${REPO}/actions/workflows/r2-worker-deploy.yml/dispatches" \
            -d '{"ref":"main"}'
          echo 'Dispatched Deploy HNL QLTC R2 Worker on main.'
