name: Temporary Member Contact Generic Rule Patcher
on:
  push:
    branches: [feat/member-contact-directory-phase3]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/member-contact-directory-phase3
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch-member-contact-generic-rule.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firestore.rules
          git commit -m "fix: keep member contacts outside generic project rules"
          git push origin HEAD:feat/member-contact-directory-phase3
