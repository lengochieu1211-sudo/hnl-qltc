name: Gate Orphan Repair UI V4

on:
  push:
    branches:
      - gate/orphan-repair-ui-v4-20260909

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated gate branch
        uses: actions/checkout@v4
        with:
          ref: gate/orphan-repair-ui-v4-20260909
          fetch-depth: 2

      - name: Materialize exact reviewed patch
        shell: bash
        run: |
          cat > /tmp/orphan_ui_v4.b64 <<'EOF'

EOF
          base64 -d /tmp/orphan_ui_v4.b64 | gzip -d > /tmp/orphan_ui_v4.patch
          echo "85c01967908af5c5b42e434828c3ffa9c03f352c67d4a0a94c4514fdaed7281d  /tmp/orphan_ui_v4.patch" | sha256sum -c -
          git apply --check /tmp/orphan_ui_v4.patch
          git apply /tmp/orphan_ui_v4.patch

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact dependencies
        run: npm ci

      - name: Focused Health Center orphan gates
        run: npm run test:health-center

      - name: Full verification
        run: npm run verify

      - name: Scope guard
        shell: bash
        run: |
          python - <<'PY'
          import subprocess
          allowed = {
            'src/components/BottomNav.tsx',
            'src/components/GoogleConfigTab.tsx',
            'src/healthCenter/HealthCenterPanelBase.tsx',
            'src/components/RoomHighlightModal.tsx',
            'src/components/FloorPlanDefectTab.tsx',
            'scripts/health-center-navigation-golden.ts',
            'scripts/stability-gate.mjs',
          }
          changed = set(filter(None, subprocess.check_output(['git','diff','--name-only'], text=True).splitlines()))
          if changed != allowed:
              raise SystemExit(f'Unexpected scope. changed={sorted(changed)}')
          print('Scope PASS:', sorted(changed))
          PY
          git diff --exit-code -- package.json package-lock.json .firebaserc firebase.json firestore.rules storage.rules .github/workflows/build.yml .github/workflows/firebase-hosting-merge.yml .github/workflows/firebase-dev-environment.yml

      - name: Commit verified source patch to gate branch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/BottomNav.tsx src/components/GoogleConfigTab.tsx src/healthCenter/HealthCenterPanelBase.tsx src/components/RoomHighlightModal.tsx src/components/FloorPlanDefectTab.tsx scripts/health-center-navigation-golden.ts scripts/stability-gate.mjs
          git commit -m "fix: complete orphan work-category repair UX"
          git push origin HEAD:gate/orphan-repair-ui-v4-20260909
