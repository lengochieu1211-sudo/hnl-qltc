name: TEMP ProjectManager Back

on:
  push:
    branches:
      - ux/sync-center-flat-layout-20260910

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/sync-center-flat-layout-20260910
      - name: Apply modal Back behavior and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('src/components/ProjectManagerModal.tsx')
          s = p.read_text(encoding='utf-8')
          old = '''  // Handle ESC key to close modal
  useEffect(() => {
    const handleKeyDown = (e: KeyboardEvent) => {
      if (e.key === 'Escape' && isOpen) {
        if (showJsonScopePicker) {
          setShowJsonScopePicker(false);
        } else {
          onClose();
        }
      }
    };
    window.addEventListener('keydown', handleKeyDown);
    return () => window.removeEventListener('keydown', handleKeyDown);
  }, [isOpen, onClose, showJsonScopePicker]);
'''
          new = '''  // Close the current layer consistently: PC Esc and Android/browser Back.
  useEffect(() => {
    if (!isOpen || typeof window === 'undefined') return;

    const marker = `hnl-project-manager-${Date.now()}-${Math.random().toString(36).slice(2)}`;
    let historyEntryActive = false;
    let closingFromPopState = false;

    const closeCurrentLayer = () => {
      if (showJsonScopePicker) {
        setShowJsonScopePicker(false);
      } else {
        onClose();
      }
    };

    const handleKeyDown = (e: KeyboardEvent) => {
      if (e.key !== 'Escape') return;
      e.preventDefault();
      closeCurrentLayer();
    };

    const handlePopState = () => {
      closingFromPopState = true;
      historyEntryActive = false;
      closeCurrentLayer();
    };

    try {
      window.history.pushState({ ...window.history.state, __hnlProjectManager: marker }, '', window.location.href);
      historyEntryActive = true;
    } catch (_) {
      historyEntryActive = false;
    }

    window.addEventListener('keydown', handleKeyDown);
    window.addEventListener('popstate', handlePopState);
    return () => {
      window.removeEventListener('keydown', handleKeyDown);
      window.removeEventListener('popstate', handlePopState);
      const currentMarker = window.history.state?.__hnlProjectManager;
      if (historyEntryActive && !closingFromPopState && currentMarker === marker) {
        historyEntryActive = false;
        window.history.back();
      }
    };
  }, [isOpen, onClose, showJsonScopePicker]);
'''
          if s.count(old) != 1:
              raise SystemExit(f'ESC effect match count={s.count(old)}')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          g = Path('scripts/ui-entry-ux-golden.ts')
          t = g.read_text(encoding='utf-8')
          anchor = "assert(syncCenter.includes('Xuất bản sao JSON') && syncCenter.includes('Khôi phục từ JSON'), 'JSON backup/restore actions must remain available');\n"
          add = "assert(projectManager.includes(\"window.addEventListener('popstate'\"), 'Sync/Project modal Android/browser Back close behavior missing');\n"
          if anchor not in t:
              raise SystemExit('golden anchor missing')
          t = t.replace(anchor, anchor + add, 1)
          g.write_text(t, encoding='utf-8')
          PY

          npm ci
          npm run test:ui-entry-ux
          npm run typecheck
          npm run lint
          npm run build

      - name: Commit and clean temp workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-projectmanager-back.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ProjectManagerModal.tsx scripts/ui-entry-ux-golden.ts .github/workflows/_tmp-projectmanager-back.yml
          git diff --cached --check
          git commit -m "fix(ui): align modal Back behavior across platforms"
          git push origin HEAD:ux/sync-center-flat-layout-20260910
