name: RC2.2.16 Drive Backup Bundle

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc2-2-16-drive-backup.yml'

permissions:
  contents: write
  actions: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build continuation backup bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT='HNL-QLTC-RC2.2.16-CONTINUATION-BACKUP-2026-08-31'
          mkdir -p "$ROOT/artifacts" "$ROOT/evidence"
          git archive --format=zip --output="$ROOT/HNL-QLTC-V6.3.0-RC2.2.16-FULL-SOURCE-LATEST.zip" HEAD
          android_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/android-apk.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          windows_run=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/windows-exe.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -n "$android_run" ]; then gh run download "$android_run" -D "$ROOT/artifacts/android" || true; fi
          if [ -n "$windows_run" ]; then gh run download "$windows_run" -D "$ROOT/artifacts/windows" || true; fi
          cat > "$ROOT/HNL-QLTC-RC2.2.16-CONTINUATION-CHECKPOINT.md" <<EOF
          # HNL QLTC - Continuation Checkpoint 2026-08-31 - RC2.2.16

          ## Source mới nhất
          - GitHub repo: lengochieu1211-sudo/hnl-qltc
          - Branch: main
          - Commit backup: ${GITHUB_SHA}
          - Firebase project: com-example-qlct-61329
          - Hosting: https://hnlqltc.web.app
          - R2 Worker: hnl-qltc-r2-gateway.lengochieu1211.workers.dev
          - R2 bucket: hnl-qltc-media
          - Không rollback source cũ.

          ## Đã hoàn thành
          - R2 Worker RC2.2.16 đã deploy; CORS PUT/Authorization/Content-Type/X-HNL-Metadata PASS.
          - PROD Hosting final deploy run 33384196510 PASS; Full release gate PASS; PROD smoke PASS.
          - Đã sửa photo reconcile đa tài khoản: Cloud mới hơn tự hòa giải local.
          - Đã sửa revision/updatedAt cho metadata pending/legacy -> R2-ready, không nới Firestore RBAC.
          - EDITOR không còn retry migrate floor-plan trái quyền.
          - Diagnostic Android export 0 KB đã sửa.
          - Các workflow tạm final deploy đã được dọn khỏi main trước backup này.

          ## Runtime evidence đã có
          - ADMIN diagnostics: pendingDriveUploads=0, photoPending=0, 37 active/37 ready.
          - Có ảnh do EDITOR tạo xuất hiện phía ADMIN với storageProvider=r2 và belongsToCurrentUploader=false.
          - R2/CORS Failed to fetch nguyên nhân gốc đã được xử lý.

          ## Việc còn phải Golden trong chat mới
          1. Trên Android EDITOR đóng/mở app, online 1-2 phút, xuất diagnostics mới.
          2. Xác nhận 2 ảnh Crew legacy/pending trước đây không còn Missing or insufficient permissions.
          3. Xác nhận photoDiagnostics Android không còn metadata pending cũ/reconcile stale.
          4. ADMIN thiết bị khác phải thấy và mở binary ảnh mới của EDITOR sau cold restart.
          5. Test Crew + Defect before/after + Chat attachment, cùng điện thoại logout A/login B và PC <-> Android nếu có.
          6. Test Defect notification deep-link đúng project/floor/defect và gallery swipe nhiều ảnh.
          7. Chỉ khi Runtime Golden thật PASS mới gắn nhãn PHOTO CROSS-ACCOUNT PROD CERTIFIED.
          8. Nếu còn lỗi runtime, sửa trên source mới nhất trong backup này; không rollback.

          ## Quy tắc chuyển chat
          Đọc checkpoint này trước. Lấy FULL SOURCE LATEST trong cùng gói/Drive làm nền duy nhất. Không đổi Firebase project, Hosting, R2 bucket hoặc GitHub repo. Không khai báo PASS nếu chưa có evidence runtime thật.
          EOF
          cat > "$ROOT/FINAL-STATUS-REPORT.md" <<EOF
          # RC2.2.16 Final Status Report
          - Backup date: 2026-08-31
          - Source commit: ${GITHUB_SHA}
          - PROD deploy run: 33384196510 SUCCESS
          - PROD full release gate: PASS
          - PROD hosting smoke: PASS
          - R2 Worker/CORS: PASS
          - Cross-account photo runtime: substantially repaired; final physical-device Golden remains required as listed in checkpoint.
          EOF
          printf 'android_run=%s\nwindows_run=%s\ncommit=%s\n' "$android_run" "$windows_run" "$GITHUB_SHA" > "$ROOT/evidence/build-runs.txt"
          (cd "$ROOT" && find . -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt)
          zip -qr "${ROOT}.zip" "$ROOT"
      - uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-RC2.2.16-CONTINUATION-BACKUP-2026-08-31
          path: HNL-QLTC-RC2.2.16-CONTINUATION-BACKUP-2026-08-31.zip
          if-no-files-found: error
          retention-days: 30
      - name: Remove one-shot backup workflow
        run: |
          rm -f .github/workflows/rc2-2-16-drive-backup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/rc2-2-16-drive-backup.yml
          git commit -m 'chore: remove RC2.2.16 backup workflow'
          git push origin HEAD:main
