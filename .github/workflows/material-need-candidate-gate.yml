name: Material Need Candidate Gate

on:
  push:
    branches:
      - gate/material-need-20260908
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-material-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout gate baseline
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify gate parent is DEV 26f2790 lineage
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 26f2790597e4d94c9b704828a9517cbfcc670877 HEAD
          test "$(git rev-parse 26f2790597e4d94c9b704828a9517cbfcc670877^{tree})" = "8f77c7490f5bbec6c837143bb14484ccd3bcf6e6"

      - name: Assemble and apply candidate patch
        shell: bash
        run: |
          set -euo pipefail
          cat .gate/material-v2/part0[0-5].patch > /tmp/material-candidate.patch
          cp .gate/material-v2/part06.patch /tmp/material-fixture-fix.patch
          echo "PRIMARY_PATCH_BYTES=$(wc -c < /tmp/material-candidate.patch)"
          sha256sum /tmp/material-candidate.patch /tmp/material-fixture-fix.patch
          patch -p1 --dry-run < /tmp/material-candidate.patch
          patch -p1 < /tmp/material-candidate.patch
          patch -p1 --dry-run < /tmp/material-fixture-fix.patch
          patch -p1 < /tmp/material-fixture-fix.patch
          rm -rf .gate

      - name: Verify protected infrastructure files unchanged by candidate
        shell: bash
        run: |
          set -euo pipefail
          cat /tmp/material-candidate.patch /tmp/material-fixture-fix.patch > /tmp/material-all.patch
          if grep -E '^diff .* (hnl_qltc_base_fresh|hnl_qltc_candidate_v2)/(\.firebaserc|firebase\.json|firebase\.prod\.json|firestore\.rules|storage\.rules|\.github/workflows/|package-lock\.json)' /tmp/material-all.patch; then
            echo 'Candidate patch touches protected infrastructure or package-lock.' >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install exact dependencies
        run: npm ci

      - name: Package lock consistency
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- package-lock.json

      - name: Material Need golden
        run: npm run test:material-need

      - name: AI deterministic material gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:ai-planner
          npm run test:ai-tools
          npm run test:ai-external-context

      - name: Full stability regression
        run: npm run test:stability

      - name: TypeScript
        run: npm run typecheck

      - name: Source lint
        run: npm run lint

      - name: Firebase rules regression
        run: npm run test:rules

      - name: Dependency security audit
        run: npm run security:audit

      - name: Production build
        run: npm run build

      - name: Final no-infrastructure-drift assertion
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code -- .firebaserc firebase.json firebase.prod.json firestore.rules storage.rules package-lock.json
          echo 'MATERIAL NEED CANDIDATE FULL GATE PASS'

      - name: Promote verified source to DEV only
        shell: bash
        run: |
          set -euo pipefail
          BASE=26f2790597e4d94c9b704828a9517cbfcc670877
          git fetch origin dev
          test "$(git rev-parse origin/dev)" = "$BASE"
          FILES=(
            package.json
            scripts/ai-external-context-golden.ts
            scripts/ai-planner-golden.ts
            scripts/ai-tool-registry-golden.ts
            scripts/material-need-golden.ts
            src/App.tsx
            src/ai/data/externalAiContext.ts
            src/ai/orchestrator/aiOrchestrator.ts
            src/ai/planning/queryPlanner.ts
            src/ai/tools/toolRegistry.ts
            src/ai/tools/toolValidation.ts
            src/components/RoomHighlightModal.tsx
            src/components/WarehouseTab.tsx
            src/types.ts
            src/utils/excelExport.ts
            src/utils/materialNeedEngine.ts
          )
          git diff --binary -- "${FILES[@]}" > /tmp/material-final-source.patch
          test -s /tmp/material-final-source.patch
          git reset --hard "$BASE"
          git apply --check /tmp/material-final-source.patch
          git apply /tmp/material-final-source.patch
          git add -- "${FILES[@]}"
          printf '%s\n' "${FILES[@]}" | sort > /tmp/expected-files.txt
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --exit-code -- package-lock.json .firebaserc firebase.json firebase.prod.json firestore.rules storage.rules .github/workflows
          git config user.name 'HNL QLTC Release Gate'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'feat: deterministic material need engine for floor team and AI'
          test "$(git rev-parse HEAD^)" = "$BASE"
          git push origin HEAD:dev
          echo "DEV_PROMOTED_SHA=$(git rev-parse HEAD)"
