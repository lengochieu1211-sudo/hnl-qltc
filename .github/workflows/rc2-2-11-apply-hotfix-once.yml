name: RC2.2.11 Apply Hotfix Once
on:
  push:
    branches: [rc2-2-11-photo-speed-taskbar-icon]
    paths:
      - '.github/workflows/rc2-2-11-apply-hotfix-once.yml'

permissions:
  contents: write

jobs:
  apply_hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify staged patch
        shell: bash
        run: |
          set -euo pipefail
          echo '8cc532e563b14951ded4a51d95cf47f7d77dbbe663e949452e057a3b67af1cbb  .github/rc2211-hotfix.patch' | sha256sum -c -
          git apply --check .github/rc2211-hotfix.patch
      - name: Apply RC2.2.11 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply .github/rc2211-hotfix.patch
          git diff --check
      - name: Source gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stability-gate.mjs
          node scripts/offline-golden.mjs
          node scripts/category-golden.mjs
          node scripts/firebase-only-golden.mjs
          node scripts/firebase-only-legacy-audit.mjs --self-test
          node scripts/emulator-golden.mjs
          node scripts/rbac-matrix.mjs
          node scripts/r2-gateway-golden.mjs
          node scripts/desktop-launcher-golden.mjs
          node scripts/auth-popup-golden.mjs
          node scripts/source-lint.mjs
      - name: Commit source-only hotfix
        shell: bash
        run: |
          set -euo pipefail
          # Workflow files are updated separately by the GitHub connector because
          # the Actions bot token cannot create/update workflow definitions.
          git checkout HEAD -- .github/workflows/android-apk.yml .github/workflows/windows-exe.yml
          rm -f .github/rc2211-hotfix.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: RC2.2.11 photo sync latency and Windows taskbar icon'
          git push origin HEAD:rc2-2-11-photo-speed-taskbar-icon
