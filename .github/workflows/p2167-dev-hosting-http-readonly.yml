name: P21.67 DEV Hosting read-only HTTP status (NO DEPLOY)
on:
  push:
    branches: [audit/p2167-dev-hosting-http-20261029]
    paths: [.github/workflows/p2167-dev-hosting-http-readonly.yml]
permissions:
  contents: read
jobs:
  hosting_status:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Guard exact DEV source, no credentials, and read-only public HTTP GET
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/audit/p2167-dev-hosting-http-20261029'
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = 'ad69668ec02202811203ad36a3c70798d8874ec8'
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = 'b2557860fbb3b128b5f2c9863e99d0f8b1f78686'
          test "$(git ls-remote origin refs/heads/safety/dev-backup-room-highlight-uniform-stroke-20261029 | cut -f1)" = '04a7ab041f631e6fd5e764d12da1c878f4b82afc'
      - name: Check public DEV and PROD HTML status without login or mutations
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p evidence
          printf "env\turl\tcurl_exit\thttp_status\tbytes\tsha256\tcontent_type\tclassification\n" > evidence/http-status.tsv
          for env in dev dev_desktop backup backup_desktop prod; do
            case "$env" in
              dev) url='https://hnl-qltc-dev.web.app/' ;;
              dev_desktop) url='https://hnl-qltc-dev.web.app/?app=desktop&env=dev' ;;
              backup) url='https://hnl-qltc-dev-backup.web.app/' ;;
              backup_desktop) url='https://hnl-qltc-dev-backup.web.app/?app=desktop&env=dev' ;;
              prod) url='https://hnlqltc.web.app/' ;;
            esac
            curl -sSL --connect-timeout 10 --max-time 35 --retry 1 -D "evidence/$env.headers" -o "evidence/$env.body" -w '%{http_code}' "$url" > "evidence/$env.httpcode"
            rc=$?
            http="$(cat "evidence/$env.httpcode")"
            test -n "$http" || http=none
            size="$(wc -c < "evidence/$env.body" 2>/dev/null || printf '0')"
            sha="$(sha256sum "evidence/$env.body" 2>/dev/null | cut -d' ' -f1)"
            typ="$(grep -i '^content-type:' "evidence/$env.headers" | tail -1 | cut -d: -f2- | tr '\r\n\t' '   ' | sed 's/^ *//')"
            classification='unclassified'
            if [ "$rc" -ne 0 ]; then classification='transport-error'
            elif [ "$http" = 509 ]; then classification='HTTP-509'
            elif [ "$http" != 200 ]; then classification="HTTP-$http"
            elif grep -Eqi '(quota exceeded|usage limit|billing account|resource exhausted|quota limit)' "evidence/$env.body"; then classification='quota-text-HTTP-200'
            elif grep -Eq '(<!doctype html|<html)' "evidence/$env.body"; then classification='HTML-HTTP-200'
            else classification='nonhtml-HTTP-200'; fi
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "$env" "$url" "$rc" "$http" "$size" "$sha" "$typ" "$classification" | tee -a evidence/http-status.tsv
            rm -f "evidence/$env.body"
          done
          echo 'P21.67 read-only Hosting diagnostic complete; no deploy performed.'
      - name: Verify LIVE DEV Backup Firebase and R2 target from public deployed assets (read-only)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const origin='https://hnl-qltc-dev-backup.web.app';
          const init=await fetch(origin+'/__/firebase/init.json');
          if(!init.ok)throw Error('DEV_BACKUP_SDK_HTTP_'+init.status);
          const cfg=await init.json();
          if(cfg.projectId!=='hnl-qltc-dev-backup'||cfg.authDomain!=='hnl-qltc-dev-backup.web.app')throw Error('DEV_BACKUP_FIREBASE_IDENTITY_MISMATCH');
          const index=await fetch(origin+'/?qaScope='+Date.now());
          const html=await index.text();
          if(!index.ok||!html.includes('id="root"'))throw Error('DEV_BACKUP_HTML_MISSING_APP_ROOT');
          const manifestResponse=await fetch(origin+'/sw-assets.json');
          if(!manifestResponse.ok)throw Error('DEV_BACKUP_ASSET_MANIFEST_HTTP_'+manifestResponse.status);
          const manifest=await manifestResponse.json();
          const assets=(manifest.assets||[]).filter(x=>/^\/assets\/[a-zA-Z0-9_.-]+\.js$/.test(x));
          if(assets.length<10)throw Error('DEV_BACKUP_ASSETS_INCOMPLETE');
          let qaFirebase=false,qaR2=false,allOk=true,bytes=0;
          for(const path of assets){
            const response=await fetch(origin+path);
            if(!response.ok){allOk=false;break}
            const code=await response.text();
            bytes+=Buffer.byteLength(code);
            if(code.includes('hnl-qltc-dev-backup.web.app'))qaFirebase=true;
            if(code.includes('hnl-qltc-r2-gateway-dev-backup'))qaR2=true;
          }
          if(!allOk||!qaFirebase||!qaR2)throw Error('DEV_BACKUP_LIVE_ASSET_ENV_MISMATCH');
          const report={
            status:'P2168_DEV_BACKUP_PUBLIC_RUNTIME_TARGETS_PASS',
            verifiedAt:new Date().toISOString(),
            backupSite:origin,
            firebaseProjectId:cfg.projectId,
            authDomain:cfg.authDomain,
            r2Gateway:'hnl-qltc-r2-gateway-dev-backup.lengochieu1211.workers.dev',
            htmlStatus:index.status,
            sdkStatus:init.status,
            jsAssetCount:assets.length,
            jsBytesScanned:bytes,
            qaFirebaseBundlePresent:qaFirebase,
            qaR2BundlePresent:qaR2,
            signedInTwoUserGolden:false,
            prodOrMainModified:false,
            readOnly:true
          };
          fs.writeFileSync('evidence/dev-backup-public-identity.json',JSON.stringify(report,null,2)+'\n');
          console.log(JSON.stringify(report));
          NODE
      - name: Preserve observed HTTP metadata (not site contents)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P2167-DEV-HOSTING-HTTP-READONLY
          path: |
            evidence/http-status.tsv
            evidence/*.headers
            evidence/*.httpcode
            evidence/dev-backup-public-identity.json
          if-no-files-found: error
          retention-days: 30
