name: RC2.2.16 Dispatch Final Artifacts Once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rc2216-dispatch-final-artifacts-once.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch Android and Windows final builds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          for wf in android-apk.yml windows-exe.yml; do
            curl --fail --silent --show-error \
              -X POST \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${REPO}/actions/workflows/${wf}/dispatches" \
              -d '{"ref":"main"}'
            echo "Dispatched ${wf}"
          done
