name: SuperAdmin UI Settings Materialize

on:
  push:
    branches:
      - feature/superadmin-ui-pin-reset-20260901
    paths:
      - '.github/workflows/superadmin-ui-settings-materialize.yml'
      - 'scripts/materialize-superadmin-ui-settings.py'
      - 'scripts/fix-superadmin-ui-rbac-guard.py'

permissions:
  contents: write

jobs:
  patch_test_materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/superadmin-ui-pin-reset-20260901
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Super Admin UI settings patch
        run: python3 scripts/materialize-superadmin-ui-settings.py
      - name: Fix regression guard helper
        run: python3 scripts/fix-superadmin-ui-rbac-guard.py
      - run: npm ci
      - name: Stability
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rules
        run: npm run test:rules
      - name: Security
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Commit certified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HNL QLTC CI"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/superadmin-ui-settings-materialize.yml scripts/materialize-superadmin-ui-settings.py scripts/fix-superadmin-ui-rbac-guard.py
          git add src/App.tsx src/components/SuperAdminCenter.tsx scripts/rbac-matrix.mjs .github/workflows/superadmin-ui-settings-materialize.yml scripts/materialize-superadmin-ui-settings.py scripts/fix-superadmin-ui-rbac-guard.py
          git commit -m "Add Super Admin UI and module settings"
          git push origin HEAD:feature/superadmin-ui-pin-reset-20260901
