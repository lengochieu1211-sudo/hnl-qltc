name: SuperAdmin UI Settings Materialize

on:
  push:
    branches:
      - feature/superadmin-ui-pin-reset-20260901
    paths:
      - '.github/workflows/superadmin-ui-settings-materialize.yml'
      - 'scripts/materialize-superadmin-ui-settings.py'

permissions:
  contents: write

jobs:
  patch_test_materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/superadmin-ui-pin-reset-20260901
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Super Admin UI settings patch
        run: python3 scripts/materialize-superadmin-ui-settings.py
      - name: Fix regression guard helper
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/rbac-matrix.mjs')
          s = p.read_text(encoding='utf-8')
          old = """assertContains(firebaseSource, 'requestProjectMemberPinReset', 'SUPER ADMIN remote PIN reset API is wired');
assertContains(firebaseSource, 'isSuperAdminEmail(actor.email)', 'remote PIN reset is company SUPER ADMIN-bound');
assertContains(appSource, 'subscribeCurrentUserPinResetRealtime', 'target account listens for remote PIN reset');
assertContains(securitySource, 'applyRemotePinReset', 'remote reset clears local PIN through monotonic epoch helper');
console.log('PASS RBAC: SUPER ADMIN remote PIN reset is identity-bound and target-listened');
"""
          new = """check('SUPER ADMIN remote PIN reset API is wired', has(src.firebase, 'requestProjectMemberPinReset'));
check('remote PIN reset is company SUPER ADMIN-bound', has(src.firebase, 'isSuperAdminEmail(actor.email)'));
check('target account listens for remote PIN reset', has(src.app, 'subscribeCurrentUserPinResetRealtime'));
check('remote reset clears local PIN through monotonic epoch helper', has(src.security, 'applyRemotePinReset'));
"""
          if old not in s:
              raise SystemExit('old regression guard block not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - run: npm ci
      - name: Stability
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rules
        run: npm run test:rules
      - name: Security
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Commit certified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HNL QLTC CI"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/superadmin-ui-settings-materialize.yml scripts/materialize-superadmin-ui-settings.py
          git add src/App.tsx src/components/SuperAdminCenter.tsx scripts/rbac-matrix.mjs .github/workflows/superadmin-ui-settings-materialize.yml scripts/materialize-superadmin-ui-settings.py
          git commit -m "Add Super Admin UI and module settings"
          git push origin HEAD:feature/superadmin-ui-pin-reset-20260901
