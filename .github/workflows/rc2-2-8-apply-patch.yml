name: RC2.2.8 Apply Asserted Patch

on:
  push:
    branches:
      - rc2-2-8-data-integrity-master-gate
    paths:
      - scripts/rc2_2_8_apply_patch.py
      - .github/workflows/rc2-2-8-apply-patch.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout WIP branch
        uses: actions/checkout@v4
        with:
          ref: rc2-2-8-data-integrity-master-gate
          fetch-depth: 0

      - name: Apply asserted RC2.2.8 patch
        run: python3 scripts/rc2_2_8_apply_patch.py

      - name: Remove one-shot patch machinery
        run: |
          rm -f scripts/rc2_2_8_apply_patch.py
          rm -f .github/workflows/rc2-2-8-apply-patch.yml

      - name: Commit patched source to WIP branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git diff --cached --stat
          git commit -m "RC2.2.8: canonical RBAC and Defect deep-link [rc2.2.8-applied]"
          git push origin HEAD:rc2-2-8-data-integrity-master-gate
