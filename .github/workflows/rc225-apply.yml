name: RC2.2.5 Candidate Gate

on:
  push:
    branches:
      - rc225-apply-staging
    paths:
      - '.rc225/READY'

permissions:
  contents: write

jobs:
  candidate:
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BUILD_ID: rc225-candidate-${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout staging payload
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct and verify RC2.2.5 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .rc225/part*.b64 | base64 -d > /tmp/rc225.patch.gz
          echo "d357bd38ec77860318d719aa1bbfc99e0c1483cd1a83732a0e24452dfd9c4913  /tmp/rc225.patch.gz" | sha256sum -c -
          gzip -dc /tmp/rc225.patch.gz > /tmp/rc225.patch
          echo "5333f0a7e6c893ca38d3ec605966283df60372a2eb19d4b85d80882945ad5871  /tmp/rc225.patch" | sha256sum -c -

      - name: Rebuild exact post-image from patch ancestor
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin rc2-2-emulator-dev-golden
          ACTUAL_BASE="$(git rev-parse origin/rc2-2-emulator-dev-golden)"
          EXPECTED_BASE="8375ff69450dc8ba4b014612045318e48ea34fc3"
          test "$ACTUAL_BASE" = "$EXPECTED_BASE" || { echo "Target baseline changed: $ACTUAL_BASE"; exit 1; }

          rm -rf /tmp/rc225-exact /tmp/rc225-ancestor.index
          mkdir -p /tmp/rc225-exact
          git apply --build-fake-ancestor=/tmp/rc225-ancestor.index /tmp/rc225.patch
          GIT_INDEX_FILE=/tmp/rc225-ancestor.index git checkout-index --all --prefix=/tmp/rc225-exact/
          (
            cd /tmp/rc225-exact
            git --git-dir="$GITHUB_WORKSPACE/.git" apply --whitespace=nowarn /tmp/rc225.patch
          )

          cat > /tmp/expected-files.txt <<'EOF'
          HNL-QLTC-V6.3.0-RC2.2.5-MASTER-RBAC-REPORT.md
          firestore.rules
          package.json
          scripts/emulator-golden.mjs
          scripts/firebase-rules-behavior.mjs
          scripts/rbac-matrix.mjs
          src/App.tsx
          src/components/ChecklistTab.tsx
          src/components/CrewTab.tsx
          src/components/FloorPlanDefectTab.tsx
          src/components/GoogleConfigTab.tsx
          src/components/MaterialNormModal.tsx
          src/components/PhotoAttachmentPicker.tsx
          src/components/ProjectManagerModal.tsx
          src/components/RoomHighlightModal.tsx
          src/components/SecurityModal.tsx
          src/components/WarehouseTab.tsx
          src/utils/securityUtils.ts
          storage.rules
          EOF
          sed -i 's/^          //' /tmp/expected-files.txt

          git checkout -B rc225-candidate-tested origin/rc2-2-emulator-dev-golden
          while IFS= read -r file; do
            mkdir -p "$(dirname "$file")"
            cp "/tmp/rc225-exact/$file" "$file"
          done < /tmp/expected-files.txt
          git add --pathspec-from-file=/tmp/expected-files.txt

      - name: Apply CI root fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('src/components/FloorPlanDefectTab.tsx')
          s = p.read_text()
          old = """  const canManageStructure = roleResolved && canManageFloorPlanStructure(userRole);\n  const canEditDefects = roleResolved && canEditDefectData(userRole);\n  const canDeleteDefects = roleResolved && canDeleteBusinessData(userRole);\n"""
          new = """  const normalizedUserRole: UserRole = userRole === 'ADMIN' || userRole === 'EDITOR' ? userRole : 'VIEWER';\n  const canManageStructure = roleResolved && canManageFloorPlanStructure(normalizedUserRole);\n  const canEditDefects = roleResolved && canEditDefectData(normalizedUserRole);\n  const canDeleteDefects = roleResolved && canDeleteBusinessData(normalizedUserRole);\n"""
          if old not in s:
              raise SystemExit('FloorPlan role typing anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('src/components/SecurityModal.tsx')
          s = p.read_text()
          old = "  Shield,\n  Lock,\n"
          new = "  Shield,\n  ShieldCheck,\n  Lock,\n"
          if old not in s:
              raise SystemExit('Security ShieldCheck import anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('scripts/emulator-golden.mjs')
          s = p.read_text()
          old = "  'const canManageStructure = roleResolved && canManageFloorPlanStructure(userRole)',\n"
          new = "  \"const normalizedUserRole: UserRole = userRole === 'ADMIN' || userRole === 'EDITOR' ? userRole : 'VIEWER';\",\n  'const canManageStructure = roleResolved && canManageFloorPlanStructure(normalizedUserRole)',\n"
          if old not in s:
              raise SystemExit('Emulator RBAC guard anchor missing')
          p.write_text(s.replace(old, new, 1))

          p = Path('firestore.rules')
          s = p.read_text()
          old = """    function canEdit(projectId) {\n      return isGoogleAuthed() && (\n        isAdmin(projectId) ||\n        (uidMemberActive(projectId) && (uidRole(projectId) == 'EDITOR' || uidRole(projectId) == 'ENGINEER')) ||\n        (emailMemberActive(projectId) && (emailRole(projectId) == 'EDITOR' || emailRole(projectId) == 'ENGINEER'))\n      );\n    }\n"""
          new = """    function isEditor(projectId) {\n      return isGoogleAuthed() && (\n        (uidMemberActive(projectId) && (uidRole(projectId) == 'EDITOR' || uidRole(projectId) == 'ENGINEER')) ||\n        (emailMemberActive(projectId) && (emailRole(projectId) == 'EDITOR' || emailRole(projectId) == 'ENGINEER'))\n      );\n    }\n\n    function canEdit(projectId) {\n      return isAdmin(projectId) || isEditor(projectId);\n    }\n"""
          if old not in s:
              raise SystemExit('Firestore canEdit anchor missing')
          s = s.replace(old, new, 1)
          needle = "|| (canEdit(projectId) && !isAdmin(projectId) && ("
          if s.count(needle) != 2:
              raise SystemExit(f'Firestore generic editor branch count unexpected: {s.count(needle)}')
          s = s.replace(needle, "|| (isEditor(projectId) && (", 2)
          p.write_text(s)
          PY
          git add firestore.rules scripts/emulator-golden.mjs src/components/FloorPlanDefectTab.tsx src/components/SecurityModal.tsx

      - name: Verify exact fixed 19-file candidate
        shell: bash
        run: |
          set -euo pipefail
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          cat > /tmp/sha256-manifest.txt <<'EOF'
          c3a1f35ea41359632ebd7dedbb4bffdd7e961adc5fd13c239acd203c95a43161  HNL-QLTC-V6.3.0-RC2.2.5-MASTER-RBAC-REPORT.md
          d77432bf8d4ea4f4999eedb1b9ab5d0b823dd148c70739f49d39c51a5d5bb7e4  firestore.rules
          74cf4ed3d65b23450d3538c79eaebf91a38fb86602a038086024e21771506d3d  package.json
          08c173ed0db96c5bcf5167dc0f8ad0db4ce7e65f6d77d61ce366d4d02de35ba7  scripts/emulator-golden.mjs
          7bfdbeab5319390d998cc578169bc39b8bc90771a627eff6710262298e371733  scripts/firebase-rules-behavior.mjs
          3c9560917db526725d25522c428d116f8f1512472ebf075a106550e2ff4d29da  scripts/rbac-matrix.mjs
          7fa8e9dcb94d0515f7b382e6d5f42e393ad1a3ff033e06d7bc71382073cfca51  src/App.tsx
          0596bc1986d0a8447cc0bea68c2d63ab1aa0270292228ff0def70a5f348d5a77  src/components/ChecklistTab.tsx
          ca8f3f9cba6071549d9c37a8ca7a65d9c81769ce97af1d3b2c61453f62af6b9e  src/components/CrewTab.tsx
          d7ace8815afc147c6de1c68fe5ed45922d7409a5514c9a97a2f46b38ae331f39  src/components/FloorPlanDefectTab.tsx
          75815c5acfa10c76933e93bdd69063b3d8a776785ace64a7c92435f096079979  src/components/GoogleConfigTab.tsx
          256d5df9dc035b04f6030ec1e5e6789addae3c3dc94d59d904183835f19496fa  src/components/MaterialNormModal.tsx
          d5754cdb84a2d0e615a60844826977992b6cf5cc454a30dbd17401fa0ae85f9a  src/components/PhotoAttachmentPicker.tsx
          bb6fd1f031a6bd33a0d55eded35e4dc719e959cf4a5d0e3d3218de3c59e7f0cd  src/components/ProjectManagerModal.tsx
          40f763b951149700d26d33fe40298aa7ec4f43611d87e5d5bf43c473d8368a7c  src/components/RoomHighlightModal.tsx
          ebae63a58ab7d0161165a175595398f2412c4449559e29241f609cecb6abeb92  src/components/SecurityModal.tsx
          ba8f3b05fefe82583dd9a645a9a4cd189609061182c0b31b090786917de5b4cc  src/components/WarehouseTab.tsx
          e7d91b5c06e542f96d565c2814013bbd5756f189c53a012feabc431bd5bf4950  src/utils/securityUtils.ts
          49b287a522b9ff49b706eab06bb9791e881bfec80a768b9c144481311cd6b916  storage.rules
          EOF
          sed -i 's/^          //' /tmp/sha256-manifest.txt
          sha256sum -c /tmp/sha256-manifest.txt

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Stability and RBAC gates
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Firebase Rules emulator behavior
        run: npm run test:rules
      - name: Security audit production critical
        run: npm run security:audit
      - name: Production build
        run: npm run build
      - name: Commit tested candidate branch only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "V6.3.0 RC2.2.5 – Master RBAC & FloorPlan Permission Hardening"
          git push origin HEAD:refs/heads/rc225-candidate-tested --force-with-lease
          echo "Candidate SHA: $(git rev-parse HEAD)"
