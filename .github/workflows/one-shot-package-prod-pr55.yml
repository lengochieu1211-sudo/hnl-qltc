name: One-shot Package PROD PR55

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-package-prod-pr55.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_SHA: c5392beecd19b7d98afd520fca4f8a052f6fa78c
      PREVIOUS_MAIN_SHA: fb85f2a746fe0d3e833f2b7f57097bb5029de320
      PROD_DEPLOY_RUN: '33960762569'
      PROD_BUILD_RUN: '33960558369'
      PROD_APK_RUN: '33960558360'
      PROD_EXE_RUN: '33960558357'
    steps:
      - name: Checkout exact PROD source
        uses: actions/checkout@v4
        with:
          ref: c5392beecd19b7d98afd520fca4f8a052f6fa78c
          fetch-depth: 0

      - name: Verify exact release source and package metadata
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA" || { echo 'Wrong release SHA'; exit 1; }
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA" || { echo 'main moved after release'; exit 1; }
          test -f package.json && test -f package-lock.json
          test "$(node -p "require('./package.json').version")" = "$(node -p "require('./package-lock.json').version")" || { echo 'package/package-lock mismatch'; exit 1; }
          test -f firebase.json && test -f firebase.prod.json
          test -d .github/workflows
          ! grep -RIl --exclude-dir=.git --exclude='*.md' --exclude='package-lock.json' -E '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9_]{30,}' . >/tmp/secret_hits.txt || { cat /tmp/secret_hits.txt; echo 'Sensitive secret pattern found'; exit 1; }
          echo 'Final source pre-package gate: PASS'

      - name: Build PATCH ZIP FULL SOURCE ZIP and REPORT
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/hnl-qltc-prod-final"
          PATCH="$OUT/patch"
          mkdir -p "$PATCH"

          git archive --format=zip --output="$OUT/HNL-QLTC-PROD-FULL-SOURCE-2026-09-05.zip" "$RELEASE_SHA"
          git diff --name-only --diff-filter=AMR "$PREVIOUS_MAIN_SHA" "$RELEASE_SHA" > "$OUT/changed-files.txt"
          git diff --name-only --diff-filter=D "$PREVIOUS_MAIN_SHA" "$RELEASE_SHA" > "$OUT/deleted-files.txt"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            [ -f "$file" ] || continue
            mkdir -p "$PATCH/$(dirname "$file")"
            cp "$file" "$PATCH/$file"
          done < "$OUT/changed-files.txt"
          cp "$OUT/changed-files.txt" "$PATCH/CHANGED_FILES.txt"
          cp "$OUT/deleted-files.txt" "$PATCH/DELETED_FILES.txt"
          (cd "$PATCH" && zip -qr "$OUT/HNL-QLTC-PROD-PATCH-2026-09-05.zip" .)

          VERSION="$(node -p "require('./package.json').version")"
          cat > "$OUT/HNL-QLTC-PROD-FINAL-REPORT-2026-09-05.md" <<REPORT_EOF
          # HNL QLTC PROD FINAL REPORT — 2026-09-05

          ## Release identity
          - Main SHA: \`$RELEASE_SHA\`
          - Previous PROD main: \`$PREVIOUS_MAIN_SHA\`
          - Version: \`$VERSION\`
          - GitHub PR: #55
          - Firebase PROD: \`com-example-qlct-61329\`
          - Hosting: \`https://hnlqltc.web.app\`
          - Existing PROD R2 retained: \`https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev\`
          - HNL AI Gateway PROD: \`https://hnl-qltc-ai-gateway.lengochieu1211.workers.dev\`

          ## Delivered scope
          - HNL AI Assistant: deterministic HNL Data/Calculation/Audit engine, read/analyze-only AI narrative layer, managed Cloudflare Workers AI gateway, UI, Excel/PDF export.
          - Defect room/team linkage hardening with exact room/sub-item team suggestions.
          - Căn/Phòng Excel round-trip with hạng mục/đội, durable hidden IDs and Kiem_Tra diagnostics.
          - Inspection consistency hardening: Đạt nghiệm thu requires Đã hoàn thành.
          - Android system dark-mode integration and project-card dark styling.
          - Windows Firebase Rules test portability.

          ## Release gates — PASS
          - Main Build run: \`$PROD_BUILD_RUN\` — Stability, TypeScript, Lint, Firebase Rules behavior, critical security audit, Build.
          - Main APK run: \`$PROD_APK_RUN\` — fixed release signing required and signed APK built/uploaded.
          - Main EXE run: \`$PROD_EXE_RUN\` — desktop golden, portable EXE, taskbar icon golden, artifact upload.
          - PROD deploy run: \`$PROD_DEPLOY_RUN\` — manual confirmation gate, AI deterministic gates, Stability, TypeScript, Lint, Rules, security audit, Build, PROD bundle isolation, HNL AI Gateway PROD deploy+health, Firestore Rules deploy, Hosting deploy+smoke.
          - DEV exact-head Runtime Golden before merge — live Firebase/R2 multi-user + hosted desktop/mobile browser PASS.

          ## Safety
          - Firebase project/projectId, Hosting site, GitHub repository and existing PROD R2 gateway were not changed.
          - PROD R2 was not redeployed by the PR55 PROD release workflow.
          - HNL AI business-data functionality remains READ + ANALYZE ONLY; no autonomous delete/write actions.
          - AI provider secrets are not embedded in React/APK/EXE; managed AI executes server-side.

          ## Source/package checks
          - package.json + package-lock.json version agreement: PASS.
          - Firebase configuration files present: PASS.
          - .github/workflows present: PASS.
          - sensitive private-key/GitHub-token pattern scan: PASS.
          - FULL SOURCE ZIP integrity: PASS.
          - PATCH ZIP integrity: PASS.

          ## Changed/added source files
          $(sed 's/^/- /' "$OUT/changed-files.txt")

          ## Deleted files relative to previous main
          $(if [ -s "$OUT/deleted-files.txt" ]; then sed 's/^/- /' "$OUT/deleted-files.txt"; else echo '- None'; fi)
          REPORT_EOF

          unzip -t "$OUT/HNL-QLTC-PROD-FULL-SOURCE-2026-09-05.zip" >/dev/null
          unzip -t "$OUT/HNL-QLTC-PROD-PATCH-2026-09-05.zip" >/dev/null
          sha256sum "$OUT/HNL-QLTC-PROD-PATCH-2026-09-05.zip" "$OUT/HNL-QLTC-PROD-FULL-SOURCE-2026-09-05.zip" "$OUT/HNL-QLTC-PROD-FINAL-REPORT-2026-09-05.md" > "$OUT/SHA256SUMS.txt"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-PROD-FINAL-DELIVERABLES-PR55
          path: |
            ${{ env.OUT }}/HNL-QLTC-PROD-PATCH-2026-09-05.zip
            ${{ env.OUT }}/HNL-QLTC-PROD-FULL-SOURCE-2026-09-05.zip
            ${{ env.OUT }}/HNL-QLTC-PROD-FINAL-REPORT-2026-09-05.md
            ${{ env.OUT }}/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
