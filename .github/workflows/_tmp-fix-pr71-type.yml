name: TEMP Fix PR71 Type

on:
  push:
    branches:
      - ux/clean-open-controls-20260910

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ux/clean-open-controls-20260910
      - name: Fix dedicated modal type and golden
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          pm = Path('src/components/ProjectManagerModal.tsx')
          text = pm.read_text(encoding='utf-8')
          old = "  const modalTab: 'sync' | 'projects' = initialTab;"
          new = "  const modalTab: 'sync' | 'projects' = initialTab === 'sync' ? 'sync' : 'projects';"
          if text.count(old) != 1:
              raise SystemExit(f'ProjectManager type target count={text.count(old)}')
          pm.write_text(text.replace(old, new, 1), encoding='utf-8')

          golden = Path('scripts/ui-entry-ux-golden.ts')
          text = golden.read_text(encoding='utf-8')
          old = "assert(projectManager.includes(\"const modalTab: 'sync' | 'projects' = initialTab;\"), 'Dedicated Project/Sync destination mode missing');"
          new = "assert(projectManager.includes(\"const modalTab: 'sync' | 'projects' = initialTab === 'sync' ? 'sync' : 'projects';\"), 'Dedicated Project/Sync destination mode missing');"
          if text.count(old) != 1:
              raise SystemExit(f'UX golden target count={text.count(old)}')
          golden.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Validate focused fix
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run test:ui-entry-ux
          npm run typecheck
          npm run lint
          npm run build
      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/_tmp-fix-pr71-type.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/ProjectManagerModal.tsx scripts/ui-entry-ux-golden.ts .github/workflows/_tmp-fix-pr71-type.yml
          git diff --cached --check
          git commit -m "fix(ui): narrow dedicated project manager mode"
          git push origin HEAD:ux/clean-open-controls-20260910
