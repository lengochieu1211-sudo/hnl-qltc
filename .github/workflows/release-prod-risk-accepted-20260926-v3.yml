name: One-shot HNL QLTC PROD deploy v3 - user risk accepted 2026-09-26

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-prod-risk-accepted-20260926-v3.yml'

permissions:
  contents: read

jobs:
  deploy_prod:
    runs-on: ubuntu-latest
    environment: production
    env:
      APP_SHA: 5d62205115bfb51019b1459d0bb1301b4b67825d
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: hnlqltc.web.app
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_HNL_AI_ENABLED: "true"
      VITE_HNL_AI_GATEWAY_URL: https://hnl-qltc-ai-gateway.lengochieu1211.workers.dev
      PROD_AI_URL: https://hnl-qltc-ai-gateway.lengochieu1211.workers.dev
      PROD_HOSTING_URL: https://hnlqltc.web.app
      PROD_FIREBASEAPP_ORIGIN: https://com-example-qlct-61329.firebaseapp.com
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: 5d62205115bfb51019b1459d0bb1301b4b67825d

    steps:
      - name: Explicit user risk-accepted release gate
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF}" = "refs/heads/main"
          test "$APP_SHA" = "5d62205115bfb51019b1459d0bb1301b4b67825d"
          test "$VITE_FIREBASE_PROJECT_ID" = "com-example-qlct-61329"
          test "$VITE_R2_GATEWAY_URL" = "https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev"
          echo "USER_RISK_ACCEPTED: quota wait bypassed by explicit user request."
          echo "NOT CLAIMING BACKUP-VERIFIED OR MIGRATION-PARITY-VERIFIED."

      - name: Checkout exact approved app source
        uses: actions/checkout@v4
        with:
          ref: 5d62205115bfb51019b1459d0bb1301b4b67825d
          fetch-depth: 0

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$APP_SHA"
          test "$(node -p "require('./package.json').version")" = "$(node -p "require('./package-lock.json').version")"
          grep -q '"site": "hnlqltc"' firebase.prod.json
          grep -q '"default": "com-example-qlct-61329"' .firebaserc

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Release audit gates
        run: |
          npm run test:prod-readiness
          npm run test:stability
          npm run typecheck
          npm run lint
          npm run test:rules
          npm run security:audit
          npm run build

      - name: Deploy or verify HNL R2 Gateway PROD
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            RESPONSE="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
            ACCOUNT_ID="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=Array.isArray(j.result)?j.result:[];if(!j.success||r.length!==1)process.exit(2);process.stdout.write(String(r[0].id||''))})")"
            test -n "$ACCOUNT_ID"
            cd cloudflare/r2-gateway
            cat > wrangler.prod.ci.toml <<WRANGLER_EOF
          name = "hnl-qltc-r2-gateway"
          main = "worker.js"
          compatibility_date = "2026-08-30"

          [[r2_buckets]]
          binding = "HNL_QLTC_MEDIA"
          bucket_name = "hnl-qltc-media"

          [vars]
          FIREBASE_PROJECT_ID = "com-example-qlct-61329"
          SUPER_ADMIN_EMAIL = "lengochieu1211@gmail.com"
          ALLOWED_ORIGINS = "https://hnlqltc.web.app,https://com-example-qlct-61329.web.app,https://com-example-qlct-61329.firebaseapp.com"
          MAX_UPLOAD_BYTES = "26214400"
          FIREBASE_WEB_API_KEY = "AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY"
          FIRESTORE_AUTH_RETRY_ATTEMPTS = "4"
          WRANGLER_EOF
            CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx --yes wrangler@4.33.0 deploy --config wrangler.prod.ci.toml
            rm -f wrangler.prod.ci.toml
            cd ../..
          else
            echo "::warning::CLOUDFLARE_API_TOKEN unavailable; preserving current PROD R2 Worker and requiring health compatibility."
          fi
          ok=0
          for i in $(seq 1 30); do
            BODY="$(curl --fail --silent --show-error "${VITE_R2_GATEWAY_URL}/health?release=${GITHUB_RUN_ID}-${i}" || true)"
            if printf '%s' "$BODY" | grep -q '"ok":true' \
              && printf '%s' "$BODY" | grep -q '"policyVersion":"immutable-deleted-project-v2"' \
              && printf '%s' "$BODY" | grep -q '"firebaseProjectId":"com-example-qlct-61329"' \
              && printf '%s' "$BODY" | grep -q '"quotaAttribution":"api-key"' \
              && printf '%s' "$BODY" | grep -q '"quotaUserPartitioning":"sha256-uid"'; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1 || { echo "R2 PROD health propagation/policy check failed"; exit 1; }

      - name: Deploy or verify HNL AI Gateway PROD
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_API_TOKEN:-}" ]; then
            RESPONSE="$(curl --fail --silent --show-error -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" -H 'Content-Type: application/json' 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
            ACCOUNT_ID="$(printf '%s' "$RESPONSE" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=Array.isArray(j.result)?j.result:[];if(!j.success||r.length!==1)process.exit(2);process.stdout.write(String(r[0].id||''))})")"
            test -n "$ACCOUNT_ID"
            cd cloudflare/ai-gateway
            cat > wrangler.prod.ci.toml <<WRANGLER_EOF
          name = "hnl-qltc-ai-gateway"
          main = "worker.js"
          compatibility_date = "2026-09-05"

          [ai]
          binding = "AI"

          [vars]
          ENVIRONMENT = "PROD"
          FIREBASE_PROJECT_ID = "com-example-qlct-61329"
          FIREBASE_WEB_API_KEY = "AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY"
          ALLOWED_ORIGINS = "https://hnlqltc.web.app,https://com-example-qlct-61329.firebaseapp.com"
          PUBLIC_APP_URL = "https://hnlqltc.web.app"
          WRANGLER_EOF
            CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID" npx --yes wrangler@4.33.0 deploy --config wrangler.prod.ci.toml
            rm -f wrangler.prod.ci.toml
            cd ../..
          else
            echo "::warning::CLOUDFLARE_API_TOKEN unavailable; preserving current PROD AI Worker and requiring health compatibility."
          fi
          ok=0
          for i in $(seq 1 30); do
            BODY="$(curl --fail --silent --show-error "${PROD_AI_URL}/health?release=${GITHUB_RUN_ID}-${i}" || true)"
            if printf '%s' "$BODY" | grep -q '"ok":true' \
              && printf '%s' "$BODY" | grep -q '"environment":"PROD"' \
              && printf '%s' "$BODY" | grep -q '"firebaseProjectId":"com-example-qlct-61329"'; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" = 1 || { echo "AI PROD health propagation check failed"; exit 1; }

      - name: Deploy Firestore rules (Storage not initialized in PROD)
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          test -n "${FIREBASE_SERVICE_ACCOUNT:-}" || { echo "Missing PROD Firebase service account"; exit 1; }
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only firestore:rules --project com-example-qlct-61329 --non-interactive\n          echo 'Firebase Storage deployment intentionally skipped: PROD Storage is not initialized; R2 remains binary authority.'

      - name: Deploy Hosting exact app source
        shell: bash
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COM_EXAMPLE_QLCT_61329 }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only hosting --config firebase.prod.json --project com-example-qlct-61329 --non-interactive

      - name: Smoke PROD
        shell: bash
        run: |
          set -euo pipefail
          HTML="$(curl --fail --silent --show-error "${PROD_HOSTING_URL}/?release=${GITHUB_RUN_ID}")"
          printf '%s' "$HTML" | grep -qi '<div id="root"'
          curl --fail --silent --show-error "${VITE_R2_GATEWAY_URL}/health?postdeploy=${GITHUB_RUN_ID}" | grep -q '"ok":true'
          curl --fail --silent --show-error "${PROD_AI_URL}/health?postdeploy=${GITHUB_RUN_ID}" | grep -q '"ok":true'
          echo "PROD DEPLOY PASS — exact app source $APP_SHA"
