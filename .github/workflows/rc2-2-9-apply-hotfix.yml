name: RC2.2.9 Apply Same-Phone Photo + PC UI Hotfix
on:
  push:
    branches: [rc2-2-9-same-phone-photo-sync-ui]
    paths:
      - '.github/workflows/rc2-2-9-apply-hotfix.yml'

permissions:
  contents: write

jobs:
  apply_hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and apply exact feature patch
        shell: bash
        run: |
          set -euo pipefail
          cat .rc229-feature/part*.txt > /tmp/rc229-feature.patch
          echo '10d8253aed58f4535448567d3b0e8248333b6cd9ff49e2ab8d71cd8326fd1f78  /tmp/rc229-feature.patch' | sha256sum -c -
          git apply --check --unidiff-zero /tmp/rc229-feature.patch
          git apply --unidiff-zero /tmp/rc229-feature.patch
          git diff --check
      - name: Source release gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stability-gate.mjs
          node scripts/offline-golden.mjs
          node scripts/category-golden.mjs
          node scripts/firebase-only-golden.mjs
          node scripts/firebase-only-legacy-audit.mjs --self-test
          node scripts/emulator-golden.mjs
          node scripts/rbac-matrix.mjs
          node scripts/r2-gateway-golden.mjs
          node scripts/desktop-launcher-golden.mjs
          node scripts/auth-popup-golden.mjs
          node scripts/source-lint.mjs
      - name: Commit source hotfix and remove staging payloads
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .rc229-patch .rc229-feature
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'REFUSING: bot source commit contains workflow mutation'
            git diff --cached --name-only
            exit 1
          fi
          git commit -m 'fix: RC2.2.9 same-phone photo sync and PC quota alignment'
          git push origin HEAD:rc2-2-9-same-phone-photo-sync-ui
