name: RC2.2.9 Finalize Release Identity
on:
  push:
    branches: [rc2-2-9-same-phone-photo-sync-ui]
    paths:
      - '.github/workflows/rc2-2-9-apply-hotfix.yml'

permissions:
  contents: write

jobs:
  finalize_identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Finalize non-workflow RC2.2.9 identity
        shell: bash
        run: |
          set -euo pipefail
          printf '6.3.0-rc2.2.9\n' > desktop-wrapper/release-tag.txt
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/desktop-launcher-golden.mjs')
          s=p.read_text()
          s=s.replace("releaseTag === '6.3.0-rc2.2.8'", "releaseTag === '6.3.0-rc2.2.9'")
          s=s.replace('desktop release tag matches RC2.2.8', 'desktop release tag matches RC2.2.9')
          p.write_text(s)
          p=Path('scripts/stability-gate.mjs')
          s=p.read_text().replace('QLCT_RELEASE_TAG: 6.3.0-rc2.2.8', 'QLCT_RELEASE_TAG: 6.3.0-rc2.2.9')
          p.write_text(s)
          PY
          git diff --check
      - name: Source release gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stability-gate.mjs
          node scripts/offline-golden.mjs
          node scripts/category-golden.mjs
          node scripts/firebase-only-golden.mjs
          node scripts/firebase-only-legacy-audit.mjs --self-test
          node scripts/emulator-golden.mjs
          node scripts/rbac-matrix.mjs
          node scripts/r2-gateway-golden.mjs
          node scripts/desktop-launcher-golden.mjs
          node scripts/auth-popup-golden.mjs
          node scripts/source-lint.mjs
      - name: Commit release identity only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add desktop-wrapper/release-tag.txt scripts/desktop-launcher-golden.mjs scripts/stability-gate.mjs
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo 'REFUSING: bot commit contains workflow mutation'
            exit 1
          fi
          git commit -m 'chore: finalize RC2.2.9 release identity'
          git push origin HEAD:rc2-2-9-same-phone-photo-sync-ui
