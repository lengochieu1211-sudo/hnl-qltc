name: RC2.2.13 R2 Finalize Once

on:
  push:
    branches:
      - rc2-2-12-android-gallery-picker-hotfix
    paths:
      - '.github/workflows/rc2-2-13-r2-finalize-once.yml'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rc2-2-12-android-gallery-picker-hotfix
          fetch-depth: 0

      - name: Apply RC2.2.13 native + R2 verification source changes
        shell: python
        run: |
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'MISSING PATTERN: {label}')
              return text.replace(old, new, 1)

          # Android: materialize OEM/Google Photos content:// into app-owned cache.
          p = Path('android-wrapper/src/com/qlct/app/MainActivity.java')
          s = p.read_text(encoding='utf-8')
          if 'import android.content.ClipData;' not in s:
              s = must_replace(s, 'import android.app.Activity;\n', 'import android.app.Activity;\nimport android.content.ClipData;\n', 'ClipData import')
          if 'import android.provider.OpenableColumns;' not in s:
              s = must_replace(s, 'import android.os.Message;\n', 'import android.os.Message;\nimport android.provider.OpenableColumns;\n', 'OpenableColumns import')
          if 'import java.io.InputStream;' not in s:
              s = must_replace(s, 'import java.io.FileInputStream;\n', 'import java.io.FileInputStream;\nimport java.io.InputStream;\n', 'InputStream import')
          if 'import java.util.ArrayList;' not in s:
              s = must_replace(s, 'import java.util.HashMap;\n', 'import java.util.ArrayList;\nimport java.util.HashMap;\nimport java.util.HashSet;\nimport java.util.List;\nimport java.util.Set;\n', 'collection imports')

          gallery_block = r'''    private Intent buildFileChooserIntent(WebChromeClient.FileChooserParams params) {
              boolean imageOnly = acceptsImages(params);

              // ACTION_OPEN_DOCUMENT gives a stable ContentResolver stream on modern Android.
              // We still copy the selected URI into app-owned cache before Chromium receives it,
              // because Google Photos/OEM providers may expose virtual/ephemeral content URIs.
              Intent contentIntent = new Intent(Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT
                      ? Intent.ACTION_OPEN_DOCUMENT
                      : Intent.ACTION_GET_CONTENT);
              contentIntent.addCategory(Intent.CATEGORY_OPENABLE);
              contentIntent.setType(imageOnly ? "image/*" : "*/*");
              contentIntent.addFlags(Intent.FLAG_GRANT_READ_URI_PERMISSION);
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.KITKAT) {
                  contentIntent.addFlags(Intent.FLAG_GRANT_PERSISTABLE_URI_PERMISSION);
              }
              if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.JELLY_BEAN_MR2) {
                  contentIntent.putExtra(Intent.EXTRA_ALLOW_MULTIPLE,
                          params != null && params.getMode() == WebChromeClient.FileChooserParams.MODE_OPEN_MULTIPLE);
              }

              return Intent.createChooser(contentIntent, imageOnly ? "Chon anh tu Thu vien" : "Chon tep");
          }

          private Uri[] extractGalleryResultUris(Intent data) {
              if (data == null) return new Uri[0];
              List<Uri> uris = new ArrayList<>();
              Set<String> seen = new HashSet<>();
              ClipData clip = data.getClipData();
              if (clip != null) {
                  for (int i = 0; i < clip.getItemCount(); i++) {
                      Uri uri = clip.getItemAt(i).getUri();
                      if (uri != null && seen.add(uri.toString())) uris.add(uri);
                  }
              }
              Uri single = data.getData();
              if (single != null && seen.add(single.toString())) uris.add(single);
              if (uris.isEmpty()) {
                  Uri[] parsed = WebChromeClient.FileChooserParams.parseResult(RESULT_OK, data);
                  if (parsed != null) {
                      for (Uri uri : parsed) {
                          if (uri != null && seen.add(uri.toString())) uris.add(uri);
                      }
                  }
              }
              return uris.toArray(new Uri[0]);
          }

          private String queryDisplayName(Uri uri, int index) {
              Cursor cursor = null;
              try {
                  cursor = getContentResolver().query(uri, new String[]{OpenableColumns.DISPLAY_NAME}, null, null, null);
                  if (cursor != null && cursor.moveToFirst()) {
                      int column = cursor.getColumnIndex(OpenableColumns.DISPLAY_NAME);
                      if (column >= 0 && !cursor.isNull(column)) {
                          String name = sanitizeFileName(cursor.getString(column));
                          if (name.length() > 0) return name;
                      }
                  }
              } catch (Exception ignored) {
              } finally {
                  if (cursor != null) cursor.close();
              }
              return "gallery_" + System.currentTimeMillis() + "_" + index + ".jpg";
          }

          private String extensionForMime(String mimeType) {
              String mime = mimeType == null ? "" : mimeType.toLowerCase();
              if (mime.contains("png")) return ".png";
              if (mime.contains("webp")) return ".webp";
              if (mime.contains("gif")) return ".gif";
              if (mime.contains("heic") || mime.contains("heif")) return ".heic";
              return ".jpg";
          }

          private Uri copyGalleryUriToStableCache(Uri sourceUri, int index) throws IOException {
              if (sourceUri == null) throw new IOException("Gallery URI missing");
              String mimeType = getContentResolver().getType(sourceUri);
              String displayName = queryDisplayName(sourceUri, index);
              if (!displayName.contains(".")) displayName += extensionForMime(mimeType);
              displayName = "pick_" + System.currentTimeMillis() + "_" + index + "_" + displayName;

              File dir = new File(getCacheDir(), PickerCacheProvider.CACHE_DIR);
              if (!dir.exists() && !dir.mkdirs()) throw new IOException("Cannot create picker cache");
              long cutoff = System.currentTimeMillis() - (24L * 60L * 60L * 1000L);
              File[] oldFiles = dir.listFiles();
              if (oldFiles != null) {
                  for (File old : oldFiles) {
                      if (old.isFile() && old.lastModified() < cutoff) old.delete();
                  }
              }

              File target = new File(dir, displayName);
              long total = 0L;
              InputStream input = getContentResolver().openInputStream(sourceUri);
              if (input == null) throw new IOException("Gallery stream unavailable");
              FileOutputStream output = new FileOutputStream(target);
              try {
                  byte[] buffer = new byte[64 * 1024];
                  int read;
                  while ((read = input.read(buffer)) != -1) {
                      if (read > 0) {
                          output.write(buffer, 0, read);
                          total += read;
                      }
                  }
                  output.flush();
              } finally {
                  try { input.close(); } catch (Exception ignored) {}
                  try { output.close(); } catch (Exception ignored) {}
              }
              if (total <= 0L || target.length() <= 0L) {
                  target.delete();
                  throw new IOException("Gallery returned an empty image");
              }

              return new Uri.Builder()
                      .scheme("content")
                      .authority(PickerCacheProvider.AUTHORITY)
                      .appendPath(target.getName())
                      .build();
          }

          private void deliverGalleryUrisThroughStableCache(final Intent data) {
              final ValueCallback<Uri[]> callback = filePathCallback;
              filePathCallback = null;
              if (callback == null) return;
              final Uri[] sourceUris = extractGalleryResultUris(data);
              if (sourceUris.length == 0) {
                  callback.onReceiveValue(null);
                  return;
              }

              new Thread(() -> {
                  List<Uri> stableUris = new ArrayList<>();
                  String failure = null;
                  for (int i = 0; i < sourceUris.length; i++) {
                      try {
                          stableUris.add(copyGalleryUriToStableCache(sourceUris[i], i));
                      } catch (Exception error) {
                          failure = error.getMessage();
                          break;
                      }
                  }
                  final Uri[] result = failure == null ? stableUris.toArray(new Uri[0]) : null;
                  final String errorMessage = failure;
                  runOnUiThread(() -> {
                      if (errorMessage != null) showToast("Khong doc duoc anh Thu vien: " + errorMessage);
                      callback.onReceiveValue(result);
                  });
              }, "qlct-gallery-copy").start();
          }

'''
          pattern = re.compile(r'    private Intent buildFileChooserIntent\(WebChromeClient\.FileChooserParams params\) \{.*?\n    private boolean acceptsImages', re.S)
          if not pattern.search(s):
              raise SystemExit('MISSING PATTERN: buildFileChooserIntent block')
          s = pattern.sub(gallery_block + '    private boolean acceptsImages', s, count=1)

          old_result = '''            // Gallery-only path. Never substitute pendingCameraImageUri for a gallery result.\n            Uri[] results = resultCode == RESULT_OK\n                    ? WebChromeClient.FileChooserParams.parseResult(resultCode, data)\n                    : null;\n            // Some OEM gallery/document pickers expose only Intent.getData().\n            if ((results == null || results.length == 0) && resultCode == RESULT_OK && data != null && data.getData() != null) {\n                results = new Uri[]{data.getData()};\n            }\n            deletePendingCameraImage();\n            ValueCallback<Uri[]> callback = filePathCallback;\n            filePathCallback = null;\n            callback.onReceiveValue(results);'''
          new_result = '''            // Gallery-only path. Never hand Google Photos/OEM content:// URIs directly\n            // to Chromium. Normalize the stream into app-owned cache first.\n            deletePendingCameraImage();\n            if (resultCode == RESULT_OK && data != null) {\n                deliverGalleryUrisThroughStableCache(data);\n            } else {\n                ValueCallback<Uri[]> callback = filePathCallback;\n                filePathCallback = null;\n                callback.onReceiveValue(null);\n            }'''
          s = must_replace(s, old_result, new_result, 'gallery onActivityResult')
          p.write_text(s, encoding='utf-8')

          # Photo ready verification: server metadata plus actual object durability.
          p = Path('src/lib/photoCloudSync.ts')
          s = p.read_text(encoding='utf-8')
          s = must_replace(
              s,
              "import { BINARY_STORAGE_PROVIDER, downloadBinaryBlob, uploadProjectBinaryToCloud } from './binaryStorage';",
              "import { BINARY_STORAGE_PROVIDER, downloadBinaryBlob, uploadProjectBinaryToCloud, verifyBinaryObjectReady } from './binaryStorage';",
              'photoCloudSync import',
          )
          old_verify = '''    return String(data?.binaryUploadState || '') === 'ready'\n      && Boolean(storagePath)\n      && (provider === 'r2' || provider === 'firebase-storage');'''
          new_verify = '''    if (String(data?.binaryUploadState || '') !== 'ready' || !storagePath) return false;\n    if (provider !== 'r2' && provider !== 'firebase-storage') return false;\n    return verifyBinaryObjectReady(\n      provider,\n      storagePath,\n      Number(data?.fileSize || 0) || undefined,\n      String(data?.contentHash || data?.storageMd5Hash || '') || undefined,\n    );'''
          s = must_replace(s, old_verify, new_verify, 'photo Cloud ready verification')
          p.write_text(s, encoding='utf-8')

          # Golden expectations for R2-only write authority and native gallery materialization.
          p = Path('scripts/stability-gate.mjs')
          s = p.read_text(encoding='utf-8')
          old_android = '''requireAll(androidMain, [\n  'fileChooserDirectCamera',\n  'Chon anh tu Thu vien',\n  'Gallery-only path',\n  'Never substitute pendingCameraImageUri for a gallery result',\n  'data.getData() != null',\n], 'Android gallery picker isolated from camera flush guard');\npass('Android APK gallery cannot fall through to pending camera MediaStore handling');'''
          new_android = '''requireAll(androidMain, [\n  'fileChooserDirectCamera',\n  'Intent.ACTION_OPEN_DOCUMENT',\n  'deliverGalleryUrisThroughStableCache',\n  'copyGalleryUriToStableCache',\n  'PickerCacheProvider.AUTHORITY',\n], 'Android gallery materializes OEM/Google Photos content into app-owned cache');\nconst pickerProvider = read('android-wrapper/src/com/qlct/app/PickerCacheProvider.java');\nrequireAll(pickerProvider, ['ParcelFileDescriptor.MODE_READ_ONLY', 'OpenableColumns.DISPLAY_NAME', 'OpenableColumns.SIZE'], 'Android app-owned picker ContentProvider');\npass('Android Gallery returns stable app-owned binary to WebView instead of ephemeral OEM content URI');'''
          s = must_replace(s, old_android, new_android, 'Android stability block')
          s = must_replace(s,
              "requireAll(binaryStorage, ['R2 upload failed; falling back to Firebase Storage', 'return mapFirebase(await uploadProjectBinary(input))'], 'photo R2 to Firebase Storage reliability failover');",
              "requireAll(binaryStorage, ['one write authority only: private Cloudflare R2', 'uploadProjectBinaryToR2(input)', 'verifyBinaryObjectReady'], 'photo R2-only write authority with durable verification');",
              'binaryStorage stability block')
          s = s.replace("pass('photo metadata is published cross-account only after binary readiness with durable R2/Firebase Storage failover');", "pass('photo metadata is published cross-account only after durable R2 readiness; failed uploads stay in the local outbox');")
          s = s.replace("pass('new binaries use provider-based R2 in PROD; Firebase Storage remains reversible fallback; Drive remains read-only legacy fallback');", "pass('new binaries use private R2 as the single PROD write authority; Firebase Storage/Drive remain read-only legacy compatibility paths');")
          s = s.replace("'Firebase Storage fallback Rules'", "'Firebase Storage legacy compatibility Rules'")
          s = s.replace("pass('Firestore RBAC remains authoritative; R2 gateway mirrors member/role access and Firebase Storage fallback rules are retained');", "pass('Firestore RBAC remains authoritative; R2 gateway mirrors member/role access and Firebase Storage legacy rules are retained');")
          if "R2 durable PUT + authenticated HEAD verification" not in s:
              s = must_replace(s,
                  "requireAll(r2Storage, ['VITE_R2_GATEWAY_URL', 'Authorization', 'uploadProjectBinaryToR2', 'uploadFloorPlanBinaryToR2', 'downloadR2Blob'], 'R2 client');",
                  "requireAll(r2Storage, ['VITE_R2_GATEWAY_URL', 'Authorization', 'uploadProjectBinaryToR2', 'uploadFloorPlanBinaryToR2', 'downloadR2Blob'], 'R2 client');\nrequireAll(r2Storage, ['verifyR2ObjectReady', \"method: 'HEAD'\", 'X-HNL-SHA256', 'R2_UPLOAD_NOT_DURABLE'], 'R2 durable PUT + authenticated HEAD verification');",
                  'R2 client stability block')
          if "R2 gateway durable object HEAD" not in s:
              s = must_replace(s,
                  "requireAll(r2Worker, ['HNL_QLTC_MEDIA', 'FIREBASE_PROJECT_ID', 'firestore.googleapis.com', 'canWrite', \"area === 'floor-plans'\", \"role === 'ADMIN'\", \"role === 'EDITOR'\"], 'R2 gateway RBAC');",
                  "requireAll(r2Worker, ['HNL_QLTC_MEDIA', 'FIREBASE_PROJECT_ID', 'firestore.googleapis.com', 'canWrite', \"area === 'floor-plans'\", \"role === 'ADMIN'\", \"role === 'EDITOR'\"], 'R2 gateway RBAC');\nrequireAll(r2Worker, [\"request.method === 'HEAD'\", 'HNL_QLTC_MEDIA.head', 'X-HNL-SHA256', 'Content-Length'], 'R2 gateway durable object HEAD');",
                  'R2 worker stability block')
          p.write_text(s, encoding='utf-8')

          p = Path('scripts/desktop-launcher-golden.mjs')
          s = p.read_text(encoding='utf-8').replace('desktop release tag matches RC2.2.12', 'desktop release tag matches RC2.2.13')
          p.write_text(s, encoding='utf-8')

      - name: Diff check
        run: git diff --check

      - name: Source Golden gates
        run: |
          node scripts/stability-gate.mjs
          node scripts/offline-golden.mjs
          node scripts/category-golden.mjs
          node scripts/firebase-only-golden.mjs
          node scripts/firebase-only-legacy-audit.mjs --self-test
          node scripts/emulator-golden.mjs
          node scripts/rbac-matrix.mjs
          node scripts/r2-gateway-golden.mjs
          node scripts/desktop-launcher-golden.mjs
          node scripts/auth-popup-golden.mjs
          node scripts/source-lint.mjs

      - name: Commit finalized source
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add android-wrapper/src/com/qlct/app/MainActivity.java src/lib/photoCloudSync.ts scripts/stability-gate.mjs scripts/desktop-launcher-golden.mjs
          if git diff --cached --quiet; then
            echo 'No source changes required.'
            exit 0
          fi
          git commit -m 'fix: finalize RC2.2.13 R2 durable photo pipeline'
          git push origin HEAD:rc2-2-12-android-gallery-picker-hotfix
