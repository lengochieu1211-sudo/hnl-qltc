name: One-shot Dispatch PROD PR55

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/one-shot-dispatch-prod-pr55.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify exact certified main SHA
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Guard release SHA
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c5392beecd19b7d98afd520fca4f8a052f6fa78c" || { echo 'REFUSING: main moved after PR55 certification'; exit 1; }
      - name: Dispatch existing manual PROD release gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/firebase-hosting-merge.yml/dispatches" \
            -d '{"ref":"main","inputs":{"confirmation":"DEPLOY-PROD"}}'
          echo 'Existing gated PROD release workflow dispatched for exact PR55 main SHA.'
