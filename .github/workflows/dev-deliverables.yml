name: Package HNL QLTC DEV Deliverables

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dev-deliverables.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASELINE_SHA: c5392beecd19b7d98afd520fca4f8a052f6fa78c
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: 'true'
      VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
      VITE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_HNL_AI_ENABLED: 'true'
      VITE_HNL_AI_GATEWAY_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout exact DEV head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DEV/source isolation preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dev'
          test -n "$BASELINE_SHA"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f package.json
          test -f package-lock.json
          test -f firebase.json
          test -d .github/workflows
          test "$VITE_R2_GATEWAY_URL" = 'https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev'
          test "$VITE_HNL_AI_GATEWAY_URL" = 'https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev'
          echo 'DEV deliverable isolation preflight: PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Full certification gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:health-center
          npm run test:ai-core
          npm run test:ai-tools
          npm run test:ai-audit
          npm run test:ai-planner
          npm run test:ai-provider
          npm run test:ai-gateway
          npm run test:ai-export
          npm run test:stability
          npm run typecheck
          npm run lint
          npm run test:rules
          npm run security:audit
          npm run build

      - name: Build PATCH ZIP + FULL SOURCE ZIP + REPORT
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/hnl-deliverables"
          PATCH_DIR="$OUT/patch"
          mkdir -p "$PATCH_DIR"

          git diff --name-status "$BASELINE_SHA" "$GITHUB_SHA" > "$OUT/changed-files.txt"
          git diff --name-only --diff-filter=ACMRT "$BASELINE_SHA" "$GITHUB_SHA" > "$OUT/patch-files.txt"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            mkdir -p "$PATCH_DIR/$(dirname "$file")"
            cp -p "$file" "$PATCH_DIR/$file"
          done < "$OUT/patch-files.txt"

          (cd "$PATCH_DIR" && zip -qr "$OUT/HNL-QLTC-DEV-PATCH-2026-09-06.zip" .)
          git archive --format=zip --output="$OUT/HNL-QLTC-DEV-FULL-SOURCE-2026-09-06.zip" "$GITHUB_SHA"

          {
            echo '# HNL QLTC DEV FINAL REPORT — 2026-09-06'
            echo
            echo "- Final DEV source commit: \`$GITHUB_SHA\`"
            echo "- Patch baseline/main: \`$BASELINE_SHA\`"
            echo '- PROD/main: NOT merged, NOT deployed by this workflow.'
            echo '- Firebase/R2/AI endpoints used for certification: DEV only.'
            echo
            echo '## Health Center / Audit work completed'
            echo '- Unified Health Center under System & Diagnostics; AI Audit consumes the same audit source.'
            echo '- Vietnamese DMY parsing hardened for strings such as `15:22:15 11/8/2026`.'
            echo '- Multi-floor crew summaries no longer create false CREW_FLOOR_ID_NAME_MISMATCH repairs.'
            echo '- Room/floor/team context enriched for audit issues.'
            echo '- JSON/Excel/PDF export uses one auditSnapshotId.'
            echo '- Safe-repair flow is backup + confirm + before-value check + atomic apply + re-audit.'
            echo '- Live DEV Health Center safe-repair golden passed Firestore + realtime second-account + re-audit.'
            echo '- Stale dynamic-import/service-worker recovery hardened with build-aware cache behavior.'
            echo
            echo '## Current real-project audit evidence (latest user export)'
            echo '- 177 records scanned.'
            echo '- 20 issues after false-positive hardening: 4 ERROR + 16 WARNING.'
            echo '- 6 deterministic CREW_TEAM_ID_MISSING candidates remain for user-confirmed repair on the real DEV project.'
            echo '- 4 business ERROR items remain confirmation/manual-repair only; no automatic overwrite.'
            echo '- Empty `()` crew-task details remain NEEDS_CONFIRMATION, not auto-repair.'
            echo
            echo '## Certification in this packaging run'
            echo '- npm ci: PASS'
            echo '- Health Center golden suite: PASS'
            echo '- HNL AI core/tools/audit/planner/provider/gateway/export goldens: PASS'
            echo '- Stability/offline/RBAC/R2/auth/contact/defect/checklist goldens: PASS'
            echo '- TypeScript: PASS'
            echo '- Lint + source secret scan + package/lock consistency: PASS'
            echo '- Firebase Rules compile/behavior: PASS'
            echo '- Production dependency critical audit gate: PASS'
            echo '- Build: PASS'
            echo '- Firebase config / DEV isolation preflight: PASS'
            echo '- .github/workflows present and packaged: PASS'
            echo
            echo '## Runtime evidence already certified on exact pre-packaging DEV head'
            echo '- DEV deploy: PASS (Hosting + Firestore rules + R2 + HNL AI Gateway DEV).'
            echo '- Runtime Golden #39: PASS (Firebase/R2 multi-user, Health Center live safe-repair, realtime, offline/reconnect, desktop/mobile hosted browser).'
            echo '- Android DEV APK and Windows DEV EXE were previously certified on the same application code line; packaging workflow does not deploy PROD.'
            echo
            echo '## Safety status'
            echo '- No orphan data is auto-deleted.'
            echo '- Safe repair is restricted to deterministic fields and must preserve record identity.'
            echo '- No merge to main and no PROD deploy performed.'
            echo
            echo '## Changed/added files from main baseline'
            echo '```'
            cat "$OUT/changed-files.txt"
            echo '```'
          } > "$OUT/HNL-QLTC-DEV-FINAL-REPORT-2026-09-06.md"

          unzip -t "$OUT/HNL-QLTC-DEV-PATCH-2026-09-06.zip" >/dev/null
          unzip -t "$OUT/HNL-QLTC-DEV-FULL-SOURCE-2026-09-06.zip" >/dev/null
          test -s "$OUT/HNL-QLTC-DEV-FINAL-REPORT-2026-09-06.md"
          sha256sum "$OUT"/*.zip "$OUT"/*.md > "$OUT/SHA256SUMS.txt"
          ls -lh "$OUT"

      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-DEV-FINAL-DELIVERABLES-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/hnl-deliverables/HNL-QLTC-DEV-PATCH-2026-09-06.zip
            ${{ runner.temp }}/hnl-deliverables/HNL-QLTC-DEV-FULL-SOURCE-2026-09-06.zip
            ${{ runner.temp }}/hnl-deliverables/HNL-QLTC-DEV-FINAL-REPORT-2026-09-06.md
            ${{ runner.temp }}/hnl-deliverables/SHA256SUMS.txt
            ${{ runner.temp }}/hnl-deliverables/changed-files.txt
          if-no-files-found: error
          retention-days: 30
