name: Package HNL QLTC DEV Deliverables

on:
  push:
    branches: [dev]
    paths:
      - '.github/workflows/dev-deliverables.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      BASELINE_SHA: aa4c6bad0fe621f1091df464bd5f3a68f9329663
      RUNTIME_CERTIFIED_SHA: 89174b9b9ccb3b0bb1b6bd4c1fe18deb9c576adb
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: 'true'
      VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
      VITE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_HNL_AI_ENABLED: 'true'
      VITE_HNL_AI_GATEWAY_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout exact DEV head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DEV/source isolation preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dev'
          test -n "$BASELINE_SHA"
          git cat-file -e "${BASELINE_SHA}^{commit}"
          git cat-file -e "${RUNTIME_CERTIFIED_SHA}^{commit}"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f package.json
          test -f package-lock.json
          test -f firebase.json
          test -d .github/workflows
          test "$VITE_R2_GATEWAY_URL" = 'https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev'
          test "$VITE_HNL_AI_GATEWAY_URL" = 'https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev'
          echo 'DEV deliverable isolation preflight: PASS'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Full certification gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:health-center
          npm run test:ai-core
          npm run test:ai-tools
          npm run test:ai-audit
          npm run test:ai-planner
          npm run test:ai-provider
          npm run test:ai-gateway
          npm run test:ai-export
          npm run test:stability
          npm run typecheck
          npm run lint
          npm run test:rules
          npm run security:audit
          npm run build

      - name: Build PATCH ZIP + FULL SOURCE ZIP + REPORT
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/hnl-deliverables"
          PATCH_DIR="$OUT/patch"
          mkdir -p "$PATCH_DIR"

          git diff --name-status "$BASELINE_SHA" "$GITHUB_SHA" > "$OUT/changed-files.txt"
          git diff --name-only --diff-filter=ACMRT "$BASELINE_SHA" "$GITHUB_SHA" > "$OUT/patch-files.txt"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            mkdir -p "$PATCH_DIR/$(dirname "$file")"
            cp -p "$file" "$PATCH_DIR/$file"
          done < "$OUT/patch-files.txt"

          (cd "$PATCH_DIR" && zip -qr "$OUT/HNL-QLTC-DEV-PATCH-2026-09-11.zip" .)
          git archive --format=zip --output="$OUT/HNL-QLTC-DEV-FULL-SOURCE-2026-09-11.zip" "$GITHUB_SHA"

          {
            echo '# HNL QLTC DEV FINAL REPORT — 2026-09-11'
            echo
            echo "- Final DEV source commit: \`$GITHUB_SHA\`"
            echo "- Continuation baseline: \`$BASELINE_SHA\`"
            echo "- Runtime-certified application commit: \`$RUNTIME_CERTIFIED_SHA\`"
            echo '- The final packaging commit changes only this deliverables workflow after the runtime-certified application commit.'
            echo '- PROD/main: NOT merged, NOT deployed by this workflow.'
            echo '- Firebase/R2/AI endpoints used for certification: DEV only.'
            echo
            echo '## Runtime Golden #78 — PASS'
            echo '- Exact application commit: `89174b9b9ccb3b0bb1b6bd4c1fe18deb9c576adb`.'
            echo '- DEV isolation and Firebase credential gate: PASS.'
            echo '- Build + deploy exact DEV runtime under test: PASS.'
            echo '- DEV Hosting/R2/AI endpoint preflight: PASS.'
            echo '- Firebase + R2 ADMIN/EDITOR/VIEWER multi-user/realtime/offline-reconnect: PASS.'
            echo '- Immutable media replacement: PASS.'
            echo '- Health Center live safe-repair + second-account realtime + re-audit: PASS.'
            echo '- Hosted browser desktop + mobile: PASS.'
            echo '- Health Center Android/browser Back cleanup: PASS with zero stale backdrop and background scroll unlocked.'
            echo '- Sync Center opens after Back in VIEWER fail-closed state: PASS.'
            echo '- No PROD Firebase/R2 browser requests: PASS.'
            echo '- No page/fatal-console errors: PASS.'
            echo
            echo '## Runtime Golden #77 root cause and correction'
            echo '- #77 was a false-negative test assertion, not an RBAC failure: the unsigned hosted browser is VIEWER, while the old test waited for ADMIN-only “Cài đặt sao lưu nâng cao”.'
            echo '- RBAC was NOT loosened. Runtime Golden now anchors on the common Sync Center heading and accepts either ADMIN backup controls or the correct VIEWER fail-closed notice.'
            echo '- The test directly verifies the floating Settings backdrop is removed synchronously after Back before the next tap.'
            echo
            echo '## Certification in this packaging run'
            echo '- npm ci: PASS'
            echo '- Health Center golden suite: PASS'
            echo '- HNL AI core/tools/audit/planner/provider/gateway/export goldens: PASS'
            echo '- Stability/offline/RBAC/R2/auth/contact/defect/checklist/media/UI goldens: PASS'
            echo '- TypeScript: PASS'
            echo '- Lint + source secret scan + package/lock consistency: PASS'
            echo '- Firebase Rules compile/behavior: PASS'
            echo '- Production dependency critical audit gate: PASS'
            echo '- Build: PASS'
            echo '- Firebase config / DEV isolation preflight: PASS'
            echo '- .github/workflows present and packaged: PASS'
            echo '- PATCH ZIP integrity: PASS'
            echo '- FULL SOURCE ZIP integrity: PASS'
            echo '- SHA256 verification: PASS'
            echo
            echo '## Safety status'
            echo '- No application RBAC/data logic was relaxed for the Runtime #77 correction.'
            echo '- No merge to main and no PROD deploy performed.'
            echo '- Firebase project, projectId, Hosting targets, R2 endpoints and GitHub repository were not changed.'
            echo
            echo '## Changed/added files from continuation baseline'
            echo '```'
            cat "$OUT/changed-files.txt"
            echo '```'
          } > "$OUT/HNL-QLTC-DEV-FINAL-REPORT-2026-09-11.md"

          unzip -t "$OUT/HNL-QLTC-DEV-PATCH-2026-09-11.zip" >/dev/null
          unzip -t "$OUT/HNL-QLTC-DEV-FULL-SOURCE-2026-09-11.zip" >/dev/null
          test -s "$OUT/HNL-QLTC-DEV-FINAL-REPORT-2026-09-11.md"
          (cd "$OUT" && sha256sum *.zip *.md > SHA256SUMS.txt)
          (cd "$OUT" && sha256sum -c SHA256SUMS.txt)
          ls -lh "$OUT"

      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-DEV-FINAL-DELIVERABLES-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/hnl-deliverables/HNL-QLTC-DEV-PATCH-2026-09-11.zip
            ${{ runner.temp }}/hnl-deliverables/HNL-QLTC-DEV-FULL-SOURCE-2026-09-11.zip
            ${{ runner.temp }}/hnl-deliverables/HNL-QLTC-DEV-FINAL-REPORT-2026-09-11.md
            ${{ runner.temp }}/hnl-deliverables/SHA256SUMS.txt
            ${{ runner.temp }}/hnl-deliverables/changed-files.txt
          if-no-files-found: error
          retention-days: 30
