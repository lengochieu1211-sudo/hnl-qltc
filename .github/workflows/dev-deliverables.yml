name: Package HNL QLTC DEV Deliverables

on:
  workflow_dispatch:
  push:
    branches: [dev]

permissions:
  contents: read
  actions: read

jobs:
  rules_certification:
    name: Firebase Rules certification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FIREBASE_RULES_ATTEMPT_TIMEOUT_MS: "180000"
      FIREBASE_RULES_MAX_ATTEMPTS: "2"
      FIREBASE_RULES_STEP_BUDGET_MS: "480000"
    steps:
      - name: Checkout exact DEV head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Cache Firebase emulator binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/firebase/emulators
          key: ${{ runner.os }}-firebase-emulators-v13.35.1
          restore-keys: |
            ${{ runner.os }}-firebase-emulators-

      - name: Install exact locked dependencies
        run: npm ci

      - name: Firebase Rules compile and behavior
        run: npm run test:rules

  package:
    needs: rules_certification
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: 'true'
      VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
      VITE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_HNL_AI_ENABLED: 'true'
      VITE_HNL_AI_GATEWAY_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout exact DEV head
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: DEV/source isolation preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/dev'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -f package.json
          test -f package-lock.json
          test -f firebase.json
          test -d .github/workflows
          test "$VITE_R2_GATEWAY_URL" = 'https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev'
          test "$VITE_HNL_AI_GATEWAY_URL" = 'https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev'
          BASELINE_SHA="$(git rev-parse HEAD^)"
          echo "BASELINE_SHA=$BASELINE_SHA" >> "$GITHUB_ENV"
          echo "DEV deliverable isolation preflight: PASS ($BASELINE_SHA -> $GITHUB_SHA)"

      - name: Wait for exact Runtime Golden
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          API="https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/dev-runtime-golden.yml/runs?branch=dev&event=push&per_page=20"
          for attempt in $(seq 1 105); do
            JSON="$(curl --fail --silent --show-error -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/vnd.github+json' "$API")"
            INFO="$(printf '%s' "$JSON" | TARGET_SHA="$GITHUB_SHA" node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const r=(j.workflow_runs||[]).find(x=>x.head_sha===process.env.TARGET_SHA);process.stdout.write(r?[r.status,String(r.conclusion||''),String(r.id||''),String(r.run_number||'')].join('|'):'missing|||')})")"
            STATUS="${INFO%%|*}"
            REST="${INFO#*|}"; CONCLUSION="${REST%%|*}"; REST="${REST#*|}"; RUN_ID="${REST%%|*}"; RUN_NUMBER="${REST##*|}"
            if [ "$STATUS" = 'completed' ] && [ "$CONCLUSION" = 'success' ]; then
              echo "RUNTIME_VERIFIED_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
              echo "RUNTIME_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
              echo "RUNTIME_RUN_NUMBER=$RUN_NUMBER" >> "$GITHUB_ENV"
              echo "Exact Runtime Golden completed successfully: run $RUN_ID / $GITHUB_SHA"
              break
            fi
            if [ "$STATUS" = 'completed' ] && [ "$CONCLUSION" != 'success' ]; then
              echo "::error::Runtime Golden failed for $GITHUB_SHA: $INFO"; exit 1
            fi
            echo "Waiting Runtime Golden for $GITHUB_SHA ($attempt/105): $INFO"
            sleep 20
            if [ "$attempt" -eq 105 ]; then echo '::error::Timed out waiting for Runtime Golden'; exit 1; fi
          done

      - name: Classify exact Runtime Golden evidence
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EVIDENCE_DIR="$RUNNER_TEMP/runtime-golden"
          rm -rf "$EVIDENCE_DIR"
          mkdir -p "$EVIDENCE_DIR"
          gh run download "$RUNTIME_RUN_ID" --repo "$GITHUB_REPOSITORY" -D "$EVIDENCE_DIR"
          REPORT_JSON="$(find "$EVIDENCE_DIR" -type f -name live-backend-report.json | head -n 1)"
          test -n "$REPORT_JSON" && test -f "$REPORT_JSON" || { echo '::error::Missing live-backend-report.json from exact Runtime Golden'; exit 1; }
          CLASSIFICATION="$(REPORT_JSON="$REPORT_JSON" node -e "const fs=require('fs');const r=JSON.parse(fs.readFileSync(process.env.REPORT_JSON,'utf8'));const s=String(r.status||'');const c=String(r.certificationState||'');if(s==='PASS'&&c==='CERTIFIED_ELIGIBLE')process.stdout.write('CERTIFIED');else if(s==='PASS_WITH_INFRA_QUOTA_BLOCK'&&c==='INFRA_QUOTA_BLOCKED')process.stdout.write('VERIFIED_INFRA_QUOTA_BLOCKED');else {console.error('Unexpected runtime evidence state: '+s+' / '+c);process.exit(2)}")"
          echo "RUNTIME_CLASSIFICATION=$CLASSIFICATION" >> "$GITHUB_ENV"
          if [ "$CLASSIFICATION" = 'CERTIFIED' ]; then
            echo "RUNTIME_CERTIFIED_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
            echo "DELIVERABLE_LABEL=CERTIFIED" >> "$GITHUB_ENV"
            echo "Runtime evidence: CERTIFIED eligible"
          else
            echo "DELIVERABLE_LABEL=VERIFIED-INFRA-BLOCKED" >> "$GITHUB_ENV"
            echo "::warning::Runtime evidence completed all available checks but direct Firestore REST remained blocked by DEV quota; deliverables must NOT be labeled CERTIFIED."
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact locked dependencies
        run: npm ci

      - name: Full certification gates
        shell: bash
        run: |
          set -euo pipefail
          npm run test:health-center
          npm run test:ai-core
          npm run test:ai-tools
          npm run test:ai-audit
          npm run test:ai-planner
          npm run test:ai-provider
          npm run test:ai-gateway
          npm run test:ai-export
          npm run test:stability
          npm run typecheck
          npm run lint
          npm run security:audit
          npm run build

      - name: Build PATCH ZIP + FULL SOURCE ZIP + REPORT
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/hnl-deliverables"
          PATCH_DIR="$OUT/patch"
          DATE_UTC="$(date -u +%Y-%m-%d)"
          SHORT_SHA="${GITHUB_SHA:0:8}"
          mkdir -p "$PATCH_DIR"

          git diff --name-status "$BASELINE_SHA" "$GITHUB_SHA" > "$OUT/changed-files.txt"
          git diff --name-only --diff-filter=ACMRT "$BASELINE_SHA" "$GITHUB_SHA" > "$OUT/patch-files.txt"
          git diff --name-only --diff-filter=D "$BASELINE_SHA" "$GITHUB_SHA" > "$OUT/deleted-files.txt"
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            [ -f "$file" ] || continue
            mkdir -p "$PATCH_DIR/$(dirname "$file")"
            cp -p "$file" "$PATCH_DIR/$file"
          done < "$OUT/patch-files.txt"

          # PATCH must also represent delete-only commits. Always embed an exact-head manifest
          # so the archive is never empty and consumers can remove files listed under
          # [deleted-files] when applying the patch.
          {
            echo "HNL QLTC DEV PATCH MANIFEST"
            echo "Base: $BASELINE_SHA"
            echo "Head: $GITHUB_SHA"
            echo
            echo "[changed-files]"
            cat "$OUT/changed-files.txt"
            echo
            echo "[deleted-files]"
            cat "$OUT/deleted-files.txt"
          } > "$PATCH_DIR/PATCH-MANIFEST.txt"

          PATCH_ZIP="$OUT/HNL-QLTC-DEV-${SHORT_SHA}-PATCH-${DATE_UTC}.zip"
          FULL_ZIP="$OUT/HNL-QLTC-DEV-${SHORT_SHA}-FULL-SOURCE-${DATE_UTC}.zip"
          REPORT_KIND="$([ "${RUNTIME_CLASSIFICATION:-CERTIFIED}" = 'CERTIFIED' ] && echo CERTIFICATION || echo VERIFICATION)"
          REPORT="$OUT/HNL-QLTC-DEV-${SHORT_SHA}-${REPORT_KIND}-REPORT-${DATE_UTC}.md"
          (cd "$PATCH_DIR" && zip -qr "$PATCH_ZIP" .)
          git archive --format=zip --output="$FULL_ZIP" "$GITHUB_SHA"

          {
            if [ "${RUNTIME_CLASSIFICATION:-CERTIFIED}" = 'CERTIFIED' ]; then
              echo "# HNL QLTC DEV Certification Report — ${DATE_UTC}"
            else
              echo "# HNL QLTC DEV Verification Report — ${DATE_UTC}"
            fi
            echo
            echo "- Exact DEV source commit: \`$GITHUB_SHA\`"
            echo "- Parent/baseline commit: \`$BASELINE_SHA\`"
            echo "- Runtime-verified commit: \`${RUNTIME_VERIFIED_SHA:-$GITHUB_SHA}\`"
            if [ "${RUNTIME_CLASSIFICATION:-CERTIFIED}" = 'CERTIFIED' ]; then
              echo "- Runtime-certified commit: \`${RUNTIME_CERTIFIED_SHA:-$GITHUB_SHA}\`"
            else
              echo "- Runtime certification: NOT GRANTED — DEV Firestore direct REST quota blocked."
            fi
            echo "- Runtime Golden workflow run: \`${RUNTIME_RUN_ID:-manual-dispatch}\`"
            echo '- PROD/main: NOT merged or deployed by this workflow.'
            echo '- Firebase/R2/AI certification endpoints: DEV only.'
            echo
            echo '## Certification gates'
            echo '- npm ci: PASS'
            echo '- Stability / offline / RBAC / media / Health Center / HNL AI goldens: PASS'
            echo '- TypeScript: PASS'
            echo '- Lint + source secret scan + package/lock consistency: PASS'
            echo '- Firebase Rules compile/behavior: PASS'
            echo '- Production dependency critical security audit: PASS'
            echo '- Build: PASS'
            if [ "${RUNTIME_CLASSIFICATION:-CERTIFIED}" = 'CERTIFIED' ]; then
              echo '- Runtime Golden exact SHA: PASS / certification eligible'
            else
              echo '- Runtime Golden exact SHA: PASS WITH INFRA QUOTA BLOCK — not certification eligible'
              echo '- Direct Firestore REST probe: BLOCKED by DEV HTTP 429 RESOURCE_EXHAUSTED; SDK multi-user/realtime/offline and remaining runtime checks completed.'
            fi
            echo '- PATCH ZIP integrity: PASS'
            echo '- FULL SOURCE ZIP integrity: PASS'
            echo
            echo '## Changed files from parent'
            echo '```'
            cat "$OUT/changed-files.txt"
            echo '```'
            echo
            echo '## Deleted files represented by PATCH manifest'
            echo '```'
            cat "$OUT/deleted-files.txt"
            echo '```'
          } > "$REPORT"

          unzip -t "$PATCH_ZIP" >/dev/null
          unzip -t "$FULL_ZIP" >/dev/null
          (cd "$OUT" && sha256sum *.zip *.md > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
          echo "PATCH_ZIP=$PATCH_ZIP" >> "$GITHUB_ENV"
          echo "FULL_ZIP=$FULL_ZIP" >> "$GITHUB_ENV"
          echo "REPORT=$REPORT" >> "$GITHUB_ENV"

      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-DEV-${{ env.DELIVERABLE_LABEL }}-${{ github.run_number }}
          path: |
            ${{ env.PATCH_ZIP }}
            ${{ env.FULL_ZIP }}
            ${{ env.REPORT }}
            ${{ runner.temp }}/hnl-deliverables/SHA256SUMS.txt
            ${{ runner.temp }}/hnl-deliverables/changed-files.txt
            ${{ runner.temp }}/hnl-deliverables/deleted-files.txt
          if-no-files-found: error
          retention-days: 30
