name: RC2.2.15 Live Browser Smoke Once

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/rc2215-live-browser-smoke-once.yml'

permissions:
  contents: read

jobs:
  live_browser_smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser smoke dependency
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/hnl-browser-smoke"
          cd "$RUNNER_TEMP/hnl-browser-smoke"
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Test live PROD desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hnl-browser-smoke"
          cat > smoke.cjs <<'NODE_EOF'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const baseUrl = 'https://hnlqltc.web.app/?release=rc2.2.15&browser-smoke=' + Date.now();
          const cases = [
            { name: 'desktop', viewport: { width: 1440, height: 900 }, isMobile: false },
            { name: 'mobile', viewport: { width: 390, height: 844 }, isMobile: true },
          ];
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const report = [];
            let failed = false;
            for (const testCase of cases) {
              const context = await browser.newContext({ viewport: testCase.viewport, isMobile: testCase.isMobile });
              const page = await context.newPage();
              const pageErrors = [];
              const sameOriginHttpErrors = [];
              page.on('pageerror', e => pageErrors.push(String(e && e.message || e)));
              page.on('response', r => {
                try {
                  const u = new URL(r.url());
                  if (u.origin === 'https://hnlqltc.web.app' && r.status() >= 400) {
                    sameOriginHttpErrors.push(`${r.status()} ${u.pathname}`);
                  }
                } catch {}
              });
              const response = await page.goto(baseUrl + '&viewport=' + testCase.name, { waitUntil: 'domcontentloaded', timeout: 60000 });
              await page.waitForFunction(() => {
                const root = document.querySelector('#root');
                return !!root && root.childElementCount > 0 && document.body.innerText.trim().length > 40;
              }, { timeout: 45000 });
              await page.waitForTimeout(3000);
              const state = await page.evaluate(() => ({
                title: document.title,
                textLength: document.body.innerText.trim().length,
                rootChildren: document.querySelector('#root')?.childElementCount || 0,
                scrollWidth: document.documentElement.scrollWidth,
                innerWidth: window.innerWidth,
                bodyText: document.body.innerText.slice(0, 1200),
              }));
              const fatalText = /application error|something went wrong|failed to load application|blank screen/i.test(state.bodyText);
              const mobileOverflow = testCase.name === 'mobile' && state.scrollWidth > state.innerWidth + 8;
              const ok = !!response && response.status() === 200 && state.rootChildren > 0 && state.textLength > 40 && pageErrors.length === 0 && sameOriginHttpErrors.length === 0 && !fatalText && !mobileOverflow;
              if (!ok) failed = true;
              const out = { name: testCase.name, httpStatus: response && response.status(), ...state, pageErrors, sameOriginHttpErrors, fatalText, mobileOverflow, ok };
              report.push(out);
              await page.screenshot({ path: `${testCase.name}.png`, fullPage: true });
              await context.close();
            }
            await browser.close();
            fs.writeFileSync('report.json', JSON.stringify(report, null, 2));
            console.log(JSON.stringify(report, null, 2));
            if (failed) process.exit(1);
          })().catch(err => { console.error(err); process.exit(1); });
          NODE_EOF
          node smoke.cjs

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-RC2.2.15-Live-Browser-Smoke
          path: |
            ${{ runner.temp }}/hnl-browser-smoke/report.json
            ${{ runner.temp }}/hnl-browser-smoke/desktop.png
            ${{ runner.temp }}/hnl-browser-smoke/mobile.png
          if-no-files-found: warn
          retention-days: 30
