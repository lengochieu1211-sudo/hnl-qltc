name: HNL QLTC DEV Auto Login Emulator Golden

on:
  pull_request:
    branches: [dev]
    paths:
      - 'src/components/AppAuthGate.tsx'
      - 'src/lib/firebaseBase.ts'
      - 'scripts/dev-emulator-autologin-*.mjs'
      - '.github/workflows/dev-emulator-autologin-golden.yml'
  push:
    branches: [dev]
    paths:
      - 'src/components/AppAuthGate.tsx'
      - 'src/lib/firebaseBase.ts'
      - 'scripts/dev-emulator-autologin-*.mjs'
      - '.github/workflows/dev-emulator-autologin-golden.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dev_auth_emulator_autologin:
    # Never run for main, PROD or other deployment environments.
    if: github.ref != 'refs/heads/main' && (github.event_name != 'push' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      DEV_AUTO_TEST_ENV: isolated-emulator
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_USE_FIREBASE_EMULATORS: 'true'
      VITE_FIREBASE_EMULATOR_PROJECT_ID: demo-hnl-qltc-dev
      VITE_BINARY_STORAGE_PROVIDER: firebase-storage
      VITE_HNL_AI_ENABLED: 'false'
      VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install dependencies
        run: npm ci
      - name: Compile, lint and isolation gates
        run: |
          npm run typecheck
          npm run lint
          node scripts/dev-emulator-autologin-boundary-golden.mjs
          npm run build
      - name: Install headless Chromium
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Test DEV Auth Emulator login in three browser sessions
        run: >-
          npx --yes firebase-tools@13.35.1 emulators:exec
          --only auth,firestore,storage
          --project demo-hnl-qltc-dev
          "node scripts/dev-emulator-autologin-browser-golden.mjs"
      - name: Save evidence (never upload auth tokens)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HNL-DEV-EMULATOR-AUTOLOGIN-${{ github.run_number }}
          path: runtime-evidence/dev-emulator-auto-login/**
          if-no-files-found: warn
          retention-days: 14
