name: Package exact HNL QLTC DEV 82087d09 source

on:
  push:
    branches: [artifact-source-82087d09]

permissions:
  contents: read

jobs:
  package_exact_source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout packaging branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive exact certified DEV commit
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="82087d099cb1928798b00d1b631e708aa540cafe"
          git cat-file -e "$TARGET_SHA^{commit}"
          git archive --format=zip --output=HNL-QLTC-V6.3.0-DEV-82087d09-FULL-SOURCE.zip "$TARGET_SHA"
          unzip -t HNL-QLTC-V6.3.0-DEV-82087d09-FULL-SOURCE.zip
          sha256sum HNL-QLTC-V6.3.0-DEV-82087d09-FULL-SOURCE.zip > HNL-QLTC-V6.3.0-DEV-82087d09-FULL-SOURCE.sha256

      - name: Upload exact source package
        uses: actions/upload-artifact@v4
        with:
          name: HNL-QLTC-DEV-82087d09-FULL-SOURCE
          path: |
            HNL-QLTC-V6.3.0-DEV-82087d09-FULL-SOURCE.zip
            HNL-QLTC-V6.3.0-DEV-82087d09-FULL-SOURCE.sha256
          if-no-files-found: error
