name: RC2.2.10 Apply Hotfix Once
on:
  push:
    branches: [rc2-2-10-photo-realtime-android-intake]
    paths:
      - '.github/workflows/rc2-2-10-apply-hotfix-once.yml'

permissions:
  contents: write

jobs:
  apply_hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify staged patch
        shell: bash
        run: |
          set -euo pipefail
          echo '3102c17737d65733009310556973f23fca6bb1ad27d9b3a2edc492b2421e3971  .github/rc2210.patch' | sha256sum -c -
          git apply --check .github/rc2210.patch
      - name: Apply RC2.2.10 patch
        shell: bash
        run: |
          set -euo pipefail
          git apply .github/rc2210.patch
          git diff --check
      - name: Source gates
        shell: bash
        run: |
          set -euo pipefail
          node scripts/stability-gate.mjs
          node scripts/offline-golden.mjs
          node scripts/category-golden.mjs
          node scripts/firebase-only-golden.mjs
          node scripts/firebase-only-legacy-audit.mjs --self-test
          node scripts/emulator-golden.mjs
          node scripts/rbac-matrix.mjs
          node scripts/r2-gateway-golden.mjs
          node scripts/desktop-launcher-golden.mjs
          node scripts/auth-popup-golden.mjs
          node scripts/source-lint.mjs
      - name: Commit source-only hotfix
        shell: bash
        run: |
          set -euo pipefail
          # GitHub App token cannot push workflow-file edits. Keep those two files at
          # branch HEAD; connector updates them separately after this source commit.
          git checkout HEAD -- .github/workflows/android-apk.yml .github/workflows/windows-exe.yml
          rm -f .github/rc2210.patch
          git add -A
          echo 'Changed files to commit:'
          git diff --cached --name-only
          test -z "$(git diff --cached --name-only | grep '^\.github/workflows/' || true)" || { echo 'REFUSING workflow-file change in bot commit'; exit 1; }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: RC2.2.10 photo realtime and Android camera intake'
          git push origin HEAD:rc2-2-10-photo-realtime-android-intake
