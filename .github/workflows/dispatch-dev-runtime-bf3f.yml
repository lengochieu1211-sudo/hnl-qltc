name: Dispatch DEV Runtime bf3f

on:
  push:
    branches: [gate/ai-material-raw-20260908]
    paths:
      - '.github/workflows/dispatch-dev-runtime-bf3f.yml'

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Verify DEV SHA and dispatch DEV-only runtime
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED='bf3fdb6b87032787db2b56facf1aa5e9cd544806'
          ACTUAL="$(gh api repos/${GITHUB_REPOSITORY}/branches/dev --jq '.commit.sha')"
          test "$ACTUAL" = "$EXPECTED" || { echo "::error::DEV moved: $ACTUAL"; exit 1; }
          gh workflow run dev-runtime-golden.yml --repo "$GITHUB_REPOSITORY" --ref dev
          echo "Dispatched DEV Runtime Golden for $EXPECTED"
