name: RC2.2.8 Apply Runtime Finalization + Photo Fix

on:
  push:
    branches:
      - rc2-2-8-data-integrity-master-gate
    paths:
      - .github/workflows/rc2-2-8-apply-runtime-fix.yml

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch history
        uses: actions/checkout@v4
        with:
          fetch-depth: 20

      - name: Verify temp payload only
        shell: bash
        run: |
          set -euo pipefail
          BASE="fab7d071520df72885de73295a3f8d5cee2f29d5"
          git cat-file -e "${BASE}^{commit}"
          unexpected="$(git diff --name-only "$BASE"..HEAD | grep -Ev '^\.github/rc228-patch/|^\.github/rc228-patch-raw/|^\.github/rc228-patch-small/|^\.github/workflows/rc2-2-8-apply-runtime-fix\.yml$' || true)"
          test -z "$unexpected" || { echo "Unexpected files changed before apply:"; echo "$unexpected"; exit 1; }

      - name: Apply byte-verified candidate and run source gates
        shell: bash
        run: |
          set -euo pipefail
          echo "3ba9352dfbf80fbb929a2613605cd4c903e55494277e500e6f653df5e548dd11  .github/rc228-patch-small/part00" | sha256sum -c -
          echo "c78d777a7a8e449f4b0d2a3c8dd64309d8dd37ff9715ea457740de9a38af4060  .github/rc228-patch-small/part01" | sha256sum -c -
          echo "73d686fece8d910ab78db00176fcc258f2492d7e802a2cd7cc10aa2a73301071  .github/rc228-patch-small/part02" | sha256sum -c -
          echo "0aa45deef4698f3e11477ee398d13bd14efdf57a7d128721474e576754dbad84  .github/rc228-patch-small/part03" | sha256sum -c -
          echo "4e6de83deac8f17ba7a8f51587d01d7c70682a97bb75476a86b33f9170decd1a  .github/rc228-patch-small/part04" | sha256sum -c -
          echo "d9a5ed861e4860bee0abcc9b9ea600b83398de2e785df358437da08549664b1b  .github/rc228-patch-small/part05" | sha256sum -c -
          echo "b9edaac81298820962a0ca2a504cee14cf46f5e67dc2e2485c2813f9b6401eb2  .github/rc228-patch-small/part06" | sha256sum -c -
          echo "512bf77dca0c9d97c85ab2a323e3cde44db065a2a8fa5f5cb023664590740817  .github/rc228-patch-small/part07" | sha256sum -c -
          echo "0ef82d5224bfc2bd3a6e24a84150d646bfe7c5059aba8e30e1bf17b990029a22  .github/rc228-patch-small/part08" | sha256sum -c -
          cat .github/rc228-patch-small/part{00,01,02,03,04,05,06,07,08} > /tmp/rc228.patch
          echo "20d2eeb0997e1dcc5d30ad65788430fd71f185f2c22e1ec56640a6acd662af96  /tmp/rc228.patch" | sha256sum -c -
          git apply --check /tmp/rc228.patch
          git apply /tmp/rc228.patch
          git diff --check

          node scripts/stability-gate.mjs
          node scripts/offline-golden.mjs
          node scripts/category-golden.mjs
          node scripts/firebase-only-golden.mjs
          node scripts/firebase-only-legacy-audit.mjs --self-test
          node scripts/emulator-golden.mjs
          node scripts/rbac-matrix.mjs
          node scripts/r2-gateway-golden.mjs
          node scripts/desktop-launcher-golden.mjs
          node scripts/auth-popup-golden.mjs
          node scripts/source-lint.mjs

          if git diff --name-only | grep -E '^(package\.json|package-lock\.json|firebase\.json|firebase\.prod\.json|firestore\.rules|storage\.rules|database\.rules\.json)$'; then
            echo "Unexpected protected config change"
            exit 1
          fi

          # GitHub Actions' token cannot push workflow-file changes. Keep both release
          # workflows and this one-shot workflow unchanged in the bot commit; they are
          # finalized/removed separately through the GitHub connector after source push.
          git checkout -- .github/workflows/android-apk.yml .github/workflows/windows-exe.yml
          rm -rf .github/rc228-patch .github/rc228-patch-raw .github/rc228-patch-small

      - name: Commit source fix to existing PR branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          if git diff --cached --name-only | grep -q '^\.github/workflows/'; then
            echo "Refusing bot push with workflow-file changes"
            exit 1
          fi
          git commit -m "fix: cross-account cloud photos and RC2.2.8 source"
          git push origin HEAD:rc2-2-8-data-integrity-master-gate
