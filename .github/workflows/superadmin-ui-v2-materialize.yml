name: SuperAdmin UI V2 Materialize

on:
  push:
    branches:
      - feature/superadmin-ui-v2-20260901
    paths:
      - '.github/workflows/superadmin-ui-v2-materialize.yml'
      - 'scripts/materialize-superadmin-ui-v2.py'
      - 'scripts/fix-ui-v2-stability.py'

permissions:
  contents: write

jobs:
  patch_test_materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/superadmin-ui-v2-20260901
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply Super Admin UI V2 patch
        run: python3 scripts/materialize-superadmin-ui-v2.py
      - name: Update Stability logo guard
        run: python3 scripts/fix-ui-v2-stability.py
      - run: npm ci
      - name: Stability
        run: npm run test:stability
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Rules
        run: npm run test:rules
      - name: Security
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Commit certified source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "HNL QLTC CI"
          git config user.email "actions@users.noreply.github.com"
          rm -f .github/workflows/superadmin-ui-v2-materialize.yml scripts/materialize-superadmin-ui-v2.py scripts/fix-ui-v2-stability.py
          git add src/App.tsx src/components/GoogleAuthHeader.tsx src/components/SuperAdminCenter.tsx src/lib/firebase.ts src/index.css scripts/stability-gate.mjs .github/workflows/superadmin-ui-v2-materialize.yml scripts/materialize-superadmin-ui-v2.py scripts/fix-ui-v2-stability.py
          git commit -m "Add Super Admin UI Settings V2"
          git push origin HEAD:feature/superadmin-ui-v2-20260901
