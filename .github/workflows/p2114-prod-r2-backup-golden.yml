name: P21.14 PROD R2 backup metadata-preserving backup (NO PROD)
on:
  push:
    branches:
      - release/p21-13-prod-candidate-20261027
    paths:
      - 'scripts/p2114-prod-r2-backup*'
      - '.github/workflows/p2114-prod-r2-backup-golden.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dev-r2-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: '4078cafe74946b0d5a67b35143b60071'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact source and R2 PROD source-read / isolated backup-write guard
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/p21-13-prod-candidate-20261027'
          test -n "${CLOUDFLARE_API_TOKEN:-}"
          grep -q '^bucket_name = "hnl-qltc-media"$' scripts/p2114-prod-r2-backup.toml
          grep -q '^bucket_name = "hnl-qltc-media-prod-backup"$' scripts/p2114-prod-r2-backup.toml
          test "$(grep -c '^bucket_name = ' scripts/p2114-prod-r2-backup.toml)" = 2
          ! grep -q '^bucket_name = "hnl-qltc-media-dev"
      - name: Start ephemeral local Wrangler with remote PROD source-to-isolated-backup only R2 bindings
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.153.0 dev --config scripts/p2114-prod-r2-backup.toml --ip 127.0.0.1 --port 8789 > /tmp/hnl-p2114-wrangler.log 2>&1 &
          echo $! > /tmp/hnl-p2114.pid
          ready=0
          for i in $(seq 1 50); do
            if curl --silent --fail -H 'x-hnl-dev-backup: PROD-SNAPSHOT-P2114' http://127.0.0.1:8789/health | grep -q '"environment":"PROD"'; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then tail -80 /tmp/hnl-p2114-wrangler.log; exit 1; fi
      - name: Snapshot entire PROD R2 and verify every byte + metadata
        run: node scripts/p2114-prod-r2-backup-runner.mjs
      - name: Publish verified backup manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P2114-DEV-R2-BACKUP-VERIFIED-${{ github.sha }}
          path: P2114-DEV-R2-BACKUP-VERIFIED-MANIFEST.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stop local backup worker
        if: always()
        run: |
          if [ -f /tmp/hnl-p2114.pid ]; then kill "$(cat /tmp/hnl-p2114.pid)" || true; fi
          tail -20 /tmp/hnl-p2114-wrangler.log || true
 scripts/p2114-prod-r2-backup.toml
          ! grep -q 'PROD_SOURCE\.put\|PROD_SOURCE\.delete' scripts/p2114-prod-r2-backup-worker.mjs
      - name: Start ephemeral local Wrangler with remote PROD source-to-isolated-backup only R2 bindings
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.153.0 dev --config scripts/p2114-prod-r2-backup.toml --ip 127.0.0.1 --port 8789 > /tmp/hnl-p2114-wrangler.log 2>&1 &
          echo $! > /tmp/hnl-p2114.pid
          ready=0
          for i in $(seq 1 50); do
            if curl --silent --fail -H 'x-hnl-dev-backup: PROD-SNAPSHOT-P2114' http://127.0.0.1:8789/health | grep -q '"environment":"PROD"'; then ready=1; break; fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then tail -80 /tmp/hnl-p2114-wrangler.log; exit 1; fi
      - name: Snapshot entire PROD R2 and verify every byte + metadata
        run: node scripts/p2114-prod-r2-backup-runner.mjs
      - name: Publish verified backup manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: P2114-DEV-R2-BACKUP-VERIFIED-${{ github.sha }}
          path: P2114-DEV-R2-BACKUP-VERIFIED-MANIFEST.json
          if-no-files-found: warn
          retention-days: 30
      - name: Stop local backup worker
        if: always()
        run: |
          if [ -f /tmp/hnl-p2114.pid ]; then kill "$(cat /tmp/hnl-p2114.pid)" || true; fi
          tail -20 /tmp/hnl-p2114-wrangler.log || true
