name: HNL DEV Room Preset Labels and Icon Align Hosting-only Release 20261120 (NO PROD/Rules/R2/AI)
on:
  push:
    branches:
      - dev
    paths:
      - .github/workflows/hnl-dev-room-preset-icon-align-hosting-only-20261120.yml
permissions:
  contents: read
concurrency:
  group: hnl-qltc-dev-release
  cancel-in-progress: false
jobs:
  deploy-dev-hosting-only:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      DEV_PROJECT: hnl-qltc-dev
      DEV_HOST: https://hnl-qltc-dev.web.app
      VITE_APP_ENV: DEV
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway-dev.lengochieu1211.workers.dev
      VITE_HNL_AI_ENABLED: 'true'
      VITE_HNL_AI_GATEWAY_URL: https://hnl-qltc-ai-gateway-dev.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: 'true'
      VITE_ENABLE_LEGACY_DRIVE_WRITE: 'false'
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: 'false'
      VITE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: '(default)'
      VITE_USE_FIREBASE_EMULATORS: 'false'
      VITE_FIREBASE_AUTH_DOMAIN: hnl-qltc-dev.web.app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify DEV HEAD, controlled reconciliation, correct target, unchanged PROD
        shell: bash
        env:
          FIREBASE_DEV_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV }}
        run: |
          set -euo pipefail
          BASE=2bc66d6d13dd37d516a2c79f37ac0e371d94eb04
          LIVE_EXPECTED=5c3d1f52bcfae8f6a141fb4e084f10e9e9d16285
          test "$(git rev-parse HEAD^)" = "$BASE" || { echo '::error::Approval source parent mismatch'; exit 1; }
          test "$GITHUB_REPOSITORY" = lengochieu1211-sudo/hnl-qltc
          test "$GITHUB_REF" = refs/heads/dev
          test "$GITHUB_EVENT_NAME" = push
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = ec79ffc801ecf059b37c82b9f4a9acf503108bf9 || { echo "::error::PROD main HEAD changed"; exit 1; }
          # Exact approved current DEV source and immutable tree; no rollback.
          test "$(git rev-parse "$BASE^{tree}")" = ce65f33d5e4c7a9288b31d1d2151f3a63a718127
          test "$(git rev-parse "$BASE:src/components/FloorPlanDefectTab.tsx")" = 65c736fd2b958118cac32fa64ad46f8d6d10085f
          test "$(git rev-parse "$BASE:src/components/RoomHighlightModal.tsx")" = 50aab13c0b5c2b6cbec710109c589f658edf20ca
          test "$(git rev-parse "$BASE:src/components/SecurityModal.tsx")" = c271239c4ced86c93256906c28e9b6dd928ebd99
          ! grep -Fq 'Nạp thay thế (xóa cũ)' src/components/RoomHighlightModal.tsx
          grep -Fq 'Nạp Thêm Vào Căn Này' src/components/RoomHighlightModal.tsx
          grep -Fq 'data-hnl-subitem-quantity' src/components/RoomHighlightModal.tsx
          grep -Fq 'Highlight hạng mục con' src/components/FloorPlanDefectTab.tsx
          grep -Fq 'data-hnl-room-team-contact-row="true"' src/components/RoomHighlightModal.tsx
          grep -Fq 'data-hnl-room-pc-status-column="true"' src/components/RoomHighlightModal.tsx
          grep -Fq 'xl:grid-cols-[minmax(0,1.15fr)_minmax(360px,1fr)]' src/components/RoomHighlightModal.tsx
          ! grep -Fq 'data-hnl-room-name-color-row="true"' src/components/RoomHighlightModal.tsx
          ! grep -Fq 'data-hnl-room-color-option="true"' src/components/RoomHighlightModal.tsx
          grep -Fq 'data-hnl-room-category-title-row="true"' src/components/RoomHighlightModal.tsx
          grep -Fq 'data-hnl-room-add-subitem-inline="true"' src/components/RoomHighlightModal.tsx
          grep -Fq 'data-hnl-room-add-subitem-mobile="true"' src/components/RoomHighlightModal.tsx
          grep -Fq 'hidden lg:inline-flex' src/components/RoomHighlightModal.tsx
          grep -Fq 'lg:hidden w-full lg:w-auto' src/components/RoomHighlightModal.tsx
          grep -Fq 'order-2 flex justify-end xl:shrink-0' src/components/RoomHighlightModal.tsx
          grep -Fq 'data-hnl-room-preset-inline-row="true"' src/components/RoomHighlightModal.tsx
          grep -Fq 'lg:flex-row lg:items-end' src/components/RoomHighlightModal.tsx
          grep -Fq 'hidden lg:inline">Nạp hạng mục thi công</span>' src/components/RoomHighlightModal.tsx
          grep -Fq 'hidden lg:inline">Nạp vào Căn / Phòng</span>' src/components/RoomHighlightModal.tsx
          grep -Fq 'flex items-start lg:items-center gap-2 border-b border-indigo-100/80 pb-2' src/components/RoomHighlightModal.tsx
          grep -Fq 'shrink-0 mt-0.5 lg:mt-0 shadow-2xs' src/components/RoomHighlightModal.tsx
          grep -Fq 'hidden lg:inline">Chọn mẫu hạng mục thi công:</span>' src/components/RoomHighlightModal.tsx
          grep -Fq 'className="bg-slate-50/90 rounded-2xl border border-slate-200 overflow-hidden"' src/components/RoomHighlightModal.tsx
          node --experimental-strip-types scripts/subitem-highlight-advanced-golden.mjs
          test "$(git rev-parse "$BASE:scripts/ui-entry-ux-golden.ts")" = 2eac25002912a7d95d160a9742c5d3096cb3b073
          test "$(git rev-parse "$BASE:src/types.ts")" = bfed21c5206d6add5acd33a84bb382d4817219b3
          test "$(git rev-parse "$BASE:src/utils/roomCategoryUnit.ts")" = 4df44a45bad5ac87badb1f1ddf18668cd7c62189
          test "$(git rev-parse "$BASE:src/utils/subItemHighlightGeometry.ts")" = aa8c909f58448747927989d111f230a336976b70
          test "$(git rev-parse "$BASE:scripts/subitem-highlight-advanced-golden.mjs")" = 15f9a073bcf8d89b1bae684ca8d34cc636a591e8
          test "$(git rev-parse "$BASE:scripts/ui-return-and-palette-golden.mjs")" = 10732575316fd43c3491eb6d5167417964205ccb
          # Dedicated one-file approval commit after source-only patch; only DEV Hosting is deployed.
          git diff --name-only "$BASE" "$GITHUB_SHA" > "$RUNNER_TEMP/changed.txt"
          test "$(cat "$RUNNER_TEMP/changed.txt")" = '.github/workflows/hnl-dev-room-preset-icon-align-hosting-only-20261120.yml' || { echo "::error::Unexpected source changes in DEV approval commit"; cat "$RUNNER_TEMP/changed.txt"; exit 1; }
          ! grep -E '(^\.firebaserc$|^firestore\.rules$|^storage\.rules$|^firebase\.json$|^firebase\.prod\.json$|^package(-lock)?\.json$|^cloudflare|worker\.js$|^\.env|^\.github/dev-release-approval\.json$)' "$RUNNER_TEMP/changed.txt"
          test "$DEV_PROJECT" = hnl-qltc-dev
          test "$VITE_APP_ENV" = DEV
          test "$VITE_USE_FIREBASE_EMULATORS" = false
          test "$VITE_FIREBASE_AUTH_DOMAIN" = hnl-qltc-dev.web.app
          test "$VITE_ENABLE_LEGACY_DRIVE_WRITE" = false
          test -n "${FIREBASE_DEV_SA:-}"
          node - <<'NODE'
          const a=JSON.parse(process.env.FIREBASE_DEV_SA);
          if(a.type!=='service_account'||a.project_id!=='hnl-qltc-dev'||!a.private_key||!a.client_email)throw Error('Refuse wrong Firebase DEV credentials');
          console.log('DEV-only project identity verified');
          NODE
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Extract existing DEV SDK config (never create new Firebase apps)
        shell: bash
        env:
          FIREBASE_DEV_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV }}
        run: |
          set -euo pipefail
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/hnl-room-preset-icon-align-dev-credentials.json"
          printf '%s' "$FIREBASE_DEV_SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 apps:list WEB --project "$DEV_PROJECT" --json > "$RUNNER_TEMP/apps.json"
          APP_ID="$(node - "$RUNNER_TEMP/apps.json" <<'NODE'
          const d=require(process.argv[2]);const a=Array.isArray(d.result)?d.result:[];const item=a.find(x=>x.platform==='WEB'||String(x.appId||'').includes(':web:'));if(!item?.appId)throw Error('Missing existing DEV web app');process.stdout.write(item.appId)
          NODE
          )"
          npx --yes firebase-tools@13.35.1 apps:sdkconfig WEB "$APP_ID" --project "$DEV_PROJECT" --json > "$RUNNER_TEMP/sdk.json"
          node - "$RUNNER_TEMP/sdk.json" <<'NODE'
          const fs=require('fs'),d=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const keys=['apiKey','appId','messagingSenderId','projectId','authDomain','storageBucket'],out={};
          function extract(v){if(!v)return;if(typeof v==='string'){try{extract(JSON.parse(v))}catch{}
            for(const k of keys){const m=v.match(new RegExp(k+'\\s*:\\s*["\\x27]([^"\\x27]+)["\\x27]'));if(m&&!out[k])out[k]=m[1]}}
            else if(Array.isArray(v)){v.forEach(extract)}else if(typeof v==='object'){for(const [k,x] of Object.entries(v)){if(keys.includes(k)&&typeof x==='string'&&!out[k])out[k]=x;extract(x)}}}
          extract(d);
          if(out.projectId!=='hnl-qltc-dev'||!out.apiKey||!out.appId||!out.messagingSenderId)throw Error('DEV SDK identity incomplete');
          out.authDomain='hnl-qltc-dev.web.app';out.storageBucket ||= 'hnl-qltc-dev.firebasestorage.app';
          const names={apiKey:'API_KEY',appId:'APP_ID',messagingSenderId:'MESSAGING_SENDER_ID',projectId:'PROJECT_ID',authDomain:'AUTH_DOMAIN',storageBucket:'STORAGE_BUCKET'};
          fs.appendFileSync(process.env.GITHUB_ENV,Object.entries(names).map(([k,n])=>'VITE_FIREBASE_'+n+'='+out[k]).join('\n')+'\n');
          console.log('DEV existing SDK loaded, PROD Firebase not used');
          NODE
      - name: Full npm lock, TS, lint, Rules, stability and Web build gate
        shell: bash
        run: |
          set -euo pipefail
          node -e "const a=require('./package.json'),b=require('./package-lock.json');if(a.name!==b.name||a.version!==b.version)process.exit(2)"
          npm ci
          node scripts/equipment-picker-golden.mjs
          node scripts/equipment-project-scope-golden.mjs
          node --experimental-strip-types scripts/team-equipment-statistics-golden.mjs
          node --experimental-strip-types scripts/warehouse-handler-account-golden.mjs
          node scripts/ui-return-and-palette-golden.mjs
          node --experimental-strip-types scripts/subitem-highlight-advanced-golden.mjs
          npx tsx scripts/ui-entry-ux-golden.ts
          node --experimental-strip-types scripts/room-highlight-small-region-golden.mjs
          node --experimental-strip-types scripts/p216-room-sidecar-ui-golden.mjs
          node --experimental-strip-types scripts/pc-chat-room-height-golden.mjs
          node scripts/desktop-workspace-v32-golden.mjs
          node scripts/desktop-workspace-v33-deep-golden.mjs
          node scripts/desktop-workspace-v34-compact-golden.mjs
          node scripts/festival-effects-golden.mjs
          node --experimental-strip-types scripts/warehouse-order-catalog-mass-golden.mjs
          npx tsx scripts/catalog-mass-roundtrip-golden.ts
          node scripts/warehouse-catalog-voucher-link-golden.mjs
          node scripts/team-source-voucher-golden.mjs
          node scripts/warehouse-voucher-source-return-golden.mjs
          npx tsx scripts/quick-edit-excel-golden.ts
          node scripts/date-timezone-regression-golden.mjs
          npm run typecheck
          npm run lint
          npm run test:rules
          npm run security:audit
          npm run test:firestore-restore-gate
          npm run test:stability
          npm run test:floorplan-p0
          node scripts/warehouse-transfer-amend-golden.mjs
          node --experimental-strip-types scripts/room-highlight-small-region-golden.mjs
          npm run test:crew-report-structure
          npm run test:rbac
          npm run test:offline
          export VITE_GIT_COMMIT="$GITHUB_SHA"
          export VITE_BUILD_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          npm run build
          test -s dist/index.html
          test -s dist/audio/festival/rocket-real.mp3
          test -s dist/audio/festival/crackle-real.mp3
          test "$(git hash-object dist/audio/festival/rocket-real.mp3)" = 07d038ec94e7443fb9f20cf328958618f6f16c31
          test "$(git hash-object dist/audio/festival/crackle-real.mp3)" = b1d9c03cd3eb6715ed6bae78c222e58ece06c9d1
          grep -R -q hnl-qltc-dev dist/assets
          ! grep -R -q 'hnl-qltc-r2-gateway\.lengochieu1211\.workers\.dev' dist/assets
          rm -f dist/server.cjs dist/server.cjs.map
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const sha=x=>createHash('sha256').update(x).digest('hex');
          const html=fs.readFileSync('dist/index.html');
          const s=html.toString();
          const m=s.match(/src="(\/assets\/[^"]+\.js)"/);
          if(!m)throw Error('No hashed Web JS entry');
          const p='dist'+m[1];
          if(!fs.existsSync(p))throw Error('Missing built asset');
          fs.writeFileSync('dist/hnl-dev-release.json',JSON.stringify({
            schema:1,environment:'DEV',firebaseProjectId:'hnl-qltc-dev',
            gitCommit:process.env.GITHUB_SHA,buildId:process.env.GITHUB_RUN_ID+'-'+process.env.GITHUB_RUN_ATTEMPT,
            indexSha256:sha(html),entryPath:m[1],entrySha256:sha(fs.readFileSync(p))
          },null,2));
          NODE
      - name: Preflight exact DEV HEAD, previous live release and Hosting-only config (no rules/storage/workers)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = ec79ffc801ecf059b37c82b9f4a9acf503108bf9
          # Do not overwrite a concurrent or unrecognized DEV website publication.
          LIVE_JSON="$(curl -fsSL --retry 3 "$DEV_HOST/hnl-dev-release.json?preflight=$GITHUB_SHA")"
          LIVE_SHA="$(printf '%s' "$LIVE_JSON" | node -e "let s='';process.stdin.on('data',b=>s+=b).on('end',()=>{const j=JSON.parse(s);if(j.firebaseProjectId!=='hnl-qltc-dev'||j.environment!=='DEV')process.exit(2);process.stdout.write(j.gitCommit||'')})")"
          test "$LIVE_SHA" = 5c3d1f52bcfae8f6a141fb4e084f10e9e9d16285 || { echo "::error::DEV live moved since preflight; refusing overwrite: $LIVE_SHA"; exit 1; }
          node - <<'NODE'
          const fs=require('fs');
          const base=JSON.parse(fs.readFileSync('firebase.json','utf8'));
          if(base.hosting?.public!=='dist')throw Error('Hosting public root unexpected');
          const hosting={...base.hosting,site:'hnl-qltc-dev'};
          fs.writeFileSync('hnl-dev-room-preset-icon-align-20261120.generated.json',JSON.stringify({hosting}));
          const keys=Object.keys(JSON.parse(fs.readFileSync('hnl-dev-room-preset-icon-align-20261120.generated.json')));
          if(keys.join(',')!=='hosting')throw Error('Forbidden resources in deploy config');
          NODE
          test "$DEV_PROJECT" != com-example-qlct-61329
      - name: DEPLOY HOSTING ONLY to existing DEV site (NEVER PROD, Rules, R2 or Workers)
        env:
          FIREBASE_DEV_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_HNL_QLTC_DEV }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/dev | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = ec79ffc801ecf059b37c82b9f4a9acf503108bf9
          LIVE_SHA="$(curl -fsSL --retry 3 "$DEV_HOST/hnl-dev-release.json?deploy=$GITHUB_SHA" | node -e "let s='';process.stdin.on('data',b=>s+=b).on('end',()=>{const j=JSON.parse(s);if(j.firebaseProjectId!=='hnl-qltc-dev'||j.environment!=='DEV')process.exit(2);process.stdout.write(j.gitCommit||'')})")"
          test "$LIVE_SHA" = 5c3d1f52bcfae8f6a141fb4e084f10e9e9d16285 || { echo "::error::Concurrent DEV Hosting update detected; refuse deploy"; exit 1; }
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/hnl-room-preset-icon-align-dev-credentials.json"
          test -s "$GOOGLE_APPLICATION_CREDENTIALS"
          npx --yes firebase-tools@13.35.1 deploy --only hosting --config "$GITHUB_WORKSPACE/hnl-dev-room-preset-icon-align-20261120.generated.json" --project hnl-qltc-dev --non-interactive
      - name: Confirm DEV LIVE exact deployed source and real assets, read-only
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            status=$(curl -L -sS -o "$RUNNER_TEMP/hnl-dev-release-live.json" -w '%{http_code}' "$DEV_HOST/hnl-dev-release.json?head=$GITHUB_SHA")
            if [ "$status" = 200 ] && node - "$RUNNER_TEMP/hnl-dev-release-live.json" <<'NODE'
          const fs=require('fs');const j=JSON.parse(fs.readFileSync(process.argv[2]));if(j.gitCommit!==process.env.GITHUB_SHA||j.firebaseProjectId!=='hnl-qltc-dev'||j.environment!=='DEV')process.exit(1);
          NODE
            then ok=1;break;fi
            echo "DEV Hosting source propagation: HTTP $status, try $i/24"
            sleep 5
          done
          test "$ok" = 1 || { echo '::error::DEV Hosting release manifest does not match exact HEAD';exit 1;}
          curl -L -fsS "$DEV_HOST/" -o "$RUNNER_TEMP/hnl-dev-index-live.html"
          grep -q 'id="root"' "$RUNNER_TEMP/hnl-dev-index-live.html"
          node - "$RUNNER_TEMP/hnl-dev-release-live.json" <<'NODE' > "$RUNNER_TEMP/entry-path.txt"
          const j=require(process.argv[2]);process.stdout.write(j.entryPath)
          NODE
          ASSET="$(cat "$RUNNER_TEMP/entry-path.txt")"
          test "${ASSET#/assets/}" != "$ASSET"
          curl -L -fsS "$DEV_HOST$ASSET" -o "$RUNNER_TEMP/hnl-dev-entry.js"
          node - "$RUNNER_TEMP/hnl-dev-release-live.json" "$RUNNER_TEMP/hnl-dev-entry.js" <<'NODE'
          const fs=require('fs'),crypto=require('crypto'),j=require(process.argv[2]);
          const hash=crypto.createHash('sha256').update(fs.readFileSync(process.argv[3])).digest('hex');
          if(hash!==j.entrySha256)throw Error('DEV LIVE JS bytes do not match certified build');
          console.log('HNL DEV room preset icon/title aligned and new labels LIVE Git HEAD + JS SHA256 PASS; PROD untouched');
          NODE
          # Read back real CC0 audio bytes from LIVE, not just the SPA shell.
          for name in rocket-real.mp3 crackle-real.mp3; do
            curl -L -fsS "$DEV_HOST/audio/festival/$name" -o "$RUNNER_TEMP/$name"
            cmp "dist/audio/festival/$name" "$RUNNER_TEMP/$name" || { echo "::error::DEV LIVE audio bytes mismatch: $name"; exit 1; }
          done

      - name: Package exact DEV source, patch, changed-files and SHA256 handoff (no cloud data writes)
        if: success()
        shell: bash
        env:
          BASELINE_SHA: 5c3d1f52bcfae8f6a141fb4e084f10e9e9d16285
        run: |
          set -euo pipefail
          mkdir -p handoff
          git archive --format=zip --output=handoff/FULL_SOURCE.zip "$GITHUB_SHA"
          python3 - <<'PY'
          import hashlib, os, subprocess, zipfile
          base=os.environ['BASELINE_SHA']; head=os.environ['GITHUB_SHA']
          names=subprocess.check_output(['git','diff','--name-only','--diff-filter=ACMR','-z',base,head]).split(bytes([0]))
          changed=[name.decode() for name in names if name]
          with zipfile.ZipFile('handoff/PATCH.zip','w',zipfile.ZIP_DEFLATED) as z:
              for name in changed: z.writestr(name,subprocess.check_output(['git','show',head+':'+name]))
          with open('handoff/changed-files.txt','w') as f: f.write('\n'.join(changed)+'\n')
          with open('handoff/REPORT.md','w') as f:
              f.write('# HNL QLTC DEV Hosting-only release\n')
              f.write('Approved source: '+base+'\nReleased commit: '+head+'\n')
              f.write('Hosting: hnl-qltc-dev.web.app; no PROD/Rules/R2/AI deployment\n')
              f.write('Source: exact GitHub archive; patch includes changes since approved app source\n')
              f.write('User changes: PC-only acceptance preset labels clarified (Nạp hạng mục thi công, Chọn mẫu hạng mục thi công, Nạp vào Căn / Phòng) and preset heading centered with icon on PC. Existing layout, mobile copy, data, Rules, sync and behavior preserved.\n')
              f.write('CI and Hosting manifest/JS checksum verified in workflow steps; device interaction requires separate Runtime Golden.\n')
          with open('handoff/SHA256SUMS.txt','w') as f:
              for name in ['FULL_SOURCE.zip','PATCH.zip','changed-files.txt','REPORT.md']:
                  f.write(hashlib.sha256(open('handoff/'+name,'rb').read()).hexdigest()+'  '+name+'\n')
          for name in ['FULL_SOURCE.zip','PATCH.zip']:
              with zipfile.ZipFile('handoff/'+name) as z:
                  if z.testzip() is not None: raise SystemExit('CORRUPTED_ZIP')
          print('SOURCE_AND_PATCH_ARCHIVES_PASS',head,len(changed))
          PY
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: HNL-QLTC-DEV-ROOM-PRESET-ICON-ALIGN-${{ github.sha }}
          path: handoff/
          if-no-files-found: error
          retention-days: 7
      - name: Scrub temporary service account and generated config
        if: always()
        shell: bash
        run: |
          rm -f "$RUNNER_TEMP/hnl-room-preset-icon-align-dev-credentials.json" hnl-dev-room-preset-icon-align-20261120.generated.json
