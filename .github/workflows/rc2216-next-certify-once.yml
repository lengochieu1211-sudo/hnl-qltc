name: RC2.2.16 Next Certify Once

on:
  push:
    branches:
      - rc2.2.16-notify-superadmin-pdf-checklist
    paths:
      - '.github/workflows/rc2216-next-certify-once.yml'
      - 'ci/rc2216-patches/**'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    env:
      VITE_APP_ENV: PROD
      VITE_RUNTIME_BACKEND: firebase-only
      VITE_BINARY_STORAGE_PROVIDER: r2
      VITE_R2_GATEWAY_URL: https://hnl-qltc-r2-gateway.lengochieu1211.workers.dev
      VITE_ENABLE_LEGACY_DRIVE_READ: "true"
      VITE_ENABLE_LEGACY_DRIVE_WRITE: "false"
      VITE_ENABLE_LEGACY_LOCAL_BUSINESS_CACHE_WRITE: "false"
      VITE_FIREBASE_API_KEY: AIzaSyAShhTKSnmLMOEm4dST--1_X7fjJUE4znY
      VITE_FIREBASE_AUTH_DOMAIN: com-example-qlct-61329.firebaseapp.com
      VITE_FIREBASE_PROJECT_ID: com-example-qlct-61329
      VITE_FIREBASE_STORAGE_BUCKET: com-example-qlct-61329.firebasestorage.app
      VITE_FIREBASE_MESSAGING_SENDER_ID: "119152410850"
      VITE_FIREBASE_APP_ID: 1:119152410850:web:c2aee2135428af34ef5ebb
      VITE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: "(default)"
      VITE_BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      VITE_GIT_COMMIT: ${{ github.sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged source patches
        shell: bash
        run: |
          set -euo pipefail
          cat ci/rc2216-patches/*.patch > /tmp/rc2216-next.patch
          git apply --check /tmp/rc2216-next.patch
          git apply /tmp/rc2216-next.patch
          git diff --check

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Stability + Checklist Golden
        run: npm run test:stability

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Firebase Rules + Emulator
        run: npm run test:rules

      - name: Security audit critical
        run: npm run security:audit

      - name: Production build
        run: npm run build

      - name: Materialize certified source on branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ci/rc2216-patches
          rm -f .github/workflows/rc2216-next-certify-once.yml
          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'feat: notification superadmin pdf checklist hardening'
          git push origin HEAD:rc2.2.16-notify-superadmin-pdf-checklist
