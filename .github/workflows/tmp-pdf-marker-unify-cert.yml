name: TEMP PDF Marker Unify Certification

on:
  push:
    branches:
      - fix/pdf-marker-legend-defect-sort-unify
    paths:
      - '.github/workflows/tmp-pdf-marker-unify-cert.yml'
      - 'scripts/_tmp_pdf_marker_unify.py'

permissions:
  contents: write

jobs:
  certify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pdf-marker-legend-defect-sort-unify
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply PDF/header patch
        run: python3 scripts/_tmp_pdf_marker_unify.py
      - name: Stability
        run: npm run test:stability
      - name: TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Firebase Rules
        run: npm run test:rules
      - name: Security
        run: npm run security:audit
      - name: Build
        run: npm run build
      - name: Materialize certified source and remove temporary CI files
        shell: bash
        run: |
          set -euo pipefail
          rm -f scripts/_tmp_pdf_marker_unify.py .github/workflows/tmp-pdf-marker-unify-cert.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 1
          fi
          git commit -m "fix: unify PDF markers sorting legend and simplify header"
          git push origin HEAD:fix/pdf-marker-legend-defect-sort-unify
