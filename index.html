<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Edge/Chrome --app mode owns the running Taskbar window. Give it HQ PNG
         sources instead of the legacy single-frame 16x16 ICO so Windows can
         downsample the HNL logo cleanly at Taskbar/DPI sizes. -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-3d-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-3d-512.png" />
    <link rel="apple-touch-icon" href="/icon-3d-192.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>HNL Quản Lý Thi Công</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Final dark-mode guards are intentionally loaded last so Tailwind gradient/opacity utilities cannot override them. -->
    <link rel="stylesheet" href="/darkmode-final.css" />
    <link rel="stylesheet" href="/darkmode-ai.css" />
  </body>
</html>
