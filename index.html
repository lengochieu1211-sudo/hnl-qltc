<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />

    <meta name="theme-color" content="#4f46e5" />

         visibly blurring the old SVG/192px source when rasterizing it down. Use
         exact pixel-hinted HNL frames for the small Windows/DPI sizes instead. -->
    <link rel="icon" type="image/png" sizes="16x16" href="/hnl-taskbar-pixel-16.png?v=20260909-pixel2" />
    <link rel="icon" type="image/png" sizes="20x20" href="/hnl-taskbar-pixel-20.png?v=20260909-pixel2" />

    <link rel="icon" type="image/png" sizes="32x32" href="/hnl-taskbar-pixel-32.png?v=20260909-pixel2" />
    <link rel="icon" type="image/png" sizes="40x40" href="/hnl-taskbar-pixel-40.png?v=20260909-pixel2" />
    <link rel="icon" type="image/png" sizes="48x48" href="/hnl-taskbar-pixel-48.png?v=20260909-pixel2" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-3d-192.png?v=20260909-pixel2" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-3d-512.png?v=20260909-pixel2" />
    <link rel="apple-touch-icon" href="/icon-3d-192.png?v=20260909-pixel2" />
    <link rel="manifest" href="/manifest.json" />
    <title>HNL Quản Lý Thi Công</title>
  </head>

    <link rel="stylesheet" href="/darkmode-ai.css" />
  </body>
</html>
