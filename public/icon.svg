<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient: Deep Royal Indigo to Navy -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="60%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Metallic Gold/Orange Accent for Panels and Joints -->
    <linearGradient id="goldGrad" x1="120" y1="120" x2="380" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Vibrant Cyan/Blue for digital construction lines -->
    <linearGradient id="cyanGrad" x1="100" y1="380" x2="400" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Premium Glow Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#06b6d4" flood-opacity="0.15" />
    </filter>

    <!-- Inner Shadow for Drywall Panel Depth -->
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feOffset dx="0" dy="3"/>
      <feGaussianBlur stdDeviation="3" result="offset-blur"/>
      <feComposite operator="out" in="SourceGraphic" in2="offset-blur" result="inverse"/>
      <feFlood flood-color="black" flood-opacity="0.6" result="color"/>
      <feComposite operator="in" in="color" in2="inverse" result="shadow"/>
      <feComposite operator="over" in="shadow" in2="SourceGraphic"/>
    </filter>
  </defs>

  <!-- 1. Beautiful Squircle Base (App Icon Frame with Rounded Corners) -->
  <!-- Outer glowing border -->
  <rect x="14" y="14" width="484" height="484" rx="112" fill="none" stroke="url(#cyanGrad)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Main Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" />

  <!-- 2. Decorative Background Grid (Drywall Ceiling Framing Grid Concept) -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="2">
    <!-- Horizontal Ceiling Grid Lines -->
    <line x1="16" y1="100" x2="496" y2="100" />
    <line x1="16" y1="180" x2="496" y2="180" />
    <line x1="16" y1="260" x2="496" y2="260" />
    <line x1="16" y1="340" x2="496" y2="340" />
    <line x1="16" y1="420" x2="496" y2="420" />
    
    <!-- Vertical Ceiling Grid Lines -->
    <line x1="100" y1="16" x2="100" y2="496" />
    <line x1="180" y1="16" x2="180" y2="496" />
    <line x1="260" y1="16" x2="260" y2="496" />
    <line x1="340" y1="16" x2="340" y2="496" />
    <line x1="420" y1="16" x2="420" y2="496" />
  </g>

  <!-- 3. Central Dynamic Symbol (Modern Geometric Drywall Construction Logo with Depth) -->
  <g filter="url(#shadow)">
    <!-- Base Layer: Floating Plasterboard Panel (Slightly rotated to show drywall installation) -->
    <path d="M 120,330 L 290,130 L 400,240 L 230,440 Z" fill="url(#cyanGrad)" opacity="0.15" />

    <!-- Isometric Drywall Ceiling Panel Structure (Representing Drywall Sheets & Frames) -->
    <!-- The Left Panel (Main Sheet) -->
    <path d="M 130,340 L 280,170 L 370,260 L 220,430 Z" fill="#1e293b" stroke="#334155" stroke-width="3" />
    
    <!-- Core Plasterboard Corner Cut (Demonstrating precision, square-ruler, ceiling design) -->
    <path d="M 280,170 L 370,260 L 320,310 L 230,220 Z" fill="url(#cyanGrad)" opacity="0.85" />
    
    <!-- Laser Alignment Guide / Link Symbol for construction elements -->
    <path d="M 100,310 L 250,140" stroke="url(#goldGrad)" stroke-width="8" stroke-linecap="round" />
    <circle cx="250" cy="140" r="12" fill="url(#goldGrad)" />
    <circle cx="100" cy="310" r="12" fill="url(#goldGrad)" />

    <!-- A-Frame / Triangle Construction Ruler Truss (Symbol of professional plaster engineering) -->
    <path d="M 160,390 L 340,210 L 390,260 L 210,440 Z" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-linejoin="round" />

    <!-- Tiny Laser Crosshair Dot at intersection (Precision laser levelling used in drywall ceilings) -->
    <circle cx="340" cy="210" r="6" fill="#f43f5e" />
    <circle cx="340" cy="210" r="14" fill="none" stroke="#f43f5e" stroke-width="2" opacity="0.5" />
  </g>

  <!-- 4. Glossy Overlay for Premium Depth (Glassy Arc Light Reflection) -->
  <path d="M 16,150 C 120,40 280,40 496,150 C 420,80 280,30 16,150 Z" fill="#ffffff" opacity="0.05" />
</svg>
